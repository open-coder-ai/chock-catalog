id: protect-commit-privacy
name: "Protect Commit Privacy"
version: "0.0.4"
description: >
  Keep the development conversation out of git history. Agent-authored commits narrate by
  default -- who asked for what, which discussion decided it, what the plan was -- and on a
  public repo that narration is published forever. The guard refuses git commit commands
  whose message (inline -m/--message or the file behind -F/--file) contains process-leak
  markers; the rule tells the agent to describe the change, not the conversation, and to
  propose sensitive messages to the human before committing. A commit or gh pr create|edit
  wrapped in sh -c/bash -c (hiding it inside one opaque argv token) falls back to scanning
  the raw command text, scoped to argv[0] actually being a shell interpreter so a command
  that merely echoes the pattern as documentation still passes. Best-effort: markers are a
  narrow deny-list, and a message the human explicitly approves can say anything -- edit
  the marker list in the guard, the content is yours.
artifact: rule
enforcement: advise
rule:
  text: |
    commit_message|pr_description: describe(change); never(narrate: conversation|plan|who_asked|user_quotes|session_refs|internal_doc_paths)
    if(sensitive_context): propose_message_to_human; await(approval) before(commit)  # history is published forever
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-08-24T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.4
  date: '2026-09-21'
  changes:
  - "Bypass fix (deep review): the guard keys on argv[0] to tell a real git/gh invocation
    from one merely printed (echo git commit ...), but shlex collapses a sh -c/bash -c
    payload into one opaque argv token before this guard ever sees it, so argv[0] becomes
    sh/bash and the message never reaches the positional scan at all -- a commit or PR
    composed this way carried no marker check whatsoever. Added a raw-text fallback scoped
    to argv[0] actually being a shell interpreter (sh/bash/zsh/ksh/dash), so the echo case
    that keying on argv[0] exists to allow stays allowed -- caught as a regression in
    self-testing before it shipped, together with an unrelated bug (the fallback read the
    MARKERS array before it was defined, a silent no-op under set -u) found the same way.
    Three eval cases added (tc-021..tc-023)."
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release, authored from a live incident: this catalog's own maintainer found agent-written commit messages narrating private decisions that were headed for a public repo."
- version: 0.0.2
  date: '2026-08-22'
  changes:
  - "Delivery bump for the Claude-format plugin packages built from this policy: on republish, their PreToolUse command is a single python3 invocation (the proposed interpreter-fallback chain was rejected after review proved it could erase deny verdicts) and their descriptions state the per-client fail posture. Guard logic and this repo's own artifacts are unchanged."
- version: 0.0.3
  date: '2026-08-24'
  changes:
  - "PR-body coverage + session-link marker (hardening review, from a live incident: agent harnesses appended claude.ai/code/session URLs to public PR bodies). The rule already claimed pr_description and session_refs; the guard now delivers the CLI slice: it also scans `gh pr create|edit` bodies (--body/-b, --body-file, -F, and attached forms) and adds `claude.ai/code/session` to the marker list. Combined short clusters carrying -m/-b (`git commit -am`, `-sam`, `-amMSG`) are now scanned -- previously the message escaped the parser. Target detection keys on the command after skipping transparent prefixes (sudo, command, env VAR=val, nice ...) so `command git commit` is caught while a non-command like `echo git commit -m ...` is not blocked; file reads use `cat --` to avoid option injection from a `-`-prefixed path. Thirteen eval cases added. A PR body set via the web UI or appended by a harness after the tool call remains out of reach and is the CI backstop's job."
