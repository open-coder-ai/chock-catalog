id: package-lifecycle-scripts
name: "Flag Package Lifecycle Scripts"
version: "0.0.1"
description: >
  Warns (observe rollout) when a change adds or edits code that runs at install or build time: npm
  install/prepare/pack scripts, gypfile without native sources, bin shadowing, unpinned git/URL deps;
  setup.py cmdclass and import-time calls, .pth imports, conftest, pyproject build hooks; build.rs and
  build-deps; go:generate; MSBuild Exec; gemspec, extconf, Podfile, Composer, Maven, Gradle exec. Never
  refuses yet; judges file text, not what a hook runs. Friction, not a security boundary.
artifact: rule
enforcement: advise
mandatory: false
effects:
- read_only
approval:
  required: false

rule:
  text: |
    avoid(install_time_and_build_time_scripts); if_required: explain(why), keep_offline: true, pin(git_and_url_deps: commit)
    prefer: download to a file, verify checksum, run as a reviewed step; never add hooks that fetch, decode or eval

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: warn
    message: >
      A change adds or edits code that runs when a package is installed or built (an npm lifecycle
      script, setup.py command override, build.rs, MSBuild Exec, gemspec extension and the like), or a
      git or URL dependency with no commit pin. Whoever controls that code or URL runs it on every
      machine that installs the package. Keep install and build steps offline and explicit: download to
      a file, verify a pinned checksum, run it as a separate reviewed step, and pin git dependencies to a
      40-hex commit. This policy only warns while it is measured (rollout observe); it has no waiver yet.
    params:
      script: package-lifecycle-scripts-gate.py

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "flags new or changed install- and build-time hooks and unpinned git/URL dependencies in package manifests; warns only (observe) and judges file text, not what a hook runs"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP04, package-registry-config bundle): a script gate at commit and agent write. It prints a findings document; the engine re-runs it on the baseline and judges only keys the change adds, so an untouched hook is old and an edited one is new (key: rule, entry, class, normalized value). Ships at action: warn, the observe stage of rollout D15; the script already chooses block (exit 1) for fetch-exec class hooks and ask (exit 3) for other new hooks, so promotion is a manifest change."
  - "Adversarial review, fixed before release: Python install code is followed where it runs, so class bodies, module-local functions and lambdas a running call names (to a fixed point), conftest start-up hooks (pytest_configure and the like), star imports of os/subprocess, `importlib.import_module`, `runpy` and `getattr(<module>, ...)` are judged, not only direct module-level calls; a script an npm lifecycle entry names, and the file Cargo's `package.build` names, are judged when edited alone (keyed by a digest of their text); Gradle, Podfile, gemspec and extconf statements are keyed whole across lines until their brackets balance or their heredoc ends; empty quotes and letter escapes are removed before the signal search (`c''url`), and `npx --yes/-p`, `npm exec`, `pnpm dlx`, `yarn dlx`, `bunx` and `pnpx` count as downloads; MSBuild attributes are read in document order (a `Command=` inside a Condition is not the command), `<DownloadFile>` is blocked, a Maven plugin is matched by any of its artifactIds with entities decoded; `!=` alone is no build-requirement pin; npm's uninstall scripts are judged; every scan is linear, and a judged file over 256 KiB is asked about whole (keyed by digest) instead of scanned. Eval cases unchanged; review regressions are pytest cases."
  - "Verdict note: an MSBuild Exec in a target hooked into the build (BeforeBuild/AfterBuild, BeforeTargets/AfterTargets, InitialTargets) is block class, per the roadmap's csproj-exec-after-build eval and its reg-build-exec row; that also catches a plain `npm ci` hooked before Build (ASP.NET SPA templates). The verdict is capped at warn while observed; whether it should be ask once enforced is an owner decision recorded in the pull request."
  - "Limits (not caught): the roadmap's phantom-dependency heuristic (a dependency nothing imports, added in a version-bump change); NP05's registry settings (.npmrc ignore-scripts, .yarnrc.yml enableScripts, pnpm onlyBuiltDependencies) belong to registry-config; pnpm package.yaml and package.json5; a hook body built at run time (variables, `$(...)`, `printf` escapes) is asked about, not blocked; a script a lifecycle entry reaches indirectly (`npm run x`, a shell wrapper calling another file) is not followed, nor a package.json more than 12 folders above the script; methods called on a class instance (`K().run()`) in setup.py; Python syntax newer than the gate's interpreter is refused as unparseable in setup.py and asked about in conftest; Gradle and Ruby statements longer than 60 lines (heredocs 200) are keyed by their first part; gyp sources named through variables do not count as native; scikit-build, maturin and other build backends' hook settings. There is no waiver yet: the gate only warns. Friction, not a security boundary."
