id: package-lifecycle-scripts
name: "Flag Package Lifecycle Scripts"
version: "0.1.0"
description: >
  Blocks fetch-exec class hooks and asks about other new ones when a change adds or edits code that runs at install or build time: npm
  install/prepare/pack scripts, gypfile without native sources, bin shadowing, unpinned git/URL deps;
  setup.py cmdclass and import-time calls, .pth imports, conftest, pyproject build hooks; build.rs and
  build-deps; go:generate; MSBuild Exec; gemspec, extconf, Podfile, Composer, Maven, Gradle exec. Judges
  file text, not what a hook runs. Friction, not a security boundary.
artifact: rule
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

rule:
  text: |
    avoid(install_time_and_build_time_scripts); if_required: explain(why), keep_offline: true, pin(git_and_url_deps: commit)
    prefer: download to a file, verify checksum, run as a reviewed step; never add hooks that fetch, decode or eval

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      A change adds or edits code that runs when a package is installed or built (an npm lifecycle
      script, setup.py command override, build.rs, MSBuild Exec, gemspec extension and the like), or a
      git or URL dependency with no commit pin. Whoever controls that code or URL runs it on every
      machine that installs the package. Keep install and build steps offline and explicit: download to
      a file, verify a pinned checksum, run it as a separate reviewed step, and pin git dependencies to a
      40-hex commit. A person who has reviewed the change approves the ask; there is no waiver yet.
    params:
      script: package-lifecycle-scripts-gate.py

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "flags new or changed install- and build-time hooks and unpinned git/URL dependencies in package manifests; blocks fetch-exec class and asks about other hooks, and judges file text, not what a hook runs"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.1.0
  date: '2026-10-04'
  changes:
  - "Promoted from observe to block (rollout D15). The catalog's own history measured a 0.0% fire rate over 154 first-parent commits (chock-catalog#223), under the 5% bar. `hook.gate.action` is now `block` and `enforcement` is `block`: the script's own verdicts stand, so a fetch-exec class hook is refused and any other new or changed hook asks. Eval cases keep their inputs; the 21 that expected `warn` now expect the verdict the script gives (16 block, 5 ask) per the pack's own gate. No detection, scope or threshold change. Only the catalog's own history was measured; an adopter observe run was not."
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP04, package-registry-config bundle): a script gate at commit and agent write. It prints a findings document; the engine re-runs it on the baseline and judges only keys the change adds, so an untouched hook is old and an edited one is new (key: rule, entry, class, normalized value). Ships at action: warn, the observe stage of rollout D15; the script already chooses block (exit 1) for fetch-exec class hooks and ask (exit 3) for other new hooks, so promotion is a manifest change."
  - "Adversarial review, fixed before release: Python install code is followed where it runs, so class bodies, module-local functions and lambdas a running call names (to a fixed point), conftest start-up hooks (pytest_configure and the like), star imports of os/subprocess, `importlib.import_module`, `runpy` and `getattr(<module>, ...)` are judged, not only direct module-level calls; a script an npm lifecycle entry names, and the file Cargo's `package.build` names, are judged when edited alone (keyed by a digest of their text); Gradle, Podfile, gemspec and extconf statements are keyed whole across lines until their brackets balance or their heredoc ends; empty quotes and letter escapes are removed before the signal search (`c''url`), and `npx --yes/-p`, `npm exec`, `pnpm dlx`, `yarn dlx`, `bunx` and `pnpx` count as downloads; MSBuild attributes are read in document order (a `Command=` inside a Condition is not the command), `<DownloadFile>` is blocked, a Maven plugin is matched by any of its artifactIds with entities decoded; `!=` alone is no build-requirement pin; npm's uninstall scripts are judged; every scan is linear, and a judged file over 256 KiB is not scanned but judged whole (see round 2). Eval cases unchanged; review regressions are pytest cases."
  - "Adversarial review, round 2, fixed: keys and file digests keep inner spaces, newlines and indentation (only line endings and outer blank lines are unified), so dedenting a call out of an `if`, or turning a comment line into code, is new; Ruby and Gradle statements count brackets with strings and comments removed, a plain `<<TAG` heredoc ends only at TAG in column 0, and every heredoc a line opens is keyed; Python install code is over-approximated: every lambda body, and each local function the running code mentions at all (called, aliased, passed to `atexit.register`, every definition of a redefined name), read once through a worklist so a long call chain stays linear; a manifest or build file over 256 KiB is block class whole, so padding cannot soften a hook it hides; husky's `prepare` is allowed through npx, pnpx, bunx, npm/pnpm exec, dlx or yarn, and only on its own; any path argument a lifecycle entry names makes that file a judged target (narrowed in round 3). Eval tc-028 now pins line endings, not reflowed whitespace, as old."
  - "Adversarial review, round 3, fixed: a lifecycle target is only a file the hook executes (each command's program when it is a path, or an interpreter's first operand: `node dist/index.js`, `sh tools/setup`), never a data argument (`tsc -p tsconfig.json`) nor the package.json itself, and it is asked about, not blocked, since a URL or child_process in a program's own source is ordinary; Ruby and Gradle statements also continue past a line that ends in a comma, backslash, operator or method dot, and `register('x', Exec)` counts as an Exec task; calling a local class follows its `__init__`/`__new__`, and a call through `globals()`/`vars()`/`locals()` is asked about."
  - "Adversarial review, round 4, fixed: the files a lifecycle entry runs are read from its shell words (shlex, plain splitting when quoting is broken), over-approximated: every operand of an interpreter command, `-r`/`--require`/`--import`/`--loader` values, and `sh -c`/`node -e` operands read again as commands, after assignments, `if/then` keywords, subshell brackets, redirects and wrappers (`env -i`, `sudo -E`, `time -p`, `npx --yes`, `pnpm exec`, `yarn`, `npm exec --`, `bun x`) are set aside; a name resolves as node does (`scripts/a` to `scripts/a.js`, a folder to its index file). A non-interpreter command still counts only its program, so `tsc -p tsconfig.json` names no target. Only an interpreter's first operand or a program written in the same change escalates the entry to block class."
  - "Adversarial review, round 5, fixed: zx, babel-node, esno, esr, vite-node, jiti, sucrase-node, ts-node-esm, coffee, `source`, `.` and `cmd /c|/k` count as interpreters, so the file they run is a target; the paths a body runs are computed once per body and matched as a set, so many operands and many written files stay fast."
  - "Verdict note: an MSBuild Exec in a target hooked into the build (BeforeBuild/AfterBuild, BeforeTargets/AfterTargets, InitialTargets) is block class, per the roadmap's csproj-exec-after-build eval and its reg-build-exec row; that also catches a plain `npm ci` hooked before Build (ASP.NET SPA templates). The verdict is capped at warn while observed; whether it should be ask once enforced is an owner decision recorded in the pull request."
  - "Limits (not caught): the roadmap's phantom-dependency heuristic (a dependency nothing imports, added in a version-bump change); NP05's registry settings (.npmrc ignore-scripts, .yarnrc.yml enableScripts, pnpm onlyBuiltDependencies) belong to registry-config; pnpm package.yaml and package.json5; a hook body built at run time (variables, `$(...)`, `printf` escapes) is asked about, not blocked; a script a lifecycle entry reaches indirectly (`npm run x`, a shell wrapper calling another file, a path built at run time such as `node $(cat f)` or `node $INIT_CWD/x.js`, a runner not on the interpreter list) is not followed, nor a package.json more than 12 folders above the script; methods called on a class instance (`K().run()`, other than its constructor) and `getattr(sys.modules[__name__], ...)` in setup.py; Python syntax newer than the gate's interpreter is refused as unparseable in setup.py and asked about in conftest; Gradle and Ruby statements longer than 60 lines (heredocs 200) are keyed by their first part, and a `#` or `//` inside a Ruby regex or %-literal or a Groovy slashy string is read as a comment when brackets are counted; gyp sources named through variables do not count as native; scikit-build, maturin and other build backends' hook settings. There is no waiver yet: the gate only warns. Friction, not a security boundary."
