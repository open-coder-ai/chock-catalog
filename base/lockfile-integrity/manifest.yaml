id: lockfile-integrity
name: "Lockfile Integrity"
version: "0.0.1"
description: >
  Script gate (commit, agent write, CI) over npm, yarn, pnpm, bun, poetry, uv, Pipfile, Cargo, go.sum,
  Gemfile, composer and NuGet locks. Blocks: source off the registry list or not https, missing hash, hash
  changed for a locked version, unpinned git source, unreadable lock. Asks: SHA-1-only hash, transitive
  install script, lock or manifest moved alone, go.sum lines removed, lock ignored or deleted. Judges what
  a change adds. Friction, not a security boundary.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

applies_to:
  # Lockfiles, the manifests that explain them, and .gitignore. Names are matched without case: macOS and
  # Windows package managers open a lockfile whatever its case.
  paths:
  - "[pP][aA][cC][kK][aA][gG][eE]-[lL][oO][cC][kK].[jJ][sS][oO][nN]"
  - "*/[pP][aA][cC][kK][aA][gG][eE]-[lL][oO][cC][kK].[jJ][sS][oO][nN]"
  - "[nN][pP][mM]-[sS][hH][rR][iI][nN][kK][wW][rR][aA][pP].[jJ][sS][oO][nN]"
  - "*/[nN][pP][mM]-[sS][hH][rR][iI][nN][kK][wW][rR][aA][pP].[jJ][sS][oO][nN]"
  - "[yY][aA][rR][nN].[lL][oO][cC][kK]"
  - "*/[yY][aA][rR][nN].[lL][oO][cC][kK]"
  - "[pP][nN][pP][mM]-[lL][oO][cC][kK].[yY][aA][mM][lL]"
  - "*/[pP][nN][pP][mM]-[lL][oO][cC][kK].[yY][aA][mM][lL]"
  - "[bB][uU][nN].[lL][oO][cC][kK]"
  - "*/[bB][uU][nN].[lL][oO][cC][kK]"
  - "[pP][oO][eE][tT][rR][yY].[lL][oO][cC][kK]"
  - "*/[pP][oO][eE][tT][rR][yY].[lL][oO][cC][kK]"
  - "[uU][vV].[lL][oO][cC][kK]"
  - "*/[uU][vV].[lL][oO][cC][kK]"
  - "[pP][iI][pP][fF][iI][lL][eE].[lL][oO][cC][kK]"
  - "*/[pP][iI][pP][fF][iI][lL][eE].[lL][oO][cC][kK]"
  - "[cC][aA][rR][gG][oO].[lL][oO][cC][kK]"
  - "*/[cC][aA][rR][gG][oO].[lL][oO][cC][kK]"
  - "[gG][oO].[sS][uU][mM]"
  - "*/[gG][oO].[sS][uU][mM]"
  - "[gG][eE][mM][fF][iI][lL][eE].[lL][oO][cC][kK]"
  - "*/[gG][eE][mM][fF][iI][lL][eE].[lL][oO][cC][kK]"
  - "[gG][eE][mM][sS].[lL][oO][cC][kK][eE][dD]"
  - "*/[gG][eE][mM][sS].[lL][oO][cC][kK][eE][dD]"
  - "[cC][oO][mM][pP][oO][sS][eE][rR].[lL][oO][cC][kK]"
  - "*/[cC][oO][mM][pP][oO][sS][eE][rR].[lL][oO][cC][kK]"
  - "[pP][aA][cC][kK][aA][gG][eE][sS].[lL][oO][cC][kK].[jJ][sS][oO][nN]"
  - "*/[pP][aA][cC][kK][aA][gG][eE][sS].[lL][oO][cC][kK].[jJ][sS][oO][nN]"
  - "[pP][aA][cC][kK][aA][gG][eE].[jJ][sS][oO][nN]"
  - "*/[pP][aA][cC][kK][aA][gG][eE].[jJ][sS][oO][nN]"
  - "[pP][nN][pP][mM]-[wW][oO][rR][kK][sS][pP][aA][cC][eE].[yY][aA][mM][lL]"
  - "*/[pP][nN][pP][mM]-[wW][oO][rR][kK][sS][pP][aA][cC][eE].[yY][aA][mM][lL]"
  - "[pP][yY][pP][rR][oO][jJ][eE][cC][tT].[tT][oO][mM][lL]"
  - "*/[pP][yY][pP][rR][oO][jJ][eE][cC][tT].[tT][oO][mM][lL]"
  - "[pP][iI][pP][fF][iI][lL][eE]"
  - "*/[pP][iI][pP][fF][iI][lL][eE]"
  - "[cC][aA][rR][gG][oO].[tT][oO][mM][lL]"
  - "*/[cC][aA][rR][gG][oO].[tT][oO][mM][lL]"
  - "[gG][oO].[mM][oO][dD]"
  - "*/[gG][oO].[mM][oO][dD]"
  - "[gG][eE][mM][fF][iI][lL][eE]"
  - "*/[gG][eE][mM][fF][iI][lL][eE]"
  - "[gG][eE][mM][sS].[rR][bB]"
  - "*/[gG][eE][mM][sS].[rR][bB]"
  - "[cC][oO][mM][pP][oO][sS][eE][rR].[jJ][sS][oO][nN]"
  - "*/[cC][oO][mM][pP][oO][sS][eE][rR].[jJ][sS][oO][nN]"
  - "[dD][iI][rR][eE][cC][tT][oO][rR][yY].[pP][aA][cC][kK][aA][gG][eE][sS].[pP][rR][oO][pP][sS]"
  - "*/[dD][iI][rR][eE][cC][tT][oO][rR][yY].[pP][aA][cC][kK][aA][gG][eE][sS].[pP][rR][oO][pP][sS]"
  - "*.[gG][eE][mM][sS][pP][eE][cC]"
  - "*.[cC][sS][pP][rR][oO][jJ]"
  - "*.[fF][sS][pP][rR][oO][jJ]"
  - "*.[vV][bB][pP][rR][oO][jJ]"
  - ".gitignore"
  - "*/.gitignore"

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      A lockfile change points a package somewhere other than its registry, drops or replaces its hash, leaves a
      git source unpinned, or moves the lock without the manifest that explains it. Regenerate the lock with the
      package manager from the registry (npm install, yarn, pnpm install, poetry lock, uv lock, cargo update -p,
      go mod tidy, bundle lock, composer update) and commit it with the manifest change. A person who has reviewed
      a private registry host adds it to .chock/registry-allowlist.txt and commits that first; an agent asks the
      person and never edits that file or the lock by hand.
    params:
      script: lockfile-integrity-gate.py

compliance:
  owasp_llm_2025:
  - control: LLM03
    coverage: partial
    note: "refuses lockfile changes that swap a package's source or hash, the tampering slice of supply chain risk a diff can show; it does not check registry content, signatures or provenance"
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "an agent-written lockfile cannot redirect a dependency to an unlisted host, drop its hash or re-hash a locked version unseen; malicious packages published to the registry itself are out of scope"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP06; package-registry-config bundle rule reg-lockfile-host, CWE-494). A script gate at commit and at agent tool use (the turn's end included); CI runs it as at commit. Reads package-lock.json and npm-shrinkwrap.json (lockfile v1 to v3), bun.lock (EP03 JSONC), yarn.lock (classic by line; Berry and pnpm-lock.yaml v5 to v9 through the EP01 YAML scanner), poetry.lock, uv.lock and Cargo.lock (tomllib), Pipfile.lock, composer.lock and packages.lock.json (json), go.sum, Gemfile.lock and gems.locked (by line); file names match without case. Blocks, as the roadmap sets them: a source that is not https, or whose host (normalised by the EP11 helpers: case, IDN and trailing-dot spellings match; userinfo, a port other than 443 and a URL parsers split differently are refused) is neither a default registry of its ecosystem nor listed in .chock/registry-allowlist.txt as committed at HEAD -- npm resolved, pnpm tarball, bun and Berry sources (an npm: resolution with ::__archiveUrl= included), git and file: sources in npm-family locks, PyPI registry, sdist and wheel URLs, Cargo alternative registries, gem remotes, composer dist URLs; a registry entry with no hash; a hash replaced for a package@version the baseline already locked (a sha512 replaced by a sha1 included); a git source without a full commit id (Cargo, uv, poetry, Pipfile, Gemfile, composer, pnpm, Berry); a lock that cannot be read with certainty (invalid syntax, a repeated field or key, a YAML alias or merge key). Asks: only SHA-1 or MD5 hashes; a new transitive package marked hasInstallScript (npm) or requiresBuild (pnpm); at commit, push and CI, a lock that changed with no related manifest in the change, or a manifest whose dependency sections changed while a lock beside or above it did not; go.sum lines removed; a .gitignore pattern that ignores a lockfile whose manifest sits in that folder; at commit, a staged deletion of a lock whose manifest stays. Judging: at commit the gate reads HEAD, and at tool use the disk (HEAD when the disk already holds the write), so it compares a package@version across both and reports only what the change adds, marked new; at push and in CI it cannot name the range base, so it reports per-file findings keyed by rule and package@version for the engine's baseline run, and the cross-revision rules (a replaced hash, go.sum removals, deletions) do not run there. Timing: the tests hold a 10 MB package-lock.json under 10 s and a 3 MB pnpm-lock.yaml under 15 s, inside the engine's 30 s budget; a YAML or JSONC lock over 64 MiB is refused as unreadable. Ships for rollout observe first (D15): `rollout: observe` in .chock/config.yaml until the false-positive rate is measured."
  - "Limits: the registry a client is configured to use (.npmrc, .yarnrc.yml npmRegistryServer, pip index-url, Cargo source replacement) is not read here (registry-config, NP05, owns it), so an npm entry with no resolved URL, a Berry npm: entry, a uv, poetry or Pipfile entry on the default index and every NuGet and go.sum entry are judged by hash only. Nothing is fetched: a malicious version published to the registry itself, or a lock regenerated against a malicious tarball, passes. At push and in CI the cross-revision rules do not run, and a block-tier finding the base already held in a lock turns a new ask-tier finding in that lock into a refusal. Composer's defaults include api.github.com and codeload.github.com, so a zipball of any GitHub repository passes the host rule. A hash added beside the old ones for the same version (a newly published wheel) is not judged, only a replacement; a lock regenerated by a newer client that upgrades a version's sha1 to sha512 is refused as a replacement. A lock deleted in a commit that stages no other lockfile, manifest or .gitignore never reaches the gate (the engine runs a script only when an in-scope file changed), and deletions are not seen at tool use, push or CI. At agent tool use the lock-with-manifest rules do not run. A file: tarball and a git dependency in an npm-family lock are refused unless a person allowlists the host. Not read: bun.lockb (binary), go.work.sum, requirements.txt hash mode, poetry/uv content-hash drift. No inline waiver (JSON and lock formats cannot carry one): a person adds a reviewed host to the allowlist and commits it first, answers an ask with CHOCK_ALLOW=lockfile-integrity, or keeps the repo at rollout observe. Friction, not a security boundary."
