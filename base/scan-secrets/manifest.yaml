  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.1.7
  date: '2026-11-26'
  changes:
  - "R13-8 (second pass, review of 2026-11-15, REVIEW-secrets; owner decisions D-R13-8a, b and c of 2026-11-26). A password beside a loopback host is silent in the command-line and URI shapes: the PGPASSWORD= and --password= forms, the mysql family, sshpass and the URI shape read the command's host operand (-h, --host, @host, ://host, host=) and stay silent when it is localhost, 127.x.x.x or ::1 as a whole host token; localhost.attacker-host.io, 127.0.0.1.nip.io and every private range (10.x, 192.168.x) stay refused. PGPASSWORD= and --password= with a literal of 8 or more characters are refused when the command names another host (a dotted name or an address), and keep the 12 floor when it names none; assignments keep 12. AWS's documented example key pair is allowed by exact value (docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html, read 2026-11-26): AKIAIOSFODNN7EXAMPLE and its secret key; one character off is refused, and so is the example inside a longer token. The jwt.io sample token is NOT added: the token the owner's case tc-109 holds is not the one jwt.io shows on 2026-11-26. .pem and .key files are judged by what they add instead of by name: a public key, a certificate or a translation file is allowed, a private-key block is refused whatever the name; .env*, .p12, .pfx, .jks and .keystore keep the path rule. Limit: the engine's path rule cannot read content, so a key file with no header line, or in binary form, is no longer refused by name. Azure: a storage connection string's AccountKey (86 or more base64 characters and ==) and a SAS sig= on a URL that also carries sv= and se= are refused; a variable reference is silent. A placeholder start counts only as the whole value: xxxx, a call, a subscript, a generic and a member chain no longer silence a longer value (a value that starts like a call or a subscript, or starts with xxxx), and a member chain is silent only when every segment reads as an identifier, so a dotted passphrase of mixed letters is refused while a lower-case one (correct.horse.battery) is still read as a member chain. A call or subscript expression ends at whitespace, a quote, a backtick, a backslash or one of ;,)]}?!. tc-001 changes from block to allow: it is AWS's documented example key. Measured, scratch repo without the compiled gate, chock 1.2.0: the suite is 94 cases; before 79 pass and 15 fail (the owner's fixtures); after 90 pass and 4 fail, tc-109 (above) and tc-027, tc-030 and tc-031, which use the documented example key as their violating line and need a fixture with another value. Every case earlier than tc-101 is unchanged except tc-001 and those three. Replay of the old and the new pattern over 2732 unique fixture lines of every catalog suite: refused 61 before, 57 after; 12 refusals lost (the documented example key pair and the two loopback cases, all meant to be lost) and 8 gained (the owner's fixtures tc-115, 116, 118, 120 and 123 to 126, all meant to be refused). Over 412024 added lines of the first-parent history of this repository: refused 182 before, 177 after; 12 lost (the same plus a demo line that types the example key), 7 gained (owner fixtures). 0 new refusals on a line that is not a secret. Open-coder-ai/chock history: unmeasured. Tests: test_scan_secrets_pass2.py (the owner cases against the manifest pattern, the silent forms, hostile lines) and the forbidden-path and hostile-line lists of test_scan_secrets_pattern.py."
- version: 0.1.6
  date: '2026-11-22'
  changes:
  - "R13-1 (secrets in agent settings files): a password typed into a command is refused when the quote around it is JSON-escaped, which is how an agent saves a command into its own settings file after a person chose don't-ask-again. Measured first, at catalog c2925a1: 2080 replays of six command shapes (a Postgres password variable, a ssh password flag, the mysql short and long password flags, a curl bearer header, a connection string), each as a literal, a variable reference and a placeholder, in a settings file, a shell script and a Markdown note, at commit and at an agent write. Every plain literal was already refused and every reference and placeholder already silent; three forms passed only with an escaped quote (the Postgres variable, the mysql short flag and the ssh flag, each followed by a backslash-quoted value). The key-value, mysql-family and ssh password alternatives now accept one backslash before an opening quote, and the two flag placeholder exemptions accept one after the value. A literal beside a local host is still refused, and a literal with no host still blocks rather than asks: loosening either would lower this policy, and local-host noise belongs to R13-8. Tests: test_scan_secrets_agent_settings.py; eval cases tc-065 and tc-066."
- version: 0.1.5
  date: '2026-11-15'
  changes:
  - "Code that handles a password is no longer refused (SS-1; hardening review of 2026-11-15, REVIEW-secrets sections 4 and 4b). The two bare alternatives, `password[=:]<12+ characters>` and `(api|secret|auth)[_-]?(key|token)[=:]<20+ characters>`, matched any run of characters, so `password = getpass.getpass()`, `password = request.json[\"password\"]`, `password: formData.get(\"password\"),` and `password: <your-password>` were blocked. They now match a literal value: silent on a placeholder (`<...>`, `***`, `xxxx`, `...`, `%(`, `#{`, `[[`, your/example/changeme/redacted/null words) and on an expression (an identifier chain followed by `(`, `[` or `<`; a member chain without a digit such as `event.target.value`; for key and token also a snake_case or UPPER_CASE name). `password::` is a path, not an assignment. Provider formats, the named key rule, the quoted alternatives and the command-password alternatives are unchanged. Misses text now names expressions; a dotted passphrase of letters only (`correct.horse.battery`) is read as a member chain. Measured: the 58 lines of the review's idioms and placeholders, 42 refused before, 0 after; eval suite 59 of 59 before, 64 of 64 after (tc-060 to tc-064, all allow, five of which 0.1.4 fails); every committed refusing case still blocks; replay over first-parent history, chock-catalog 243 commits and 430603 added lines: 141 lines refused before and after, 0 disappear, 0 appear; open-coder-ai/chock 281 commits and 253827 added lines: 44 before and after, 0 and 0. Tests: the scan-secrets pattern tests and the guard-memory-writes copy test."
- version: 0.1.4
  date: '2026-11-09'
  changes:
  - "Changelog order only (IR-F46): entries had been added at the top of a list that ran oldest-first, so it rose and fell by version; they now run newest-first throughout. No entry's text or version, and no rule, guard or eval, changed. Patch bump because the manifest is part of the published pack hash."
- version: 0.1.3
  date: '2026-10-25'
  changes:
  - "Hardening (SR-2d2d): a `-p<password>` argument is now refused for the whole mysql and mariadb client family (mysql, mysqldump, mysqladmin, mysqlsh, mysqlpump, mysqlimport, mysqlcheck, mysqlshow, mysqlslap, mysqlbinlog, mariadb and mariadb-dump, -admin, -import, -check, -show, -slap, -binlog), and sshpass keeps its `-p <password>` and `-p<password>` forms. The match stays inside the tool's own command: a pipe, `;` or `&` ends it, so `mysqldump db | ssh -p2222 host` and `mysqldump db && tar -pxzf a.tar` no longer read the next command's -p as a password. -p on mkdir, ssh, tar and cp was never matched. A mysql-family `-p` followed by a separate word is a prompt plus a database name, so it stays allowed. Tests: test_scan_secrets_sr2d2.py; eval case tc-059."
- version: 0.1.2
  date: '2026-10-19'
  changes:
  - "False positive fixed (plugin review M2): the quoted `password = '...'` alternative, the one 0.0.1 shape with no reference exclusion, fired on `password = \"${DB_PASSWORD}\"` and `password = \"$DB_PASSWORD\"`. It is now silent on a quoted value that starts with $, {{ or %( -- the exclusions the named-credential rule already applied -- and still fires on a literal of twelve or more characters, with or without digits. The unquoted and `os.environ` / `process.env` forms the review also named were already silent; eval cases pin all of them at the agent's write and at commit."
  - "Not changed, and why: a new .env file is still refused by path whatever its values hold, and a waiver pragma the agent writes on the same line still does not count at tool use. Both live in the engine's content_regex kind (the path rule has no content exemption; the HEAD rule for agent waivers is chock 0.14.0's), not in this manifest."
- version: 0.1.1
  date: '2026-10-07'
  changes:
  - "Status draft -> production by the BV-C3 promotion rule, measured at catalog main 9e3e2fe: every eval case executed and passing in the replay, tier enforced-at-commit, no open bug issue, no chock check warning. Behaviour unchanged."
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "v2 regex tier (roadmap HP01; the files and entropy tiers are separate policies, not this one). The content_pattern is now a verbose, commented regex (one alternative per line, so no line of this manifest matches it). The 0.0.9 alternatives are kept, with three changes: the private-key one is replaced by a broader one (any PEM label ending PRIVATE KEY, and the PGP armor); the JWT one bounds its first two segments (512 and 16384 characters) so a hostile line is judged in linear time; the bare password one no longer fires on a value starting ENC[ (SOPS), vault:, a Terraform reference (var., local., data., module., each., self.) or an environment lookup (os.environ, getenv(, process.env., ENV[). Added: (1) named credential values: api key, secret key, secret key base, access key, AWS secret access key, client/consumer/JWT/webhook/app/session/signing/cookie secret, auth/access/refresh/API/bearer/bot token, private/signing/encryption/master key, password, passwd, passphrase, and any SCREAMING_SNAKE name ending _TOKEN, _SECRET, _PASS or _PWD; in any case and separator, with = : := => ?=, an optional quote or index bracket round the name (config['password'] =), an optional type annotation (password: str =) and a b/r/u string prefix; a quoted value of 12+ characters with a digit or symbol, or a bare value of 16+ with a digit, of any length. Not judged: values that start like a reference (${, $VAR, {{, {name}, <, ENC[, vault:, a path, an environment lookup), a placeholder word that is the whole value or is followed only by digitless text (your-password, changeme), a quoted UPPER_SNAKE name (AWS_ACCESS_KEY_ID), a bare lower_snake or UPPER_SNAKE identifier whose parts carry at most three digits each (private_key_pem2, get_token_v2(...)), a quoted path ending in a key or config file extension, and a bare value naming a type (Key, Token, Type, ...). (2) credentials in a URI (scheme://user:password@host) unless the host is localhost or an example host, the password is a placeholder (including foo, foobar, bar, baz) or equals the user name; narrowed: the user and password hold no unescaped backslash, # or ? (RFC 3986 userinfo cannot), so the parser-differential vectors of public URL test corpora (a backslash before the @, a fragment before it) are not credentials, and a percent-encoded user (%25name) does not change the verdict; both classes stay unbounded negated sets over a delimiter the next token requires, so time stays linear. (3) Authorization Bearer, Basic and Token literals. (4) passwords on a command line: curl -u/--user (attached or not), docker/podman/oras login -p/--password, mysql -p<value> (quoted or not), sshpass -p. (5) vendor shapes: GitLab tokens and runner registration token, Hugging Face, Google OAuth access token, Slack webhook URL, xoxe/xapp tokens, Twilio API key, Databricks, Doppler, Pulumi, Vault, Shopify, Sentry, Grafana, DigitalOcean, Linear, Notion, Perplexity, PlanetScale, Postman, Heroku, PyPI, RubyGems, OpenAI service-account and admin keys. Every new quantifier that scans ahead is bounded and a value is matched by its first 12 or 16 characters, so time is linear in the line: the worst of 4720 hostile shapes measured under 1 s per 50 KB, so an agent hook's 30 s budget takes megabytes of hostile text. The forbidden-path regex now spares a dotenv template whose last suffix is a template word (.env.local.example, .env.production.sample), which it blocked before. Stripe test keys stay unmatched: the roadmap asks for them as ask, and a content_regex gate has one action. The description lists what is caught and what is missed."
- version: 0.0.9
  date: '2026-09-30'
  changes:
  - "Wording only; the content pattern is unchanged. The description now says whole files are blocked by path (.env*, *.pem, *.key, *.p12, *.pfx, *.jks, *.keystore), that JWTs are matched, and which forms are not yet caught: the quoted-colon forms (`\"password\": \"...\"`, `api_key: \"...\"`, standard JSON and YAML), access_token= and client_secret=. The gate message is unchanged for now: the README quotes it verbatim, so its wording (a path hit is waived by the pragma anywhere in the file, not only on a line) changes together with that quote. The description names where each check runs and fits the 500-char budget; source_repo points at chock-catalog."
- version: 0.0.8
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, an agent's commit (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT or agent_commit_env)) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.7
  date: '2026-09-21'
  changes:
  - "Token format coverage (deep review, CONTRIBUTING.md's own invited first contribution):
    AWS ASIA (STS temporary access keys, as common as AKIA in CI); GitHub gho_/ghu_/ghr_
    (OAuth, App user-to-server, App refresh tokens -- ghp_/ghs_/github_pat_ were already
    covered); and the legacy sk- OpenAI API key format (pre sk-proj-, still issued and valid,
    distinct from sk-ant- and sk-proj- which were already covered). Six eval cases added
    (tc-021..tc-026), one of them a negative guarding scikit-learn/sklearn text against the
    broadened sk- pattern."
- version: 0.0.6
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so the same pattern enforces at agent write-time (mcp-gateway / agent guard) and not only over a git diff -- a secret is caught as the agent writes it, before any commit. No pattern change. Message generalized from 'staged changes' to 'this change' and notes that the allowlist pragma is a commit-review concept NOT honored at tool-use (the scanned text there is a live, attacker-controllable tool argument, so a match always blocks -- matching the gateway's existing content_regex semantics)."
- version: 0.0.5
  date: '2026-08-25'
  changes:
  - "Honesty (do-not-claim): drop 'high-entropy secret values' from the description -- the guard matches known patterns (vendor prefixes, private-key blocks, key/token/password assignments) and computes no entropy. Wording only; guard unchanged."
- version: 0.0.4
  date: '2026-08-24'
  changes:
  - "Broaden coverage (hardening review): the forbidden-path regex now catches environment-specific dotenv files (.env.production, .env.local, .env.staging) while still sparing committed templates (.env.example/.sample/.template/.dist/.defaults, which hold placeholders). Content patterns gain UNQUOTED credential assignments -- api/secret/auth key|token = or : value (>=20 chars) and password = or : value (>=12 chars) -- which the previous quote-anchored patterns missed; ${VAR} env references are excluded from the password value class to avoid false positives. Self-hosting preserved. Five eval cases added (.env.production block, .env.example allow, unquoted api_key, unquoted password, below-floor negative)."
