suite:
  id: scan-secrets-tests-v1
  policy_id: scan-secrets
  version_constraint: ">=0.0.1"
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # `content_regex` has no derived cases: producing a string that matches an arbitrary
  # regex is not mechanical, so every case here states an expectation independently of
  # the pattern. That is what makes them evidence rather than a restatement.
  cases:
  - id: tc-001
    category: trigger
    prompt: A staged file contains an AWS access key ID pattern.
    expect: The hook blocks the commit.
    execute:
      files:
        creds.py: "AWS_ACCESS_KEY_ID = 'AKIAIOSFODNN7EXAMPLE'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-002
    category: trigger
    prompt: A commit adds a .env file.
    expect: The hook blocks the commit.
    execute:
      files:
        .env: "DATABASE_URL=postgres://localhost/dev\n"
      expect: block
  - id: tc-003
    category: negative_trigger
    prompt: A commit adds a source file containing the word 'password' in a comment without a secret value.
    expect: The hook allows the commit.
    execute:
      files:
        login.py: "# the password is read from the environment, never hard-coded\n"
      expect: allow
  - id: tc-004
    category: behavior
    prompt: 'A test fixture contains a fake secret with ''# pragma: allowlist secret'' on the same line.'
    expect: The hook allows the commit.
    execute:
      files:
        test_fixture.py: "FAKE = 'AKIAIOSFODNN7EXAMPLE'  # pragma: allowlist secret\n"  # pragma: allowlist secret
      expect: allow
  - id: tc-005
    category: edge
    prompt: A private key block is added to a file whose extension is not itself forbidden.
    expect: The hook blocks on content, not only on the filename.
    execute:
      files:
        notes.md: "-----BEGIN RSA PRIVATE KEY-----\nMIIEow...\n"  # pragma: allowlist secret
      expect: block
  - id: tc-006
    category: trigger
    prompt: A staged file contains a GitHub fine-grained personal access token.
    expect: The hook blocks the commit.
    execute:
      files:
        ci.py: "TOKEN = 'github_pat_11ABCDEFG0123456789_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-007
    category: trigger
    prompt: A staged file contains a Slack bot token.
    expect: The hook blocks the commit.
    execute:
      files:
        notify.py: "SLACK = 'xoxb-NOTAREALTOKEN-EXAMPLE-ONLY'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-008
    category: trigger
    prompt: A staged file contains an Anthropic API key.
    expect: The hook blocks the commit.
    execute:
      files:
        llm.py: "KEY = 'sk-ant-api03-EXAMPLE-EXAMPLE-EXAMPLE-00000000'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-009
    category: trigger
    prompt: A staged file contains a Stripe live secret key.
    expect: The hook blocks the commit.
    execute:
      files:
        billing.py: "STRIPE = 'sk_live_EXAMPLE0000000000000000'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-010
    category: trigger
    prompt: A staged file contains a Google API key.
    expect: The hook blocks the commit.
    execute:
      files:
        maps.js: "const key = 'AIzaSyEXAMPLE00000000000000000000000000';\n"  # pragma: allowlist secret
      expect: block
  - id: tc-011
    category: negative_trigger
    prompt: A staged doc mentions vendor prefixes in prose, with no token value.
    expect: The hook allows the commit; a prefix is not a credential.
    execute:
      files:
        security.md: "Rotate any xoxb- or github_pat_ credential found in logs. npm_registry is configured in .npmrc.\n"
      expect: allow
  - id: tc-012
    category: trigger
    prompt: A commit adds an environment-specific dotenv file.
    expect: The hook blocks .env.production, not only bare .env.
    execute:
      files:
        .env.production: "DATABASE_URL=postgres://prod/db\n"
      expect: block
  - id: tc-013
    category: negative_trigger
    prompt: A commit adds a dotenv template with placeholder values.
    expect: The hook allows .env.example; templates carry placeholders, not real secrets.
    execute:
      files:
        .env.example: "DATABASE_URL=postgres://localhost/dev\n"
      expect: allow
  - id: tc-014
    category: adversarial
    prompt: A staged config assigns an api key without quotes.
    expect: The hook blocks an unquoted key=value credential.
    execute:
      files:
        config.ini: "api_key = abcdef0123456789ABCDEF01\n"  # pragma: allowlist secret
      expect: block
  - id: tc-015
    category: adversarial
    prompt: A staged YAML sets a password with a colon, no quotes.
    expect: The hook blocks an unquoted colon-assigned password value.
    execute:
      files:
        app.yaml: "password: hunter2hunter2extra\n"  # pragma: allowlist secret
      expect: block
  - id: tc-016
    category: negative_trigger
    prompt: A config references a password via an environment variable.
    expect: The hook allows a ${VAR} reference; it is not a literal secret.
    execute:
      files:
        app.yaml: "password: ${DATABASE_PASSWORD}\n"
      expect: allow
  - id: tc-017
    category: negative_trigger
    prompt: A commit adds a .env.sample template.
    expect: The hook allows the .sample template suffix.
    execute:
      files:
        .env.sample: "DATABASE_URL=postgres://localhost/dev\n"
      expect: allow
  - id: tc-018
    category: negative_trigger
    prompt: A commit adds a .env.template file.
    expect: The hook allows the .template suffix.
    execute:
      files:
        .env.template: "DATABASE_URL=postgres://localhost/dev\n"
      expect: allow
  - id: tc-019
    category: negative_trigger
    prompt: A commit adds a .env.dist file.
    expect: The hook allows the .dist suffix.
    execute:
      files:
        .env.dist: "DATABASE_URL=postgres://localhost/dev\n"
      expect: allow
  - id: tc-020
    category: negative_trigger
    prompt: A commit adds a .env.defaults file.
    expect: The hook allows the .defaults suffix.
    execute:
      files:
        .env.defaults: "DATABASE_URL=postgres://localhost/dev\n"
      expect: allow
  - id: tc-021
    category: trigger
    prompt: A staged file contains an AWS STS temporary access key ID (ASIA prefix).
    expect: The hook blocks the commit; ASIA keys are as sensitive as long-term AKIA ones.
    execute:
      files:
        creds.py: "AWS_ACCESS_KEY_ID = 'ASIAIOSFODNN7EXAMPLE'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-022
    category: trigger
    prompt: A staged file contains a GitHub OAuth access token.
    expect: The hook blocks the commit; gho_ tokens grant the same access a ghp_ PAT does.
    execute:
      files:
        creds.py: "TOKEN = 'gho_1234567890abcdefghijklmnopqrstuvwxyz'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-023
    category: trigger
    prompt: A staged file contains a GitHub App user-to-server token.
    expect: The hook blocks the commit.
    execute:
      files:
        creds.py: "TOKEN = 'ghu_1234567890abcdefghijklmnopqrstuvwxyz'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-024
    category: trigger
    prompt: A staged file contains a GitHub App refresh token.
    expect: The hook blocks the commit.
    execute:
      files:
        creds.py: "TOKEN = 'ghr_1234567890abcdefghijklmnopqrstuvwxyz'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-025
    category: trigger
    prompt: A staged file contains a legacy-format OpenAI API key (no sk-proj- prefix).
    expect: The hook blocks the commit; the pre-project-key sk- format is still issued and valid.
    execute:
      files:
        creds.py: "OPENAI_API_KEY = 'sk-abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOP12'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-026
    category: negative_trigger
    prompt: A commit adds a comment mentioning the scikit-learn library.
    expect: The hook allows it; "sk-learn"/"sklearn" must not be mistaken for an OpenAI key.
    execute:
      files:
        notes.md: "sk-learn is a machine learning library; import sklearn to use it.\n"
      expect: allow
  - id: tc-027
    category: trigger
    prompt: "The agent writes an AWS-style access key into creds.py."
    expect: "The write is refused before it happens."
    execute: {event: tool_use, writes: {"creds.py": "KEY = 'AKI\u0041IOSFODNN7EXAMPLE'\n"}, expect: block}  # pragma: allowlist secret
  - id: tc-028
    category: negative_trigger
    prompt: "The agent writes a clean creds.py."
    expect: "The write is allowed."
    execute: {event: tool_use, writes: {"creds.py": "KEY = os.environ['KEY']\n"}, expect: allow}  # pragma: allowlist secret
  - id: tc-029
    category: behavior
    prompt: "creds.py already holds a reviewed, waived line in HEAD; the agent edits elsewhere in the file."
    expect: "The write is allowed: a waiver already in HEAD is honoured in the agent."
    execute: {event: tool_use, head_files: {"creds.py": "KEY = 'AKI\u0041IOSFODNN7EXAMPLE'  # pragma: allowlist secret\n"}, writes: {"creds.py": "KEY = 'AKI\u0041IOSFODNN7EXAMPLE'  # pragma: allowlist secret\nprint('ready')\n"}, expect: allow}  # pragma: allowlist secret
  - id: tc-030
    category: behavior
    prompt: "The agent adds the waiver pragma itself to a line that violates the gate in creds.py."
    expect: "The write is refused: a waiver the write adds is not honoured in the agent."
    execute: {event: tool_use, head_files: {"creds.py": "KEY = os.environ['KEY']\n"}, writes: {"creds.py": "KEY = 'AKI\u0041IOSFODNN7EXAMPLE'  # pragma: allowlist secret\n"}, expect: block}  # pragma: allowlist secret
  - id: tc-031
    category: trigger
    prompt: "At the turn's end creds.py on disk holds an AWS-style access key that HEAD lacks."
    expect: "The turn is blocked: the diff against HEAD adds it."
    execute: {event: stop, head_files: {"creds.py": "KEY = os.environ['KEY']\n"}, writes: {"creds.py": "KEY = 'AKI\u0041IOSFODNN7EXAMPLE'\n"}, expect: block}  # pragma: allowlist secret
  - id: tc-032
    category: negative_trigger
    prompt: "At the turn's end creds.py differs from HEAD only by a clean line; HEAD already holds an old violation."
    expect: "The turn is allowed: only the lines the turn added are judged."
    execute: {event: stop, head_files: {"creds.py": "KEY = 'AKI\u0041IOSFODNN7EXAMPLE'\n"}, writes: {"creds.py": "KEY = 'AKI\u0041IOSFODNN7EXAMPLE'\nprint('ready')\n"}, expect: allow}  # pragma: allowlist secret
  - id: tc-042
    category: negative_trigger
    prompt: A commit adds an environment-specific dotenv template (.env.local.example).
    expect: The hook allows it; 0.0.9 blocked any .env.<x>.example by path.
    execute:
      files:
        .env.local.example: "DATABASE_URL=postgres://localhost/dev\n"
      expect: allow
  - id: tc-043
    category: negative_trigger
    prompt: A commit adds config that takes every credential from a reference, not a literal.
    expect: The hook allows ${VAR}, $VAR, {{ template }}, os.environ and process.env forms.
    execute:
      files:
        config.json: "{\"password\": \"${DB_PASSWORD}\", \"apiKey\": \"{{ .Values.apiKey }}\"}\n"
        app.yaml: "client_secret: $OAUTH_CLIENT_SECRET_V2\n"
        settings.py: "password = os.environ.get('DB_PASSWORD')\n"
        index.js: "const accessToken = process.env.ACCESS_TOKEN_2;\n"
      expect: allow
  - id: tc-044
    category: negative_trigger
    prompt: A commit adds config whose credential values are placeholders.
    expect: The hook allows changeme, YOUR_API_KEY_HERE, <token> and ******** placeholders.
    execute:
      files:
        config.json: "{\"password\": \"changeme\", \"api_key\": \"YOUR_API_KEY_HERE\"}\n"
        app.yaml: "access_token: \"<access-token-2>\"\nprivate_key: \"**************\"\n"
      expect: allow
  - id: tc-045
    category: negative_trigger
    prompt: A commit adds a SOPS-encrypted secrets file.
    expect: The hook allows ENC[...] values; they are ciphertext, not credentials.
    execute:
      files:
        secrets.enc.yaml: "password: ENC[AES256_GCM,data:abc123def456ghi789=,iv:xyz0,tag:abc0,type:str]\n"
      expect: allow
  - id: tc-047
    category: negative_trigger
    prompt: A commit adds ordinary code whose names mention keys, tokens and passwords.
    expect: The hook allows type annotations, local URIs, lengths and prompted passwords.
    execute:
      files:
        sign.py: "def sign(private_key: Ed25519PrivateKey, password_min_length: int = 12):\n    pass\n"
        compose.yaml: "url: postgres://postgres:postgres@localhost:5432/db\n"
        run.sh: "mysql -h db -P 3306 -u root -p app\ndocker login -u bot --password-stdin registry.io\n"
      expect: allow
  - id: tc-049
    category: adversarial
    prompt: A credential is split so that the key and the value sit on different lines.
    expect: Documented miss -- the gate judges one line at a time, so the commit is allowed.
    execute:
      files:
        app.yaml: "client_secret:\n  Zq8x7Wv6Ut5Sr4Qp3On2\n"
      expect: allow
  - id: tc-050
    category: adversarial
    prompt: A credential is committed base64-encoded inside a generic field.
    expect: Documented miss -- an encoded value without a credential name is not matched; the entropy tier is planned.
    execute:
      files:
        blob.yaml: "data: Z2xwYXQtRVhBTVBMRTBOT1RBUkVBTDBUT0tFTg==\n"
      expect: allow
  - id: tc-053
    category: negative_trigger
    prompt: A commit adds code that passes credentials by name, path or variable, not by value.
    expect: The hook allows identifiers, quoted environment-variable names, key-file paths and a templated bearer.
    execute:
      files:
        client.py: "load(private_key=private_key_pem2, access_key='AWS_ACCESS_KEY_ID_2')\n"
        app.yaml: "private_key: 'secrets/prod-key2.pem'\n"
        call.sh: "curl -H 'Authorization: Bearer ACCESS_TOKEN_2' https://api.internal\n"
      expect: allow
  - id: tc-033
    category: trigger
    prompt: A staged JSON file sets a password with the quoted-colon form.
    expect: 'The hook blocks it; "key": "value" is judged like key = value.'
    execute:
      files:
        config.json: "{\"db\": {\"password\": \"s3cr3t-Value-99\"}}\n"  # pragma: allowlist secret
      expect: block
  - id: tc-034
    category: trigger
    prompt: A staged YAML file sets an access token in camelCase.
    expect: The hook blocks it.
    execute:
      files:
        app.yaml: "accessToken: a1B2c3D4e5F6g7H8i9J0\n"  # pragma: allowlist secret
      expect: block
  - id: tc-035
    category: trigger
    prompt: A staged dotenv-style script exports an AWS secret access key.
    expect: The hook blocks the commonest AWS secret shape, which 0.0.9 missed.
    execute:
      files:
        deploy.sh: "export AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCY0NOTREAL0\n"  # pragma: allowlist secret
      expect: block
  - id: tc-036
    category: trigger
    prompt: A staged file contains a GitLab personal access token.
    expect: The hook blocks it.
    execute:
      files:
        ci.py: "TOKEN = 'glpat-EXAMPLE0NOTAREAL0TOKEN'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-037
    category: trigger
    prompt: A staged file contains a Hugging Face access token.
    expect: The hook blocks it.
    execute:
      files:
        train.py: "HF_TOKEN = 'hf_EXAMPLE0NOTAREAL0TOKEN000000000000'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-038
    category: trigger
    prompt: A staged file holds a database URI with a user and password for a non-local host.
    expect: The hook blocks credentials embedded in a URI.
    execute:
      files:
        settings.py: "DATABASE_URL = 'postgres://app:s3cr3tpw@db.internal:5432/app'\n"  # pragma: allowlist secret
      expect: block
  - id: tc-039
    category: trigger
    prompt: A staged script sends a literal bearer token in an Authorization header.
    expect: The hook blocks it.
    execute:
      files:
        call.sh: "curl -H 'Authorization: Bearer abc123def456ghi789' https://api.internal/v1\n"  # pragma: allowlist secret
      expect: block
  - id: tc-040
    category: trigger
    prompt: A staged script passes a literal password on the docker login command line.
    expect: The hook blocks it; --password-stdin is the alternative.
    execute:
      files:
        release.sh: "docker login -u bot -p S3cretPa55 registry.internal\n"  # pragma: allowlist secret
      expect: block
  - id: tc-041
    category: trigger
    prompt: A staged file contains an encrypted PKCS8 private key header.
    expect: The hook blocks it; ENCRYPTED and PGP private-key headers are private keys too.
    execute:
      files:
        notes.md: "-----BEGIN ENCRYPTED PRIVATE KEY-----\n"  # pragma: allowlist secret
      expect: block
  - id: tc-046
    category: behavior
    prompt: A person commits the AWS documentation example secret key with the waiver pragma.
    expect: The hook allows it; the pragma marks a documented example.
    execute:
      files:
        docs_example.sh: "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY  # pragma: allowlist secret\n"  # pragma: allowlist secret
      expect: allow
  - id: tc-048
    category: adversarial
    prompt: The agent writes a GitLab token and adds the waiver pragma to the same line in the same edit.
    expect: The write is refused; a waiver the write adds is not honoured in the agent.
    execute: {event: tool_use, head_files: {"ci.py": "TOKEN = os.environ['TOKEN']\n"}, writes: {"ci.py": "TOKEN = 'glpat-EXAMPLE0NOTAREAL0TOKEN'  # pragma: allowlist secret\n"}, expect: block}  # pragma: allowlist secret
  - id: tc-051
    category: adversarial
    prompt: A YAML key in SCREAMING_SNAKE case with a quoted value, the shape an agent writes to dodge a lower-case rule.
    expect: The hook blocks it; name matching ignores case and separator.
    execute:
      files:
        values.yaml: "STRIPE_API_KEY: \"rk9-Qz8Yx7Wv6Ut5Sr4\"\n"  # pragma: allowlist secret
      expect: block
  - id: tc-052
    category: trigger
    prompt: "The agent writes an Authorization header literal into a client file."
    expect: "The write is refused before it happens."
    execute: {event: tool_use, writes: {"client.py": "HEADERS = {\"Authorization\": \"Bearer abc123def456ghi789\"}\n"}, expect: block}  # pragma: allowlist secret
  - id: tc-054
    category: negative_trigger
    prompt: A commit adds URL-parser test vectors whose userinfo holds a backslash, a fragment or an example word.
    expect: The hook allows them; RFC 3986 userinfo cannot hold an unescaped backslash, # or ?, and foobar is a placeholder.
    execute:
      files:
        urls.txt: "http://127.1.1.1:80\\@127.2.2.2:80/\nhttp://127.1.1.1:80\\@@127.2.2.2:80/\nhttp://127.1.1.1:80#\\@127.2.2.2:80/\nhttp://%25DOMAIN:foobar@foodomain.com/\n"
      expect: allow
  - id: tc-055
    category: adversarial
    prompt: A staged file holds real connection URLs with a user and a non-placeholder password on non-example hosts.
    expect: The hook blocks credentials in a URI.
    execute:
      files:
        deploy.sh: "git clone https://deploy:S3cr3tP4ss@git.internal.corp/app.git\n"  # pragma: allowlist secret
        app.env.txt: "DB=postgres://app:hunter2xyz9@db.prod.corp:5432/x\n"  # pragma: allowlist secret
      expect: block
