id: registry-config
name: "Registry Config"
version: "0.0.1"
description: >
  Refuses package-manager config that redirects installs or weakens them: literal tokens, http or
  unlisted registry hosts (parsed, so lookalike and userinfo spellings fail), TLS or checksum checks
  off, install scripts on (npm, Yarn, pnpm, Bun, pip, uv, Poetry, conda, Go, Cargo, NuGet, Maven,
  Bundler, Composer, Hex, Dependabot); asks on extra indexes, replaces, no cooldown. Added only. Ship
  observe first. Friction, not a boundary.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      This change points a package manager at an unapproved or clear-text registry, writes a
      credential into its config, turns TLS or checksum verification off, lets dependencies run
      install scripts, or redirects where packages come from. Use https registries on the default
      hosts, read tokens from environment references and keep verification on. An internal mirror is
      added by a person to .chock/registry-hosts.txt in a reviewed commit. A finding that only asks
      (extra index, replace, missing cooldown) is kept by a person committing from their own shell
      with CHOCK_ALLOW=registry-config; an agent asks the person and never sets it.
    params:
      script: registry-config-gate.py

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "refuses a change that points package installs at an unapproved or clear-text source, turns verification off or enables dependency install scripts; package provenance, signatures and registry-side controls stay with the advisory owasp-asi04-agentic-supply-chain policy"
  owasp_cicd:
  - control: CICD-SEC-3
    coverage: partial
    note: "dependency chain abuse through registry configuration only: extra indexes, scoped registries, source replacement and checksum opt-outs in committed config files; typosquats, lockfile tampering and lifecycle scripts are other packs"
  cwe:
  - control: CWE-494
    coverage: partial
    note: "code fetched without an integrity check: TLS, checksum database and signature validation turned off in committed package-manager config"
  - control: CWE-319
    coverage: partial
    note: "clear-text http registries and indexes in committed package-manager config"
  - control: CWE-798
    coverage: partial
    note: "registry credentials written out in committed package-manager config; a token in any other file is scan-secrets' to find"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP05; package-registry-config bundle rules reg-npmrc-token, reg-http-registry, reg-tls-off, reg-script-allow-weaken, reg-confusion, reg-overrides-redirect, reg-vcs-weaken, reg-cooldown-absent; classes H02, H04, H06, C03). A script gate at commit, agent write and the turn's end. It prints a findings document; the engine re-runs it on the baseline and judges only what the change adds, keyed by rule, setting and normalised value (a credential by digest, never echoed), never by line. Rollout: ship under 'rollout: observe' first (decision D15)."
  - "Blocks: a literal credential (npm _authToken/_auth/_password, Yarn npmAuthToken/npmAuthIdent, Bun token/password, .pypirc password, Cargo token, NuGet ClearTextPassword/Password, Maven password, Composer http-basic/oauth/bearer/token, Dependabot registry token/password/key, Renovate hostRules, a password in any judged URL's userinfo; ${VAR}, ${env.X}, $VAR, %VAR%, ${{ ... }}, {env:X} and Ruby ENV references pass); an http, ws, ftp, git or svn URL in a registry, index, mirror, channel or source setting (loopback hosts pass); a registry, index or mirror host that is neither in implementations/data/registry-hosts.json (the default public registries, dated, kind curated) nor in the repository's committed .chock/registry-hosts.txt, matched after the EP11 URL and host normaliser, so userinfo, suffix and IDN lookalike spellings do not match and an ambiguous URL is refused; TLS or checksum verification off (strict-ssl, enableStrictSsl, strictSsl, unsafeHttpWhitelist, trusted-host, allow-insecure-host, verify_ssl, ssl_verify, check-revoke, secure-http, disable-tls, unsafe_https, allowInsecureConnections, signatureValidationMode accept, GOINSECURE, GOSUMDB=off, GONOSUMDB/GONOSUMCHECK/GOPRIVATE set to '*', a '*.tld' or a bare public code host, GOFLAGS -insecure); install scripts on (ignore-scripts false, script-shell, unsafe-perm, enableScripts, dangerouslyAllowAllBuilds, onlyBuiltDependencies '*', strictDepBuilds false, blockExoticSubdeps false, trustPolicy off, Dependabot insecure-external-code-execution allow, Renovate postUpgradeTasks commands); and a judged file that is not valid TOML, YAML, JSON or INI, or holds an unclosed XML comment, CDATA or DOCTYPE."
  - "Asks: --extra-index-url and uv index-strategy unsafe-*, NuGet packageSources without <clear/> (or two sources without packageSourceMapping), a second global Gemfile source or Pipfile [[source]], Composer allow-plugins for every plugin, cargo-deny unknown-registry/unknown-git allow (reg-confusion); go.mod/go.work replace, yarnPath and Yarn plugins, pnpmfile, pnpm overrides and catalogs to an npm:, link:, file:, git or URL spec, Cargo [source] replace-with, [patch], [build] rustc wrappers, [target] runner/linker, [alias], [env], GOPROXY=direct, GOFLAGS -mod=mod (reg-overrides-redirect); Dependabot ignore of dependency-name '*', Renovate automerge (reg-vcs-weaken); no min-release-age (.npmrc), minimumReleaseAge (pnpm-workspace.yaml, bunfig [install]), npmMinimalAgeGate (.yarnrc.yml) or Dependabot cooldown per update (reg-cooldown-absent); a change to .chock/registry-hosts.txt itself; YAML aliases, merge keys or repeated keys and repeated JSON keys (reg-indirect). Redirects ask rather than block (roadmap: block) because vendored sources, local replaces, sccache and committed Yarn releases are common and correct; an ask is still a refusal for an agent (D8)."
  - "Files, by name in any folder and any case: .npmrc, .yarnrc, .yarnrc.yml, pnpm-workspace.yaml, .pnpmfile.cjs, bunfig.toml, pip.conf, pip.ini, requirements*/constraints* .txt/.in and requirements/*.txt, uv.toml, pyproject.toml ([tool.uv], [[tool.poetry.source]], [tool.pdm]), .pypirc, Pipfile, .condarc, environment.yml, go.mod, go.work, go.env, .cargo/config(.toml), deny.toml, nuget.config, Directory.Build.props/.targets, Maven settings.xml, Gemfile, gems.rb, composer.json, mix.exs, Podfile, Package.swift, .github/dependabot.yml, renovate.json(5) and .renovaterc; GO* settings also in Dockerfiles, Containerfiles, Makefiles, .env files, .envrc and CI files (GitHub workflows and actions, GitLab, CircleCI, Azure, Bitbucket, Buildkite, Jenkinsfile, Travis, Drone, Cloud Build, CodeBuild)."
  - "Limits: settings set from the command line or a script (npm config set, pip --trusted-host in a RUN line, go env -w outside the listed files) and in user-level or global config files are not seen; a GO* value built from variables is not judged; package.json, Cargo.toml and lockfiles are other packs (NP04, NP06); Podfile and Package.swift URLs and git sources are judged for clear text only, never against the host list; Renovate cooldown settings, Maven <blocked>, NuGet trustedSigners and Hex mirrors set outside mix.exs are not read; JSON5 Renovate configs the JSON reader refuses are read line by line; a file that already holds a blocking finding turns a new ask-only finding in it into a block (the verdict comes from every finding the file holds). Friction, not a security boundary: a person can still override, and a determined agent can write config the readers do not know."
