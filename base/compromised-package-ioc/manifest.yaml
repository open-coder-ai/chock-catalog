id: compromised-package-ioc
name: "Compromised Package IOC"
version: "0.1.0"
description: >
  Blocks adding a known-malicious package version (npm, PyPI, crates, Go, RubyGems, Packagist manifests and
  lockfiles), a re-pointed action ref, or an IOC file name, from a dated, sourced list (data/ioc.json, CI
  fails 120 days after as_of). Runs: commit, agent write, turn's end; only additions judged. Exact versions
  only: a range is not resolved. A snapshot, not a feed; friction, not a boundary. Adopt under rollout observe.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      A known-malicious package version, compromised action ref or IOC file name was added. Use a release
      outside the list (the cited advisory names the fixed one) or drop the dependency, pin the action to a
      reviewed commit, or delete the file. The list changes only in a reviewed pull request to this policy's
      data/ioc.json; there is no in-line waiver.
    params:
      script: compromised-package-ioc-gate.py

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "Initial release (roadmap NP08, package-registry-config bundle). A script gate reads package.json, package-lock.json, npm-shrinkwrap.json, yarn.lock, pnpm-lock.yaml, bun.lock, requirements and constraints files, pyproject.toml, Pipfile, Pipfile.lock, poetry.lock, uv.lock, pdm.lock, go.mod, go.sum, Cargo.toml, Cargo.lock, Gemfile, gems.rb, *.gemspec, Gemfile.lock, gems.locked, composer.json and composer.lock, plus `uses:` in workflows and action.yml, and every written path's name. It prints a findings document keyed by ecosystem, normalised name and version, so the engine refuses only what a change adds."
  - "The list is implementations/data/ioc.json, an EP12 `ioc` table loaded through chock_scan.data_table: 65 package rows, 4 actions, 9 file names, each with its incident, date and a cited source. tools/check_data_tables.py fails CI 120 days after as_of (D7). It is refreshed by a person in a reviewed pull request from the weekly threat digest; nothing in a repository can waive a row. A table that does not load refuses every write (exit 2, undecided, so the declared block applies)."
  - "Matching: a row lists exact versions, or `*` for a package that was malicious in every version (impostors and typosquats). Names are normalised per registry: PEP 503 for PyPI, `_` as `-` for crates, case folded everywhere (which only adds matches). Versions drop a leading `=` or `v`; PyPI releases compare numerically (1.82.7 equals 1.82.7.0); npm build metadata is dropped. npm `overrides` and `pnpm.overrides` (a `parent>child` key judges the child), npm aliases (`npm:real@x`), yarn and package-lock aliases, Cargo `package =` renames and composer `v` tags resolve to the package fetched."
  - "Exact versions only, by design. A manifest range (`^1.14.0`) is not resolved, because every listed release is already unpublished and a range check would refuse most of npm; the lockfile carries the resolved version and is read instead. Cargo is the exception that names the floor: `arrayref = \"0.3.10\"` is a caret range whose floor is the listed release, and it is refused, as are `=`, `^`, `~` and `>=` with that floor when the requirement is that one comparator (a comma-separated list such as `^0.3.10, <0.4` is not resolved). A listed action is refused at its listed commit (an advisory's abbreviation matches a full pin) and, when `mutable_refs` is set (tags were re-pointed in the incident), at any tag or branch: pin it to a reviewed 40-hex commit. A `uses:` value is read through YAML tags, anchors, quotes and block scalars, and an alias is judged by the value its anchor names in the same file; one this gate cannot read (an alias whose anchor is defined twice or on its own line, an escaped string) is refused, keyed by a digest of the whole file, so any edit to that workflow is judged again."
  - "Parse failure is a refusal: a JSON or TOML manifest or lockfile the gate cannot parse, or a read file that did not decode as UTF-8, is reported as a finding keyed by a digest of its text (a NUL always counts; U+FFFD only when the file yields no package at all, so a Latin-1 comment in a Gemfile is not a refusal), so an edit to a file that stays unreadable is new and only a byte-identical baseline is not. A leading byte-order mark is stripped, as npm, pip and Composer do; an empty file names nothing and is silent. The line readers (requirements, yarn, pnpm, Go, Ruby) skip a line they cannot read rather than refusing the file."
  - "Known misses: bun.lockb (binary), requirements files reached only through `-r`/`-c`, `-e` and direct-URL requirements, setup.py and setup.cfg, Gradle/Maven/NuGet/Hex/CocoaPods, a tarball or git URL whose content is a listed release, a workflow `uses:` in YAML flow style; Composer pins written `==`, four-part or with `@stable`/`as` (composer.lock still carries them); Ruby `%q()` names (Gemfile.lock still carries them); a malicious trivy-action or setup-trivy commit pinned by SHA (76 tags were re-pointed, so only their tags are refused); reviewdog's other actions; pnpm-workspace.yaml `overrides` and `catalog` entries (pnpm-lock.yaml still carries what they resolve to); requirements files whose name holds neither `requirements` nor `constraints` (`reqs.txt`, `requirements.lock`); an edit to a fixture that is deliberately unreadable JSON or TOML, which is refused every time; the `s1ngularity-repository*` repository names, which live on GitHub rather than in a file; the Shai-Hulud 2.0 set (over 1,000 packages; its loader file names are listed instead), and generic payload names (bundle.js, telemetry.js, setup.mjs at the repo root) left out to avoid false refusals. Rollout: adopt with `rollout: observe` in .chock/config.yaml first (D15)."
