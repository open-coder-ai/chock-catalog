id: protect-test-integrity
name: "Protect Test Integrity"
version: "0.0.1"
description: >
  Blocks a commit that turns tests green by weakening them instead of fixing the code: a
  deleted test file, a net loss of assertions across the change, or a vacuous assertion
  (assert True, expect(true).toBe(true)) added in place of a real one. Covers Python, JS/TS,
  Go and Java test layouts. Mechanised slice of agent-discipline's never(fix_test_by) rule;
  added skips are block-test-skips. Enforced at commit only: chock 0.13.0 does not run this
  gate kind at agent tool-use. A reviewed exception carries 'chock: allow test-integrity' on
  an added line of the test file; a waiver is not honoured when CHOCK_AGENT_COMMIT is set.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: test_integrity
    "on": [commit]
    action: block
    message: >
      Test integrity: this change deletes a test file, removes more assertions than it adds,
      or adds a vacuous assertion. Fix the code under test, not the test. If the removal is
      deliberate (obsolete behaviour, a test moved elsewhere), a person adds
      'chock: allow test-integrity' on an added line of that test file and commits from their
      own shell; the waiver is not honoured for an agent's commit (CHOCK_AGENT_COMMIT set).
    params:
      test_path_regex: '(^|/)(tests?/|__tests__/|test_[^/]*\.py$|[^/]*_test\.(py|go)$|[^/]*\.(test|spec)\.[cm]?[jt]sx?$|src/test/)'
      assertion_pattern: '\b(assert(?:[A-Z_.(\s]|$)|expect\(|should\.|require\.\w+\(|pytest\.raises\(|t\.(Error|Fatal)\w*\(|assertThat\()'
      dummy_assertion_pattern: '^\s*(assert\s+(True|1)\s*(#.*|,.*)?$|(self\.|\w+\.)?assertTrue\((True|true)\s*[,)]|expect\(true\)\.(toBe\(true\)|toBeTruthy\(\))|expect\(1\)\.toBe\(1\))'
      allowlist_pragma: 'chock:\s*allow\s+test-integrity'

provenance:
  author: "chock-core"
  created_at: "2026-09-29T00:00:00Z"
  updated_at: "2026-09-29T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-09-29'
  changes:
  - "Initial draft: test_integrity gate at commit, split out of agent-discipline's never(fix_test_by) so the deleted-test, net-assertion-loss and vacuous-assertion slice is enforced rather than advised. Not bound to tool_use: chock 0.13.0 does not run test_integrity there."
