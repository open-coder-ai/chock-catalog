id: protect-test-integrity
name: "Protect Test Integrity"
version: "0.0.3"
description: >
  Blocks weakening tests to turn them green: a deleted test file (commit only), a net loss of
  assertions, or an added vacuous assertion (assert True, expect(true).toBe(true)). Added skips
  are block-test-skips. Runs: commit (incl. an agent's commit: CHOCK_AGENT_COMMIT, CLAUDECODE=1,
  AI_AGENT or agent_commit_env), agent write (vs disk), turn's end (vs HEAD). Waiver: 'chock:
  allow test-integrity' on an added line. Person's commit: honoured. Agent: only if already in
  HEAD; it asks a person.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: test_integrity
    "on": [commit, tool_use]
    action: block
    message: >
      Test integrity: this change deletes a test file, removes more assertions than it adds,
      or adds a vacuous assertion. Fix the code under test, not the test. If the removal is
      deliberate (obsolete behaviour, a test moved elsewhere), a person adds
      'chock: allow test-integrity' on an added line of that test file and commits from their
      own shell. In the agent (tool use, the turn's end, an agent's commit) only a waiver
      already committed in HEAD counts, so an agent asks a person.
    params:
      test_path_regex: '(^|/)(tests?/|__tests__/|test_[^/]*\.py$|[^/]*_test\.(py|go)$|[^/]*\.(test|spec)\.[cm]?[jt]sx?$|src/test/)'
      assertion_pattern: '\b(assert(?:[A-Z_.(\s]|$)|expect\(|should\.|require\.\w+\(|pytest\.raises\(|t\.(Error|Fatal)\w*\(|assertThat\()'
      dummy_assertion_pattern: '^\s*(assert\s+(True|1)\s*(#.*|,.*)?$|(self\.|\w+\.)?assertTrue\((True|true)\s*[,)]|expect\(true\)\.(toBe\(true\)|toBeTruthy\(\))|expect\(1\)\.toBe\(1\))'
      allowlist_pragma: 'chock:\s*allow\s+test-integrity'

provenance:
  author: "chock-core"
  created_at: "2026-09-29T00:00:00Z"
  updated_at: "2026-09-30T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.3
  date: '2026-09-30'
  changes:
  - "Wording fix, no behaviour change: the description and the gate message said a waiver is 'never honoured in the agent'. Since chock 0.14.0 a waiver already committed in HEAD counts in the agent (tool use, the turn's end, an agent's commit), the same as block-test-skips; a waiver on a new line does not. The description, the gate message, the tc-017 expect text and the same sentence in the 0.0.2 entry below are corrected. The description names where each check runs, and fits the 500-char budget."
- version: 0.0.1
  date: '2026-09-29'
  changes:
  - "Initial draft: test_integrity gate at commit, split out of agent-discipline's never(fix_test_by) so the deleted-test, net-assertion-loss and vacuous-assertion slice is enforced rather than advised. Not bound to tool_use: chock 0.13.0 does not run test_integrity there."
- version: 0.0.2
  date: '2026-09-29'
  changes:
  - "Also run in the agent: gate.on is now [commit, tool_use], as chock 0.14.0 runs test_integrity there. A write that removes more assertions than it adds, or adds a vacuous one, is refused as it is made (against the file on disk; at the turn's end against HEAD). A deleted test file is a commit-time check only, since Edit and Write cannot delete. In the agent the pragma counts only when that exact line is already committed in HEAD, as in the content gates (chock 0.14.0). False-positive check: assertions moved between files across two writes can trip the net-loss count on the first write; the message tells the agent to ask a person for the reviewed exception."
