id: protect-agent-config
name: "Protect Agent Config"
version: "0.2.6"
description: >
  Stops an agent editing its guardrails (MITRE ATLAS AML.T0081). Shell guard refuses writes to
  AGENTS.md, .claude/settings, MCP/hook client configs (.mcp.json, ...), .git/{hooks,config},
  policy implementations/, .chock/{config.yaml,*security.json,allowlist,bin,compiled,state}: redirect,
  rm/mv/tee/sed -i, cp into, git checkout/restore. Coarse: also eval or sh -c of computed text, shells fed by
  pipe/variable, interpreter one-liners naming such a path. Reads, `chock sync` pass. Edit/Write: tool gate.
artifact: rule
enforcement: advise
rule:
  text: |
    agent_config(AGENTS.md+wrappers|.claude/settings|.mcp.json|.chock/{config.yaml,*security.json,*allowlist.txt,bin,compiled,state}|.git/{hooks,config}|.agents/policies/*/implementations|.{cursor,codex,windsurf}/hooks.json|.{cursor,vscode}/mcp.json|.{codex,grok}/config.toml|.gemini/settings.json|.junie/mcp/mcp.json|.devin/{mcp_config,config,hooks.v1}.json|.grok/hooks/|.agents/{mcp_config,hooks}.json|.tabnine/agent/settings.json|.github/hooks/): never(edit|delete)
    else ask_person; no marker passes
hook:
  gate:
    kind: content_regex
    "on": [tool_use]
    action: block
    message: >
      This path is agent configuration or enforcement (instruction files, permission files, the
      dependency allowlist, vendored gates, policy implementations). An agent must not edit its
      own guardrails through the Edit or Write tools. Propose the change to a human -- say which
      file and what should change and why -- and wait for approval; regenerate managed files with
      `chock sync`. A person edits these files from their own shell.
    params:
      scan: added_lines
      forbidden_path_regex: '(?i)(AGENTS\.md|CLAUDE\.md|GEMINI\.md|copilot-instructions\.md|\.cursorrules|\.windsurfrules|\.aider\.conf\.yml|\.claude[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*settings|\.mcp\.json|\.cursor[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*mcp\.json|\.vscode[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*mcp\.json|\.gemini[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*settings\.json|\.codex[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*config\.toml|\.junie[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*mcp[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*mcp\.json|\.devin[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*(?:mcp_)?config(?:\.local)?\.json|\.grok[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*config\.toml|\.agents[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*mcp_config\.json|\.tabnine[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*agent[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*settings\.json|\.(?:cursor|codex|windsurf)[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*hooks\.json|\.devin[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*hooks\.v1\.json|\.agents[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*hooks\.json|\.(?:github|grok)[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*hooks[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*|\.chock[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*(bin|compiled|dependency-allowlist\.txt|config\.yaml|security\.json|agentic-security\.json)|\.git[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*(?:hooks|config)|\.agents[/\\](?:\.?[/\\]|[^/\\]+[/\\]\.\.[/\\])*policies[/\\].*implementations)'
      content_pattern: '(?!)'
effects:
- read_only
approval:
  required: false

compliance:
  mitre_atlas:
  - control: AML.T0081
    coverage: partial
    note: "refuses shell edits to agent instruction, permission and enforcement files"
  - control: AML.T0083
    coverage: partial
    note: "reduces exposure by refusing shell rewrites of the config files that carry credentials"
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "blocks shell self-modification of agent permission and instruction files; identity design and grant scoping remain advisory"

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-10-01T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.2.6
  date: '2026-10-02'
  changes:
  - "Round 7 closes (#152; eval cases tc-1110 to tc-1241; tests in tests/policies/test_protect_agent_config_seventh.py and guard_cases_seventh.py). Behaviour change in the shared reader `chock_shellparse`, which ships byte for byte to every Python guard: a `--` before the script of `eval` or a `-c` shell is dropped (`eval -- 'rm AGENTS.md'`, `builtin eval --`, `command eval --`, `bash -c -- '...'`, `sh -c --`), a `name=(...)` array is one assignment word and makes the variable unknown, `x+=text` appends to the value the line shows (unknown when it shows none), `x[0]=text` makes `x` unknown, and `{` at the head of a function body or group is looked through, so `f(){ rm -rf /; }` is read as the command it holds. Refused now: `$'\\x2e'` inside a double-quoted `eval` or `-c` script (`eval \"echo x > $'\\x2e'mcp.json\"`, also behind `env`, `timeout`, `nohup`, `xargs -0`); a variable bound in a function body or a `{ ...; }` group (`x=$(mktemp); f(){ x=.mcp.json; }; f; echo z > $x`, `local x=`, `declare x=`, `read x`, and the same for a variable set to a literal); a literal variable that `read`, `for`, `printf -v`, `mapfile`, `getopts` or `${x:=}` rebinds (`x=safe; read x <<< .mcp.json; rm \"$x\"`); a variable derived from a mktemp variable and then rebound (`y=$x; read y <<< .mcp.json`); a nameref given its target after it is declared, or through a chain (`declare -n r; r=x; r=.mcp.json`, `r=$n`); arrays and appended text as a path (`x=(.mcp.json); echo z > $x`, `declare a=(AGENTS.md)`, `x=.mc; x+=p.json; rm \"$x\"`); a git alias value with an abbreviated or quoted program option (`ls-remote --u=sh`, `archive --e=sh`, `clone --co=core.fsmonitor=sh`, `init --te=`, `\"--upload-pack=sh\"`); `git NAME ARGS` for a name that is no git command when an argument reaches a protected path, as a glob or from the directory a `cd` went to (`git co -- A*.md`, `cd .claude && git co -- settings.json`); git options that run a program or write a file (`rebase -x` and `--exec`, `bisect run`, a `filter-branch` filter, `submodule foreach`, `difftool -x`, the values of GIT_EDITOR, GIT_SEQUENCE_EDITOR, GIT_PAGER, GIT_SSH_COMMAND, GIT_ASKPASS, GIT_EXTERNAL_DIFF, EDITOR, VISUAL and PAGER, `log`, `diff` and `show --output=FILE`, `format-patch -o DIR`); interpreters `pypy`, `tclsh`, `Rscript`, `julia`, `groovy`, `osascript` (literal paths, and the backstop), `sqlite3` and `gdb` (the backstop), and the wrappers `chronic` and `tsp`; Windows: a trailing dot or space on any folder name (`.claude.\\settings.json`, `robocopy build \"C:\\Users\\me\\repo \" /MIR`), a `\\\\?\\` or `\\\\.\\` device prefix, `mklink`, `attrib`, `icacls`, `takeown`. The timing test for a mktemp line of thousands of uses now allows 4 s per line, not 2 s (a runner under load took 12 s; only the time bound changed, no assertion about what is refused)."
  - "Round 7, kept allowed (one eval case each from the same range, and the same lists in the tests): `git config alias.hist \"log --pretty=format:'%h %ad | %s%d [%an]' --graph --date=short\"`, `alias.f 'log --format=\"%h [%an]\"'`, `alias.tree 'log --graph --format=%h*'`, `alias.recent \"for-each-ref --sort=-committerdate refs/heads/\"`, `alias.sr 'show-ref --heads'`, `alias.x 'fetch --unshallow'`, `alias.x 'push --force-with-lease'`, `alias.x 'clone --depth 1 --recurse-submodules'`; `eval -- 'cat .mcp.json'`, `bash -c -- 'ls src'`; `x=(a b c); for f in \"${x[@]}\"; do echo $f; done`, `x=src; x+=/a.py; echo hi > out.txt`, `x=a; x=b; echo hi > $x`, `{ echo hi; } > out.txt`, `f(){ echo hi; }; f > out.txt`; `git st` and `git co $branch` for an alias the line does not define, and `echo AGENTS.md > notes.txt; git st` (the old check refused any line that named a protected path anywhere; the new one looks at the arguments of the git command, so a protected name elsewhere on the line no longer refuses it); `git rebase -x 'make test' HEAD~3`, `git bisect run make test`, `git submodule foreach 'git pull'`, `GIT_EDITOR=true git commit`, `GIT_EDITOR=: git rebase -i HEAD~2`, `PAGER=cat git log`, `GIT_SSH_COMMAND='ssh -i key' git fetch`, `git log --output=out.txt`, `git format-patch -o patches HEAD~1`; `Rscript -e 'print(1)'`, `sqlite3 db.sqlite 'select 1'`, `gdb -batch -ex bt prog`, `chronic make test`, `tsp make`, `tclsh script.tcl`; under a Windows root `attrib +h src\\a.py`, `mklink link.txt target.txt`, `icacls src /grant Everyone:R`, `robocopy build out /MIR`, `git checkout HEAD~1`."
  - "Known limits after round 7 (adds to the sixth-round entry, which still holds except where the changes above say otherwise). Closed that the round-6 review listed: `eval --` and `-c --`, `$'..'` in a quoted script, function bodies, derived variables and late namerefs, arrays and `+=`, abbreviated alias options, format placeholders in aliases, the unknown-alias check on a glob or after `cd`, and the git, interpreter and Windows gaps named above. Still not caught, and not named before: writers that take a program or a path through an option the guard does not read (`tar --to-command`, `--checkpoint-action` and `-I`, `zip -TT`, `rsync -e`, `man -P`, `less '+!cmd'`, `npx -c`, `npm exec -c`, `sed 's/a/cmd/e'`, `socat ... EXEC:`, `awk -f -` and `awk \"$prog\" FILE`, and any interpreter not in the lists above); an editor or pager variable whose value holds a `$` (it is left alone); Windows 8.3 short names (`CLAUDE~1\\SETTIN~1.JSO`, which has the same shape as `HEAD~1`, so it is not read as unknown), and PowerShell paths built in parentheses (`Set-Content (Join-Path $PWD AGENTS.md) x`, because the reader ends the command at the `(`). Refused although harmless: a literal variable that is read into, looped over or `printf -v` bound before it is used as a path; a variable that holds an array, an element or appended text unknown to the line, when it is then used as a write target; `git NAME ARGS` of an unknown alias when an argument is a glob that can match a protected file; a program option or an editor variable that itself names a protected path. A `git NAME` alias that the line does not define and whose arguments name no protected path passes, even when the line names one elsewhere. The guard is friction, not a boundary."
- version: 0.2.5
  date: '2026-10-01'
  changes:
  - "Behaviour change: the shell guard resolves each path before it matches, instead of looking for a protected name in the command text. The #149 review found that the forms below got past it for every protected path, `.claude/settings.json`, `.mcp.json` and `.chock/config.yaml` among them. New module `implementations/pathguard.py` runs beside the unchanged `chock_shellparse` copy and adds to the old match, so nothing the old guard refused is allowed now. It keeps a virtual working directory through the whole command line: it starts at the guard's own directory below the repository root (found by walking up to `.git`), follows `cd`, `pushd` and `popd` across `;`, `&&`, `||`, `|`, newlines and `bash -c` or `eval` scripts, and resolves every path word and redirection target (`>`, `>>`, `2>`, `&>`, `>|`) with `..`, `.`, `//`, backslashes, case and absolute paths inside the repository folded in."
  - "Now refused, with an eval case each: `cd .cursor && echo x > mcp.json`, `cd .cursor; tee mcp.json`, `pushd .cursor; ...`, `cd .claude && ... settings.json`, `cd .chock && ... config.yaml`; `D=.cursor; echo x > $D/mcp.json` (a variable the same line set is expanded); `echo x > $(echo .cursor/mcp.json)` and the backtick form; `.cursor/x/../mcp.json` and `x/../.cursor/mcp.json`; globs `.cursor/mcp.jso[n]`, `.cursor/mcp.*`, `.claude/sett*`, `AGENT?.md`, `rm .cursor/*`, `rm -rf .cur*`; and a whole directory that holds a protected path: `mv .cursor /tmp/old`, `ln -s /tmp/x .cursor`, `rm -r .cursor` (also `.claude`, `.chock`, `.github`, `.git`, `.agents`), `cp -r evil/ .cursor`, `cp -r evil/* .cursor/`, `cp evil/mcp.json .cursor/`, `cp -t .cursor ...`, `find .cursor -delete`, `git rm -r .cursor`. tests/policies/test_protect_agent_config_paths.py runs each form against every protected path."
  - "Fail closed: when the guard cannot resolve a word that sits where a writer takes a path, it refuses if the word could reach a protected path (unknown text is read as any characters, a glob as a glob). So `> $OUT`, `tee $F`, `rm $X`, `cp a $DEST`, a `$(...)` or backtick as a target, and a relative write after `cd $DIR` or `cd -` (read as that name in any directory) are refused, while `rm -rf $TMPDIR/build`, `cp a $HOME/backup` and `cat $X` are not. A command named by a variable or substitution (`$EDITOR`, `bash -c $CMD`, `eval $X`) is refused when it is given a protected path or the line assigned one to a variable; `eval $(ssh-agent -s)` passes. Text that does not parse (an unclosed quote) is refused when it holds a writer. Reads stay allowed: `cat $X`, `cat .mcp.json`, `ls .cursor`, `cp -r .cursor /tmp/x`; for cp, install and ln only the destination counts."
  - "Kept allowed, as a 52-command corpus of ordinary development commands (eval cases from tc-182 on, and the same list in the tests): `chock sync`, `cd src && make`, `echo $HOME`, `cp a b`, `git diff`, `git checkout $BRANCH`, `git restore --staged .`, `find . -name '*.pyc' -delete`, `sed -i '$d' notes.txt`, a commit message or quoted here-document that mentions a protected path, and the neighbours `.vscode/launch.json`, `.cursor/rules/a.mdc`, `.github/workflows/ci.yml` (also through `cd`, a variable or a glob). One change to expect: a redirect or tee to a bare variable (`echo x > $LOG`) now asks a person."
  - "Edit/Write gate: the tool_use gate matches the path the tool call names, which the agent tools give as a concrete path, and the runner does not normalise it. Its forbidden_path_regex now accepts a `dir/../` pair wherever it already accepted repeated separators (`.cursor/x/../mcp.json`, `src/../.chock/x/../config.yaml`). Only a pair directly before the next segment is read: `.cursor/a/b/../../mcp.json` is not matched by the gate."
  - "Second review round, also refused now (modules `pathmatch.py`, `pathtext.py`, `pathwords.py`, `pathwriters.py` beside `pathguard.py`; eval cases tc-274 on; tests/policies/guard_cases_review.py): ANSI-C and locale quoting (`$'\\x2ecursor'`); an unknown start before a protected path (`$(pwd)/.cursor/mcp.json`, `R=$(pwd); rm -rf $R/.git`); variables set from input the line does not show (`declare`, `local`, `read`, `for`, `printf -v`); a bare name that can be a protected file after `cd $DIR`; `>&` with a word as a file redirection; a shell that reads its script from standard input (pipe, here-string, here-document, nested to a fixed depth); a here-document marker inside arithmetic; `-t DIR` and `--target-directory` for cp, mv and install; `find` as the writer (`-delete`, `-exec` bodies, `-fprint`); `sort -o`, `curl -o`, `wget -O`, `tar -x -C`, `unzip -d`, `awk -i inplace`, `sponge`, `rsync`, `pandoc -o`; brace lists and ranges; the repository folder itself or a folder above it (`rm -rf .`, `cp -r x/. .`, `chmod -R`); interpreters given a protected path as a literal (also from standard input); `$@`, `$*` and `$1` as a write target; an alias for a protected path made with `ln`; editors (`vi`, `vim`, `nvim`, `nano`, `emacs`); `git config core.hooksPath` and `git -c core.hooksPath=`, which move the hooks away. The 193-command ordinary-development corpus (tests/policies/guard_corpus_ordinary.py) and an allowed twin of each class stay allowed. The guard is friction, not a boundary."
  - "What remains, not caught by the guard: an interpreter that computes the path (`python -c` building `.cursor/` + `mcp.json`; a literal path in `python -c`, `perl -i` or `node -e` is caught, as before); a script or build file that does the write (`bash run.sh`, `source x`, `make`, `git apply` of a patch that names the file); writers the guard does not name (`xargs` fed a name, `env -C`, `git -C`, `CDPATH`); an alias, function or variable set in an earlier tool call; a symlink made earlier and written through; command substitutions inside an unquoted here-document body; `foo/$VAR` where `$VAR` holds `..`. The backstop for all of these is the turn's-end check of the Edit/Write gate, which refuses an agent's turn while a protected file is dirty, so a write that got through is stopped before the turn ends; the engine's baseline check holds it again at the pull request."
  - "Third review round (#152), refused now, with eval cases tc-334 on and tests in tests/policies/test_protect_agent_config_third.py: a leading bracket glob that can match the dot (`[.]mcp.json`, `[.]claude/settings.json`, `[.]git/hooks`, `[!a]mcp.json`, `[[:punct:]]mcp.json`) is read as able to match a leading dot, for write, rm, rm -rf, tee, cp, mv and touch; a script nested past what the shared reader unwraps (`bash -c` five or more deep, also eval, sudo, cmd /c and inside a substitution) is refused with its own reason, nested too deep to check, whatever it holds, and so is a brace list or numeric range cut off at its limit, which is now read as unknown text; direct writes to `.git/config` (`>`, `>>`, `sed -i`, tee, cp, mv), which is also in the Edit/Write gate; `git clean` with a protected pathspec (`-- .claude`, `.mcp.json`, `.chock`) or, with `-x` or `-X` and no pathspec or the repository folder, over ignored files such as the generated chock folders (plain `git clean -fd` and `-n` pass); Windows `move`, `xcopy`, `robocopy` and `rename` (also behind `cmd /c`), with the destination as the second operand, `/MIR` and `/PURGE` deleting in the destination and `/MOVE` the source; wrappers that run a command or script are looked through (`su -c`, `env -S`, `fakeroot`, `unshare`, `flock` and `flock -c`, `taskset`, `chrt`, `strace`, `ltrace`, `watch`, `unbuffer`, `busybox`, `nsenter`, `setpriv`, `chroot`, `fish`, `csh`, `tcsh` and the other `-c` shells, `coproc`, `trap`), and where an option is not known a protected name anywhere in the words refuses the line; `cp`, `mv`, `install` and `ln` of a file with a protected name into a directory (`cp x/CLAUDE.md src/`, an existing directory, or `-t DIR`), as `echo x > src/CLAUDE.md` is; `php -r`, `lua -e`, `deno eval`, `bun -e`, awk `system()` or a piped command and sed's `e command` and `w file` on a protected path."
  - "Third review round, kept allowed: `find ... -exec` with a reader (cat, grep, ls, file, stat, head, tail, wc, md5sum, sha*sum, echo, printf, test, diff) from the repository root, which the guard refused because the nesting count leaked from one candidate path to the next; `find -exec` still counts when the program is a writer, an interpreter or unknown, and `-delete` is refused. `$(mktemp ...)` (plain options, or a template under $TMPDIR) is a fresh random path that cannot be protected: `echo x > $(mktemp)`, `T=$(mktemp -d); cp a $T/; rm -rf $T`, `mv $(mktemp) out.txt` pass, while `..` after it is unknown and refused. Unknown variables stay refused, and `echo x > ${D}/mcp.json` or `${D}/settings.json` with D unset is refused (the variable may be a folder holding the name). Modules `pathgit.py`, `pathwin.py`, `pathwrap.py` and `pathscript.py` join the guard; the shared `chock_shellparse` copy is unchanged."
  - "Known limits, still not caught (third round): the whole-tree effects of `git checkout`, `restore`, `reset`, `stash` and `read-tree`; command strings handed to ssh, tmux, screen, docker, kubectl and at; PowerShell .NET calls, `-EncodedCommand` and `Start-Process`; `rsync --remove-source-files`; extglob patterns; `/proc/self/cwd`; `git init --template` and `git submodule add`; sed `e` or `s///e` that runs text the line does not show, and awk `system()` of a computed command; `env -S` strings, judged as if run where the guard cannot name the directory; `mktemp` forms with other options or templates (unknown, so refused); `git clean` pathspec magic and `git -C`. Existing substring matches still refuse `my-claude.md` and `.mcp.json.bak`, a copy of a protected file under its own name into a folder of the repository is refused, and an interpreter given a protected file to read is refused."
  - "Fourth review round (#152), refused now, with eval cases tc-512 on, tests in tests/policies/test_protect_agent_config_{fourth,gitconf,windows,scripts}.py and modules `pathreach.py`, `pathsubst.py`, `pathconf.py` beside the others: a variable or substitution the line shows is resolved before the name below it is judged (`H=$(git rev-parse --git-path hooks); echo x > $H/pre-commit`, `H=${PWD}/.git/hooks`, `H=$(echo .git/hooks)`, `C=$(echo .chock/compiled)`, `cd $(git rev-parse --git-dir) && cd hooks`; `git rev-parse` with `--git-dir`, `--git-common-dir`, `--absolute-git-dir`, `--show-toplevel` and `--git-path P` is read as in a plain checkout, `.git` below the repository folder); a value that stays unknown followed by a standard git hook name, chock's launcher or hook-file name, or `config` is refused (`echo x > $U/pre-commit`), while `$TMPDIR/x`, `$BUILD_DIR/out.txt` and `$OUT/report.json` pass; a `$(mktemp)` variable is trusted until a construct binds it again (round five narrows this to real bindings: merely naming it, as `echo \"tmp: $tmp\"` does, no longer revokes the trust); a `find -exec` body is judged once with `{}` as an unknown name, as well as once per file found, so a filter that finds nothing no longer hides `-exec cp {} .git/config`; `git config` that sets, adds, unsets or renames a key that runs code (core.hooksPath, fsmonitor, pager, editor, sshCommand, askPass, alias.* (round five: a value that is a plain git command passes), diff, merge and filter drivers, credential helpers, include paths, gpg programs, pager.*, sendemail.*, web and browser and man commands) or edits a section (`--remove-section core`), `--edit`, and `--file`/`-f` at `.git/config` unless it is a read, as are the same keys in `git -c`, GIT_CONFIG_KEY_n and GIT_CONFIG_PARAMETERS (`git config user.name x`, `--get` and `--list` pass); Windows `robocopy` and `xcopy` into the repository folder or a folder above it (`.`, `.\\`, `..`, `%CD%`, `$PWD`, the absolute path; round five reads a drive-letter path) with `/MIR`, `/PURGE`, `/E`, `/S`, a wildcard source or a file operand, and robocopy's value options (`/XD`, `/XF`, `/IF`, `/R:n`, `/W:n`, `/LEV:n`) are no longer read as paths; a script a line shows as text is judged as a script (round five: only when the producer is exactly one plain `echo`, `printf` or `cat <<DOC`; `bash -c \"$(cat <<'E' ... E)\"`, `eval \"$(echo '...')\"`, `source <(echo '...')`, `. /dev/stdin <<< '...'`, `echo '...' | . /dev/stdin`), and one it does not show (`eval \"$(curl ...)\"`, `source <(curl ...)`, `curl ... | bash`) is refused when the line names a protected path anywhere; `git restore --staged --worktree` (and `-S -W`) and `git clean -fd .` or a pathspec that is the repository folder or above it; `deno eval` with a protected path literal; a run of `*` in a glob is read as one, so a long run no longer takes seconds, and a bracket class with `&&`, `||`, `~~` or `--` no longer raises a FutureWarning."
  - "Fourth round, kept allowed: `robocopy src build /XD x /E /R:3 /W:5 /LEV:2`, `robocopy src build /MIR`, `robocopy src ..\\sibling /E`, `xcopy /y a.txt build\\`, `copy a.txt build\\` and `move build\\a.txt dist\\` (a trailing backslash on a Windows command ends a folder name; it is not an escape, and `xcopy a.txt .cursor\\` is still refused); `git config user.name x`, `git config --get core.hooksPath`, `git config --list`; `git restore --staged src`; `git clean -fd`, `-fd src`; `eval \"$(ssh-agent -s)\"`, `source <(kubectl completion bash)` and `eval \"$(echo 'echo hi')\"`."
  - "What remains, not caught by the guard, after the fourth round: the wrapper list is fixed (`runuser -c`, `script -c`, `parallel`, `systemd-run`, `xvfb-run`, `numactl`, `prlimit`, `valgrind`, `gdb -ex shell`, `fish -C`, a dynamic-loader invocation, `ssh`, `docker run` are not looked through); `ls | xargs cp -t .claude` and `xargs -I{} cp {} .claude/` (a name fed on standard input); git as a general tree writer (`checkout`, `restore --source`, `reset --hard`, `checkout-index`, `archive | tar`, `apply`, `worktree add` and `clone` into a protected folder); the config files `.git/modules/*/config`, `.git/worktrees/*/config.worktree` and `~/.gitconfig`; PowerShell .NET calls, `iwr -OutFile` and `Expand-Archive`; awk `getline` and `FILENAME` tricks; a brace expansion is refused at its cap but may take seconds to read; and a child of a protected folder reached through a variable the line does not show is refused only when its name is a standard git hook name, a chock or hook-file name, or `config` (`H=$UNKNOWN; echo x > $H/my-custom-hook` is allowed). The guard is friction, not a boundary."
  - "Fifth review round (#152), refused now, with eval cases tc-801 on, tests in tests/policies/test_protect_agent_config_fifth.py and a module `pathfeed.py` beside the others. `git config`: long options are read by any unambiguous prefix (`--edi`, `--ed`, `--fil`, `--unset-a`, `--remove-s`, `--rename-s`, `--repl`), bundled short letters are split (`-ef`, `-el`; `-fe` is refused too, though git reads it as a file named `e`), `--edit`, `-e` and `git config edit` are refused whatever GIT_EDITOR or core.editor say, and the git 2.46 subcommands `set`, `unset`, `rename-section`, `remove-section` and `edit` are judged as their option forms (`get` and `list` read). `--file` at a protected file is also refused with `--remove-section` and `--rename-section`. Decoy producers: only exactly one plain `echo`, `printf` (its format applied to its arguments, so `printf '%s\\n' 'echo x > .mcp.json' | bash` is read) or `cat <<DOC` is taken as the whole script; any other producer (a list, a group, `echo hi; cat <<< '...'`, a word with a variable) has every literal string judged as a script and the line is refused when it names a protected path anywhere, and that fallback stays on when a script is found. All `<(...)` bodies of the line are judged, and so is the command before a pipe that closes a `{ ...; }` or `( ... )` group. A write or removal below a prefix the line cannot read (`$(dirname \"$PWD\")/repo/.mcp.json`, `rm $(foo)/a/AGENTS.md`, `tee $(foo)/a/.mcp.json`, backticks, `$X/a/.claude/settings.json`) is refused when the plain text after the prefix names a protected path, unquoted as well as quoted. Windows-native roots: a repository folder given as `C:\\Users\\me\\repo` is read as Windows reads it (backslash and slash alike, case-insensitive, `ntpath` for the folders above it), so `robocopy src C:\\Users\\me\\repo /E`, `robocopy src C:\\ /MIR`, `rd /s /q C:\\Users\\me\\repo`, `xcopy src \"C:\\Users\\me\\repo\"`, `Remove-Item -Recurse C:\\Users\\me\\repo` and drive-letter spellings of every protected path are refused, while the same commands below the repository folder or on another drive pass; `%CD%` is read for every command, and `xcopy` of a folder, or of a name with no extension, into the repository folder is refused (`xcopy Makefile .` too). The tests emulate the root by giving the guard a Windows-style CHOCK_HOOK_CWD on Linux; they have not been run on Windows."
  - "Fifth round, mktemp: a `$(mktemp)` variable loses its trust only at a real binding, found once per line instead of once per command (a line of 4000 uses runs in under two seconds, linear; it took over 16 seconds at that size before): assignment `x=`, `x+=`, `x[0]=` (also as a prefix `x=y cmd`), `read`, `mapfile`, `readarray`, `for`, `select`, `printf -v`, `declare`, `typeset`, `local`, `export` and `readonly` with `x=`, `let`, `((x=1))` and `((x++))`, `getopts`, `unset`, `${x:=y}`, `eval` of text that binds it, a nameref (`declare -n x=y; y=AGENTS.md; echo z > $x`, `declare -n r=x`), and any `source`, `.` or `eval \"$VAR\"`, which can set any variable. `echo \"tmp: $tmp\"`, `echo out=$out` and `echo \"wrote f\"` no longer revoke it."
  - "Fifth round, kept allowed: `git config alias.co checkout`, `git config --global alias.st status`, `alias.lg 'log --oneline --graph'` (an alias whose value starts with a plain git command runs no program; one that starts with `!` runs a shell and is refused); `git config get core.pager`, `list`, `set user.name x`, `unset user.signingkey`; `eval \"$(ssh-agent -s)\"`, `source <(kubectl completion bash)`, `diff <(sort a) <(sort b)`, `echo hi; echo 'echo hi' | bash`, `printf '%s\\n' 'echo hi' | bash`; `echo x > $(foo)/out.txt` and `$TMPDIR/out.txt`; `robocopy src C:\\Users\\me\\repo\\build /E` and `xcopy src C:\\Users\\me\\other /E` under a Windows root."
  - "Known limits after the fifth round, by design or not caught. Refused although harmless: a code-running key set to any value (`git config core.pager less`, `core.editor vim`, `credential.helper cache`, `include.path x`), because the key runs a program for the next person; an alias to a name that is not a plain git command (`alias.x foo` would run `git-foo` from the PATH) or whose value starts with `!` or `-` or holds `--exec`/`-x`, and every alias key given by `git -c` or GIT_CONFIG_*; `git config --edit` with no editor change; `xcopy Makefile .` under any root, and a `$(mktemp)` variable followed by `source` or `eval \"$VAR\"`; the guard also still refuses `my-claude.md`, `.mcp.json.bak` and a protected name mentioned in a line that pipes unknown text to a shell. Not caught: config keys that change behaviour without running a program (`url.<base>.insteadOf`, `http.proxy`, `core.excludesFile`, `core.attributesFile`, `safe.directory`, `commit.gpgSign`, `receive.denyCurrentBranch`); an unknown `%VAR%` (`%USERPROFILE%`, `%~dp0`) is read as a plain name while an unknown `$VAR` is read as any text, so `robocopy src %USERPROFILE%\\repo /E` and `rd /s /q %ProjectDir%` pass; drive-relative `\\Users\\me\\repo` without a letter after a bash-style unquote, UNC `\\\\server\\share`, `C:name` and Git-Bash `/c/Users/me/repo` spellings against a drive-letter root; `git clean -fd` removes untracked files from the whole tree and passes, while `git clean -fd .` is refused; `echo '...' | python3` and the listed stdin-script interpreters (python, perl, ruby, node, php, lua, bun, deno; from 0.2.6 also pypy, tclsh, Rscript, julia, groovy, osascript, sqlite3, gdb) are judged only on plain protected paths written as string literals, so a script that builds the path passes; a script on disk that the line only names (`bash run.sh`); a `printf` that uses `%q`, `%(...)T` or a format held in a variable; a producer's strings with no space or shell character are not read as scripts (the line is still refused if it names a protected path). The guard is friction, not a boundary."
  - "Sixth review round (#152), refused now, with eval cases tc-989 to tc-1109, tests in tests/policies/test_protect_agent_config_{sixth,opaque}.py and modules `pathescape.py` and `pathopaque.py` beside the others. mktemp: a `$(mktemp)` variable also loses its trust at a `trap` body that binds it (`trap 'x=.mcp.json' DEBUG`, ERR, RETURN, a signal followed by `kill -USR1 $$`, and `eval \"trap ...\"`; a body that binds nothing, as `trap 'rm -f \"$t\"' EXIT` does, keeps it), at a binder whose variable is named by an expansion (`read $n`, `read -r \"$n\"`, `mapfile $n`, `printf -v $n`, `printf -v ${n}[0]`, `declare -n r=$n`, `typeset -n`, `local -n`, `export \"$n=...\"`, `declare $n=...`, `let \"$n=1\"`, `(( $n = 1 ))`, `for $n in`, `getopts ab $n`, `unset $n`) and at a command named by a variable (`$t` holding a trap or a `read`). Git aliases: a value is exempt only when it starts with a git command that runs no program and none of its options runs one (`--exec`, `--upload-pack`, `--receive-pack`, `--template`, `-x` of rebase or pull, `-u` of clone, fetch or pull, `-c` of clone, a merge strategy git does not ship such as `-s sh`), when it names no protected path or folder holding one (`log --output=.mcp.json`, `format-patch -o .claude`), and when the git command it holds is not one this guard refuses (`config core.hooksPath h`, `config --global core.pager sh`, `config alias.y '!sh'`, `config -e`, `config -f .git/config ...`, `clean -fdx`); `git NAME` for a name that is no git command (a user alias the line does not define) is refused when the line names a protected path. Escapes: `echo -e`, `printf` and `%b` text and `$'...'` are decoded as bash decodes them, so `\\0056` is `.` for `echo -e` and `%b` (and `\\005` then `6` for a printf format), `\\x2e`, `\\u002e` and `\\U0000002e` are read, `\\c` ends `echo -e` and `%b` output, and a code point past Unicode no longer raises in the guard (it ended in exit 2, which lets the command through). Windows: `cd /d DIR` (also `chdir`, `pushd`) takes DIR, not `/d`, as the target; a `\\` that closes a folder name before a space (`xcopy build\\ . /E`, `robocopy C:\\build\\out\\ C:\\Users\\me\\repo\\ /E`, `cd .cursor\\ && ...`) or ends a quoted drive-letter path (`\"C:\\build\\\"`) is read as a separator in a second reading of the line; `%CD%\\child` (`rd /s /q %CD%\\.git`, `xcopy src %CD%\\.cursor\\ /E`) is read as the child of the repository folder."
  - "Sixth round, the backstop (module `pathopaque.py`, wired after the path walk so every line passes it before it is allowed): a line that holds a construct which runs script text the guard cannot read literally is refused when it names a protected path anywhere (as written, with escapes decoded, with quotes and substitution marks taken out, or in any substitution, here-document or `-c` script of it). The constructs, as a table in the module: `eval` (or `iex`, `Invoke-Expression`) of computed text; `source` or `.` of a process substitution, a variable, standard input, or nothing; a shell (`sh`, `bash`, `zsh`, `dash`, `ksh`, `fish` and the others) with `-c` and a variable, a substitution or no script, or with no script file at all (`| sh`, `| bash -s`, `<<<`, `<<`, `/dev/stdin`); a shell behind `xargs`, `find -exec`, `parallel`, `sudo`, `env`, `busybox` and the other launchers; `env -S`; a variable or substitution as the command (`$SH -c`, `\"$x\" ...`, `${cmd} ...`); `trap` with a body; and an interpreter one-liner or one that reads its program from standard input (`python -c`, `python3`, `perl -e`, `node -e`, `ruby -e`, `php -r`, `lua -e`, `bun -e`, `deno eval`). The reason says the line runs script text the guard cannot read and names a protected path. It is a coarse refusal: it refuses such a line even when it is harmless (`eval \"$x\" # see .mcp.json`, `python3 -c 'print(open(\".mcp.json\").read())'`, `bash -c \"$CMD\" AGENTS.md`), and it never refuses a line that names no protected path, nor one that only reads a path with no such construct (`cat .mcp.json`, `git diff .mcp.json | less`, `bash -c 'cat .mcp.json'`, `bash run.sh`)."
  - "Sixth round, kept allowed: `x=$(mktemp); trap 'rm -f \"$x\"' EXIT; echo y > $x`, `read -p \"name $USER: \" y` after a mktemp, `eval \"$(ssh-agent -s)\"`, `source ~/.bashrc`, `xargs sh -c 'echo \"$@\"' _ < files.txt`, `while read l; do eval \"$l\"; done < cmds.txt`, `python3 -c 'print(1)'`, `python3 -m pytest`, `trap 'rm -f tmp.txt' EXIT`, `find . -exec grep foo {} +` and `$HOME/bin/tool`, all of which name no protected path; `git config alias.pf 'push --force-with-lease'`, `alias.rb 'rebase -i'`, `alias.sync 'pull --rebase'`, `alias.cl 'clone --depth 1'`, `alias.mo 'merge -s ours'`, `alias.cp 'cherry-pick -x'`, `alias.pu 'push -u origin HEAD'`, `alias.aliases 'config --get-regexp alias'`; `cd /d build && echo x > out.txt`, `xcopy build\\ out\\ /E`, `rd /s /q %CD%\\build` under a Windows root."
  - "Known limits after the sixth round (this entry adds to the fifth-round one, which still holds except where it says otherwise here). Closed that the fifth-round review listed: the mktemp trap and indirect-name rebinding, the code-running git aliases, `\\0NNN` escapes, script text reaching a shell through `xargs`, `read` into `eval` or `sh -c`, a here-string of a variable, a shell named by a variable, `cd /d`, a closing backslash on a non-final Windows operand, and `%CD%\\child`; and the stdin-interpreter limit now refuses a line that names a protected path. Refused although harmless, by the backstop and the mktemp rule: any line with one of the constructs above that names a protected path anywhere (a comment, a quoted message, an argument that is only read), and a `$(mktemp)` variable after a `trap` whose body binds a variable or after a binder named through `$`. Still not caught: script text that builds the path from pieces the line does not show (`a=.mc; b=p.json; eval \"$a$b\"`, `base64 -d | sh`, `echo ... > x.sh; sh x.sh`), because the backstop reads the text of the line and its escapes, not the value of a variable; `cmd` and `powershell -Command` reading a script from standard input or a variable, `cmd < script.bat`, and PowerShell variables, `$env:USERPROFILE` and `(Get-Location)` as paths; a copy or move into a protected folder below an unreadable prefix (`cp a $X/.cursor/`, `rsync -a a $(foo)/.claude/`); `BASH_ENV=<(...) bash -c true` and `bash 3<<< '...' /dev/fd/3`; a hook folder given as `\\\\?\\C:\\...` or with `..` under a Windows root; an alias value that starts with `config`, `clone`, `fetch`, `pull`, `push`, `ls-remote`, `rebase`, `archive` or `init` passes when none of the options above is given (an option spelled in a way this guard does not know passes); inert or indirect git keys (`interactive.diffFilter`, `man.*.path`, `browser.*.path`, `guitool.*.cmd`, `init.templateDir`, `protocol.ext.allow`) and further program-running keys outside the list (`gpg.ssh.defaultKeyCommand`, `tar.*.command`, `imap.tunnel`, `instaweb.httpd`), so the earlier \"web and browser and man commands\" covers `.cmd` only; `git -C .git config` with an inert key; and a line of about 20000 `cd a;` takes five seconds. The sixth-round CI and CodeQL checks are the ones named in the pull request; the Windows forms are tested by giving the guard a Windows-style CHOCK_HOOK_CWD on Linux and have not been run on Windows. The guard is friction, not a boundary."
- version: 0.2.4
  date: '2026-10-01'
  changes:
  - "Behaviour change: the project-level MCP config files and the hook files that a supported client reads are protected by the guard and the Edit/Write gate, beside the root `.mcp.json`. A server an agent registers in an MCP config runs with the client's authority the next time the client starts, and an agent that deletes chock's PreToolUse and Stop entries from a hook file disarms its own gates; both lower its own enforcement. MCP configs added: `.cursor/mcp.json` (Cursor; Grok also reads it), `.vscode/mcp.json` (VS Code Copilot), `.gemini/settings.json` (Gemini CLI; the whole file is client config: mcpServers, hooks, tool permissions), `.codex/config.toml` (Codex CLI: `[mcp_servers.*]`), `.junie/mcp/mcp.json` (Junie), `.devin/mcp_config.json` and `.devin/mcp_config.local.json` (Devin since v3000.3) with `.devin/config.json` and `.devin/config.local.json` (older Devin keeps mcpServers there; they also hold permissions and hooks), `.grok/config.toml` (Grok), `.agents/mcp_config.json` (Antigravity) and `.tabnine/agent/settings.json` (Tabnine). Hook files added, the ones `chock sync` merges chock's entries into: `.cursor/hooks.json` (Cursor), `.codex/hooks.json` (Codex CLI), `.windsurf/hooks.json` (Windsurf), `.github/hooks/` (VS Code Copilot: `chock.json`, agentseam's default `agentseam.json`), `.grok/hooks/` (Grok), `.devin/hooks.v1.json` (Devin) and `.agents/hooks.json` (Antigravity). Ordinary neighbours stay writable: `.vscode/launch.json` and `settings.json`, `.cursor/rules/*`, `.windsurf/rules/*`, `.codex/prompts/*`, `.gemini/commands/*`, `.github/workflows/*` and `.github/ISSUE_TEMPLATE/*`, `.devin/notes.md`, `.agents/skills/*`. (`.gemini/GEMINI.md` was already protected as an instruction file and still is.) The same path normalisation applies (backslashes, `//`, `/./`, case)."
  - "A person still edits these files from their own shell, and `chock sync` passes the guard (it names no protected path), so regeneration works. `chock sync` merges hook entries into `.gemini/settings.json`, `.tabnine/agent/settings.json` and the hook files above; a run that changes one leaves it dirty until it is committed, and the Edit/Write gate's turn's-end check refuses an agent's turn while a protected file is dirty (tested for `.gemini/settings.json`, `.tabnine/agent/settings.json` and `.cursor/hooks.json`), as it does for `.claude/settings.json`. Commit the regenerated files before an agent's turn ends."
  - "Left out: Windsurf's MCP config (global `~/.codeium/windsurf/mcp_config.json` only), Kimi Code and Junie's user files (outside the repository), the `mcp` key in `.vscode/settings.json` (an editor settings file with unrelated content), and clients chock does not support (`.roo/mcp.json`, `.amazonq/mcp.json`). Known limits, the same as for `.claude/settings.json` and every other protected path and not specific to these: `..` segments are not resolved, a write by bare file name after a `cd` into the directory is not joined to it, and shell variables, command substitution and globs are not resolved to the protected path. The engine's baseline check is the backstop when a change reaches a pull request."
- version: 0.2.3
  date: '2026-09-30'
  changes:
  - "Behaviour change: `.chock/security.json` (java-security) and `.chock/agentic-security.json` (agentic-code-security) are protected by the guard and the Edit/Write gate. They set each rule's verdict (allow, ask or deny), so an agent that could write them could switch a denying rule to allow and then pass its own gate. A person still edits them from their own shell. java-security's guided setup page writes nothing, and its skill used to have the agent write the file; java-security 0.6.3 has the agent show the file, the diff and a here-doc command the person runs instead. Reading them stays allowed. The baseline check in the engine holds a loosened verdict to a person's approval in a pull request."
  - "Paths are normalised before they are matched: the guard reads backslashes as slashes, collapses `//` and `/./`, and lowercases, since macOS and Windows filesystems ignore case, so `.chock//security.json`, `.chock/./security.json` and `.chock/SECURITY.json` are refused. The Edit/Write gate's forbidden_path_regex is case-insensitive (`(?i)`) and accepts the same repeated separators. Reads of those spellings still pass."
  - "`.chock/state` joins the shell guard only: chock's Stop re-entry ledger lives at `.chock/state/<session>.stop.jsonl`, and an agent that rewrote it could reset its own re-entry count. It is not in the Edit/Write gate, whose turn's-end check walks untracked paths and would refuse every turn end where `.chock/state/` is not gitignored, because the engine writes its session log there."
  - "Known limits, unchanged: a directory as the target (`rm -r .chock`), `git checkout REF -- .`, globs and shell variables are not resolved to the protected paths. The engine's baseline check is the backstop when the change reaches a pull request."
- version: 0.2.2
  date: '2026-09-30'
  changes:
  - "Behaviour change: `.chock/config.yaml` is protected by the guard and the Edit/Write gate. It holds the rollout level (`rollout: observe` turns blocking gates into warnings), which policies are disabled or narrowed, and `agent_commit_env`, the variables that mark an agent. An agent that could write it could lower its own enforcement or hide its own marker. A person still edits it from their own shell. Reading it stays allowed."
- version: 0.2.1
  date: '2026-09-30'
  changes:
  - "Behaviour change: the 'chock: approved-config-change' marker no longer passes a command. Before, any shell command carrying the marker (for example `echo x > AGENTS.md  # chock: approved-config-change`) passed; now it is blocked like any other write to a protected path. The guard runs only on the agent's own tool calls, so only the agent could type the marker; a person makes an approved change in their own shell, where no agent hook runs. The refusal message now tells the agent to ask the person, never to use a marker. The Edit/Write gate is unchanged. Eval tc-008 flips allow to block."
  - "Text: the description lists .git/hooks and policy implementations/, names the gate's points (PreToolUse, the turn's end) and fits the 500-char budget; the rule text lists .git/hooks and says to ask the person."
- version: 0.2.0
  date: '2026-09-29'
  changes:
  - "Second check for the Edit and Write tools: a content_regex gate at tool_use only (PreToolUse and the turn's end), never at commit, so a person stays free to edit these files. Its forbidden_path_regex matches exactly the paths the command guard protects (instruction files, .claude/settings, .mcp.json, .chock/bin, .chock/compiled, .chock/dependency-allowlist.txt, .chock/config.yaml, .git/hooks, policy implementations), refuses any write to them outright (the path check needs no content; the content pattern is `(?!)`, which matches nothing, because a match-anything pattern would refuse every file), and its message tells the agent to propose the change to a human. No allowlist_pragma: the runner reads a waiver from the path's whole HEAD file, so one committed line would unlock the file for every later edit. The gate never judges this policy's own folders (the runner skips a policy's own paths); the guard still covers those from the shell. Artifact stays rule; the ambient line is unchanged. Guard unchanged."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "Ported from bash to Python: implementations/protect-agent-config.py replaces the bash script, stdlib only, deterministic, no network. It ships beside the chock_shellparse package (identical in every ported policy; tests pin the copies), which reads the command with a quote-aware lexer instead of scanning text: it splits at unquoted && || ; | & and newlines, drops redirections and comments, keeps heredoc bodies, and looks through bash|sh|zsh -c, pwsh -Command, cmd /c, eval, sudo, doas, env VAR=x, command, exec, nohup, timeout, nice, time, xargs and subshells, so `cd repo && ...` and `bash -c '...'` are judged on the command they run and `echo ...` on none. Unbalanced quotes fall back to a split at separators and whitespace that still sees redirections and reads an unclosed quote as one word; CHOCK_TOOL=powershell|pwsh selects PowerShell reading (backslash paths, cmdlets), and without it the text decides. An unexpected exception exits 2 (a guard fault), never 1 (a block)."
  - "Bypasses closed, each with eval cases: `git checkout HEAD~3 -- AGENTS.md`, `git restore --source=... AGENTS.md` (and git rm/mv of a protected file), PowerShell `Set-Content`, `Add-Content` and `Out-File` on a protected path, and the `sc`/`ac` aliases. `.chock/dependency-allowlist.txt` joins the protected paths; `.chock/bin` and `.chock/compiled` are protected as directories too, not only below a trailing slash."
  - "False block removed: writes are judged by what they change, so `cp AGENTS.md /srv/backup` (a read of the protected file) and `Get-Content AGENTS.md | Set-Content /srv/copy` are allowed; only the destination of cp/install/ln counts. The 'chock: approved-config-change' marker still passes a command, and every existing case keeps its verdict."
- version: 0.0.7
  date: '2026-09-24'
  changes:
  - "Eval cases added so every guard statement is exercised: clause-splitter arms for a
    separator glued to the end of a token (`status|| rm`, `status&& rm`, `notes.txt| rm`)
    targeting .claude/settings.json. Guard unchanged."
- version: 0.0.6
  date: '2026-09-21'
  changes:
  - "False-positive fix (deep review): a redirect ('>'/'>>') is now only a write when the
    protected path is its actual target, not merely present anywhere in the command, so
    `cat .claude/settings.json 2>/dev/null` and `... 2>&1` (stderr suppressed or
    duplicated, not a write to anything) no longer refuse a plain read. Writer-verb
    detection (rm/mv/cp/tee/sed -i/interpreter write-forms) is now scoped to the same
    command-line clause (split at ';', '&&', '||', '|', including a separator glued to
    the END of a token) as the protected-path mention, so an unrelated write in a
    different clause (`rm -f /srv/x; cat .claude/settings.json`, `echo hi > /srv/x; cat
    .claude/settings.json`) no longer refuses the read. A genuine write, alone or beside
    an unrelated read clause, is still refused. Seven eval cases added (tc-025..tc-031)
    covering the false-positive fix and the regression it must not reopen."
