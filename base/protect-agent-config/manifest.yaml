id: protect-agent-config
name: "Protect Agent Config"
version: "0.2.4"
description: >
  Stops an agent editing its guardrails (MITRE ATLAS AML.T0081). Shell guard refuses writes to
  AGENTS.md and wrappers, .claude/settings, MCP and hook client configs (.mcp.json, .cursor/mcp.json,
  .gemini/settings.json, .codex/hooks.json, more), .git/hooks, policy implementations/ and
  .chock/{config.yaml,security.json,agentic-security.json,dependency-allowlist.txt,bin,compiled,state}:
  redirect, rm/mv/tee/sed -i, cp into, git checkout/restore. Reads and `chock sync` pass. Edit/Write: tool_use gate.
artifact: rule
enforcement: advise
rule:
  text: |
    agent_config(AGENTS.md+wrappers|.claude/settings|.mcp.json|.chock/{config.yaml,*security.json,*allowlist.txt,bin,compiled,state}|.git/hooks|.agents/policies/*/implementations|.{cursor,codex,windsurf}/hooks.json|.{cursor,vscode}/mcp.json|.{codex,grok}/config.toml|.gemini/settings.json|.junie/mcp/mcp.json|.devin/{mcp_config,config,hooks.v1}.json|.grok/hooks/|.agents/{mcp_config,hooks}.json|.tabnine/agent/settings.json|.github/hooks/): never(edit|delete)
    else ask_person; no marker passes
hook:
  gate:
    kind: content_regex
    "on": [tool_use]
    action: block
    message: >
      This path is agent configuration or enforcement (instruction files, permission files, the
      dependency allowlist, vendored gates, policy implementations). An agent must not edit its
      own guardrails through the Edit or Write tools. Propose the change to a human -- say which
      file and what should change and why -- and wait for approval; regenerate managed files with
      `chock sync`. A person edits these files from their own shell.
    params:
      scan: added_lines
      forbidden_path_regex: '(?i)(AGENTS\.md|CLAUDE\.md|GEMINI\.md|copilot-instructions\.md|\.cursorrules|\.windsurfrules|\.aider\.conf\.yml|\.claude[/\\](?:\.?[/\\])*settings|\.mcp\.json|\.cursor[/\\](?:\.?[/\\])*mcp\.json|\.vscode[/\\](?:\.?[/\\])*mcp\.json|\.gemini[/\\](?:\.?[/\\])*settings\.json|\.codex[/\\](?:\.?[/\\])*config\.toml|\.junie[/\\](?:\.?[/\\])*mcp[/\\](?:\.?[/\\])*mcp\.json|\.devin[/\\](?:\.?[/\\])*(?:mcp_)?config(?:\.local)?\.json|\.grok[/\\](?:\.?[/\\])*config\.toml|\.agents[/\\](?:\.?[/\\])*mcp_config\.json|\.tabnine[/\\](?:\.?[/\\])*agent[/\\](?:\.?[/\\])*settings\.json|\.(?:cursor|codex|windsurf)[/\\](?:\.?[/\\])*hooks\.json|\.devin[/\\](?:\.?[/\\])*hooks\.v1\.json|\.agents[/\\](?:\.?[/\\])*hooks\.json|\.(?:github|grok)[/\\](?:\.?[/\\])*hooks[/\\](?:\.?[/\\])*|\.chock[/\\](?:\.?[/\\])*(bin|compiled|dependency-allowlist\.txt|config\.yaml|security\.json|agentic-security\.json)|\.git[/\\](?:\.?[/\\])*hooks|\.agents[/\\](?:\.?[/\\])*policies[/\\].*implementations)'
      content_pattern: '(?!)'
effects:
- read_only
approval:
  required: false

compliance:
  mitre_atlas:
  - control: AML.T0081
    coverage: partial
    note: "refuses shell edits to agent instruction, permission and enforcement files"
  - control: AML.T0083
    coverage: partial
    note: "reduces exposure by refusing shell rewrites of the config files that carry credentials"
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "blocks shell self-modification of agent permission and instruction files; identity design and grant scoping remain advisory"

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-10-01T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.2.4
  date: '2026-10-01'
  changes:
  - "Behaviour change: the project-level MCP config files and the hook files that a supported client reads are protected by the guard and the Edit/Write gate, beside the root `.mcp.json`. A server an agent registers in an MCP config runs with the client's authority the next time the client starts, and an agent that deletes chock's PreToolUse and Stop entries from a hook file disarms its own gates; both lower its own enforcement. MCP configs added: `.cursor/mcp.json` (Cursor; Grok also reads it), `.vscode/mcp.json` (VS Code Copilot), `.gemini/settings.json` (Gemini CLI; the whole file is client config: mcpServers, hooks, tool permissions), `.codex/config.toml` (Codex CLI: `[mcp_servers.*]`), `.junie/mcp/mcp.json` (Junie), `.devin/mcp_config.json` and `.devin/mcp_config.local.json` (Devin since v3000.3) with `.devin/config.json` and `.devin/config.local.json` (older Devin keeps mcpServers there; they also hold permissions and hooks), `.grok/config.toml` (Grok), `.agents/mcp_config.json` (Antigravity) and `.tabnine/agent/settings.json` (Tabnine). Hook files added, the ones `chock sync` merges chock's entries into: `.cursor/hooks.json` (Cursor), `.codex/hooks.json` (Codex CLI), `.windsurf/hooks.json` (Windsurf), `.github/hooks/` (VS Code Copilot: `chock.json`, agentseam's default `agentseam.json`), `.grok/hooks/` (Grok), `.devin/hooks.v1.json` (Devin) and `.agents/hooks.json` (Antigravity). Ordinary neighbours stay writable: `.vscode/launch.json` and `settings.json`, `.cursor/rules/*`, `.windsurf/rules/*`, `.codex/prompts/*`, `.gemini/commands/*`, `.github/workflows/*` and `.github/ISSUE_TEMPLATE/*`, `.devin/notes.md`, `.agents/skills/*`. (`.gemini/GEMINI.md` was already protected as an instruction file and still is.) The same path normalisation applies (backslashes, `//`, `/./`, case)."
  - "A person still edits these files from their own shell, and `chock sync` passes the guard (it names no protected path), so regeneration works. `chock sync` merges hook entries into `.gemini/settings.json`, `.tabnine/agent/settings.json` and the hook files above; a run that changes one leaves it dirty until it is committed, and the Edit/Write gate's turn's-end check refuses an agent's turn while a protected file is dirty (tested for `.gemini/settings.json`, `.tabnine/agent/settings.json` and `.cursor/hooks.json`), as it does for `.claude/settings.json`. Commit the regenerated files before an agent's turn ends."
  - "Left out: Windsurf's MCP config (global `~/.codeium/windsurf/mcp_config.json` only), Kimi Code and Junie's user files (outside the repository), the `mcp` key in `.vscode/settings.json` (an editor settings file with unrelated content), and clients chock does not support (`.roo/mcp.json`, `.amazonq/mcp.json`). Known limits, the same as for `.claude/settings.json` and every other protected path and not specific to these: `..` segments are not resolved, a write by bare file name after a `cd` into the directory is not joined to it, and shell variables, command substitution and globs are not resolved to the protected path. The engine's baseline check is the backstop when a change reaches a pull request."
- version: 0.2.3
  date: '2026-09-30'
  changes:
  - "Behaviour change: `.chock/security.json` (java-security) and `.chock/agentic-security.json` (agentic-code-security) are protected by the guard and the Edit/Write gate. They set each rule's verdict (allow, ask or deny), so an agent that could write them could switch a denying rule to allow and then pass its own gate. A person still edits them from their own shell. java-security's guided setup page writes nothing, and its skill used to have the agent write the file; java-security 0.6.3 has the agent show the file, the diff and a here-doc command the person runs instead. Reading them stays allowed. The baseline check in the engine holds a loosened verdict to a person's approval in a pull request."
  - "Paths are normalised before they are matched: the guard reads backslashes as slashes, collapses `//` and `/./`, and lowercases, since macOS and Windows filesystems ignore case, so `.chock//security.json`, `.chock/./security.json` and `.chock/SECURITY.json` are refused. The Edit/Write gate's forbidden_path_regex is case-insensitive (`(?i)`) and accepts the same repeated separators. Reads of those spellings still pass."
  - "`.chock/state` joins the shell guard only: chock's Stop re-entry ledger lives at `.chock/state/<session>.stop.jsonl`, and an agent that rewrote it could reset its own re-entry count. It is not in the Edit/Write gate, whose turn's-end check walks untracked paths and would refuse every turn end where `.chock/state/` is not gitignored, because the engine writes its session log there."
  - "Known limits, unchanged: a directory as the target (`rm -r .chock`), `git checkout REF -- .`, globs and shell variables are not resolved to the protected paths. The engine's baseline check is the backstop when the change reaches a pull request."
- version: 0.2.2
  date: '2026-09-30'
  changes:
  - "Behaviour change: `.chock/config.yaml` is protected by the guard and the Edit/Write gate. It holds the rollout level (`rollout: observe` turns blocking gates into warnings), which policies are disabled or narrowed, and `agent_commit_env`, the variables that mark an agent. An agent that could write it could lower its own enforcement or hide its own marker. A person still edits it from their own shell. Reading it stays allowed."
- version: 0.2.1
  date: '2026-09-30'
  changes:
  - "Behaviour change: the 'chock: approved-config-change' marker no longer passes a command. Before, any shell command carrying the marker (for example `echo x > AGENTS.md  # chock: approved-config-change`) passed; now it is blocked like any other write to a protected path. The guard runs only on the agent's own tool calls, so only the agent could type the marker; a person makes an approved change in their own shell, where no agent hook runs. The refusal message now tells the agent to ask the person, never to use a marker. The Edit/Write gate is unchanged. Eval tc-008 flips allow to block."
  - "Text: the description lists .git/hooks and policy implementations/, names the gate's points (PreToolUse, the turn's end) and fits the 500-char budget; the rule text lists .git/hooks and says to ask the person."
- version: 0.2.0
  date: '2026-09-29'
  changes:
  - "Second check for the Edit and Write tools: a content_regex gate at tool_use only (PreToolUse and the turn's end), never at commit, so a person stays free to edit these files. Its forbidden_path_regex matches exactly the paths the command guard protects (instruction files, .claude/settings, .mcp.json, .chock/bin, .chock/compiled, .chock/dependency-allowlist.txt, .chock/config.yaml, .git/hooks, policy implementations), refuses any write to them outright (the path check needs no content; the content pattern is `(?!)`, which matches nothing, because a match-anything pattern would refuse every file), and its message tells the agent to propose the change to a human. No allowlist_pragma: the runner reads a waiver from the path's whole HEAD file, so one committed line would unlock the file for every later edit. The gate never judges this policy's own folders (the runner skips a policy's own paths); the guard still covers those from the shell. Artifact stays rule; the ambient line is unchanged. Guard unchanged."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "Ported from bash to Python: implementations/protect-agent-config.py replaces the bash script, stdlib only, deterministic, no network. It ships beside the chock_shellparse package (identical in every ported policy; tests pin the copies), which reads the command with a quote-aware lexer instead of scanning text: it splits at unquoted && || ; | & and newlines, drops redirections and comments, keeps heredoc bodies, and looks through bash|sh|zsh -c, pwsh -Command, cmd /c, eval, sudo, doas, env VAR=x, command, exec, nohup, timeout, nice, time, xargs and subshells, so `cd repo && ...` and `bash -c '...'` are judged on the command they run and `echo ...` on none. Unbalanced quotes fall back to a split at separators and whitespace that still sees redirections and reads an unclosed quote as one word; CHOCK_TOOL=powershell|pwsh selects PowerShell reading (backslash paths, cmdlets), and without it the text decides. An unexpected exception exits 2 (a guard fault), never 1 (a block)."
  - "Bypasses closed, each with eval cases: `git checkout HEAD~3 -- AGENTS.md`, `git restore --source=... AGENTS.md` (and git rm/mv of a protected file), PowerShell `Set-Content`, `Add-Content` and `Out-File` on a protected path, and the `sc`/`ac` aliases. `.chock/dependency-allowlist.txt` joins the protected paths; `.chock/bin` and `.chock/compiled` are protected as directories too, not only below a trailing slash."
  - "False block removed: writes are judged by what they change, so `cp AGENTS.md /srv/backup` (a read of the protected file) and `Get-Content AGENTS.md | Set-Content /srv/copy` are allowed; only the destination of cp/install/ln counts. The 'chock: approved-config-change' marker still passes a command, and every existing case keeps its verdict."
- version: 0.0.7
  date: '2026-09-24'
  changes:
  - "Eval cases added so every guard statement is exercised: clause-splitter arms for a
    separator glued to the end of a token (`status|| rm`, `status&& rm`, `notes.txt| rm`)
    targeting .claude/settings.json. Guard unchanged."
- version: 0.0.6
  date: '2026-09-21'
  changes:
  - "False-positive fix (deep review): a redirect ('>'/'>>') is now only a write when the
    protected path is its actual target, not merely present anywhere in the command, so
    `cat .claude/settings.json 2>/dev/null` and `... 2>&1` (stderr suppressed or
    duplicated, not a write to anything) no longer refuse a plain read. Writer-verb
    detection (rm/mv/cp/tee/sed -i/interpreter write-forms) is now scoped to the same
    command-line clause (split at ';', '&&', '||', '|', including a separator glued to
    the END of a token) as the protected-path mention, so an unrelated write in a
    different clause (`rm -f /srv/x; cat .claude/settings.json`, `echo hi > /srv/x; cat
    .claude/settings.json`) no longer refuses the read. A genuine write, alone or beside
    an unrelated read clause, is still refused. Seven eval cases added (tc-025..tc-031)
    covering the false-positive fix and the regression it must not reopen."
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release. Anchors: MITRE ATLAS AML.T0081 (Modify Agent Configuration), AML.T0083, OWASP ASI03, AIVSS Self-Modification."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.3
  date: '2026-08-22'
  changes:
  - "Delivery bump for the Claude-format plugin packages built from this policy: on republish, their PreToolUse command is a single python3 invocation (the proposed interpreter-fallback chain was rejected after review proved it could erase deny verdicts) and their descriptions state the per-client fail posture. Guard logic and this repo's own artifacts are unchanged."
- version: 0.0.4
  date: '2026-08-23'
  changes:
  - "Description honesty: the approved-config-change marker is stated as what it is -- friction plus an audit trail, not authentication (anything in the command line, the agent can write; found in external review of the Copilot marketplace submission). Points at the commit-time gate and CI as the enforcement an agent cannot self-approve. Guard logic unchanged."
- version: 0.0.5
  date: '2026-08-24'
  changes:
  - "Guard self-protection + coverage (hardening review): also protect the policy implementation sources (.agents/policies/*/implementations/) so an agent cannot shell-rewrite the very guard the hook executes; treat interpreter write-forms (python -c, perl -i, ruby -i, node -e, --eval) and dd/ed/ex as writers. Interpreter write-flag detection is order-independent -- a code/in-place flag after any interpreter option matches (python -O -c, perl -0777 -i, node --eval), interpreters and raw writers are matched by basename (path-qualified /usr/bin/python3, /bin/dd), and whole-token writers are scanned inside bash -c payloads -- while a bash -c wrapper's own -c and bare `python script.py path` reads still pass. Normalize Windows backslash paths and also scan CHOCK_RAW_COMMAND. Sixteen eval cases added (tc-009..tc-024) covering the guard sources, every claimed writer, the order-independent and path-qualified and wrapped-payload bypasses, and read-path negatives."
