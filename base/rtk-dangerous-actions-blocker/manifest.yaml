id: rtk-dangerous-actions-blocker
name: "rtk Dangerous Actions Blocker"
version: "0.2.2"
description: >
  rtk#1007. Destructive verdicts come from the chock_destructive table shared with block-
  destructive-commands: the same blocks (root/home deletes, force/delete/mirror pushes, reset
  --hard, clean -f, IaC destroy, cloud deletes, DB drops, lockouts) and asks (rm -rf off rtk's
  safe list, bare lease, stash drop, prunes, -auto-approve). Own rows block credential-file reads
  (.env, keys, ~/.ssh) and echo or inline *_API_KEY/_SECRET/_TOKEN. Skips file rows in container
  exec.
artifact: rule
enforcement: advise
compliance:
  mitre_atlas:
  - control: AML.T0101
    coverage: partial
    note: "refuses or holds destructive tool commands before they run; non-shell destruction paths are out of scope"
  owasp_asi:
  - ASI02
rule:
  text: |
    block: chock_destructive table (= block-destructive-commands: rm_-rf(/|~|.|abs), push(-f|+ref|:ref|--mirror), reset_--hard|clean_-f|checkout_., destroy|cloud_delete, sql_drop|dropdb), read(.env|*.pem|*.key|id_rsa|~/.ssh|~/.aws), echo|inline($*_API_KEY|$*_SECRET|$*_TOKEN)
    ask: rm_-rf(relative, off safe_list), lease_bare, stash_drop, branch_-D, docker_*_prune, -auto-approve, pkill_-f, systemctl_disable; skip_inside: docker|kubectl_exec(file rows); prefix: rtk
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-09-13T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

tags:
- carve-out
- rtk
- requested-by:rtk-ai/rtk#1007

changelog:
- version: 0.2.2
  date: '2026-10-03'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: in a short-option cluster every `o` or `O` takes the next word (`bash -co pipefail '...'`, `-oc`, `-Oc extglob`, `-c -oe pipefail`) and a lone `-` ends the options as `--` does (`sh -c - '...'`), so the script behind them is read and judged. What this policy refuses is otherwise unchanged; it now also judges the command inside those forms. See protect-agent-config 0.2.7."
- version: 0.2.1
  date: '2026-10-02'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: it skips a `--` and the shell options between `-c` and the script (`bash -c -- '...'`, `sh -c -x '...'`, `eval -- '...'`), reads `name=(...)`, `name+=` and `name[i]=` assignments, looks through the `{` that opens a function body or group, and splits a line whose quotes do not balance in one pass (it was cubic: seconds at 4 KB, a minute at 8 KB). What this policy refuses is otherwise unchanged; it now also judges the command inside those forms. See protect-agent-config 0.2.6."
- version: 0.2.0
  date: '2026-10-02'
  changes:
  - "Destructive verdicts now come from chock_destructive (table 1.0.0), shipped byte for byte in this policy and block-destructive-commands; this guard keeps only its own credential rows (file reads, echoes, inline literals). Where the two policies disagreed the stricter verdict wins, because an agent may not lower enforcement: git reset --hard, git clean -f, git checkout . and docker system/volume prune now block instead of asking (tc-017 to tc-020, tc-034, tc-035, tc-040, tc-060 and tc-068 flip ask to block), and git push --force-with-lease with no value asks (tc-016 flips allow to ask). Aligning at ask instead, as the roadmap's HP02 note suggests, would loosen block-destructive-commands; that is the owner's call and a one-row change in the table."
  - "Gains every verb block-destructive-commands 0.2.0 adds (its changelog lists them), plus find -delete/-exec rm, shred, truncate, wipefs and docker volume remove, which this fork never judged. The C3 fallback is honoured fail-closed the same way: an unsplittable command is also read without its quotes and the stricter reading wins. 13 eval cases added (tc-093 to tc-105)."
  - "The same review hardening as block-destructive-commands 0.2.0 (its changelog lists it), through the shared table. rtk's safe list for rm -rf is unchanged: widening it (.venv, .pytest_cache, out) would turn asks into allows, which only the owner can decide."
- version: 0.1.1
  date: '2026-09-30'
  changes:
  - "Message fixes: a force push (and a '+' refspec) now says 'git push --force rewrites remote history. Rebase onto the remote and push fast-forward; a rewrite is the person's call.' The old text advised --force-with-lease, which block-destructive-commands' pre-push hook refuses when both are installed. Every block reads 'BLOCKED: <what> is refused. Ask the person to run it themselves; prefer a scoped or dry-run form.' in place of 'is not allowed without approval', since no approval path exists. The rm -rf message names '.' and '..' and the PowerShell message names what is blocked (any drive path, root, home, '.' or '..'). Guard verdicts unchanged."
  - "Rule text: aws s3 rm reads --recursive (not -r) and rb --force; '.' is listed as a blocked rm -rf target; prefer drops force-with-lease."
  - "Description (within the 500-char budget): names PowerShell/cmd removal, aws s3 rb --force, FLUSHALL, printf and '.', and says which rows are skipped inside docker/kubectl exec."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "Ported from bash to Python: implementations/rtk-dangerous-actions-blocker.py replaces the bash script, stdlib only, deterministic, no network. It ships beside the chock_shellparse package (identical in every ported policy; tests pin the copies), which reads the command with a quote-aware lexer instead of scanning text: it splits at unquoted && || ; | & and newlines, drops redirections and comments, keeps heredoc bodies, and looks through bash|sh|zsh -c, pwsh -Command, cmd /c, eval, sudo, doas, env VAR=x, command, exec, nohup, timeout, nice, time, xargs and subshells, so `cd repo && ...` and `bash -c '...'` are judged on the command they run and `echo ...` on none. Unbalanced quotes fall back to a split at separators and whitespace that still sees redirections and reads an unclosed quote as one word; CHOCK_TOOL=powershell|pwsh selects PowerShell reading (backslash paths, cmdlets), and without it the text decides. An unexpected exception exits 2 (a guard fault), never 1 (a block)."
  - "Secret-file reads now follow the rule text's read(...): besides cat/head/tail/less/more/bat/strings/xxd/hexdump/base64/od/nl/tac, the search and filter tools grep, egrep, fgrep, rg, ag, ack, awk, gawk, sed, cut, sort, uniq, jq, yq and diff are refused on a credential file, and so is a `< .env` input redirect to any of them; `grep KEY .env` was silent before. Example and template copies (.env.example and friends) stay readable."
  - "The docker/kubectl exec rule is kept by parsing the command that runs inside the container and judging it with the host-path rows skipped, so `docker exec web cat .env` is still allowed while `docker exec ci git push --force` is still refused. `rtk` remains a transparent prefix. Every case in the suite keeps its verdict."
- version: 0.0.2
  date: '2026-09-24'
  changes:
  - "Bug fix: pos_after (used to read the docker/aws/helm action slot) returned failure when
    its target word was never a positional -- reachable whenever that word only appears as
    the VALUE of an earlier value-flag (e.g. `aws --profile s3 sts get-caller-identity`,
    profile literally named \"s3\"). Every caller assigns its output directly and only
    compares the string, but the unguarded assignment's failing exit code aborted the whole
    script under `set -eu`, silently blocking an unrelated command with no message.
    pos_after now always succeeds (empty output when not found), matching how every caller
    already treats it. Eval cases added covering a credential-path read under .ssh/, the
    pos_after regression (now allowed), docker image prune (ask), terraform destroy,
    aws s3 rm --recursive, helm uninstall, aws s3 rb --force, and gcloud ... delete."
- version: 0.0.1
  date: '2026-09-13'
  changes:
  - "Initial carve-out of the decision table in rtk-ai/rtk#1007. Forked from block-destructive-commands 0.0.8 (its position-aware argv parser, value-flag handling, $HOME/tilde targets, PowerShell branch and cloud rows), then changed only where rtk's table differs: an ask tier (exit 3) for rm -rf on unlisted relative paths, git reset --hard / clean -f / checkout . / branch -D, docker prune and docker rm -f over a substitution; new block families for credential-file reads, credential echoes and inline literals, and DROP/TRUNCATE/unscoped DELETE through the common database clients; rtk added as a transparent prefix; file checks skipped inside docker exec / kubectl exec."
