id: verify-mcp-allowlist
name: "Verify MCP Allowlist"
version: "0.5.1"
description: >
  Gates MCP servers against .chock/mcp-allowlist.json, empty by default (name, launcher with exact args, or url host).
  Shell guard refuses `<agent> mcp add` and shell writes of MCP configs or the allowlist unless listed. Script gate
  (commit, tool use, turn end) reads 13 client configs: a server off the list, or with other command, args or url host,
  refuses; unpinned or shell launchers, http, literal credentials, old versions only warn. Misses: aliases, scripts,
  gitignored files, other clients.
artifact: rule
enforcement: advise
rule:
  text: |
    mcp_server(any client config): must(name+launcher+exact_args|url_host in .chock/mcp-allowlist.json); block(unlisted|command_args_url_differ); warn(unpinned|shell_launcher|http|literal_credential|below_floor|enable_all)
    allowlist: file, empty by default; an agent is judged by HEAD's copy and cannot grow it, a person edits it; guard: `<agent> mcp add`, shell writes; gate: commit|tool_use|stop
hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      An MCP server is not on the allowlist, differs from its allowlisted entry, or its config cannot be parsed.
      Only servers listed in .chock/mcp-allowlist.json (name with launcher and exact arguments, or url host) may be
      configured. Pin it to an exact version or image digest, run no shell command line, use https and carry
      credentials only as references (these rules warn for now). Ask a person to review the server and edit the allowlist
      from their own shell; do not edit the allowlist yourself.
    params:
      script: verify-mcp-allowlist_gate.py
effects:
- read_only
approval:
  required: false

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "blocks an unverified MCP server entering .mcp.json from the shell -- the mechanizable slice of ASI04's 'unverified MCP servers' framing; provenance and signature verification beyond allowlist membership stay with the advisory owasp-asi04-agentic-supply-chain policy"
  mitre_atlas:
  - control: AML.T0010
    coverage: partial
    note: "an MCP server is an ML supply-chain component; this blocks one entering the agent's tool surface outside a maintainer-curated allowlist, at tool time only"

provenance:
  author: "chock-core"
  created_at: "2026-09-07T00:00:00Z"
  updated_at: "2026-10-02T12:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.5.1
  date: '2026-10-02'
  changes:
  - "Verification fixes, all in the command guard: an `mcp add-json` entry or an inline config write padded with nesting deeper than the JSON reader's limit (about 1000 arrays) made the guard exit 2, which the runner reads as not checked, so the add passed; a recursion fault is now a refusal. Inline code that names a protected file (`python3 -c \"open('.mcp.json','w')...\"`, `node -e`, `perl -e`, a python heredoc) was refused in v1 and passed in 0.5.0, because the path test had become a whole-name match; it is refused again, and a file merely named like one (`foo.mcp.json`, `.mcp.json.bak`) is not. A heredoc handed to a shell (`bash <<EOF`) is read as commands. `claude.cmd`, `claude.exe` and cursor-agent's `agent` alias are read as the agent. `mcp add --help` and `-h` are help, not an add, and a help flag after `--` is still the server's own argument."
  - "Known limits, stated here because they were probed: an approved server's `env` can swap the binary its allowlisted launcher runs (`PATH`, `NODE_OPTIONS`, `NPM_CONFIG_REGISTRY`, `LD_PRELOAD`, proxies) and its `cwd` and VS Code `envFile` are not judged; the PATH family only warns (exit 4, observed under D15), and the guard has no warning channel, so an `mcp add -e PATH=...` of an approved server passes silently; an allowlisted spec is the arguments joined by single spaces, so `[\"a b\"]` equals `[\"a\", \"b\"]`; the shell guard reads a program or verb written through a variable, `$(...)`, an alias or a here-string (`bash <<< ...`), and a wrapper it does not know (`chrt`, `taskset`, `watch`, `script -c`, `busybox`, `firejail`, `unbuffer`), as it reads none of them; an inline-code read of a protected file (`python3 -c \"open('.mcp.json').read()\"`) is refused like a write; a command line near a million characters takes the guard 15 to 40 seconds, and past the runner's 30s the guard is not checked; a missing or corrupt file in the guard's data folder makes it exit 2 (not checked), so those files are guard source, held in place by protect-agent-config and the shell write check; a Zed extension server, a `mcpServers` that is a list and Cline, Continue, Junie, Trae, Copilot and `.vscode/settings.json` configs are not read."
- version: 0.5.0
  date: '2026-10-02'
  changes:
  - "Review-driven corrections, all in this release: widening an allowlist entry's host (`example.com` to `*.example.com`) is an edited entry; entry keys are JSON, not `|` joined, so two entries cannot collide; the HEAD read ignores `git replace` and reads the allowlist under the gate's repo_root, as the disk read does; any event that is not commit, push or ci reads HEAD's allowlist and judges allowlist writes as an agent's; a repeated key is an enforced finding, because a first-wins loader would run the value that is never judged; paths are matched after `.`, `..` and `//` are resolved; `mcp add` is found after global options (`claude --model x mcp add`) and under npx, bunx, pnpx, uvx, npm, pnpm, yarn and bun (dlx, exec and x); null and boolean values in an entry read as text; `env -i`, `timeout 5s`, `npm --silent exec` (not `npm --prefix /x exec`, nor `stdbuf -i L`), `python -Sc`, `node --eval=x` are read; PATH, NPM_CONFIG_PREFIX, NPM_CONFIG_NODE_OPTIONS, SSL_CERT_FILE and SSL_CERT_DIR join the denied environment variables. A server's key digests its whole entry, but only its command, arguments and url host are matched against the allowlist: an edit to `cwd`, `type`, `trust`, `autoApprove` or an environment variable of an approved server is not a finding unless a rule names it."
  - "Known limits, stated here because they were probed: the trust anchor is HEAD, which an agent that can rewrite refs (`update-ref`, `commit-tree`) or disable the commit hooks can move, so this policy relies on block-no-verify and the installed hooks; files git ignores are not written back to the gate at the turn's end, so a shell-written ignored config is not seen; the shell guard does not follow `flock` or a node script path to an agent, `cd`, `cp -t`, wildcards, symlinks, `git checkout -- .chock`, pipes into a shell or `env -S`; `qwen`, `amp`, `opencode`, `goose` and `copilot mcp add`, `code --add-mcp`, `claude --mcp-config` and `codex -c mcp_servers...` are not read; `.vscode/settings.json`, `.amazonq`, `.qwen`, `.kilocode`, `.continue` and `~/.claude.json` are not read; a Zed extension server (no command, no url) cannot be listed; credential detection is by name (`--key`, `-k`, `--pat`, `GH_PAT` and query-string tokens are not seen; `KEYBOARD` is); the guard has no warning channel, so it passes an approved server with a literal credential without a signal; a new warning-class finding beside an old refusing one in the same file exits 1, because the script cannot see the baseline; `ci` is not among the gate's events yet; the unreadable-allowlist and enable-all findings stay as described. v1's `cp .mcp.json .mcp.json.bak` was refused only because the path contained `.mcp.json`; it is allowed now."
  - "Behaviour change: the allowlist moves out of the guard source into `.chock/mcp-allowlist.json` (closed schema: a `servers` list of objects with `name` and either `launcher` with `spec`, the arguments after it joined by single spaces, or `url_host`, which may be `*.domain`). The file is empty by default and a missing file is an empty list, so every server is unlisted. The built-in `filesystem` entry is gone: it was unpinned, so v2 would warn on it; list a pinned one instead. Unknown keys, repeated keys, bad JSON or a wrong shape refuse every server and say why. An agent (tool use, turn's end, an agent's commit) is judged by the file as HEAD holds it, and a write of the file that adds or edits an entry is refused, so an agent cannot approve its own server; a person's commit reads the file on disk, so a person may add the entry and the server together. The allowlist may shrink. A shell write to the allowlist is refused like one to the guard source."
  - "New script-gate rules, all observed (they exit 4, a warning, per decision D15; the v1 tiers still exit 1): a launcher not pinned exactly (npx, bunx, pnpm dlx, yarn dlx, npm exec, uvx, uv tool run, pipx run: `name@x.y.z` or `name==x.y.z`; a git source only at a commit; docker and podman: an `@sha256:` digest), a shell or inline-code launcher (sh, bash, cmd /c, powershell -Command, python -c, node -e, looked through env, sudo and timeout), an http url or one with embedded credentials, a literal value in an environment variable, header or argument whose name says token, key, secret, password or auth, a denied option or environment variable (data/mcp-option-denylist.json), a package below its floor (data/mcp-version-floors.json: mcp-remote 0.1.16, mcp-server-git 2025.12.18; the inspector is covered by the pin rule), a repeated key, `enableAllProjectMcpServers` that is not false, and an `enabledMcpjsonServers` name the allowlist does not hold. An allowlist entry never waives one of these. Promoting a rule is adding it to ENFORCED in the gate (a repeated key is already there)."
  - "More clients read: .windsurf/mcp_config.json, .roo/mcp.json, .kiro/settings/mcp.json, .zed/settings.json (context_servers), opencode.json and opencode.jsonc (mcp), .claude/settings*.json, beside the v1 set; paths match in any case and either slash, trailing dots and spaces dropped. JSON is read as JSONC through the shared reader, so comments and trailing commas no longer hide or refuse a config; a repeated key is a finding and the values it hides are judged too. An entry is read from `command` as a string, a list or a Zed object, with `env`/`environment` and `headers`/`http_headers`; Codex TOML tables are read the same way. A server's key is its name and a digest of its whole entry, so a changed argument, environment, header or url is a new finding (the rug pull), while a reformat or a move is not."
  - "The shell guard also refuses `codex mcp add`, `gemini mcp add` and `cursor-agent mcp add` unless the added spec is on the allowlist; it reads -e/--env, -H/--header, --url and --transport, `--` launch lines and `add-json`. It refuses on the v1 tier only: an unlisted or altered server, an unreadable command; the new rules above are observed in the gate. A shell write is checked for the dedicated MCP files only (.mcp.json, .cursor, .vscode, .windsurf, .roo, .kiro, claude_desktop_config.json); the settings files that hold other things are judged by the gate. Eval suite rewritten: 103 cases, including the roadmap's mixed-case path, `codex mcp add`, JSONC, unpinned, shell launcher, http, changed argument, literal credential and enable-all cases."
- version: 0.4.4
  date: '2026-10-03'
  changes:
  - "a lone + ends shell options like -"
- version: 0.4.3
  date: '2026-10-03'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: in a short-option cluster every `o` or `O` takes the next word (`bash -co pipefail '...'`, `-oc`, `-Oc extglob`, `-c -oe pipefail`) and a lone `-` ends the options as `--` does (`sh -c - '...'`), so the script behind them is read and judged. What this policy refuses is otherwise unchanged; it now also judges the command inside those forms. See protect-agent-config 0.2.7."
- version: 0.4.2
  date: '2026-10-02'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: it skips a `--` and the shell options between `-c` and the script (`bash -c -- '...'`, `sh -c -x '...'`, `eval -- '...'`), reads `name=(...)`, `name+=` and `name[i]=` assignments, looks through the `{` that opens a function body or group, and splits a line whose quotes do not balance in one pass (it was cubic: seconds at 4 KB, a minute at 8 KB). What this policy refuses is otherwise unchanged; it now also judges the command inside those forms. See protect-agent-config 0.2.6."
- version: 0.4.1
  date: '2026-09-30'
  changes:
  - "Behaviour change: the 'chock: approved-config-change' marker no longer passes a command. Before, a shell command carrying the marker passed every shell check, including an edit of the allowlist in this guard's source, a write to .mcp.json with no visible entry and a `claude mcp add` of an unlisted server; now each is blocked. The guard runs only on the agent's own tool calls, so only the agent could type the marker; a person changes the allowlist in their own shell, where no agent hook runs. Every refusal now tells the agent to ask the person and not to edit the allowlist or add the server itself. The script gate is unchanged, except that its message also covers an unparseable config. Eval tc-006 flips allow to block."
  - "Text: the description drops the stale 'tool time only' and 'No pragma' wording, names the turn's end and the unparseable-config refusal, and fits the 500-char budget."
- version: 0.4.0
  date: '2026-09-30'
  changes:
  - "The script gate prints a findings document instead of comparing with a baseline itself. It reports every server the allowlist does not name, keyed by the server name and its normalized source (command and args space-joined, or the url), and the engine (chock 0.15.0) runs it again on the baseline text and refuses only a (path, key) the change holds more of. So a server the change adds, renames or re-argues is new, an unlisted server already there never blocks an unrelated edit or a reformat, and the same server declared twice in one file is a second copy. An unreadable config is keyed by a digest of its text, so any edit to one is new. Removed: head_text, before_text and entries, the gate's own HEAD and disk reads; the exit code (1 refuses, 2 is a fault) is unchanged. Eval cases tc-059 onward add an unlisted server added, an existing server's args changed, an old server reformatted, a line shift and a duplicate."
- version: 0.3.0
  date: '2026-09-30'
  changes:
  - "The script gate judges only what the change adds at tool use too, not just at commit. A server is judged when its name+source pair is absent from the baseline: a new server, or one whose command/args/url changed. Baseline per event: HEAD at commit and push; at PreToolUse the file on disk before the write; at the turn's end (disk already holds the written text) HEAD; a new config file has every server new. A renamed server with unchanged config counts as new, so an unlisted new name is still refused, as the guard's name+source rule has it. A server the turn did not touch no longer blocks the agent at the turn's end. Eval tc-056 (stop, an old unlisted server plus an added listed one) flips block to allow; tc-057 (stop adds an unlisted server) and tc-058 (stop alters an old server) block; tc-054's wording now says the added server is what is refused."
- version: 0.2.0
  date: '2026-09-29'
  changes:
  - "Second check for file-write tools and for commits: a script gate (implementations/verify-mcp-allowlist_gate.py, stdlib) at commit and tool_use that parses every written MCP client config -- .mcp.json, .cursor/mcp.json, .vscode/mcp.json (servers or mcpServers), claude_desktop_config.json, .gemini/settings.json (mcpServers) and .codex/config.toml ([mcp_servers], tomllib) -- and refuses any server whose name and exact command/args/url are not on the allowlist. It imports the guard's own ALLOWED_MCP_SERVERS and source rule from the file beside it, so there is one allowlist. At commit only servers the change adds or alters against HEAD are refused, so a server already committed never blocks an unrelated edit; at tool use every server in the written file is judged. An unparseable config is refused as unverifiable. Reasons name the file and server, never the launch line, which may carry a token. Guard unchanged. The script is named with an underscore (`_gate`) so that chock's eval runner, which treats every implementations/*.py as a command guard and takes the first in sort order, still picks verify-mcp-allowlist.py for the command cases."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "Ported from bash to Python: implementations/verify-mcp-allowlist.py replaces the bash script, stdlib only, deterministic, no network. It ships beside the chock_shellparse package (identical in every ported policy; tests pin the copies), which reads the command with a quote-aware lexer instead of scanning text: it splits at unquoted && || ; | & and newlines, drops redirections and comments, keeps heredoc bodies, and looks through bash|sh|zsh -c, pwsh -Command, cmd /c, eval, sudo, doas, env VAR=x, command, exec, nohup, timeout, nice, time, xargs and subshells, so `cd repo && ...` and `bash -c '...'` are judged on the command they run and `echo ...` on none. Unbalanced quotes fall back to a split at separators and whitespace that still sees redirections and reads an unclosed quote as one word; CHOCK_TOOL=powershell|pwsh selects PowerShell reading (backslash paths, cmdlets), and without it the text decides. An unexpected exception exits 2 (a guard fault), never 1 (a block)."
  - "Bypasses closed, each with eval cases: `claude mcp add evil ...` and `claude mcp add-json evil '{...}'` (name and source are checked against the allowlist; `claude mcp add filesystem -- npx -y @modelcontextprotocol/server-filesystem` passes, an allowed name pointed at another command does not, `add-from-claude-desktop` is refused as unverifiable; list, get and remove stay allowed)."
  - "The JSON in an inline .mcp.json write (echo, printf or a heredoc) is now parsed with a real JSON parser instead of a regex window, so a server entry carrying a nested object (an env map) no longer shifts the boundary and hides the next entry. A write with no parseable mcpServers entry still fails closed. The allowlist moved into the Python guard; the protected-source check covers the guard and its shipped parser package (verify-mcp-allowlist/implementations/), and the existing .sh-named eval cases keep their verdicts."
- version: 0.0.3
  date: '2026-09-24'
  changes:
  - "Eval cases added so every guard statement is exercised: the interpreter-write clause
    (e.g. `python3 -c ... .mcp.json`), and clause-splitter arms for a separator glued to the
    end of a token (`status|| tee`, `status&& tee`, `cat x| tee`) as well as a bare pipe
    token. Also: removed the dead `*) exit 0 ;;` default arm from the final protected-path
    case -- protected_clause can only ever contain .mcp.json or the allowlist script's own
    filename (the only two patterns _clause_protected_path/_redirect_target_protected match,
    and the allowlist-script arm already exits above), so that default could never run; the
    remaining single-arm case's no-op action is now an explicit `:` so it is traceable. A
    direct-invocation test (test_guard_direct.py) covers the CHOCK_RAW_COMMAND-unset
    raw=\"$*\" fallback, which no eval case can drive. Guard behavior unchanged for every
    reachable input."
- version: 0.0.2
  date: '2026-09-21'
  changes:
  - "False-positive fix (deep review): writer detection was global (any writer-ish token or
    redirect anywhere in the command) while the .mcp.json path check was a separate,
    unlinked substring test, so a plain read with stderr suppressed
    (cat .mcp.json 2>/dev/null) or an unrelated write elsewhere in the same line
    (rm -f /tmp/x; cat .mcp.json) was refused -- the same bug class fixed in
    protect-agent-config, reusing its clause-scoping approach here. A genuine write is still
    refused. Two eval cases added (tc-016, tc-017)."
- version: 0.0.1
  date: '2026-09-07'
  changes:
  - "Initial release (issue #1): tool-time guard over .mcp.json server entries against a name+source allowlist that ships inside implementations/verify-mcp-allowlist.sh. Unlisted name blocks; an allowed name with a changed command/args/url blocks (catches both an edited server and one renamed to an allowed name while pointing elsewhere); an exact name+source match passes without needing a human approval each time. The allowlist is protected the same way protect-agent-config protects every policy's guard sources -- a shell write to it is refused without the 'chock: approved-config-change' marker; it ships inside the script rather than a separate file because guard-mode evals run against an empty sandbox repo, so a separate allowlist file could never be exercised by this suite. Scoped to Claude Code's .mcp.json: agentseam 0.2.1 has no per-vendor MCP-config-path field to read for the other agents it lists (its config_path is hook-wiring, not MCP servers), and this policy does not guess at undocumented paths. Commit-time blocking from the issue is not shipped: chock 0.8.0's three gate kinds cannot express name+source pairing against an external allowlist file, so this stays a PreToolUse guard, best-effort on Claude Code (PreToolUse fails open on a crashed hook) like its named prior art protect-agent-config."
