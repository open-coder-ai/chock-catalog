id: verify-mcp-allowlist
name: "Verify MCP Allowlist"
version: "0.3.0"
description: >
  Gate MCP server configuration as protected content. A shell write to .mcp.json is refused
  unless every mcpServers entry on the line, parsed as JSON, matches a name+source pair on the
  allowlist -- an unlisted name blocks, and an allowed name whose command/args/url changed
  blocks too. `claude mcp add|add-json` is checked the same way (add-from-claude-desktop cannot
  be verified and is refused). The allowlist ships inside this guard's own script, protected
  like every policy's implementations/ source -- edit only with 'chock: approved-config-change'.
  The shell guard reads Claude Code's .mcp.json, best-effort (PreToolUse fails open on a crash; a
  write with no visible content fails closed). A script gate at commit and tool use parses every
  written MCP config (.mcp.json, .cursor/mcp.json, .vscode/mcp.json, claude_desktop_config.json,
  .gemini/settings.json, .codex/config.toml) against the same allowlist; only servers the change
  adds or alters are refused, at commit and tool use. No pragma.
artifact: rule
enforcement: advise
rule:
  text: |
    mcp_config(.mcp.json): server(name,source=cmd+args|url) must(match: allowlist(this_guard_source)); block(unlisted|source_mismatch); allow(exact_match)
    allowlist: lives in implementations/verify-mcp-allowlist.py; also gates `claude mcp add|add-json`; edit requires 'chock: approved-config-change'; also gates written configs: .mcp.json|.cursor|.vscode|claude_desktop|.gemini|.codex added-only at commit+tool_use
hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      An MCP server that is not on the allowlist is configured. Only servers listed, by name and
      exact command/args/url, in implementations/verify-mcp-allowlist.py may be added. Ask a
      person to review the server and add it to that list; do not edit the allowlist yourself.
    params:
      script: verify-mcp-allowlist_gate.py
effects:
- read_only
approval:
  required: false

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "blocks an unverified MCP server entering .mcp.json from the shell -- the mechanizable slice of ASI04's 'unverified MCP servers' framing; provenance and signature verification beyond allowlist membership stay with the advisory owasp-asi04-agentic-supply-chain policy"
  mitre_atlas:
  - control: AML.T0010
    coverage: partial
    note: "an MCP server is an ML supply-chain component; this blocks one entering the agent's tool surface outside a maintainer-curated allowlist, at tool time only"

provenance:
  author: "chock-core"
  created_at: "2026-09-07T00:00:00Z"
  updated_at: "2026-09-29T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.3.0
  date: '2026-09-30'
  changes:
  - "The script gate judges only what the change adds at tool use too, not just at commit. A server is judged when its name+source pair is absent from the baseline: a new server, or one whose command/args/url changed. Baseline per event: HEAD at commit and push; at PreToolUse the file on disk before the write; at the turn's end (disk already holds the written text) HEAD; a new config file has every server new. A renamed server with unchanged config counts as new, so an unlisted new name is still refused, as the guard's name+source rule has it. A server the turn did not touch no longer blocks the agent at the turn's end. Eval tc-056 (stop, an old unlisted server plus an added listed one) flips block to allow; tc-057 (stop adds an unlisted server) and tc-058 (stop alters an old server) block; tc-054's wording now says the added server is what is refused."
- version: 0.2.0
  date: '2026-09-29'
  changes:
  - "Second check for file-write tools and for commits: a script gate (implementations/verify-mcp-allowlist_gate.py, stdlib) at commit and tool_use that parses every written MCP client config -- .mcp.json, .cursor/mcp.json, .vscode/mcp.json (servers or mcpServers), claude_desktop_config.json, .gemini/settings.json (mcpServers) and .codex/config.toml ([mcp_servers], tomllib) -- and refuses any server whose name and exact command/args/url are not on the allowlist. It imports the guard's own ALLOWED_MCP_SERVERS and source rule from the file beside it, so there is one allowlist. At commit only servers the change adds or alters against HEAD are refused, so a server already committed never blocks an unrelated edit; at tool use every server in the written file is judged. An unparseable config is refused as unverifiable. Reasons name the file and server, never the launch line, which may carry a token. Guard unchanged. The script is named with an underscore (`_gate`) so that chock's eval runner, which treats every implementations/*.py as a command guard and takes the first in sort order, still picks verify-mcp-allowlist.py for the command cases."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "Ported from bash to Python: implementations/verify-mcp-allowlist.py replaces the bash script, stdlib only, deterministic, no network. It ships beside the chock_shellparse package (identical in every ported policy; tests pin the copies), which reads the command with a quote-aware lexer instead of scanning text: it splits at unquoted && || ; | & and newlines, drops redirections and comments, keeps heredoc bodies, and looks through bash|sh|zsh -c, pwsh -Command, cmd /c, eval, sudo, doas, env VAR=x, command, exec, nohup, timeout, nice, time, xargs and subshells, so `cd repo && ...` and `bash -c '...'` are judged on the command they run and `echo ...` on none. Unbalanced quotes fall back to a split at separators and whitespace that still sees redirections and reads an unclosed quote as one word; CHOCK_TOOL=powershell|pwsh selects PowerShell reading (backslash paths, cmdlets), and without it the text decides. An unexpected exception exits 2 (a guard fault), never 1 (a block)."
  - "Bypasses closed, each with eval cases: `claude mcp add evil ...` and `claude mcp add-json evil '{...}'` (name and source are checked against the allowlist; `claude mcp add filesystem -- npx -y @modelcontextprotocol/server-filesystem` passes, an allowed name pointed at another command does not, `add-from-claude-desktop` is refused as unverifiable; list, get and remove stay allowed)."
  - "The JSON in an inline .mcp.json write (echo, printf or a heredoc) is now parsed with a real JSON parser instead of a regex window, so a server entry carrying a nested object (an env map) no longer shifts the boundary and hides the next entry. A write with no parseable mcpServers entry still fails closed. The allowlist moved into the Python guard; the protected-source check covers the guard and its shipped parser package (verify-mcp-allowlist/implementations/), and the existing .sh-named eval cases keep their verdicts."
- version: 0.0.3
  date: '2026-09-24'
  changes:
  - "Eval cases added so every guard statement is exercised: the interpreter-write clause
    (e.g. `python3 -c ... .mcp.json`), and clause-splitter arms for a separator glued to the
    end of a token (`status|| tee`, `status&& tee`, `cat x| tee`) as well as a bare pipe
    token. Also: removed the dead `*) exit 0 ;;` default arm from the final protected-path
    case -- protected_clause can only ever contain .mcp.json or the allowlist script's own
    filename (the only two patterns _clause_protected_path/_redirect_target_protected match,
    and the allowlist-script arm already exits above), so that default could never run; the
    remaining single-arm case's no-op action is now an explicit `:` so it is traceable. A
    direct-invocation test (test_guard_direct.py) covers the CHOCK_RAW_COMMAND-unset
    raw=\"$*\" fallback, which no eval case can drive. Guard behavior unchanged for every
    reachable input."
- version: 0.0.2
  date: '2026-09-21'
  changes:
  - "False-positive fix (deep review): writer detection was global (any writer-ish token or
    redirect anywhere in the command) while the .mcp.json path check was a separate,
    unlinked substring test, so a plain read with stderr suppressed
    (cat .mcp.json 2>/dev/null) or an unrelated write elsewhere in the same line
    (rm -f /tmp/x; cat .mcp.json) was refused -- the same bug class fixed in
    protect-agent-config, reusing its clause-scoping approach here. A genuine write is still
    refused. Two eval cases added (tc-016, tc-017)."
- version: 0.0.1
  date: '2026-09-07'
  changes:
  - "Initial release (issue #1): tool-time guard over .mcp.json server entries against a name+source allowlist that ships inside implementations/verify-mcp-allowlist.sh. Unlisted name blocks; an allowed name with a changed command/args/url blocks (catches both an edited server and one renamed to an allowed name while pointing elsewhere); an exact name+source match passes without needing a human approval each time. The allowlist is protected the same way protect-agent-config protects every policy's guard sources -- a shell write to it is refused without the 'chock: approved-config-change' marker; it ships inside the script rather than a separate file because guard-mode evals run against an empty sandbox repo, so a separate allowlist file could never be exercised by this suite. Scoped to Claude Code's .mcp.json: agentseam 0.2.1 has no per-vendor MCP-config-path field to read for the other agents it lists (its config_path is hook-wiring, not MCP servers), and this policy does not guess at undocumented paths. Commit-time blocking from the issue is not shipped: chock 0.8.0's three gate kinds cannot express name+source pairing against an external allowlist file, so this stays a PreToolUse guard, best-effort on Claude Code (PreToolUse fails open on a crashed hook) like its named prior art protect-agent-config."
