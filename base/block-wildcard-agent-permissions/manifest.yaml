id: block-wildcard-agent-permissions
name: "Block Wildcard Agent Permissions"
version: "0.0.8"
description: >
  Blocks agent grants that allow everything: a bare Bash wildcard, a `*` in an
  allow/alwaysAllow/tools array on the same line, or quoted defaultMode bypassPermissions. Any
  file is judged. Not caught: a multi-line array (`"*"` alone on a line, YAML `- "*"` list),
  unquoted defaultMode: bypassPermissions. Runs: commit, agent write, turn's end. Waiver: 'pragma:
  allowlist broad-agency' same line. Person's commit: honoured. Agent: only if already in HEAD;
  MCP gateway: never. Agent asks a person.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Wildcard agent permission grant detected. Scope the grant to specific tools or
      commands (e.g. Bash(git status:*), a named tool list); replace defaultMode
      bypassPermissions with a mode that asks (default or acceptEdits). Waiver:
      'pragma: allowlist broad-agency' on the same line. A person's commit honours it; in the
      agent (write, the turn's end, an agent's commit) only a line already in HEAD counts, and
      the MCP gateway never does. An agent asks a person; it never writes the pragma.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+broad-agency'
      # Written so the pattern never matches its own source text in this manifest or
      # the compiled gate.json (#32 class): [*] and \s stand between the literal
      # tokens real content carries. [^\]]* lets the wildcard be ANY array element on
      # the line (not only the first), and defaultMode:bypassPermissions is the
      # whole-session escape hatch. LIMITATION: this gate matches per line (the engine
      # splits even staged_blob into lines), so a pretty-printed grant with the wildcard
      # alone on its own line is NOT caught here -- a line-scan cannot tell that "*" sits
      # inside an allow array without unacceptable false positives on unrelated arrays.
      # Catching that form needs a structure-aware gate kind (future work).
      content_pattern: |-
        Bash\([*]\)|["']?\ballow\b["']?\s*:\s*\[[^\]]*["'][*]["']|["']?\balwaysAllow\b["']?\s*:\s*\[[^\]]*["'][*]["']|["']?\btools\b["']?\s*:\s*\[[^\]]*["'][*]["']|["']?\bdefaultMode\b["']?\s*:\s*["']bypassPermissions["']

compliance:
  mitre_atlas:
  - control: AML.T0083
    coverage: partial
    note: "narrows the blast radius of any credential an over-granted agent config would expose"
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "blocks the everything-grant a diff can show; least-agency tool design remains advisory (owasp-asi02-tool-misuse, owasp-asi03-identity-privilege-abuse)"
  owasp_llm_2025:
  - control: LLM06
    coverage: partial
    note: "Excessive Agency: blocks the single-line everything-grant in an agent's permission config; multi-line grants and per-tool scoping are not judged"

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.8
  date: '2026-10-02'
  changes:
  - "Metadata, no behaviour change: the OWASP ASI03 note gave Excessive Agency the id LLM03; in the OWASP Top 10 for LLM Applications 2025 it is LLM06 (LLM03 is Supply Chain). The claim is now machine-readable, compliance.owasp_llm_2025: LLM06 (partial), and tools/check_registry.py holds every LLM id in a manifest to the 2025 list. The 0.0.1 entry below is corrected the same way."
- version: 0.0.7
  date: '2026-09-30'
  changes:
  - "Disclosure, no behaviour change: the description now lists what the pattern misses -- a multi-line array (`\"*\"` alone on its own line, or a YAML `- \"*\"` list) and an unquoted defaultMode: bypassPermissions -- and says any file is judged, since the policy has no path bound. The gate message gains a fix for bypassPermissions and the standard waiver sentence (person's commit honours it; in the agent only a line already in HEAD counts; the MCP gateway never does). The description names where each check runs and fits the 500-char budget."
- version: 0.0.6
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, an agent's commit (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT or agent_commit_env)) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.5
  date: '2026-09-21'
  changes:
  - "Bypass fix (deep review): the key-matching half of the pattern required a literal
    double quote directly before allow/alwaysAllow/tools/defaultMode, so an unquoted
    YAML-style key (as opposed to JSON's always-quoted keys) escaped detection entirely --
    a wildcard grant under an unquoted allow or tools key passed clean. Quoting is now
    optional around each key (and around the wildcard element itself, so a single-quoted
    array element is caught too), with an explicit word boundary added so an unrelated key
    merely containing one of these names as a substring (disallow, allowlist) is not
    mistaken for it -- a regression the unbounded fix would otherwise have introduced,
    caught in self-testing before it shipped. Five eval cases added (tc-012..tc-016), one
    of them the disallow/allowlist regression guard."
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release. Anchors: OWASP LLM06 (Excessive Agency; this line said LLM03 until 0.0.8), ASI03, OWASP Agentic T3; sibling of block-wildcard-iam."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.3
  date: '2026-08-24'
  changes:
  - "Close the single-line regex under-match found in the hardening review: the wildcard is now matched as ANY array element on the line ([^\\]]*) across allow/alwaysAllow/tools, not only the first; and defaultMode:bypassPermissions -- the whole-session escape hatch -- is blocked. Self-hosting is preserved (the pattern still never matches its own escaped source in the manifest or gate.json). Four eval cases added (allow any-element, bypassPermissions, tools any-element, alwaysAllow later element). A pretty-printed grant with the wildcard alone on its own line is deliberately NOT matched: this gate is line-by-line (the engine splits even staged_blob into lines), and a line-scan cannot tell that a lone \"*\" sits inside a permission array without false-positiving on unrelated arrays -- catching that form needs a structure-aware gate kind (future work), stated here rather than shipped as broad friction."
- version: 0.0.4
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so a wildcard grant is caught as the agent WRITES it into a settings file (the excessive-agency self-escalation path), not only when a human commits one. No pattern change. Message notes the allowlist pragma is a commit-review concept NOT honored at tool-use (live, attacker-controllable tool argument -- a match always blocks, matching the gateway's content_regex semantics)."
