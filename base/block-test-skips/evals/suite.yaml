    execute: {event: commit, files: {"tests/test_model.py": "def test_fit():\n    \"\"\"Do not use pytest.skip here.\"\"\"\n    assert model.fit(data) is model\n", "src/model.test.js": "it('fits', () => {\n  expect(model.fit(data)).toBe(model);\n});\n"}, expect: allow}
  - id: tc-072
    category: behavior
    prompt: "A commit reorders jest's existing ignore patterns over several lines."
    expect: "The commit is allowed: each pattern is keyed by its value, so a moved pattern is old."
    execute: {event: commit, head_files: {"jest.config.js": "module.exports = { testPathIgnorePatterns: ['/node_modules/', '/fixtures/'] };\n"}, files: {"jest.config.js": "module.exports = {\n  testPathIgnorePatterns: [\n    '/fixtures/',\n    '/node_modules/',\n  ],\n};\n"}, expect: allow}
