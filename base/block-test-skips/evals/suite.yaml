  - id: tc-067
    category: negative_trigger
    prompt: "A known bug is marked @pytest.mark.xfail(strict=True)."
    expect: "The commit is allowed: HP07 judges only non-strict xfail; a strict one fails the run once the test passes, so the marker cannot outlive the bug."
    execute: {event: commit, files: {"tests/test_bug.py": "import pytest\n\n\n@pytest.mark.xfail(strict=True, reason='BUG-7')\ndef test_bug():\n    assert bug() == 1\n"}, expect: allow}
