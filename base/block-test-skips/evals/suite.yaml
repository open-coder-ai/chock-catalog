suite:
  id: block-test-skips-tests-v1
  policy_id: block-test-skips
  version_constraint: '>=0.0.1'
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # Every executable case runs through the policy's script gate, staged in a throwaway repository:
  # at commit, at tool_use (the write over the file on disk) and at stop (the turn's end against HEAD).
  cases:
  - id: tc-001
    category: trigger
    prompt: A failing pytest test is marked @pytest.mark.skip.
    expect: 'The commit is refused: a skip was added to a test file.'
    execute:
      head_files:
        tests/test_a.py: |
          def test_a():
              assert f() == 1
      files:
        tests/test_a.py: |
          import pytest


          @pytest.mark.skip(reason='flaky')
          def test_a():
              assert f() == 1
      event: commit
      expect: block
  - id: tc-002
    category: trigger
    prompt: A Jest test is turned into it.skip.
    expect: The commit is refused.
    execute:
      files:
        src/app.test.ts: |
          it.skip('works', () => {
            expect(f()).toBe(1);
          });
      event: commit
      expect: block
  - id: tc-003
    category: trigger
    prompt: A Go test gains t.Skip at the top.
    expect: The commit is refused.
    execute:
      files:
        app_test.go: "func TestApp(t *testing.T) {\n\tt.Skip(\"later\")\n}\n"
      event: commit
      expect: block
  - id: tc-004
    category: trigger
    prompt: A spec is focused with describe.only so the rest of the suite stops running.
    expect: 'The commit is refused: a focus marker silently skips every other test.'
    execute:
      files:
        web/cart.spec.js: |
          describe.only('cart', () => {});
      event: commit
      expect: block
  - id: tc-005
    category: trigger
    prompt: A JUnit 5 test is annotated @Disabled.
    expect: The commit is refused.
    execute:
      files:
        src/test/java/AppTest.java: |
          class AppTest {
            @Disabled
            void runs() {}
          }
      event: commit
      expect: block
  - id: tc-006
    category: trigger
    prompt: A test skip is added to a nested test directory under a package.
    expect: 'The commit is refused: any tests/ directory counts.'
    execute:
      files:
        pkg/tests/unit/test_b.py: |
          @unittest.skip('x')
          def test_b():
              pass
      event: commit
      expect: block
  - id: tc-007
    category: negative_trigger
    prompt: A doc page about testing shows @pytest.mark.skip in an example.
    expect: 'The commit is allowed: only test paths are judged.'
    execute:
      files:
        notes/testing.md: |
          Use @pytest.mark.skip sparingly.
      event: commit
      expect: allow
  - id: tc-008
    category: negative_trigger
    prompt: A test file already carries a committed skip, and an unrelated test is added below it.
    expect: 'The commit is allowed: only lines this change adds are judged.'
    execute:
      head_files:
        tests/test_c.py: |
          import pytest


          @pytest.mark.skip
          def test_old():
              pass
      files:
        tests/test_c.py: |
          import pytest


          @pytest.mark.skip
          def test_old():
              pass


          def test_new():
              assert 1 + 1 == 2
      event: commit
      expect: allow
  - id: tc-009
    category: negative_trigger
    prompt: A test file mentions a skip only in a comment.
    expect: 'The commit is allowed: a commented-out marker skips nothing.'
    execute:
      files:
        tests/test_d.py: |
          # was @pytest.mark.skip, now fixed
          def test_d():
              assert g() == 2
      event: commit
      expect: allow
  - id: tc-010
    category: negative_trigger
    prompt: A new test file with ordinary tests is added.
    expect: The commit is allowed.
    execute:
      files:
        tests/test_e.py: |
          def test_e():
              assert h() == 3
      event: commit
      expect: allow
  - id: tc-011
    category: behavior
    prompt: 'A person adds ''chock: allow test-skip'' to a reviewed skip and commits from their own shell.'
    expect: The commit is allowed at commit time; the waiver is visible in the diff.
    execute:
      files:
        tests/test_f.py: |
          @pytest.mark.skip  # chock: allow test-skip -- needs GPU
          def test_f():
              pass
      event: commit
      expect: allow
  - id: tc-012
    category: edge
    prompt: The agent adds a skip pragma to its own new skip in the same write.
    expect: 'A waiver the agent writes with its own new skip is not honoured (only a waived line already committed in HEAD counts); the write is refused. (Text case: tool_use has no executable replay.)'
  - id: tc-013
    category: trigger
    prompt: "The agent writes a pytest skip marker into tests/test_a.py."
    expect: "The write is refused before it happens."
    execute: {event: tool_use, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-014
    category: negative_trigger
    prompt: "The agent writes a clean tests/test_a.py."
    expect: "The write is allowed."
    execute: {event: tool_use, writes: {"tests/test_a.py": "def test_a():\n    assert f() == 1\n"}, expect: allow}
  - id: tc-015
    category: behavior
    prompt: "tests/test_a.py already holds a reviewed, waived line in HEAD; the agent edits elsewhere in the file."
    expect: "The write is allowed: a waiver already in HEAD is honoured in the agent."
    execute: {event: tool_use, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n\n\ndef test_b():\n    assert g() == 2\n"}, expect: allow}
  - id: tc-016
    category: behavior
    prompt: "The agent adds the waiver pragma itself to a line that violates the gate in tests/test_a.py."
    expect: "The write is refused: a waiver the write adds is not honoured in the agent."
    execute: {event: tool_use, head_files: {"tests/test_a.py": "def test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-017
    category: trigger
    prompt: "At the turn's end tests/test_a.py on disk holds a pytest skip marker that HEAD lacks."
    expect: "The turn is blocked: the diff against HEAD adds it."
    execute: {event: stop, head_files: {"tests/test_a.py": "def test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-018
    category: negative_trigger
    prompt: "At the turn's end tests/test_a.py differs from HEAD only by a clean line; HEAD already holds an old violation."
    expect: "The turn is allowed: only the lines the turn added are judged."
    execute: {event: stop, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n\n\ndef test_b():\n    assert g() == 2\n"}, expect: allow}
  - id: tc-019
    category: trigger
    prompt: "A commit removes the waiver pragma from a skip HEAD held waived, leaving the skip itself untouched."
    expect: "The commit is blocked: without the waiver the skip is a finding the baseline did not have, so removing the line that excused it is a change that adds it."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-020
    category: behavior
    prompt: "A commit adds two imports above a skip HEAD already held."
    expect: "The commit passes: the skip moved down two lines but its test and its text are the same, so it is old."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import os\nimport sys\nimport pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: allow}
  - id: tc-021
    category: behavior
    prompt: "As the agent writes, a blank line and a comment shift a skip the disk already held."
    expect: "The write is allowed: a line shift does not make an old skip new."
    execute: {event: tool_use, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "# notes\n\nimport pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: allow}
  - id: tc-022
    category: trigger
    prompt: "At the turn's end a second copy of the same skip decorator sits on a test HEAD held with one."
    expect: "The turn is blocked: the file holds the skip twice and HEAD held it once, so the second copy is new."
    execute: {event: stop, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-023
    category: trigger
    prompt: "A commit skips a second test in a file whose first test HEAD already skipped."
    expect: "The commit is blocked: the new skip is on a different test, so it is a new finding beside the old one."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_b():\n    assert g() == 2\n"}, expect: block}
  - id: tc-024
    category: behavior
    prompt: "A commit renames the test under a skip HEAD already held, leaving the decorator untouched."
    expect: "The commit is blocked: the finding is keyed by its enclosing test, so a renamed test re-reports its old skip, which errs toward blocking."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a_renamed():\n    assert f() == 1\n"}, expect: block}
  - id: tc-025
    category: behavior
    prompt: "As the agent writes, a new passing test is added beside a JavaScript skip the disk already held."
    expect: "The write is allowed: the old skip keeps its enclosing describe and its text."
    execute: {event: tool_use, head_files: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n});\n"}, writes: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n  it('b', () => {\n    expect(1).toBe(1);\n  });\n});\n"}, expect: allow}
  - id: tc-026
    category: trigger
    prompt: "At the turn's end a JavaScript focus marker is added inside a describe whose old skip HEAD held."
    expect: "The turn is blocked: the focus marker is a different line in the same block, so it is new."
    execute: {event: stop, head_files: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n});\n"}, writes: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n  it.only('b', () => {\n    expect(1).toBe(1);\n  });\n});\n"}, expect: block}
