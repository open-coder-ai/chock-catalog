suite:
  id: block-test-skips-tests-v1
  policy_id: block-test-skips
  version_constraint: '>=0.0.1'
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # Every executable case runs through the policy's script gate, staged in a throwaway repository:
  # at commit, at tool_use (the write over the file on disk) and at stop (the turn's end against HEAD).
  cases:
  - id: tc-001
    category: trigger
    prompt: A failing pytest test is marked @pytest.mark.skip.
    expect: 'The commit is refused: a skip was added to a test file.'
    execute:
      head_files:
        tests/test_a.py: |
          def test_a():
              assert f() == 1
      files:
        tests/test_a.py: |
          import pytest


          @pytest.mark.skip(reason='flaky')
          def test_a():
              assert f() == 1
      event: commit
      expect: block
  - id: tc-002
    category: trigger
    prompt: A Jest test is turned into it.skip.
    expect: The commit is refused.
    execute:
      files:
        src/app.test.ts: |
          it.skip('works', () => {
            expect(f()).toBe(1);
          });
      event: commit
      expect: block
  - id: tc-003
    category: trigger
    prompt: A Go test gains t.Skip at the top.
    expect: The commit is refused.
    execute:
      files:
        app_test.go: "func TestApp(t *testing.T) {\n\tt.Skip(\"later\")\n}\n"
      event: commit
      expect: block
  - id: tc-004
    category: trigger
    prompt: A spec is focused with describe.only so the rest of the suite stops running.
    expect: 'The commit is refused: a focus marker silently skips every other test.'
    execute:
      files:
        web/cart.spec.js: |
          describe.only('cart', () => {});
      event: commit
      expect: block
  - id: tc-005
    category: trigger
    prompt: A JUnit 5 test is annotated @Disabled.
    expect: The commit is refused.
    execute:
      files:
        src/test/java/AppTest.java: |
          class AppTest {
            @Disabled
            void runs() {}
          }
      event: commit
      expect: block
  - id: tc-006
    category: trigger
    prompt: A test skip is added to a nested test directory under a package.
    expect: 'The commit is refused: any tests/ directory counts.'
    execute:
      files:
        pkg/tests/unit/test_b.py: |
          @unittest.skip('x')
          def test_b():
              pass
      event: commit
      expect: block
  - id: tc-007
    category: negative_trigger
    prompt: A doc page about testing shows @pytest.mark.skip in an example.
    expect: 'The commit is allowed: only test paths are judged.'
    execute:
      files:
        notes/testing.md: |
          Use @pytest.mark.skip sparingly.
      event: commit
      expect: allow
  - id: tc-008
    category: negative_trigger
    prompt: A test file already carries a committed skip, and an unrelated test is added below it.
    expect: 'The commit is allowed: only lines this change adds are judged.'
    execute:
      head_files:
        tests/test_c.py: |
          import pytest


          @pytest.mark.skip
          def test_old():
              pass
      files:
        tests/test_c.py: |
          import pytest


          @pytest.mark.skip
          def test_old():
              pass


          def test_new():
              assert 1 + 1 == 2
      event: commit
      expect: allow
  - id: tc-009
    category: negative_trigger
    prompt: A test file mentions a skip only in a comment.
    expect: 'The commit is allowed: a commented-out marker skips nothing.'
    execute:
      files:
        tests/test_d.py: |
          # was @pytest.mark.skip, now fixed
          def test_d():
              assert g() == 2
      event: commit
      expect: allow
  - id: tc-010
    category: negative_trigger
    prompt: A new test file with ordinary tests is added.
    expect: The commit is allowed.
    execute:
      files:
        tests/test_e.py: |
          def test_e():
              assert h() == 3
      event: commit
      expect: allow
  - id: tc-011
    category: behavior
    prompt: 'A person adds ''chock: allow test-skip'' to a reviewed skip and commits from their own shell.'
    expect: The commit is allowed at commit time; the waiver is visible in the diff.
    execute:
      files:
        tests/test_f.py: |
          @pytest.mark.skip  # chock: allow test-skip -- needs GPU
          def test_f():
              pass
      event: commit
      expect: allow
  - id: tc-012
    category: edge
    prompt: The agent adds a skip pragma to its own new skip in the same write.
    expect: 'A waiver the agent writes with its own new skip is not honoured (only a waived line already committed in HEAD counts); the write is refused. (Text case: tool_use has no executable replay.)'
  - id: tc-013
    category: trigger
    prompt: "The agent writes a pytest skip marker into tests/test_a.py."
    expect: "The write is refused before it happens."
    execute: {event: tool_use, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-014
    category: negative_trigger
    prompt: "The agent writes a clean tests/test_a.py."
    expect: "The write is allowed."
    execute: {event: tool_use, writes: {"tests/test_a.py": "def test_a():\n    assert f() == 1\n"}, expect: allow}
  - id: tc-015
    category: behavior
    prompt: "tests/test_a.py already holds a reviewed, waived line in HEAD; the agent edits elsewhere in the file."
    expect: "The write is allowed: a waiver already in HEAD is honoured in the agent."
    execute: {event: tool_use, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n\n\ndef test_b():\n    assert g() == 2\n"}, expect: allow}
  - id: tc-016
    category: behavior
    prompt: "The agent adds the waiver pragma itself to a line that violates the gate in tests/test_a.py."
    expect: "The write is refused: a waiver the write adds is not honoured in the agent."
    execute: {event: tool_use, head_files: {"tests/test_a.py": "def test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-017
    category: trigger
    prompt: "At the turn's end tests/test_a.py on disk holds a pytest skip marker that HEAD lacks."
    expect: "The turn is blocked: the diff against HEAD adds it."
    execute: {event: stop, head_files: {"tests/test_a.py": "def test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-018
    category: negative_trigger
    prompt: "At the turn's end tests/test_a.py differs from HEAD only by a clean line; HEAD already holds an old violation."
    expect: "The turn is allowed: only the lines the turn added are judged."
    execute: {event: stop, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n\n\ndef test_b():\n    assert g() == 2\n"}, expect: allow}
  - id: tc-019
    category: trigger
    prompt: "A commit removes the waiver pragma from a skip HEAD held waived, leaving the skip itself untouched."
    expect: "The commit is blocked: without the waiver the skip is a finding the baseline did not have, so removing the line that excused it is a change that adds it."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')  # chock: allow test-skip\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-020
    category: behavior
    prompt: "A commit adds two imports above a skip HEAD already held."
    expect: "The commit passes: the skip moved down two lines but its test and its text are the same, so it is old."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import os\nimport sys\nimport pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: allow}
  - id: tc-021
    category: behavior
    prompt: "As the agent writes, a blank line and a comment shift a skip the disk already held."
    expect: "The write is allowed: a line shift does not make an old skip new."
    execute: {event: tool_use, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "# notes\n\nimport pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: allow}
  - id: tc-022
    category: trigger
    prompt: "At the turn's end a second copy of the same skip decorator sits on a test HEAD held with one."
    expect: "The turn is blocked: the file holds the skip twice and HEAD held it once, so the second copy is new."
    execute: {event: stop, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, writes: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, expect: block}
  - id: tc-023
    category: trigger
    prompt: "A commit skips a second test in a file whose first test HEAD already skipped."
    expect: "The commit is blocked: the new skip is on a different test, so it is a new finding beside the old one."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_b():\n    assert g() == 2\n"}, expect: block}
  - id: tc-024
    category: behavior
    prompt: "A commit renames the test under a skip HEAD already held, leaving the decorator untouched."
    expect: "The commit is blocked: the finding is keyed by its enclosing test, so a renamed test re-reports its old skip, which errs toward blocking."
    execute: {event: commit, head_files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a():\n    assert f() == 1\n"}, files: {"tests/test_a.py": "import pytest\n\n\n@pytest.mark.skip(reason='flaky')\ndef test_a_renamed():\n    assert f() == 1\n"}, expect: block}
  - id: tc-025
    category: behavior
    prompt: "As the agent writes, a new passing test is added beside a JavaScript skip the disk already held."
    expect: "The write is allowed: the old skip keeps its enclosing describe and its text."
    execute: {event: tool_use, head_files: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n});\n"}, writes: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n  it('b', () => {\n    expect(1).toBe(1);\n  });\n});\n"}, expect: allow}
  - id: tc-026
    category: trigger
    prompt: "At the turn's end a JavaScript focus marker is added inside a describe whose old skip HEAD held."
    expect: "The turn is blocked: the focus marker is a different line in the same block, so it is new."
    execute: {event: stop, head_files: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n});\n"}, writes: {"src/a.test.ts": "describe('outer', () => {\n  it.skip('a', () => {\n    expect(f()).toBe(1);\n  });\n  it.only('b', () => {\n    expect(1).toBe(1);\n  });\n});\n"}, expect: block}
  # v2 (0.1.0): the forms and paths the roadmap's HP07 adds, each refused, beside the ordinary code each must leave alone.
  - id: tc-027
    category: trigger
    prompt: "A pytest test calls pytest.skip() at run time instead of asserting."
    expect: "The commit is refused: a runtime skip hides the test as surely as a marker."
    execute: {event: commit, files: {"tests/test_r.py": "import pytest\n\n\ndef test_r():\n    pytest.skip('broken upstream')\n    assert r() == 1\n"}, expect: block}
  - id: tc-028
    category: trigger
    prompt: "A failing test is marked @pytest.mark.xfail without strict=True."
    expect: "The commit is refused: a non-strict xfail turns a failure into a pass."
    execute: {event: commit, files: {"tests/test_x.py": "import pytest\n\n\n@pytest.mark.xfail(reason='flaky')\ndef test_x():\n    assert x() == 1\n"}, expect: block}
  - id: tc-029
    category: trigger
    prompt: "An RSpec example is turned into xit."
    expect: "The commit is refused: spec/ and *_spec.rb are test paths."
    execute: {event: commit, files: {"spec/models/user_spec.rb": "describe User do\n  xit 'saves' do\n    expect(user.save).to be true\n  end\nend\n"}, expect: block}
  - id: tc-030
    category: trigger
    prompt: "A PHPUnit test calls markTestSkipped."
    expect: "The commit is refused."
    execute: {event: commit, files: {"tests/UserTest.php": "<?php\nclass UserTest extends TestCase {\n    public function testSave() {\n        $this->markTestSkipped('later');\n    }\n}\n"}, expect: block}
  - id: tc-031
    category: trigger
    prompt: "An xUnit test gains [Fact(Skip = ...)]."
    expect: "The commit is refused: *Tests.cs is a test path."
    execute: {event: commit, files: {"src/App.Tests/UserTests.cs": "public class UserTests {\n    [Fact(Skip = \"flaky\")]\n    public void Saves() { Assert.True(Save()); }\n}\n"}, expect: block}
  - id: tc-032
    category: trigger
    prompt: "jest.config.js gains a testPathIgnorePatterns entry that hides a failing suite."
    expect: "The commit is refused: each added ignore pattern is a new finding."
    execute: {event: commit, head_files: {"jest.config.js": "module.exports = {\n  testPathIgnorePatterns: ['/node_modules/'],\n};\n"}, files: {"jest.config.js": "module.exports = {\n  testPathIgnorePatterns: ['/node_modules/', '/src/cart/'],\n};\n"}, expect: block}
  - id: tc-033
    category: behavior
    prompt: "A person waives a reviewed, ticket-linked skip on its line and commits from their own shell."
    expect: "The commit is allowed: a person's waiver on the line is honoured at commit."
    execute: {event: commit, files: {"tests/test_gpu.py": "import pytest\n\n\n@pytest.mark.skipif(not has_gpu(), reason='GPU only')  # chock: allow test-skip -- OPS-412\ndef test_gpu():\n    assert run() == 1\n"}, expect: allow}
  - id: tc-034
    category: negative_trigger
    prompt: "Application code outside any test path calls pytest.skip in a helper."
    expect: "The commit is allowed: only test paths and runner configs are judged."
    execute: {event: commit, files: {"src/app/plugin.py": "import pytest\n\n\ndef maybe():\n    pytest.skip('x')\n"}, expect: allow}
  - id: tc-035
    category: trigger
    prompt: "A test is marked skipif(True)."
    expect: "The commit is refused: an always-true condition is an unconditional skip."
    execute: {event: commit, files: {"tests/test_s.py": "import pytest\n\n\n@pytest.mark.skipif(True, reason='x')\ndef test_s():\n    assert s()\n"}, expect: block}
  - id: tc-036
    category: trigger
    prompt: "A test is marked xfail(strict=True, run=False)."
    expect: "The commit is refused: run=False never runs the test, strict or not."
    execute: {event: commit, files: {"tests/test_n.py": "import pytest\n\n\n@pytest.mark.xfail(strict=True, run=False)\ndef test_n():\n    assert n()\n"}, expect: block}
  - id: tc-037
    category: trigger
    prompt: "A test module sets a module-level pytestmark list that skips every test in it."
    expect: "The commit is refused."
    execute: {event: commit, files: {"tests/test_m.py": "import pytest\n\npytestmark = [pytest.mark.slow, pytest.mark.skip]\n\n\ndef test_m():\n    assert m()\n"}, expect: block}
  - id: tc-038
    category: trigger
    prompt: "A test module calls pytest.skip(allow_module_level=True) at import."
    expect: "The commit is refused."
    execute: {event: commit, files: {"tests/test_i.py": "import pytest\n\npytest.skip('not today', allow_module_level=True)\n\n\ndef test_i():\n    assert i()\n"}, expect: block}
  - id: tc-039
    category: trigger
    prompt: "A Jest test is replaced by test.todo."
    expect: "The commit is refused."
    execute: {event: commit, files: {"src/cart.test.js": "test.todo('adds an item');\n"}, expect: block}
  - id: tc-040
    category: trigger
    prompt: "A Vitest describe block becomes xdescribe."
    expect: "The commit is refused."
    execute: {event: commit, files: {"src/cart.spec.ts": "xdescribe('cart', () => {\n  it('adds', () => {\n    expect(add()).toBe(1);\n  });\n});\n"}, expect: block}
  - id: tc-041
    category: trigger
    prompt: "A Jasmine test is focused with fit, which silently skips every other test."
    expect: "The commit is refused."
    execute: {event: commit, files: {"src/cart.test.ts": "describe('cart', () => {\n  fit('adds', () => {\n    expect(add()).toBe(1);\n  });\n});\n"}, expect: block}
  - id: tc-042
    category: trigger
    prompt: "A JUnit test starts with assumeTrue(false)."
    expect: "The commit is refused: a false assumption aborts the test as skipped."
    execute: {event: commit, files: {"src/test/java/CartTest.java": "class CartTest {\n  @Test\n  void adds() {\n    assumeTrue(false);\n    assertEquals(1, add());\n  }\n}\n"}, expect: block}
  - id: tc-043
    category: trigger
    prompt: "A Go test returns early under testing.Short() without calling Skip."
    expect: "The commit is refused: a testing.Short() guard skips the test in short mode."
    execute: {event: commit, files: {"cart/cart_test.go": "func TestAdd(t *testing.T) {\n\tif testing.Short() {\n\t\treturn\n\t}\n\tif add() != 1 {\n\t\tt.Fatal(\"add\")\n\t}\n}\n"}, expect: block}
  - id: tc-044
    category: trigger
    prompt: "A Rust unit test inside a cfg(test) module in src/ is marked #[ignore]."
    expect: "The commit is refused: every Rust file is judged, since #[ignore] only marks tests."
    execute: {event: commit, files: {"src/cart.rs": "pub fn add() -> u8 { 1 }\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    #[ignore = \"slow\"]\n    fn adds() {\n        assert_eq!(super::add(), 1);\n    }\n}\n"}, expect: block}
  - id: tc-045
    category: trigger
    prompt: "An RSpec example calls skip inside its body."
    expect: "The commit is refused."
    execute: {event: commit, files: {"spec/cart_spec.rb": "describe Cart do\n  it 'adds' do\n    skip 'later'\n    expect(cart.add).to eq(1)\n  end\nend\n"}, expect: block}
  - id: tc-046
    category: trigger
    prompt: "pytest.ini gains addopts --deselect for a failing test."
    expect: "The commit is refused: runner config that deselects a test hides it."
    execute: {event: commit, head_files: {"pytest.ini": "[pytest]\naddopts = -ra\n"}, files: {"pytest.ini": "[pytest]\naddopts = -ra --deselect tests/test_cart.py::test_add\n"}, expect: block}
  - id: tc-047
    category: trigger
    prompt: "pyproject.toml's pytest addopts gains -k 'not cart'."
    expect: "The commit is refused."
    execute: {event: commit, files: {"pyproject.toml": "[tool.pytest.ini_options]\naddopts = \"-ra -k 'not cart'\"\n"}, expect: block}
  - id: tc-048
    category: trigger
    prompt: "A root conftest.py adds a failing module to collect_ignore."
    expect: "The commit is refused: each collect_ignore entry is a finding."
    execute: {event: commit, head_files: {"conftest.py": "collect_ignore = ['setup.py']\n"}, files: {"conftest.py": "collect_ignore = ['setup.py', 'tests/test_cart.py']\n"}, expect: block}
  - id: tc-049
    category: trigger
    prompt: "conftest.py deselects failing tests in pytest_collection_modifyitems."
    expect: "The commit is refused."
    execute: {event: commit, files: {"tests/conftest.py": "def pytest_collection_modifyitems(config, items):\n    items[:] = [item for item in items if 'cart' not in item.nodeid]\n"}, expect: block}
  - id: tc-050
    category: trigger
    prompt: "A test module calls pytest.importorskip for a dependency the change made optional."
    expect: "The commit is refused: importorskip skips the module when the import fails."
    execute: {event: commit, files: {"tests/test_np.py": "import pytest\n\nnp = pytest.importorskip('numpy')\n\n\ndef test_np():\n    assert np.ones(1)[0] == 1\n"}, expect: block}
  - id: tc-051
    category: trigger
    prompt: "A unittest test calls self.skipTest."
    expect: "The commit is refused."
    execute: {event: commit, files: {"tests/test_u.py": "import unittest\n\n\nclass CartTest(unittest.TestCase):\n    def test_add(self):\n        self.skipTest('later')\n"}, expect: block}
  - id: tc-052
    category: trigger
    prompt: "A test raises unittest.SkipTest."
    expect: "The commit is refused."
    execute: {event: commit, files: {"tests/test_st.py": "from unittest import SkipTest\n\n\ndef test_st():\n    raise SkipTest('later')\n"}, expect: block}
  - id: tc-053
    category: trigger
    prompt: "A parametrized case is skipped through pytest.param(marks=...)."
    expect: "The commit is refused."
    execute: {event: commit, files: {"tests/test_p.py": "import pytest\n\n\n@pytest.mark.parametrize('n', [1, pytest.param(2, marks=pytest.mark.skip)])\ndef test_p(n):\n    assert n\n"}, expect: block}
  - id: tc-054
    category: trigger
    prompt: "A Jest table test spread over lines ends in .skip after its each(...) table."
    expect: "The commit is refused: the table is matched as a group, so the .skip after it is seen."
    execute: {event: commit, files: {"src/sum.test.js": "test.each([\n  [1, 1, 2],\n  [1, 2, 3],\n]).skip('adds %i + %i', (a, b, sum) => {\n  expect(a + b).toBe(sum);\n});\n"}, expect: block}
  - id: tc-055
    category: trigger
    prompt: "A concurrent Jest test is skipped with it.concurrent.skip."
    expect: "The commit is refused."
    execute: {event: commit, files: {"src/sum.test.js": "it.concurrent.skip('adds', async () => {\n  expect(1 + 1).toBe(2);\n});\n"}, expect: block}
  - id: tc-056
    category: trigger
    prompt: "A Playwright test under e2e/ is marked test.fixme."
    expect: "The commit is refused: e2e/ is a test path."
    execute: {event: commit, files: {"e2e/checkout.ts": "test.fixme('pays', async ({ page }) => {\n  await page.goto('/');\n});\n"}, expect: block}
  - id: tc-057
    category: trigger
    prompt: "A JUnit 5 test is made conditional with @EnabledIfEnvironmentVariable."
    expect: "The commit is refused: a condition that is false in CI skips the test."
    execute: {event: commit, files: {"src/test/java/PayTest.java": "class PayTest {\n  @Test\n  @EnabledIfEnvironmentVariable(named = \"PAY\", matches = \"on\")\n  void pays() {}\n}\n"}, expect: block}
  - id: tc-058
    category: trigger
    prompt: "A Kotlin test class named *Test.kt gains @Ignore."
    expect: "The commit is refused."
    execute: {event: commit, files: {"app/src/main/kotlin/CartTest.kt": "class CartTest {\n    @Ignore\n    @Test\n    fun adds() {}\n}\n"}, expect: block}
  - id: tc-059
    category: trigger
    prompt: "An XCTest throws XCTSkip."
    expect: "The commit is refused: Tests/ is a test path."
    execute: {event: commit, files: {"Tests/CartTests/CartTests.swift": "final class CartTests: XCTestCase {\n    func testAdd() throws {\n        throw XCTSkip(\"later\")\n    }\n}\n"}, expect: block}
  - id: tc-060
    category: trigger
    prompt: "An NUnit test gains [Ignore] in its attribute list."
    expect: "The commit is refused."
    execute: {event: commit, files: {"Tests/CartTests.cs": "public class CartTests {\n    [Test, Ignore(\"later\")]\n    public void Adds() {}\n}\n"}, expect: block}
  - id: tc-061
