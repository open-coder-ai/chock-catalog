    category: edge
    prompt: "Adversarial: the skip marker is reached through an import alias (from pytest import mark as m; @m.skip)."
    expect: "The commit is refused: names are resolved through the module's imports."
    execute: {event: commit, files: {"tests/test_alias.py": "from pytest import mark as m\n\n\n@m.skip\ndef test_alias():\n    assert a()\n"}, expect: block}
  - id: tc-063
