    execute: {event: commit, files: {"jest.config.js": "module.exports = {\n  testPathIgnorePatterns: ['/node_modules/'],\n};\n"}, expect: allow}
  - id: tc-071
    category: negative_trigger
    prompt: "A test file calls a model's fit method and documents pytest.skip in a docstring."
