id: refname-filename-metachar
name: "Refname Filename Metachar"
version: "0.1.0"
description: >
  Refuses names a shell, CI step or git can misread. Paths a change adds or renames into (commit,
  agent writes), and branches and tags pushed (pre-push), with command substitution, an IFS
  expansion, a backtick, ; & | < >, a control or bidi character, a base64-decode shape, a leading
  dash or trailing space or dot in a segment, or a '..' segment; a ref also with a full commit id's
  shape. A guard refuses git and file commands creating such names. No waiver. Friction, not a
  boundary.
artifact: hook
enforcement: block
mandatory: false
hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      A path this change adds or renames into has a name a shell, a CI step or git can misread:
      command substitution, an IFS expansion, a backtick, a shell operator, a control or bidi
      character, a base64-decode shape, a segment starting with '-' or ending in a space or '.',
      or a '..' segment. Rename it with letters, digits, spaces inside, '.', '_', '-' and '/'.
      No waiver: if the name is truly required, a person creates it from their own shell.
    params:
      script: refname-filename-metachar-gate.py
  script:
    "on": [push]
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "Initial release (roadmap NP26; hackerbot-claw branch and file names carrying command substitution and ${IFS}, the Ultralytics branch-name injection, and the Plugin4Shell finding that a ref named like a pinned commit id wins over the commit). One rule table (implementations/refname_rules.py) serves three checks. A script gate at commit and agent tool use judges every path the change writes, keyed by path, so the engine's baseline run absolves a path that already existed and only a path the change adds or renames into can block; git prints a path holding a control character, a double quote or a backslash quoted, and a quoted path is refused as such; the engine trims the names it lists, so at a commit the gate also reads git's NUL-separated list of added and renamed names and refuses one ending in a space. A pre-push hook judges the remote name of every pushed branch and tag (deletions pass) and also refuses a 40- or 64-hex name, which shadows that commit id; a line that is not git's four-field form is refused. A command guard on chock_shellparse refuses the names created by git branch (create, -m/-c rename and copy), tag, checkout -b/-B/--orphan and -t/--track, switch -c/-C/--orphan/--track, worktree add (-b/-B, or the branch git names after the path), push refspec destinations, fetch and pull src:dst destinations and `tag <name>`, update-ref (also --stdin), symbolic-ref, stash branch and subtree split -b, with option clusters and long-option abbreviations read as git does and only the --contains/--merged/--points-at filters, -l, -a, -r, -d and upstream changes read as creating nothing (-v, --sort, --format and --column still create, as in git 2.43); and the names created by redirections, touch, mkdir and tee, the destination of cp, mv, install, ln, rsync, scp and git mv (a source keeps its name, so renaming a bad file away passes), dd of=, worktree paths, and a cmdlet's -Path/-Name/-NewName/-Destination, abbreviated or positional. Before parsing, the guard marks every `$` and backtick the shell expands (unquoted or in double quotes) and replaces each command substitution, backtick command and process substitution with one marker, so `\"${OUT}/x\"` or `\"$(whoami)/fix\"` is never read as substitution syntax, while text the shell keeps (single-quoted, escaped, spliced from quoted pieces, or next to a substitution as in `$(true)'a;b'`) is judged; every inner script (a substitution, a bash -c or sh -c script, an eval) is marked and judged the same way, up to 64 per command line, past which the line is refused; heredoc bodies are copied through without changing quote state; ANSI-C `$'...'` text is decoded for the hex, Unicode, control and common escapes; a PowerShell backtick-escaped character stays literal. A base64-decode shape is a decode run as a command (base64, whitespace or an IFS expansion, -d/--decode; or a pipe into base64), so module names like base64-decode.js pass. Ships for rollout observe first (D15)."
  - "Limits, probed: a name built at run time (`git checkout -b \"$(printf ...)\"`, an interpreter one-liner, a script, a git alias) passes the guard and is caught by the pre-push hook (refs) or the commit gate (paths); `git checkout x` that creates a local branch from an existing remote branch by name is not judged (the name is already on the remote); the source of cp or mv into a directory keeps its name and is not judged by the guard; a branch that is committed to but never pushed is not judged; CI judges paths only, since script gates receive no ref names, and a trailing space is judged only at a local commit, since the gate reads git's own list only there; cmdlets beyond New-Item, Set-Content, Out-File, Add-Content, Copy-Item, Move-Item and Rename-Item (Tee-Object, Export-Csv, .NET file calls) are not read by the guard; a staged name that is only whitespace is trimmed to nothing by the engine and reaches no check; a carriage return ending a command line is read as whitespace; Windows reserved device names, case collisions and Unicode confusables are not judged; a tracked path whose HEAD copy is empty has no baseline, so an edit to it is judged as new; names holding '&' (Q&A.md) are refused by design."
