id: refname-filename-metachar
name: "Refname Filename Metachar"
version: "0.1.0"
description: >
  Refuses names a shell, CI step or git can misread. Paths a change adds or renames into (commit,
  agent writes), and branches and tags pushed (pre-push), with command substitution, an IFS
  expansion, a backtick, ; & | < >, a control or bidi character, a base64-decode shape, a leading
  dash or trailing space or dot in a segment, or a '..' segment; a ref also with a full commit id's
  shape. A guard refuses git and file commands creating such names. No waiver. Friction, not a
  boundary.
artifact: hook
enforcement: block
mandatory: false
hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      A path this change adds or renames into has a name a shell, a CI step or git can misread:
      command substitution, an IFS expansion, a backtick, a shell operator, a control or bidi
      character, a base64-decode shape, a segment starting with '-' or ending in a space or '.',
      or a '..' segment. Rename it with letters, digits, spaces inside, '.', '_', '-' and '/'.
      No waiver: if the name is truly required, a person creates it from their own shell.
    params:
      script: refname-filename-metachar-gate.py
  script:
    "on": [push]
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "Initial release (roadmap NP26; hackerbot-claw branch and file names carrying command substitution and ${IFS}, the Ultralytics branch-name injection, and the Plugin4Shell finding that a ref named like a pinned commit id wins over the commit). One rule table (implementations/refname_rules.py) serves three checks. A script gate at commit and agent tool use judges every path the change writes, keyed by path, so the engine's baseline run absolves a path that already existed and only a path the change adds or renames into can block; git prints a path holding a control character, a double quote or a backslash quoted, and a quoted path is refused as such. A pre-push hook judges the remote name of every pushed branch and tag (deletions pass) and also refuses a 40- or 64-hex name, which shadows that commit id; a line that is not git's four-field form is refused. A command guard on chock_shellparse refuses git branch (create, -m/-c rename and copy), tag, checkout -b/-B/--orphan, switch -c/-C/--orphan, worktree add -b/-B, push refspec destinations, fetch src:dst destinations and update-ref (also --stdin) when the new name is refused, reading option clusters and long-option abbreviations as git does; and the targets of redirections, touch, mkdir, tee, cp, mv, install, ln, rsync, scp, git mv, dd of= and PowerShell -Path/-Name values. Listing, deleting and start points (a commit id after the new branch name) pass. In the guard, substitution syntax counts only when spelled literally (single-quoted or backslash-escaped), since an unquoted `${TICKET}` is expanded by the shell; the commit gate and the pre-push hook judge the expanded name. Ships for rollout observe first (D15)."
  - "Limits, probed: a name built at run time (`git checkout -b \"$(printf ...)\"`, an interpreter one-liner, a script) passes the guard and is caught by the pre-push hook (refs) or the commit gate (paths); a branch that is committed to but never pushed is not judged; CI judges paths only, since script gates receive no ref names; Windows reserved device names, case collisions and Unicode confusables are not judged; a tracked path whose HEAD copy is empty has no baseline, so an edit to it is judged as new."
