id: block-secret-store-reads
name: "Block Secret Store Reads"
version: "0.0.3"
description: >
  Best-effort guard against an agent reading credentials from the shell: cat, grep, sed, cp,
  tar, base64, source or < on ~/.ssh (not .pub), ~/.aws, ~/.npmrc, ~/.netrc, ~/.kube, ~/.gnupg,
  agent CLI dirs, browser login DBs, wallets, .env (not .env.example), *.tfstate; interpreter
  one-liners naming them; gh auth token, aws sts get-session-token, git credential fill. Asks on
  env/printenv dumps. Misses: scripts, unresolved variables, xargs lists, $(...) results.
artifact: rule
enforcement: advise
rule:
  text: |
    never(read|print): credential_stores(~/.ssh(not_*.pub)|~/.aws|~/.npmrc|~/.netrc|~/.kube|~/.gnupg|agent_cli_dirs|browser_dbs|wallets|.env(not_.env.example)|*.tfstate)|tokens(gh_auth_token|aws_sts|git_credential_fill), via(cat|grep|sed|cp|tar|base64|source|<|interpreter)
    ask: env|printenv|set|export_-p  # dumps every secret; if(value_needed): ask_person_for_that_value
effects:
- read_only
approval:
  required: false

compliance:
  mitre_atlas:
  - control: AML.T0098
    coverage: partial
    note: "refuses shell reads of credential stores and token-printing commands before they run; reads through scripts, unresolved variables and non-shell tools are out of scope"
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "keeps stored credentials out of the agent's context from the shell; scoping what the agent may hold stays with identity and permission design"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: production
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.3
  date: '2026-10-07'
  changes:
  - "Status draft -> production by the BV-C3 promotion rule, measured at catalog main 9e3e2fe: every eval case executed and passing in the replay, tier best-effort, no open bug issue, no chock check warning. Behaviour unchanged."
- version: 0.0.2
  date: '2026-10-03'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: it skips a `--` and the shell options between `-c` and the script (`bash -c -- '...'`, `sh -c -x '...'`, `eval -- '...'`), reads `name=(...)`, `name+=` and `name[i]=` assignments, looks through the `{` that opens a function body or group, splits a line whose quotes do not balance in one pass, and in a short-option cluster every `o` or `O` takes the next word while a lone `-` or `+` ends the options. What this policy refuses is otherwise unchanged; it now also judges the command inside those forms. See protect-agent-config 0.2.7."
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial release (advisory: a PreToolUse guard on the shell only). A Python guard (implementations/block-secret-store-reads.py, stdlib only, beside the shared chock_shellparse and chock_scan packages) refuses a reader, copier or archiver (cat, less, head, tail, grep, rg, sed, awk, jq, cp, mv, rsync, scp, tar, zip, base64, xxd, od, strings, openssl, gpg, source, the . builtin, dd, find -exec), a < redirect, or an interpreter one-liner or heredoc (python, node, ruby, perl, php, deno, bun, lua) that names a credential store, and refuses token printers (gh auth token and status --show-token, aws configure get of a secret field, aws configure export-credentials, aws sts get-session-token, kubectl config view --raw, security find-generic-password and find-internet-password -w/-g, git credential fill, git and docker credential helpers get). env, printenv NAME of a secret-like name, bare set, export -p, declare -p and /proc/*/environ ask instead. Paths are resolved first: ~, $HOME, ${HOME}, /root, /home/<user>, /Users/<user>, quotes, ./ and .., brace lists, globs of two or more literal characters (any glob in a directory slot, and a bare dot-glob for a verb that walks trees), variables assigned earlier in the line, and cd. Template files (.env.example, .sample, .template, .dist), listings (ls ~/.ssh), ssh-keygen -l and public keys (*.pub) stay allowed. $(...) and backtick bodies, also inside double quotes, are judged as command lines of their own; $'..' quoting is decoded; shells nested past the parser's depth are followed, then refused when too deep; curl and wget file:// and @file uploads, git diff --no-index, git config --file, find -exec and -name are read; rg and ag skip dot-directories below the home directory but not an explicit store root. The store, reader and printer tables are one curated data file (implementations/data/secret_stores.json, 365-day freshness). Known misses, probed and held by tests/policies/test_secret_store_reads.py: scripts that read a store, unresolved variables, a command held in a variable (command-position), a list handed to xargs (or find piped into xargs), $(...) results used as a path, a project .npmrc (only the home one is a store), a relative store name after a cd it cannot resolve, editors (vim), git show or git diff of a tracked store, an interpreter that dumps the environment, a recursive search of the project directory (it reads its .env), a case statement inside $(...), a pipe to a shell, a here-string fed to a shell, other wrappers (strace, watch, su -c, ssh, busybox), and other token printers (kubectl get secret, aws sts assume-role, op read, pass show). Known false positives: curl -d name=.env, a store name mentioned in interpreter code counts as a read, mv of an env file, and the agent instruction files under the listed agent directories."
