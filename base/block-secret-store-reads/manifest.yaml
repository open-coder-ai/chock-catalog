id: block-secret-store-reads
name: "Block Secret Store Reads"
version: "0.0.1"
description: >
  Best-effort guard against an agent reading credentials from the shell: cat, grep, sed, cp,
  tar, base64, source or < on ~/.ssh (not .pub), ~/.aws, ~/.npmrc, ~/.netrc, ~/.kube, ~/.gnupg,
  agent CLI dirs, browser login DBs, wallets, .env (not .env.example), *.tfstate; interpreter
  one-liners naming them; gh auth token, aws sts get-session-token, git credential fill. Asks on
  env/printenv dumps. Misses: scripts, unresolved variables, xargs lists, $(...) results.
artifact: rule
enforcement: advise
rule:
  text: |
    never(read|print): credential_stores(~/.ssh(not_*.pub)|~/.aws|~/.npmrc|~/.netrc|~/.kube|~/.gnupg|agent_cli_dirs|browser_dbs|wallets|.env(not_.env.example)|*.tfstate)|tokens(gh_auth_token|aws_sts|git_credential_fill), via(cat|grep|sed|cp|tar|base64|source|<|interpreter)
    ask: env|printenv|set|export_-p  # dumps every secret; if(value_needed): ask_person_for_that_value
effects:
- read_only
approval:
  required: false

compliance:
  mitre_atlas:
  - control: AML.T0098
    coverage: partial
    note: "refuses shell reads of credential stores and token-printing commands before they run; reads through scripts, unresolved variables and non-shell tools are out of scope"
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "keeps stored credentials out of the agent's context from the shell; scoping what the agent may hold stays with identity and permission design"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial release (advisory: a PreToolUse guard on the shell only). A Python guard (implementations/block-secret-store-reads.py, stdlib only, beside the shared chock_shellparse and chock_scan packages) refuses a reader, copier or archiver (cat, less, head, tail, grep, rg, sed, awk, jq, cp, mv, rsync, scp, tar, zip, base64, xxd, od, strings, openssl, gpg, source, the . builtin, dd, find -exec), a < redirect, or an interpreter one-liner or heredoc (python, node, ruby, perl, php, deno, bun, lua) that names a credential store, and refuses token printers (gh auth token and status --show-token, aws configure get of a secret field, aws configure export-credentials, aws sts get-session-token, kubectl config view --raw, security find-generic-password and find-internet-password -w/-g, git credential fill, git and docker credential helpers get). env, printenv NAME of a secret-like name, bare set, export -p, declare -p and /proc/*/environ ask instead. Paths are resolved first: ~, $HOME, ${HOME}, /root, /home/<user>, /Users/<user>, quotes, ./ and .., brace lists, globs of three or more literal characters, variables assigned earlier in the line, and cd. Template files (.env.example, .sample, .template, .dist), listings (ls ~/.ssh), ssh-keygen -l and public keys (*.pub) stay allowed. The store, reader and printer tables are one curated data file (implementations/data/secret_stores.json, 365-day freshness). Known misses, probed and held by tests/policies/test_secret_store_reads.py: scripts that read a store, unresolved variables, a list handed to xargs (or find piped into xargs), $(...) and backtick results, a project .npmrc (only the home one is a store), a relative store name after a cd it cannot resolve, editors (vim), git show or git diff of a tracked store, curl uploads (block-unapproved-egress covers sends), an interpreter that dumps the environment, other token printers (gcloud auth print-access-token, kubectl get secret, aws sts assume-role, op read, pass show), and a script fed to a shell as a here-string."
