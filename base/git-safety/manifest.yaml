id: git-safety
name: "Git Safety Rule"
version: "0.0.2"
description: >
  trigger: force push, hard reset, destructive branch delete, hook bypass, direct main commits.
  avoid: rewriting remote history, discarding uncommitted work, skipping pre-commit checks.
  Install block-destructive-commands, block-no-verify and protect-main-branch for the enforced
  counterparts of these controls (protect-main-branch is a commit-time gate; the other two are
  pre-execution guards on hook-carrying clients, advisory elsewhere); this rule is the advisory
  layer over them plus atomic-commit and diff-size guidance no gate can decide.
artifact: rule
enforcement: advise
rule:
  text: |
    see(block-destructive-commands): force_push|reset_hard|rm_-rf; see(block-no-verify): --no-verify|skip_hooks; see(protect-main-branch): direct_commit|push(main|master)
    advisory: avoid(branch_-D) without_approval; prefer(feature_branch|atomic_commits); ask_if(diff > 500_lines)
provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-08-25T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."
- version: 0.0.2
  date: '2026-08-25'
  changes:
  - "Meta-composition + honesty (hardening review): recast the advise-tier rule so covered clauses point via see() to the sibling policy that covers them -- protect-main-branch (a commit-time gate) for direct main/master writes, and block-destructive-commands / block-no-verify (pre-execution guards on hook-carrying clients, advisory elsewhere) for force_push/reset_hard/rm_-rf and --no-verify -- instead of asserting 'never' from an advisory policy. Deliberately does NOT claim universal or deterministic enforcement: see() points to the sibling, whose own manifest states its true tier. branch_-D, feature-branch/atomic-commit preference and the diff-size ask stay advisory. Wording/framing only."
