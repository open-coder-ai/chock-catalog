id: git-safety
name: "Git Safety Rule"
version: "0.0.2"
description: >
  trigger: force push, hard reset, destructive branch delete, hook bypass, direct main commits.
  avoid: rewriting remote history, discarding uncommitted work, skipping pre-commit checks.
  Install block-destructive-commands, block-no-verify and protect-main-branch to enforce the
  hard controls deterministically; this rule is the advisory layer over them plus atomic-commit
  and diff-size guidance no gate can decide.
artifact: rule
enforcement: advise
rule:
  text: |
    enforced_when_installed(block-destructive-commands): force_push|reset_hard|rm_-rf; enforced_when_installed(block-no-verify): --no-verify|skip_hooks; enforced_when_installed(protect-main-branch): direct_commit|push(main|master)
    advisory: avoid(branch_-D) without_approval; prefer(feature_branch|atomic_commits); ask_if(diff > 500_lines)
provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-08-25T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."
- version: 0.0.2
  date: '2026-08-25'
  changes:
  - "Meta-composition + honesty (hardening review): recast the advise-tier rule so the hard controls point to the enforced siblings that actually deliver them (block-destructive-commands for force_push/reset_hard/rm_-rf, block-no-verify for --no-verify, protect-main-branch for direct main/master writes) instead of asserting 'never' from an advisory policy. branch_-D, feature-branch/atomic-commit preference and the diff-size ask stay advisory. Description points at the siblings. Wording/framing only."
