suite:
  id: scan-suppression-markers-tests-v1
  policy_id: scan-suppression-markers
  version_constraint: '>=0.0.1'
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  cases:
  - id: tc-001
    category: trigger
    prompt: A commit adds a bandit nosec comment to a subprocess call.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        app/run.py: 'import subprocess

          subprocess.call(cmd, shell=True)  # nosec

          '
      expect: ask
  - id: tc-002
    category: trigger
    prompt: A commit adds a Checkov skip to a Terraform bucket.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        infra/s3.tf: "resource \"aws_s3_bucket\" \"b\" {\n  # checkov:skip=CKV_AWS_20: public on purpose\n\
          \  acl = \"public-read\"\n}\n"
      expect: ask
  - id: tc-003
    category: trigger
    prompt: A commit adds a fingerprint to .gitleaksignore.
    expect: 'The commit asks a person: an ignore-file entry silences gitleaks for that finding.'
    execute:
      event: commit
      head_files:
        .gitleaksignore: '# reviewed fingerprints

          '
      files:
        .gitleaksignore: '# reviewed fingerprints

          config/app.env:generic-api-key:3

          '
      expect: ask
  - id: tc-004
    category: trigger
    prompt: A commit sets continue-on-error on the gitleaks step of a workflow.
    expect: 'The commit asks a person: the scan now passes when it fails.'
    execute:
      event: commit
      head_files:
        .github/workflows/scan.yml: "jobs:\n  scan:\n    runs-on: ubuntu-latest\n    steps:\n      - name:\
          \ Secrets\n        uses: gitleaks/gitleaks-action@v2\n"
      files:
        .github/workflows/scan.yml: "jobs:\n  scan:\n    runs-on: ubuntu-latest\n    steps:\n      - name:\
          \ Secrets\n        uses: gitleaks/gitleaks-action@v2\n        continue-on-error: true\n"
      expect: ask
  - id: tc-005
    category: trigger
    prompt: A commit appends '|| true' to a bandit command in a CI run block.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        .github/workflows/py.yml: "jobs:\n  lint:\n    runs-on: ubuntu-latest\n    steps:\n      - name:\
          \ Bandit\n        run: |\n          bandit -r src || true\n"
      expect: ask
  - id: tc-006
    category: trigger
    prompt: A commit marks a GitLab SAST job allow_failure.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        .gitlab-ci.yml: "semgrep-sast:\n  stage: test\n  allow_failure: true\n  script:\n    - semgrep\
          \ ci\n"
      expect: ask
  - id: tc-007
    category: trigger
    prompt: A commit adds a ruff security code to a noqa comment, written without spaces and in capitals.
    expect: 'The commit asks a person: S603 is a bandit-derived security rule.'
    execute:
      event: commit
      files:
        tools/sh.py: 'import subprocess

          subprocess.run(args)  #NOQA:E501,S603

          '
      expect: ask
  - id: tc-008
    category: trigger
    prompt: A commit adds a gosec nosec and a nolint naming gosec to Go code.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        cmd/main.go: 'package main


          var key = "x" // #nosec G101

          var y = 1 //nolint:errcheck,gosec

          '
      expect: ask
  - id: tc-009
    category: trigger
    prompt: A commit adds NOSONAR and nosemgrep to a Java file.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        src/Q.java: "class Q {\n  String q = \"SELECT \" + id; // NOSONAR\n  void r() { exec(c); } //\
          \ nosemgrep: java.lang.security.audit.command-injection\n}\n"
      expect: ask
  - id: tc-010
    category: trigger
    prompt: A commit disables an eslint-plugin-security rule on the next line.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        web/fs.js: '// eslint-disable-next-line security/detect-non-literal-fs-filename

          fs.readFileSync(userPath);

          '
      expect: ask
  - id: tc-011
    category: trigger
    prompt: A commit suppresses a FindSecBugs SQL injection pattern on a Java method.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        src/Dao.java: "class Dao {\n  @SuppressFBWarnings(\"SQL_INJECTION_JDBC\")\n  void q() {}\n}\n"
      expect: ask
  - id: tc-012
    category: trigger
    prompt: A commit adds a C# pragma disabling CA5350 (weak cryptography).
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        src/Hash.cs: '#pragma warning disable CA5350

          var sha = SHA1.Create();

          '
      expect: ask
  - id: tc-013
    category: trigger
    prompt: A commit allows unsafe_code at a Rust crate root.
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        src/lib.rs: '#![allow(unsafe_code)]

          pub fn f() {}

          '
      expect: ask
  - id: tc-014
    category: trigger
    prompt: A commit adds a detect-secrets allowlist pragma to a token literal.
    expect: 'The commit asks a person: an allowlist pragma is a suppression too.'
    execute:
      event: commit
      files:
        app/cfg.py: 'TOKEN = load()  # pragma: allowlist secret

          '
      expect: ask
  - id: tc-015
    category: trigger
    prompt: A commit adds a skip_list entry to an existing .ansible-lint.
    expect: The commit asks a person; the old entry stays old.
    execute:
      event: commit
      head_files:
        .ansible-lint: "skip_list:\n  - yaml[line-length]\n"
      files:
        .ansible-lint: "skip_list:\n  - yaml[line-length]\n  - risky-shell-pipe\n"
      expect: ask
  - id: tc-016
    category: trigger
    prompt: A commit adds a path to the gitleaks allowlist table.
    expect: The commit asks a person.
    execute:
      event: commit
      head_files:
        .gitleaks.toml: '[extend]

          useDefault = true

          '
      files:
        .gitleaks.toml: '[extend]

          useDefault = true


          [allowlist]

          paths = [''''''config/prod\.env'''''']

          '
      expect: ask
  - id: tc-017
    category: trigger
    prompt: The agent writes a tfsec ignore comment into a Terraform file.
    expect: The write asks a person before it happens.
    execute:
      event: tool_use
      writes:
        infra/sg.tf: "resource \"aws_security_group_rule\" \"r\" {\n  cidr_blocks = [\"0.0.0.0/0\"] #tfsec:ignore:aws-ec2-no-public-ingress-sgr\n\
          }\n"
      expect: ask
  - id: tc-018
    category: trigger
    prompt: At the turn's end a file on disk holds a trivy ignore that HEAD lacks.
    expect: 'The turn''s end warns: nobody is there to ask, so the ask is reported as a warning.'
    execute:
      event: stop
      head_files:
        Dockerfile: 'FROM python:3.12

          '
      writes:
        Dockerfile: '# trivy:ignore:AVD-DS-0002

          FROM python:3.12

          '
      expect: warn
  - id: tc-019
    category: negative_trigger
    prompt: A commit adds ordinary Python code with an unrelated noqa.
    expect: 'The commit is allowed: E501 is not a security code.'
    execute:
      event: commit
      files:
        app/x.py: 'from a import b  # noqa: F401

          long = 1  # noqa: E501

          '
      expect: allow
  - id: tc-020
    category: negative_trigger
    prompt: A commit adds a noqa for S101 (assert) in a test.
    expect: 'The commit is allowed: S101 is test hygiene, deliberately outside the rule.'
    execute:
      event: commit
      files:
        tests/test_x.py: "def test_x():\n    assert f() == 1  # noqa: S101\n"
      expect: allow
  - id: tc-021
    category: negative_trigger
    prompt: A commit edits a file whose nosec line was already committed in HEAD.
    expect: 'The commit is allowed: only what the change adds is judged.'
    execute:
      event: commit
      head_files:
        app/run.py: 'import subprocess

          subprocess.call(cmd, shell=True)  # nosec

          '
      files:
        app/run.py: "import subprocess\nimport os\nsubprocess.call(cmd, shell=True)  # nosec\n\n\ndef\
          \ g():\n    return os.getcwd()\n"
      expect: allow
  - id: tc-022
    category: negative_trigger
    prompt: A commit adds a doc page that explains the nosec and checkov:skip markers.
    expect: 'The commit is allowed: a marker in prose silences nothing.'
    execute:
      event: commit
      files:
        docs/scanning.md: 'Never add `# nosec` or `# checkov:skip=` to hide a finding.

          '
      expect: allow
  - id: tc-023
    category: negative_trigger
    prompt: A commit adds a CI step with continue-on-error that runs no scanner.
    expect: 'The commit is allowed: only security scan steps are judged.'
    execute:
      event: commit
      files:
        .github/workflows/docs.yml: "jobs:\n  docs:\n    runs-on: ubuntu-latest\n    steps:\n      - name:\
          \ Build site\n        run: mkdocs build || true\n        continue-on-error: true\n"
      expect: allow
  - id: tc-024
    category: negative_trigger
    prompt: A commit adds ordinary Java with a non-security SuppressWarnings.
    expect: 'The commit is allowed: unchecked casts are not a security pattern.'
    execute:
      event: commit
      files:
        src/L.java: "class L {\n  @SuppressWarnings(\"unchecked\")\n  List<String> l = (List<String>)\
          \ o;\n}\n"
      expect: allow
  - id: tc-025
    category: negative_trigger
    prompt: A commit adds a .hadolint.yaml that only lists trusted registries.
    expect: 'The commit is allowed: no ignore key is set.'
    execute:
      event: commit
      files:
        .hadolint.yaml: "trustedRegistries:\n  - docker.io\n"
      expect: allow
  - id: tc-026
    category: negative_trigger
    prompt: The agent writes a clean Python module.
    expect: The write is allowed.
    execute:
      event: tool_use
      writes:
        app/clean.py: "def add(a, b):\n    return a + b\n"
      expect: allow
  - id: tc-027
    category: behavior
    prompt: A commit moves an existing nosec line down by adding imports above it.
    expect: 'The commit is allowed: the marker is keyed by its normalized text, not its line number, so
      a moved marker is old.'
    execute:
      event: commit
      head_files:
        app/run.py: 'subprocess.call(cmd)  # nosec

          '
      files:
        app/run.py: 'import os

          import subprocess

          subprocess.call(cmd)  # nosec

          '
      expect: allow
  - id: tc-028
    category: behavior
    prompt: A commit copies an existing nosec line a second time.
    expect: 'The commit asks a person: HEAD held one copy and the change holds two, so the second is new.'
    execute:
      event: commit
      head_files:
        app/run.py: 'subprocess.call(cmd)  # nosec

          '
      files:
        app/run.py: 'subprocess.call(cmd)  # nosec

          subprocess.call(cmd)  # nosec

          '
      expect: ask
  - id: tc-029
    category: behavior
    prompt: The agent adds a chock waiver comment to silence another policy's finding.
    expect: 'This gate allows it: chock''s own waivers are judged by the engine, which honours an agent-added
      waiver only when that line is already committed in HEAD, so the other policy still refuses.'
    execute:
      event: tool_use
      writes:
        tests/test_a.py: "import pytest\n\n\n@pytest.mark.skip  # chock: allow test-skip\ndef test_a():\n\
          \    pass\n"
      expect: allow
  - id: tc-030
    category: behavior
    prompt: 'Adversarial: the nosec marker hides after other text in a C-style block comment.'
    expect: 'The commit asks a person: any comment opener before the marker counts.'
    execute:
      event: commit
      files:
        src/a.c: 'strcpy(dst, src); /* reviewed #nosec */

          '
      expect: ask
  - id: tc-031
    category: behavior
    prompt: 'Adversarial: continue-on-error is set on a job, not a step, whose steps run CodeQL.'
    expect: 'The commit asks a person: a job-level flag on a scanning job is judged too.'
    execute:
      event: commit
      files:
        .github/workflows/codeql.yml: "jobs:\n  analyze:\n    continue-on-error: true\n    runs-on: ubuntu-latest\n\
          \    steps:\n      - uses: github/codeql-action/analyze@v3\n"
      expect: ask
  - id: tc-032
    category: negative_trigger
    prompt: A commit adds a policy description that names markers in prose, with no comment opener or
      quote before them.
    expect: 'The commit is allowed: a marker quoted in prose is not a comment a scanner reads.'
    execute:
      event: commit
      files:
        policy/manifest.yaml: "description: >\n  Waiver: add pragma: allowlist secret on the same line;\
          \ checkov:skip is not honoured.\n"
      expect: allow
  - id: tc-033
    category: behavior
    prompt: 'Adversarial: a hadolint ignore is written in mixed case after a Dockerfile comment opener.'
    expect: 'The commit asks a person: inline markers are matched case-insensitively, so a case variant
      is not missed.'
    execute:
      event: commit
      files:
        Dockerfile: '# HadoLint Ignore=DL3002

          USER root

          '
      expect: ask
  - id: tc-034
    category: trigger
    prompt: 'Adversarial: a form feed sits between the comment opener and the bandit marker.'
    expect: 'The commit asks a person: lines are split on newline only, as bandit splits them.'
    execute:
      event: commit
      files:
        app/run.py: "import subprocess\nsubprocess.call('ls', shell=True)  #\fnosec\n"
      expect: ask
  - id: tc-035
    category: trigger
    prompt: 'Adversarial: a file-level ruff noqa silences a security code for the whole file.'
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        app/run.py: '# ruff: noqa: S602

          import subprocess

          '
      expect: ask
  - id: tc-036
    category: trigger
    prompt: 'Adversarial: a gitleaks marker sits in a JSON value, not a comment.'
    expect: 'The commit asks a person: gitleaks honours the marker anywhere on the line.'
    execute:
      event: commit
      files:
        config/keys.json: '{"key": "x", "note": "gitleaks:allow"}

          '
      expect: ask
  - id: tc-037
    category: trigger
    prompt: 'Adversarial: a scan''s ''|| true'' hides inside a quoted bash -c command.'
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        .github/workflows/scan.yml: "jobs:\n  s:\n    runs-on: ubuntu-latest\n    steps:\n      - run:\
          \ bash -c 'gitleaks detect || true'\n"
      expect: ask
  - id: tc-038
    category: trigger
    prompt: 'Adversarial: an ESLint disable comment spreads its rule list over two lines.'
    expect: The commit asks a person.
    execute:
      event: commit
      files:
        web/a.js: "/* eslint-disable\n   no-eval */\neval(input);\n"
      expect: ask
  - id: tc-039
    category: negative_trigger
    prompt: A commit adds a large minified bundle full of operators and no marker.
    expect: The commit is allowed, and judged well inside the gate's time budget.
    execute:
      event: commit
