id: scan-suppression-markers
name: "Scan Suppression Markers"
version: "0.0.1"
description: >
  Asks a person before a change adds a scanner suppression: inline ignore markers (bandit, gosec,
  ruff S codes, Sonar, Semgrep, ESLint security, Checkov, tfsec, Trivy, KICS, hadolint, cfn_nag,
  zizmor, gitleaks, detect-secrets, CodeQL, Java/C#/Rust security allows), scanner
  ignore files and skip keys, a CI scan set to pass on failure. Only added lines; prose skipped.
  Runs: commit, agent write, turn's end; CI annotates. Line-local, friction not a boundary.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: ask
    message: >
      This change adds a scanner suppression: an inline ignore marker, an ignore-file entry or
      skip key, or a CI security step told to pass when it fails. Fix what the scanner reports
      instead of silencing it. If the finding is a reviewed false positive, a person keeps the
      suppression by committing from their own shell with CHOCK_ALLOW=scan-suppression-markers
      for that one commit; an agent asks the person and never sets it.
    params:
      script: scan-suppression-markers-gate.py

compliance:
  owasp_asi:
  - control: ASI10
    coverage: partial
    note: "asks a person when an agent silences a security scanner (reward hacking); the agent inventory, monitoring and kill switch stay with the advisory owasp-asi10-rogue-agents policy"
  owasp_cicd:
  - control: CICD-SEC-1
    coverage: partial
    note: "a CI security step made to pass on failure, or an ignore entry added, asks a person; branch protection and required checks stay with the platform"
  cwe:
  - control: CWE-693
    coverage: partial
    note: "protection mechanism failure by suppression: line-local markers, ignore files and soft-failed CI scans only"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP25, classes I07, J06, M03). A script gate that asks, never blocks: a suppression can be a reviewed false positive, so a person decides (CHOCK_ALLOW=scan-suppression-markers on their own commit) and an agent cannot. The script prints a findings document; the engine re-runs it on the baseline and asks only about what the change adds, so a marker line already in HEAD, or one that only moves within its file, is old. Keys carry the rule and the normalized line (plus the owning key or CI step for config entries), never a line number."
  - "Judged (a comment-style marker counts only with a comment opener before it on its line): inline markers for bandit and gosec (incl. gosec's disable directive), ruff and flake8-bandit S codes other than S101 (also file-level), golangci nolint naming gosec, Sonar, Semgrep (anywhere after whitespace), ESLint security rule sets and eval rules (disable comments, inline config turning them off, and a disable or config block comment whose directive, possibly alone on its line, or rule list continues on later lines), Checkov, Bridgecrew and Cortex skips and the checkov.io/skip annotation, tfsec and Trivy ignores, KICS, hadolint (incl. global), cfn_nag and cfn-lint metadata keys, zizmor, gitleaks and TruffleHog (anywhere on the line), the detect-secrets secret pragma (allowlist or whitelist, space or hyphen; also after a quote), CodeQL and LGTM, DevSkim, Snyk Code, Bearer, Psalm taint suppressions, RuboCop Security cops, Rust unsafe_code allows, Java and Kotlin suppressions naming a security pattern, C# SuppressMessage in the Security category or a CA security id, and C# pragma warning disable of those ids; every entry added to .gitleaksignore, .trivyignore(.yaml) or .semgrepignore; skip keys in .checkov.yml, .hadolint.yaml, .ansible-lint, bandit, .snyk and zizmor configs, and the allowlist tables of .gitleaks.toml; on a CI step or job that runs a security scanner (GitHub Actions incl. composite actions, GitLab, Azure Pipelines, Bitbucket, CircleCI): continue-on-error, allow_failure (incl. exit_codes), continueOnError or soft_fail set, a shell fallback (|| true, || :, || exit 0, || { true; }, || command true, || echo or printf outside a $( ), a trailing ; true), set +e with no later code line capturing the status ($?) or exiting with it (a bare set -e afterwards does not count: the failure is already swallowed), shell bash +e, and a scanner's own no-fail option (--soft-fail, --exit-code 0, exit-code: 0, --exit-zero, --ignore-on-exit, -no-fail, --no-fail, --no-exit-codes); and GitLab's SAST, secret detection, dependency, container, DAST, API and coverage fuzzing and IaC scanning templates switched off by their _DISABLED variable."
  - "Not judged: chock's own waivers (the roadmap does not list them; the engine ignores a waiver an agent adds at tool use, the turn's end and an agent's commit, and one written into a person's commit is that person's to review); a comment-style marker with no opener before it; Markdown, MDX, reStructuredText, AsciiDoc and text files, upper-case CHANGELOG, CHANGES and HISTORY files, chock's managed .agents/policies/ and .chock/ at the repository root and the catalog's own policy eval suites; in the prose files (not the managed ones) the gitleaks, TruffleHog and detect-secrets markers still count, quoted or not, as those scanners read prose too and honour a quoted marker; a CI settings block (env, variables, on and the like) is never a scan step. Lines split on newline only, as the scanners split them; each rule looks for its code or rule id only within 1000 characters after its anchor, rules run only on lines holding one of their words (a case-sensitive search of the case-folded line, so a folded spelling such as a long s still counts), and CI blocks come from one pass; a 5 MB write of any shape the reviews tried is judged in under three seconds."
  - "Limits: one line at a time apart from ESLint block comments, and a security id more than 1000 characters after its directive is not seen; so a Java annotation whose arguments start on a later line, a CloudFormation checkov Metadata block, a marker assembled from variables, a blanket suppression that names no rule (a bare noqa, eslint-disable or nolint, nolint:all) and a continue-on-error set by an expression are not seen; an explicit exit 0 in a scan step and a ; exit 0 are not judged (they are also the shape of a correct early exit), an ordinary || true inside a scanning step (mkdir -p out || true) still asks, and a fallback after an unbalanced $( is not seen. Also not read: YAML anchors and merge keys, a GitLab root default: before_script with set +e, a GitHub defaults shell without -e, GitLab include files not named like .gitlab-ci, the *_EXCLUDED_ANALYZERS and *_EXCLUDED_PATHS variables, and ESLint security rules downgraded to warn. A marker is keyed by its own line, so a marker line left unchanged stays old even when the code around it changes. Not read: .secrets.baseline, grype, osv-scanner, cargo-deny and cargo-audit, brakeman, CodeQL and Sonar configs, pyproject bandit or ruff settings, csproj NoWarn, ruff, flake8 or .editorconfig severities, gitleaks disabledRules or per-rule allowlists, checkov skip-path; Android SuppressLint, Sonar java:S ids in SuppressWarnings, FindSecBugs codes with no security word (ECB_MODE, STATIC_IV), Rust cfg_attr allows and Psalm taint escapes. Rollout: ship under 'rollout: observe' first (decision D15)."
