id: block-unguarded-agent-spawn
name: "Block Unguarded Agent Spawn"
version: "0.0.5"
description: >
  Best-effort guard against an agent launching a coding agent with safety checks off: claude
  --dangerously-skip-permissions or --permission-mode bypassPermissions; codex --full-auto,
  --yolo, --dangerously-bypass-approvals-and-sandbox, --sandbox/-s danger-full-access; gemini
  --yolo, -y, --approval-mode yolo; cursor-agent --force/-f. Parsed: cd, bash -c, sudo/env,
  npx/bunx/pnpx wrappers are caught; echo/grep/commit text is not. Bypasses: aliases, scripts,
  config-set modes, unlisted agents.
artifact: rule
enforcement: advise
rule:
  text: |
    never(spawn_agent): claude(--dangerously-skip-permissions|--permission-mode_bypassPermissions), codex(--full-auto|--yolo|--dangerously-bypass-approvals-and-sandbox|--sandbox|-s_danger-full-access), gemini(--yolo|-y|--approval-mode_yolo), cursor-agent(--force|-f)
    if(unattended_run_needed): ask_person; person_starts_it  # spawn with default approvals and sandbox
effects:
- read_only
approval:
  required: false

compliance:
  owasp_asi:
  - control: ASI10
    coverage: partial
    note: "refuses launching a sub-agent with approvals or sandbox switched off from the shell; agent inventory, expiry, monitoring and a kill switch stay with the advisory owasp-asi10-rogue-agents policy"

provenance:
  author: "chock-core"
  created_at: "2026-09-29T00:00:00Z"
  updated_at: "2026-09-30T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.5
  date: '2026-10-03'
  changes:
  - "a lone + ends shell options like -"
- version: 0.0.1
  date: '2026-09-29'
  changes:
  - "Initial baseline: a Python guard (implementations/block-unguarded-agent-spawn.py, stdlib only, beside the shared chock_shellparse package) refuses claude --dangerously-skip-permissions and --permission-mode bypassPermissions, codex --full-auto, --yolo, --dangerously-bypass-approvals-and-sandbox and --sandbox danger-full-access, gemini --yolo, -y and --approval-mode yolo, and cursor-agent --force/-f, on the command actually run: after cd, bash -c, sudo/env wrappers and through npx/bunx package names. Normal invocations, and commands that merely mention a flag, are allowed. Advisory (a PreToolUse guard on the shell only): maps to OWASP ASI10 as partial coverage."
- version: 0.0.2
  date: '2026-09-30'
  changes:
  - "Wording only, verdicts unchanged: the description lists what the guard already catches but did not name -- cursor-agent -f, codex -s danger-full-access, and bunx and pnpx as well as npx -- and fits the 500-char budget. The refusal now gives a route forward: run the agent with default approvals, or ask the person to start an unattended run from their own shell. The rule text lists the same flags and says to ask the person."
- version: 0.0.3
  date: '2026-10-02'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: it skips a `--` and the shell options between `-c` and the script (`bash -c -- '...'`, `sh -c -x '...'`, `eval -- '...'`), reads `name=(...)`, `name+=` and `name[i]=` assignments, looks through the `{` that opens a function body or group, and splits a line whose quotes do not balance in one pass (it was cubic: seconds at 4 KB, a minute at 8 KB). What this policy refuses is otherwise unchanged; it now also judges the command inside those forms. See protect-agent-config 0.2.6."
- version: 0.0.4
  date: '2026-10-03'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: in a short-option cluster every `o` or `O` takes the next word (`bash -co pipefail '...'`, `-oc`, `-Oc extglob`, `-c -oe pipefail`) and a lone `-` ends the options as `--` does (`sh -c - '...'`), so the script behind them is read and judged. What this policy refuses is otherwise unchanged; it now also judges the command inside those forms. See protect-agent-config 0.2.7."
