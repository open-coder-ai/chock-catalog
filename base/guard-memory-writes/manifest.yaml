id: guard-memory-writes
name: "Guard Memory Writes"
version: "0.0.6"
description: >
  Refuses agent-memory writes holding what memory must never hold: pasted git history (diff, hunk,
  commit, index lines), a fenced code block over 20 lines, a duplicate line, or a secret
  (scan-secrets' pattern). Judges only memory files (MEMORY.md at any depth, CLAUDE.local.md,
  .claude/memory/**, memory/**/*.md; at agent tool-use also ~/.claude/projects/*/memory/**,
  ~/.claude/CLAUDE.md, /memories/**) and only what the change adds. No waiver. Structural checks
  only.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    outside_repo:
    - "~/.claude/projects/*/memory/**"
    - "~/.claude/CLAUDE.md"
    - "/memories/**"
    action: block
    message: >
      Memory write refused: it pastes git history, a code block over 20 lines, a duplicate
      line, or a secret. Store the non-derivable fact in one short line; link to the commit or
      file instead of pasting it. Rotate any secret that was written.
    params:
      script: guard-memory-writes-gate.py

provenance:
  author: "chock-core"
  created_at: "2026-09-29T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-09-29'
  changes:
  - "Initial draft: script gate over agent-memory files, split out of memory-discipline's never_persist (git history) and chock-mise's never(store): secrets. Secret pattern is scan-secrets' content_pattern verbatim; a test fails if the two drift. File contents are not mechanically detectable beyond an oversized fenced block, so that slice of never_persist stays advisory."
- version: 0.0.2
  date: '2026-09-29'
  changes:
  - "The gate declares outside_repo, so an agent's write to its own memory store is judged at tool use: ~/.claude/projects/*/memory/** and ~/.claude/CLAUDE.md (Claude Code's auto-memory and user instructions) and /memories/** (the path Copilot's memory tool writes, which the vendored Copilot runtime reads from the tool call). The baseline for an outside file is the file on disk, not HEAD. Stop and commit still see only repository files; a shell write to these paths is not seen."
- version: 0.0.3
  date: '2026-09-30'
  changes:
  - "The gate prints a findings document for everything it refuses in a memory file, and the engine (chock 0.15.0) compares it with the baseline -- HEAD in the repository, the file on disk for an outside store -- instead of the gate comparing lines. A key is the reason and the normalized line for git history, a secret and a duplicate, and the reason and the fence opener (```python) for a long block; a secret's line is hashed in its key so the document never carries it. So a finding that only moves is old, and a second copy is new. Removed: new_line_numbers, head_lines and disk_lines; the outside-repo paths are still recognised by the script. A committed long block that grows is still old: it has the opener it had."
- version: 0.0.4
  date: '2026-09-30'
  changes:
  - "A long block's key is now the reason, the fence opener and a hash of the block's normalized body (long-block|```python|<sha256[:16]>). A line added to a committed block that is still over the limit changes the body, so the finding is new and blocks; before, it kept the opener's key and passed as old. An untouched long block is still old, and one shrunk under the limit is no finding."
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Description only, within the 500-char budget; scope, checks and gate unchanged."
- version: 0.0.6
  date: '2026-10-02'
  changes:
  - "The secret check follows scan-secrets 0.1.0: its content_pattern is copied verbatim (now a verbose, commented regex), so a memory file is also refused for quoted-colon JSON and YAML credentials, AWS secret access keys, credentials in URIs, Authorization header literals, passwords on a command line, PGP and encrypted private-key blocks, and the named-credential forms and vendor token shapes scan-secrets 0.1.0 adds. The URI-credentials alternative is the narrowed one (no unescaped backslash, # or ? in the userinfo; foo, foobar, bar, baz are placeholders). Scope, keys and gate unchanged."
