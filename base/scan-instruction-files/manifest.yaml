id: scan-instruction-files
name: "Scan Instruction Files"
version: "0.0.1"
description: >
  Asks a person before a change adds injection text to an agent instruction file (AGENTS.md, CLAUDE.md,
  GEMINI.md, Cursor/Windsurf/Cline/Roo/Kiro rules, Copilot instructions and prompts, SKILL.md, agent
  commands): rule overrides, secrecy, auto-approve, hook or review bypass, fetch-and-run, remote
  instructions, role swaps, fake system tags, removed guardrails. Refuses secret exfiltration and encoded
  payloads. Added text only; English phrases; friction, not a boundary.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      This change adds text to an agent instruction file that an attacker would add: it overrides
      standing rules, hides work from a person, approves tools or skips hooks and review without one,
      downloads and runs code, follows remote instructions, recasts the agent's role, poses as a system
      message, removes a guardrail statement, sends a secret somewhere, or hides a command in an encoded
      blob. Write rules as prohibitions a person can review, and put setup steps in a reviewed script. A
      person keeps a reviewed line by committing from their own shell: CHOCK_ALLOW=scan-instruction-files
      for that one commit answers an ask, and 'chock: allow instruction-scan' on the line waives a
      refusal; an agent asks the person and never sets either.
    params:
      script: scan-instruction-files-gate.py

compliance:
  owasp_asi:
  - control: ASI01
    coverage: partial
    note: "asks before plain-text goal-hijack phrasing lands in an instruction file and refuses secret exfiltration and encoded payloads there; injection through fetched content, issues or tool output stays advisory (injection-defense)"
  owasp_llm_2025:
  - control: LLM01
    coverage: partial
    note: "Prompt Injection: judges the persistent carrier (committed instruction files) by English phrase lexicon; paraphrase, other languages and runtime content are not judged"
  mitre_atlas:
  - control: AML.T0051
    coverage: partial
    note: "LLM Prompt Injection, indirect via repository instruction files: lexicon heuristics at commit and on agent writes"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP02). A script gate over agent instruction files, judged by path, case-insensitively: AGENTS.md (and AGENT.md, AGENTS.override.md), CLAUDE.md, CLAUDE.local.md, GEMINI.md, SKILL.md and MEMORY.md anywhere; .cursorrules, .windsurfrules, .clinerules (file or folder), .roorules; .cursor/rules/, .windsurf/rules/, .roo/rules*/, .kiro/steering/, .continue/{rules,prompts}/, .amazonq/rules/, .augment/rules/, .trae/rules/, .codex/prompts/, .gemini/commands/, .claude/{commands,agents,skills,memory}/; .github/copilot-instructions.md and .github/{instructions,prompts,agents,chatmodes}/; *.instructions.md, *.prompt.md, *.chatmode.md, *.agent.md; .junie/guidelines.md; memory/*.md; and `.agents/policies/INDEX*.md`, which chock's pointer in AGENTS.md tells every agent to read. Nothing is skipped by location: chock's installed copies (`.agents/policies/`, `.chock/`) and a catalog's policy skill pages are judged like any instruction file, because an agent loads them too. One exception is the engine's, not this script's: it never runs a policy's gate on that policy's own installed folder (`.agents/policies/scan-instruction-files/`), whose eval suite carries the text it refuses; protect-agent-config guards that folder's implementations/ only. Paths are folded (backslashes, `//`, `.`, `..`) before matching."
  - "Judged, on the text a change adds (a findings document the engine compares with the baseline run; key = rule + a hash of the normalized statement, never a line number, so a moved line is old and a second copy is new). The file is read as statements: soft-wrapped paragraph lines joined (however long the paragraph) and split into sentences, each list item, heading (one to six # and a space, up to three spaces in), thematic break, table row (a `|` run with a delimiter row) and front-matter key (a plain YAML name, a colon and a space, with the lines up to the next key) on its own, a front matter of more than one key also judged whole, a hard line break (two trailing spaces, a backslash, <br>) ending a part of its paragraph while the sentences that span the break are also judged whole (so it cuts a negation's reach but cannot split a phrase or a command, in prose, a code span or an indented code block), an inline <br> read as a space, while a wrapped line that starts with an autolink or a lone `|` continues its paragraph; a blockquote read as a container, also inside a list item (its > prefix set aside, a statement ending where the quote depth changes, except for a lazy continuation line right after quoted text); fenced code, its opener's info string judged as prose (an approximation of CommonMark: lines end at LF, CRLF or a lone CR, only spaces and tabs indent, indents are counted in columns with a tab to the next multiple of four; an opener or closer indented four or more columns past its container's content is not one, the container being the innermost open list item, kept open across a lazy continuation line, or the margin; a fence right after a list marker opens when one to four columns follow the marker; a backtick opener whose info string holds a backtick is not one; a fence closes at its closer (at the opener's quote depth), when its quote ends, or, in a list item, at a non-blank line below the item's content indent; HTML blocks and CommonMark's paragraph-interruption rules are not modelled) line by line, a line ending in a backslash, | or && joined with the next, and its lines judged as prose paragraphs as well (a blank line or block start begins one, a fence line or a heading stands alone; when a line outside the fence's container ends it, the last paragraph is joined with that line, as a renderer that saw no fence would join it), so where this reader takes text for a fence that a renderer shows as prose, wrapped prose is still joined and judged; only for a sure fence (opened at the margin, outside any list, quote or HTML block, CommonMark's seven HTML block kinds tracked) closed by its own closer does that reading ask at most, as every renderer shows that text as code; statements over 4000 characters in overlapping pieces. Text is NFKD-normalized, casefolded, with format, combining and control characters removed, and in prose emphasis marks, code-span backticks and quotes or brackets around a single word removed too (fenced code keeps them, and so do the bracketed fake trust tags (inst, system, sys)), so a zero-width space, an accent, bold or a hard wrap does not hide a phrase. Asks (exit 3): overriding standing instructions, secrecy toward a person, auto-approving or trusting tools, permission-skip flags, acting on something risky without asking (only with a risky target in the same segment, which a sentence end or a semicolon splits: push, deploy, delete, install, a download, secrets, any command), bypassing hooks, gates, review or chock itself (including --no-verify, SKIP=, CHOCK_ALLOW and rollout: observe), weakening failing tests, fetch-and-run (a download piped into a shell or interpreter, a shell running a download's output, process substitution of a download, a PowerShell download passed to iex, download-then-chmod), password-protected archives, following remote instructions, role reassignment, fake system/admin/trusted tags, an opaque base64 blob of 80+ characters (wrapped lines joined: a 40+ character run that ends a line, base64-only lines after it behind any quote or list prefix, and the run that starts the next line, a trailing shell backslash set aside; lines that do not decode as one blob are also judged one by one and, padding removed, as one opaque run; a run may follow = as in KEY=<blob>), and a guardrail statement (a mandate word and a guarded topic) the change deletes or rewords so that a topic it guarded (tests, review, hooks, secrets, main...) is left with fewer guardrail statements of the same polarity (prohibitions and positive mandates are counted apart, so turning never into always asks): a weakening, not a rewording. Refuses (exit 1): a secret sent to a remote destination (a URL, host, e-mail or webhook in the statement, and a send verb -- send, post, upload, e-mail, forward, submit -- whose object, between the verb and a destination that follows it in the same clause (carried past a colon or dash beside to/into/at: upload X to: https://...), is a secret file (a private key, not a .pub), env dump or secret variable, or whose direct object is a credential (the API key, all tokens, followed by to/from/via/with... or the clause's end) in a clause not about an auth header; push and share count only with a secret file or variable as their object, copy, paste, sync and report never count, a leaked, exposed or compromised secret named as the object is a disclosure to a security contact, a secret named only after the destination (with twine, which reads $TWINE_PASSWORD) is how the agent authenticates, and a negation governing the secret discounts it; or a network tool fed a secret through a pipe into it, a data or upload flag, a redirect or a substitution on its own command, a header, user, password or httpie Header:\"value\" holding only a plain variable or ${{ secrets.X }} being set aside, in prose as in commands; or DNS-shaped exfil), decoding base64 or hex straight into a shell or interpreter, a blob that decodes to a command or to text the rules flag, and a fake trust tag whose block (to its closing tag, at most 12 statements, a fence's prose reading not counted) runs a command. A network tool whose only secret is a variable inside the URL it fetches or in a name=$VAR form field asks instead (secret-in-request): OAuth, Slack and Telegram APIs take credentials that way (&-joined fields included; an @file upload is never set aside). A negation discounts a match only when it governs it: among the eight words before it for an ask, the two words before the verb for a refusal (never send, do not upload; never commit or push reaches the second verb), and not cut off by a closing bracket or >, colon, semicolon, pipe, arrow (->, =>, a unicode arrow), spaced dash (an em or en dash counts as spaced), a closing double quote, and/then/so, a hard line break, or a comma (a comma list ending in or/nor keeps it: never use --no-verify, --force or skip hooks); the compact form never(context): X governs X at most two words on. Encouragers (do not hesitate to, do not forget, no matter what, no exceptions, not optional) and verb forms (blocks, rejects, denies) are not negations. A risky target governed by its own negation (never push) does not count; in a piece of a statement split for length, a rule that pairs a phrase with a target fires on the phrase alone, since the pair may straddle two pieces. Guardrail polarity is read with encouragers removed (never forget to commit secrets permits). A credential named generically (a token, the API key) sent in an Authorization header, and a plain secret variable in a curl -H or -u value, are not exfiltration."
  - "Verdict per run: exit 1 when a refusal-class finding is new against the text before the change (the file on disk before a tool write, HEAD at commit and at the turn's end, which reaches the script as a tool write whose text is already on disk), else exit 3; the engine judges only new findings. An ask is refused at commit unless a person commits from their own shell with CHOCK_ALLOW=scan-instruction-files, asked at tool use, and a warning at the turn's end. A refusal is waived only by a person, with 'chock: allow instruction-scan' on a line of the statement or alone on the line above, honoured at a person's commit only (not at tool use, the turn's end, an agent's commit or CI). An instruction file over 262144 characters is not read: every change to it is refused (keyed by its whole text), so padding a file cannot turn a refusal into an ask; a person waives it with the waiver on its first line at their own commit. Unreadable stdin, a judged path whose text is not a string, two spellings of one judged path, a non-string event or repo_root, a broken or missing lexicon (implementations/data/lexicon.json, a dated curated table loaded by chock_scan.data_table, with every vowel written as a JSON unicode escape so no attack phrase sits in the file verbatim) or git failing to run exit 2, which the runner treats as undecided and refuses."
  - "Division of labour. protect-agent-config already refuses any agent Edit/Write or shell write to AGENTS.md, CLAUDE.md, GEMINI.md, copilot-instructions.md, .cursorrules and .windsurfrules, so for those files this gate adds the commit and the turn's-end check (a person's own edits, writes that got past the guard) and the content judgment; for the other paths here (rules folders, prompts, skills, commands, steering) it is the only check on content. block-invisible-unicode (HP15) owns hidden characters (tag, bidi, zero-width); this gate only strips them before matching. scan-hidden-content (NP01, not yet in the catalog) owns hidden HTML/CSS text and markdown image beacons; text inside an HTML comment is judged here like any other. block-curl-pipe-sh judges commands an agent runs; this gate judges instructions that tell an agent to run them. guard-memory-writes and NP20 own memory files; MEMORY.md and memory/*.md are also judged here. injection-defense stays the advisory rule for fetched content, issues and tool output."
  - "Rollout (D15): ship under `rollout: observe` in .chock/config.yaml first and read the gate log before enforcing. Measured by replaying the gate over history against each parent. This catalog: 33 of 404 non-merge commits flagged; 32 only in chock's own policy pages (installed copies under `.agents/policies/` and the catalog's skill pages, which describe the patterns they refuse, so an edited description names a flag literally or drops a guarded topic), 1 elsewhere (a reworded guardrail in java-security's configure skill, a true ask). The chock engine repository: 3 of 418, all in installed policy copies. Of 140 instruction files in the catalog, the engine and the planning repository judged whole, the 87 findings are all asks in policy pages; files people write produced none, and nothing was refused. While policy pages are judged, this catalog does not meet D15's 5% bar; a person refreshing installed policies answers the ask with CHOCK_ALLOW."
  - "Refuses by design: a fence this reader is not sure of (in a list item or quote, indented, after an HTML line, or ended by its container) has its prose reading judged in full, so a code comment that reads as an instruction to send a secret, joined with the command under it, refuses; move the comment out of the code or waive the line at commit. Asks by design: a vendor's one-line installer (a download piped into sh, as rustup and uv document it) asks; put the step in a reviewed script or answer the ask. A comma list after a negation (without asking, never push, deploy or delete branches) reads like a new clause and asks, as a comma-led clause after a prohibition would be judged. Limits (probed, not caught): a non-English override (only English phrases are in the lexicon); a paraphrase the lexicon does not list (pay no attention to the earlier guidance; a made-up persona's name used where the lexicon expects a role phrase such as an unrestricted assistant; send the output of env to <url>); a homoglyph letter (Cyrillic o in ignore: block-invisible-unicode's confusable tier owns it); a negated framing that is not a prohibition (it would not hurt to bypass the hooks); an instruction split across list items or statements; a short encoded payload under 80 characters with no decode-and-run on the same statement; link text pointing at remote instructions (a markdown link labelled as the real instructions); a blob encoded twice; hex with a 0x prefix; base64 wrapped at fewer than 40 characters a line; emphasis or quotes inside fenced code in its line-by-line reading; a phrase split by a line this reader takes for a fence opener or closer that a renderer shows as paragraph text (the two halves are judged apart); a deleted guardrail replaced by another of the same polarity on the same topic (never commit secrets replaced by never paste secrets in issues); a line moved from a code fence into prose, or the reverse, when its normalized text is unchanged (its key stays the same); a secret named after the destination (send to <url> the contents of a key file) is read as authentication, and a destination named before the send verb (to <url>, upload a key file) is not paired with it; a secret sent in a header or user value that is a plain variable, or inside a URL (asked, not refused); anything outside the judged paths (a README an agent reads, MCP prompts served at run time). A deleted instruction file is never handed to the gate (the engine passes added, copied, modified, renamed and type-changed files), so the guardrails it held go unjudged. A removed or reworded guardrail is not judged in CI (the payload names no base), and in CI every refusal-class finding in a changed file counts as new. Friction, not a security boundary: a person reviewing every change to an instruction file is the control."
