id: verify-dependency-exists
name: "Dependency Allowlist"
version: "0.1.0"
description: >
  Allowlist gate for new dependencies; no registry lookup is made. Reads Python, Node, Rust, Ruby, PHP, JVM,
  .NET, Go, Elixir, Dart and Swift manifests (parsed, never run); blocks an added name missing from
  .chock/dependency-allowlist.txt and asks on a lockfile-only addition. Not read: computed lists, sources,
  versions. Opt-in: seed the allowlist, run in rollout observe, then `chock enable verify-dependency-exists`.
  Runs: commit, agent write, turn's end.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      Unknown dependency blocked: it is not in .chock/dependency-allowlist.txt. This gate checks the
      allowlist only and makes no registry lookup, so confirm the package exists in its official registry
      and is the intended one first. If you are an agent, ask a person to add the name; do not edit that
      file yourself (protect-agent-config). If you are a person, add the name to the file.
    params:
      # One script reads every manifest family and lockfile (implementations/depnames/), so a format the
      # built-in dependency_allowlist gate cannot parse is covered. It prints each unlisted name as a
      # finding and the engine keeps only the ones this change adds (against HEAD, the disk or the range
      # base), so touching a manifest that already holds an unlisted package does not block. A lockfile
      # name alone exits 3 (ask); any manifest name exits 1 (block); a file it cannot read adds no names.
      script: dependency-manifests.py

compliance:
  mitre_atlas:
  - control: AML.T0010
    coverage: partial
    note: "allowlist gate over new dependencies; only manifest-visible names are checked, a computed list is not read"
  nist_ai_rmf:
  - control: GOVERN-6.1
    coverage: partial
    note: "a committed allowlist is a third-party-risk policy the repo enforces"
  - control: MANAGE-3.1
    coverage: partial
    note: "new third-party components are checked against a curated control at commit, agent write and the turn's end"
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "allowlist gate over newly-added dependencies in the manifests of eleven ecosystems at commit, agent write and turn's end; it checks membership in a curated allowlist, NOT existence in the upstream registry, and not a dependency's source or version"

provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
  - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1)."
- version: 0.0.2
  date: '2026-08-04'
  changes:
  - "Ported to v3 manifest shape with dependency_allowlist gate; added compliance.owasp_asi ASI04."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas/nist_ai_rmf); no mechanism change."
- version: 0.0.3
  date: '2026-08-25'
  changes:
  - "Honesty (do-not-claim): owasp_asi ASI04 coverage full -> partial; the note now states it is an allowlist-membership gate at commit entry, not upstream-registry existence verification. Wording only."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Also run in the agent: gate.on is now [commit, tool_use], so a dependency the agent adds to a watched manifest is refused as it writes, not only at commit. Only names the write adds against the file on disk (at the turn's end, against HEAD) are checked, so an edit to a manifest that already holds an unlisted package is not refused. The message now tells the agent to ask a person to extend the allowlist, which the agent cannot edit itself."
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Rename (display name only, id unchanged): 'Verify Dependency Exists' becomes 'Dependency Allowlist', because the gate is an allowlist and never looks a package up in a registry."
  - "Disclosure, no behaviour change: the description says no registry lookup is made and lists what is not read -- -r/-e lines, requirements-dev.txt, poetry dependency groups and [dependency-groups]. The stale 'commit time' notes are replaced by where each check runs (commit, agent write against disk, turn's end against HEAD). The message is addressed to whoever reads it: an agent asks a person; a person adds the name to the file. source_repo points at chock-catalog; the description fits the 500-char budget."
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "Rebuilt on a script gate (implementations/dependency-manifests.py) in place of the built-in dependency_allowlist kind, which reads four formats and cannot be extended from a policy; a manifest holds one gate, so the script also reads those four. It reads requirements*.txt, requirements/*.txt, constraints*.txt (an -r include is judged when the change holds that file), Pipfile, setup.cfg, setup.py (literal lists via ast, never run), pyproject.toml (project, build-system, optional and group tables, Poetry, uv dev, override and constraint lists, PDM, Hatch environments), package.json (also overrides, pnpm.overrides, resolutions, catalogs and npm: aliases; workspace:, file: and link: specs are local), Cargo.toml (dev, build, target, workspace, patch, package renames), Gemfile and gemspec, composer.json, pom.xml, Gradle scripts (any quoted coordinate with a dotted group, either map order, versioned plugins) and *.versions.toml catalogs, csproj and packages.config, go.mod (require blocks and replace), mix.exs, pubspec.yaml and Package.swift. Names are normalised per ecosystem: PEP 503 for Python, - and _ alike for Cargo, lowercase elsewhere with an npm scope kept."
  - "New behaviour: a name that appears only in a lockfile (package-lock.json, yarn.lock, pnpm-lock.yaml, poetry.lock, uv.lock, Cargo.lock, go.sum, Gemfile.lock, composer.lock) and is not listed asks instead of blocking. A pom.xml, csproj or other XML manifest that declares a DOCTYPE or ENTITY, and a manifest too large or too deeply nested to read, is refused unread as a finding keyed by a digest of its text (so any edit to it is new and its names cannot slip past it); a file with a plain syntax error adds no names, and its note reaches nobody when the run allows. Allowlist lines may carry a trailing ' # note'. `--seed` prints the names the tracked manifests hold, for a first allowlist."
  - "Behaviour change: the allowlist is matched after normalisation, so `Foo_Bar` is the listed `foo-bar`; before, only a case-insensitive exact match counted. The message now also says the package must be the intended one."
  - "Judging detail: Go module paths, Maven coordinates, Hex and pub names are compared as written, not lowercased, because those registries tell `Foo` from `foo` -- an allowlist line for `github.com/BurntSushi/toml` no longer passes the different module `github.com/burntsushi/toml`. A lockfile is asked about only when no manifest of its ecosystem changed beside it (same folder or below): a listed manifest addition is no longer an ask for the transitive names its lock gains."
