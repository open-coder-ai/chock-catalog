id: verify-dependency-exists
name: "Dependency Allowlist"
version: "0.0.5"
description: >
  Allowlist gate for new dependencies; no registry lookup is made. Watches requirements.txt,
  pyproject.toml ([project] and poetry dependencies), package.json, go.mod; blocks an added name
  missing from .chock/dependency-allowlist.txt. Not read: -r/-e lines, requirements-dev.txt,
  poetry groups, [dependency-groups]. Opt-in: fill the allowlist, then `chock enable
  verify-dependency-exists`. Runs: commit, agent write (vs disk), turn's end (vs HEAD).
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: dependency_allowlist
    "on": [commit, tool_use]
    action: block
    message: >
      Unknown dependency blocked: it is not in .chock/dependency-allowlist.txt. This gate checks
      the allowlist only and makes no registry lookup, so confirm the package exists in the
      official registry first. If you are an agent, ask a person to add the name; do not edit
      that file yourself (protect-agent-config). If you are a person, add the name to the file.
    params:
      # Each format has a dedicated extractor that parses the whole staged file, so
      # section context is available and only real dependencies are reported. Only names
      # this commit ADDS are checked -- diffed against HEAD -- so touching a manifest
      # that already contains an unlisted package does not block the commit (the gate also
      # runs at agent write, against the file on disk, and at the turn's end, against HEAD).
      # `chock check` rejects any format without an extractor.
      manifests:
      - requirements.txt
      - pyproject.toml
      - package.json
      - go.mod
      allowlist_file: .chock/dependency-allowlist.txt

compliance:
  mitre_atlas:
  - control: AML.T0010
    coverage: partial
    note: "allowlist gate over new dependencies; only manifest-visible additions are checked"
  nist_ai_rmf:
  - control: GOVERN-6.1
    coverage: partial
    note: "a committed allowlist is a third-party-risk policy the repo enforces"
  - control: MANAGE-3.1
    coverage: partial
    note: "new third-party components are checked against a curated control at commit time"
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "allowlist gate over newly-added dependencies in requirements.txt, pyproject.toml, package.json, go.mod at commit entry; it checks membership in a curated allowlist, NOT existence in the upstream registry"

provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-09-30T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
  - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Rename (display name only, id unchanged): 'Verify Dependency Exists' becomes 'Dependency Allowlist', because the gate is an allowlist and never looks a package up in a registry."
  - "Disclosure, no behaviour change: the description says no registry lookup is made and lists what is not read -- -r/-e lines, requirements-dev.txt, poetry dependency groups and [dependency-groups]. The stale 'commit time' notes are replaced by where each check runs (commit, agent write against disk, turn's end against HEAD). The message is addressed to whoever reads it: an agent asks a person; a person adds the name to the file. source_repo points at chock-catalog; the description fits the 500-char budget."
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1)."
- version: 0.0.2
  date: '2026-08-04'
  changes:
  - "Ported to v3 manifest shape with dependency_allowlist gate; added compliance.owasp_asi ASI04."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas/nist_ai_rmf); no mechanism change."
- version: 0.0.3
  date: '2026-08-25'
  changes:
  - "Honesty (do-not-claim): owasp_asi ASI04 coverage full -> partial; the note now states it is an allowlist-membership gate at commit entry, not upstream-registry existence verification. Wording only."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Also run in the agent: gate.on is now [commit, tool_use], so a dependency the agent adds to a watched manifest is refused as it writes, not only at commit. Only names the write adds against the file on disk (at the turn's end, against HEAD) are checked, so an edit to a manifest that already holds an unlisted package is not refused. The message now tells the agent to ask a person to extend the allowlist, which the agent cannot edit itself."
