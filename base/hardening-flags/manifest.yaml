id: hardening-flags
name: "Hardening Flags"
version: "0.1.0"
description: >
  Blocks added settings that weaken compiler, linker, Rust or kernel hardening, in CMake, Make, meson, configure.ac,
  Cargo, build.rs, Go release scripts, Dockerfiles and kernel config: no stack protector, FORTIFY_SOURCE off, non-PIE,
  execstack, norelro, CET off, kernel KASLR/RWX off. Asks on Rust release overflow-checks off, /dev/mem. Misses flags
  set by environment, generated files, toolchain defaults. Runs: commit, agent write, turn's end, CI. Waiver:
  'pragma: allowlist hardening-flag'.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      A build or kernel setting that weakens a hardening default was added (stack protector, FORTIFY_SOURCE,
      PIE, RELRO, non-executable stack, CET, kernel KASLR or RWX). Keep the default or enable the protection. A person may
      waive a reviewed setting with 'pragma: allowlist hardening-flag' in a comment on the same line and commit from
      their own shell; in the agent a waiver counts only for a line already committed in HEAD, so an agent asks the
      person rather than writing the pragma itself.
    params:
      script: hardening-flags-gate.py

compliance:
  owasp_asi:
  - control: ASI05
    coverage: partial
    note: "refuses the added weakening flags a diff can show in the scoped build and kernel config files; flags set by environment, generated build files and toolchain defaults are not seen"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP33, record 12 T9). A script gate over the lines a change adds in CMakeLists.txt and *.cmake, Makefile, GNUmakefile, *.mk, meson.build, configure.ac, Cargo.toml, .cargo/config(.toml), build.rs, *.sh, Dockerfile and Containerfile, .goreleaser.y(a)ml and kernel config (defconfig, *_defconfig, *.config). The judged settings are a curated data table, data/flags.json (EP12): block entries are `-fno-stack-protector`, `-U_FORTIFY_SOURCE` (unless the same line defines it again as 1 to 3), `-D_FORTIFY_SOURCE=0`, `-no-pie`, `-fno-pie`, meson `pie: false` and `b_pie=false`, `-z execstack`, `-z norelro` (also `-Wl,`, `-Xlinker` and quoted or split argument forms), `-fcf-protection=none`, `-mno-shstk`, CMake POSITION_INDEPENDENT_CODE off, Rust `-C relocation-model=static` and `-C link-arg=-z -C link-arg=execstack|norelro`, and kernel `# CONFIG_X is not set` or `CONFIG_X=n` for STACKPROTECTOR, STRICT_KERNEL_RWX, RANDOMIZE_BASE, HARDENED_USERCOPY and FORTIFY_SOURCE; ask entries are Rust overflow-checks off in the release profile (table, dotted key, inline table, CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS, `-C overflow-checks=off`), CONFIG_DEVMEM=y and CONFIG_STRICT_DEVMEM off. Go and CGO flags are the C entries read in Makefiles, scripts, Dockerfiles and GoReleaser files (`-extldflags=-no-pie`, `CGO_CFLAGS`, `CGO_LDFLAGS`). Not findings: panic abort, optimisation levels, debug profiles, `-fstack-protector*`. Comments are blanked per file type before matching (Make joins lines first, so a comment ending in a backslash runs on; CMake bracket comments; Rust nested block comments), backslash continuations are joined both as Make and as a shell reads them, CMake, meson, TOML and Rust commands are joined while a bracket is open, and kernel config is case-sensitive. Only additions are judged: the engine compares each file's findings with HEAD by entry. A waiver is `pragma: allowlist hardening-flag` inside a comment on the setting's own line, honoured at commit and CI for a person and, in the agent (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT, agent_commit_env), only for a setting already in HEAD. Ship it with rollout `observe` (D15) before `enforce`."
  - "Limits (not caught): flags set through the environment at build time (CFLAGS, RUSTFLAGS, CGO_CFLAGS in a CI step or an export outside the scoped files), generated build files, CMakePresets.json and toolchain files not named above, `#cgo` lines and other flags inside Go and C sources, Bazel, Gradle, Xcode and Meson cross files, `-fno-pic`, `-fno-stack-clash-protection`, `-Wl,-z,lazy`, `-C relro-level`, `-Wl,-z,noexecstack` or `-fstack-protector` being removed (NP31 guard-deletion judges removals), kernel STACKPROTECTOR_STRONG and other hardening switches not in the table, flags assembled from variables (`$(HARDEN_OFF)`, `${X}`), a flag split across a CMake or Make quoting boundary, an option and its value separated by a build-system call (`.arg(\"-z\").arg(\"execstack\")`), shell `$'...'` quoting, and a flag inside a heredoc or string that a script writes out. A person's waiver in a Make `define` block or a continuation is read only on the setting's own line. A change that adds a block entry beside an old ask entry in the same file asks the engine for a block (one exit code per run). Known false positives, waivable: a flag named inside a string or a removal (`filter-out`, `list(REMOVE_ITEM)`, `string(REPLACE)`, `has_argument`, `AX_CHECK_COMPILE_FLAG`, `grep`), `-U_FORTIFY_SOURCE` and `-D_FORTIFY_SOURCE=2` on separate lines, `-C relocation-model=static` for musl or no_std targets, any `*.config` file with a kernel-looking line. More misses: meson `'-fno-stack-' + 'protector'`, meson `pie: false` inside a variable, `.pic(false)` and `.env(...)` calls in build.rs, a quoted key `release` outside the cases listed, custom Cargo profiles that inherit release, `Makefile.linux`, `*.in` templates, `configure.in`, `Kbuild`, `debian/rules`, extension-less scripts and upper-case file names. The table must keep its core rows (stack protector, FORTIFY_SOURCE, PIE, execstack, RELRO, kernel stack protector and KASLR) or the gate refuses it; other rows can be edited without notice to this check. Friction, not a security boundary."
