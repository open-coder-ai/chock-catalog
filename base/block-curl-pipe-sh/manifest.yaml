id: block-curl-pipe-sh
name: "Block Curl-Pipe-Shell"
version: "0.0.6"
description: >
  Best-effort guard: refuses a download piped into a shell or interpreter (curl, wget, lynx,
  aria2c, iwr/irm into sh/bash/zsh/dash/ksh/fish/python/perl/ruby/node; bare, path-qualified or
  quoted; in a subshell or behind sudo/env/xargs/nohup/timeout), bash -c "$(curl ...)", bash
  <(curl ...), `| iex`. Probed misses: fetch inside a quoted command (bash -c "...", ssh host
  "..."), eval "$(curl ...)", source <(curl ...), pipe into php/pwsh/deno/busybox/su -c/$SHELL,
  download then run. Friction only.
artifact: rule
enforcement: advise
compliance:
  owasp_asi:
  - ASI02
rule:
  text: |
    block(remote_exec): fetch(curl|wget|iwr|irm) piped/substituted into interpreter(sh|bash|python|perl|node|iex)
    allow: download_to_file, fetch|non_interpreter(jq|tar); prefer: curl -o file; read; run
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-08-26T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.6
  date: '2026-10-02'
  changes:
  - "Disclosure, no behaviour change: the description names the bypasses the guard was probed to allow -- a fetch inside a quoted command (bash -c, sh -c, ssh, docker exec), eval of a command substitution, source or dot of a process substitution, a pipe into php, pwsh, deno, busybox, su -c or a variable-named shell, and download-then-run -- in place of the generic 'aliases, variables, obfuscation'. tests/policies/test_stated_limits.py fails if the guard starts catching one (so the text is updated) or the text stops naming one. The closing fixes are HP03."
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Description only, within the 500-char budget: lists the fetchers (curl, wget, lynx, aria2c, iwr/irm) and interpreters (sh, bash, zsh, dash, ksh, fish, python, perl, ruby, node) the guard matches, the wrappers it sees through, and the allowed forms. Guard unchanged."
- version: 0.0.4
  date: '2026-09-30'
  changes:
  - "Metadata: source_repo points at chock-catalog, where this policy lives, not at chock."
- version: 0.0.3
  date: '2026-09-24'
  changes:
  - "Coverage: a direct-invocation test (test_guard_direct.py) now exercises the
    CHOCK_RAW_COMMAND-unset raw=\"$*\" fallback -- the path an older vendored adapter takes,
    handing the guard only argv -- and proves curl ... | sh is still caught by the
    argv-reconstructed command text. No eval case can drive this branch: chock's own replay
    always sets CHOCK_RAW_COMMAND. Guard unchanged."
- version: 0.0.2
  date: '2026-09-21'
  changes:
  - "Bypass fix (deep review): a quoted interpreter name after the pipe (curl ... | \"sh\",
    curl ... | 'bash') no longer dodges the match -- the interpreter still runs either way,
    only its argv spelling changed. xargs, nohup, timeout, nice, stdbuf, ionice and setsid
    join sudo/exec/command/env as recognized transparent wrappers (curl ... | xargs sh,
    curl ... | xargs -I{} sh -c '{}', curl ... | nohup sh, curl ... | timeout 5 sh all now
    refused); xargs's replace-string flag and timeout's bare duration no longer break the
    match. Seven eval cases added (tc-028..tc-034), one of them negative (xargs wrapping a
    non-interpreter tool stays allowed)."
- version: 0.0.1
  date: '2026-08-26'
  changes:
  - "Initial public baseline: block a network fetch wired directly into a shell or script interpreter -- curl|sh, wget|bash, curl|python, path-qualified (curl|/bin/sh), subshell groups (curl|(sh)), sudo/exec/command/env wrappers, bash -c \"$(curl ...)\", bash <(curl ...), iwr|iex; allow download-to-file and pipes into non-interpreter tools (jq, tar, grep)."
