id: block-fetch-exec-in-files
name: "Flag Fetch-Exec in Files"
version: "0.0.2"
description: >
  Warns (observe rollout) when a line added to a script, Dockerfile, Makefile, CI workflow or
  package.json wires a download into a code runner: curl/wget/aria2c/lynx/iwr/irm piped into a shell,
  python/perl/ruby/node/php/lua on stdin, pwsh or iex; bash -c, eval, source or a here-string of a
  $(...) or <(...) download; Dockerfile ADD of a URL without --checksum. One line at a time:
  continuation lines, variables, unicode-escaped JSON, split or quoted command names, a download
  saved to a file and run on a later step, and interpreters or fetchers outside the lists are
  missed. Never refuses. Friction only.
artifact: rule
enforcement: advise
mandatory: false
effects:
- read_only
approval:
  required: false
applies_to:
  # Files that run as build or install steps: scripts, container builds, task runners, CI, npm
  # scripts. Without this bound the gate would judge every file -- docs that quote the pattern too.
  paths:
  - "Dockerfile*"
  - "*/Dockerfile*"
  - "dockerfile*"
  - "*/dockerfile*"
  - "*.Dockerfile"
  - "*.dockerfile"
  - "Containerfile*"
  - "*/Containerfile*"
  - "containerfile*"
  - "*/containerfile*"
  - "Makefile"
  - "*/Makefile"
  - "makefile"
  - "*/makefile"
  - "GNUmakefile"
  - "*/GNUmakefile"
  - "*.mk"
  - "justfile"
  - "*/justfile"
  - "Justfile"
  - "*/Justfile"
  - "Taskfile.yml"
  - "Taskfile.yaml"
  - "*/Taskfile.yml"
  - "*/Taskfile.yaml"
  - "Taskfile.dist.yml"
  - "Taskfile.dist.yaml"
  - "*/Taskfile.dist.yml"
  - "*/Taskfile.dist.yaml"
  - ".justfile"
  - "*/.justfile"
  - "*.sh"
  - "*.bash"
  - "*.zsh"
  - "*.ksh"
  - "*.bat"
  - "*.cmd"
  - "*.ps1"
  - "*.psm1"
  - ".envrc"
  - "*/.envrc"
  - "Vagrantfile"
  - "*/Vagrantfile"
  - "Procfile"
  - "*/Procfile"
  - ".github/workflows/*"
  - "*/.github/workflows/*"
  - ".github/actions/*"
  - "*/.github/actions/*"
  - ".travis.yml"
  - ".drone.yml"
  - ".buildkite/*"
  - ".gitlab/*"
  - ".gitlab-ci.yml"
  - "*/.gitlab-ci.yml"
  - "Jenkinsfile*"
  - "*/Jenkinsfile*"
  - ".circleci/*"
  - "azure-pipelines*.yml"
  - "*/azure-pipelines*.yml"
  - "azure-pipelines*.yaml"
  - "*/azure-pipelines*.yaml"
  - ".azure-pipelines/*"
  - "bitbucket-pipelines.yml"
  - "*/bitbucket-pipelines.yml"
  - "cloudbuild.yml"
  - "cloudbuild.yaml"
  - "*/cloudbuild.yml"
  - "*/cloudbuild.yaml"
  - "package.json"
  - "*/package.json"

rule:
  text: |
    flag(fetch_exec_in_file): added line wires a downloader (curl, wget, iwr, irm) into a shell or interpreter by pipe, $(..), <(..) or here-string; Dockerfile ADD <url> without --checksum
    prefer: download to a file, verify (sha256sum -c, gpg --verify, ADD --checksum=sha256:...), then run; waiver: same-line pragma, person only

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: warn
    message: >
      A line added to a build, CI or install file wires a network download straight into a shell
      or interpreter (or ADDs a URL without --checksum), so whoever controls that URL controls what
      runs. Download to a file, verify it (sha256sum -c against a pinned checksum, gpg --verify, or
      ADD --checksum=sha256:...), then run it as a separate step. This policy only warns while it is
      measured. Waiver: 'pragma: allowlist fetch-exec' on the same line. A person's commit honours it;
      in the agent only a line already in HEAD counts. An agent asks a person; it never writes the pragma.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+fetch-exec'
      # Bracketed first letters ([c]url, [i]wr) keep the pattern from matching its own text here and
      # in the compiled gate.json. One line at a time: a fetcher and a consumer joined by a pipe with
      # no ; && || between, a runner (bash -c, eval, source, .) fed by $(...) <(...) or a here-string
      # of a fetch, PowerShell iex of a download, or Dockerfile ADD of a URL with no --checksum. Comment
      # lines and echo/printf lines are skipped.
      content_pattern: |-
        ^\s*(?i:add)\s+(?:--(?!checksum)[\w-]+(?:=\S+)?\s+)*(?:\[\s*)?["']?https?://|^(?!\s*(?:-\s+)?[@+-]*(?:echo|printf|Write-Host)\b(?:[^;&|\n"']|"[^"\n]*"|'[^'\n]*')*$)(?:[^#\n]|(?<=\S)#)*?(?:(?:(?<![\w.-])(?:[c]url|[w]get2?|[a]ria2c|[l]ynx|(?i:[i]wr|[i]rm|[i]nvoke-webrequest|[i]nvoke-restmethod|[d]ownloadstring))|(?i:\.[d]ownloadstring))(?![\w-])(?:[^;&|\n#]|(?<!\s)#|&(?![&>])|\|(?!\|))*?\|&?\s*[({]?\s*(?:(?:[\w./-]*/)?(?:sudo|doas|env|exec|command|nohup|nice|timeout|stdbuf|xargs)(?:\s+(?:-\S+(?:\s+\w+(?=\s+\S))?|\w+=\S*|[0-9][\w.]*))*\s+)*["']?(?:[\w./-]*/)?(?:(?:ba|z|da|k|a|c|tc|mk)?sh|fish|busybox\s+sh|(?:python[0-9.]*|perl|ruby|node|php|lua)(?=\s*(?:$|-(?:\s|$)|[;&|)'"`])|(?:\s+-[A-Za-z]+)+(?:\s+-)?\s*(?:$|[;&|)]))|(?:source|\.)\s+/dev/(?:stdin|fd/0)|(?i:iex|invoke-expression|pwsh|powershell))(?![\w.-])|(?<![\w.-])(?:eval|source|\.|(?:ba|z|da|k|a|tc|mk)?sh|fish|python[0-9.]*|perl|ruby|node|php|lua)(?:\s+-\S+)*\s+(?:/dev/stdin\s+)?(?:<<<\s*|<\s*)?["']?(?:\$\(|<\(|`)\s*(?:(?:sudo|doas|command|env|exec)\s+(?:-\S+\s+)*)*(?:[\w./-]*/)?(?:[c]url|[w]get2?|[a]ria2c|[l]ynx|(?i:[i]wr|[i]rm|[i]nvoke-webrequest|[i]nvoke-restmethod|[d]ownloadstring))(?![\w-])|(?i:(?<![\w-])(?:iex|invoke-expression)[\s"'(]*(?:(?:&\s*\{|\$)[\s"'(]*)*(?:[i]rm|[i]wr|[c]url|[i]nvoke-webrequest|[i]nvoke-restmethod|new-object\s+(?:system\.)?net\.webclient)(?![\w-])|\[scriptblock\]::create\(\s*\(*\s*(?:[i]rm|[i]wr)))

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "flags remote-code installs written into build, CI and install files; warns only (observe) and reads one line at a time"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.2
  date: '2026-10-02'
  changes:
  - "Adversarial pass. Fixed: an echo/printf/Write-Host line was skipped wholesale, so an echo followed by && and a piped download went unseen (now skipped only when the line is the echo and nothing chains after it; make's @echo and -echo included); a '#' inside a word before the downloader hid the line; the here-string/substitution runners now see '/dev/stdin <<<', 'command curl', 'env curl' and '/usr/bin/curl'; the pipe form sees a a DownloadString call piped to iex, a piped 'sudo -u root sh', '/usr/bin/env bash', 'source /dev/stdin', and python with flags before stdin ('python3 -u -', 'python3 -I'); PowerShell iex of '$(irm ...)', '& { $(irm ...) }' and curl aliases; Dockerfile exec-form 'ADD [\"URL\", \"/dst\"]'. iex matching is now linear on long runs of parentheses and spaces. Paths: lowercase dockerfile/containerfile/makefile, Taskfile.dist, .justfile, *.ksh/*.bat/*.cmd, nested .github, .travis.yml, .drone.yml, .buildkite, .gitlab, azure-pipelines*.yaml, bitbucket-pipelines.yml in subdirectories. Known limits named in the description: continuation lines, variables ($(CURL), $SHELL, x=$(curl ..); eval $x), unicode-escaped JSON, split or quoted command names (c\"\"url), download-to-file then run, fetchers and interpreters outside the lists (http, fetch, nc, deno, Rscript, tclsh, su -c, ssh, docker run -i), quoted echo arguments containing $(download piped to sh), extensionless scripts, and a line with thousands of repeated downloader words takes seconds to judge."
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap HP03 companion): a content_regex gate at commit and agent write over the build, CI and install files in applies_to.paths. Ships with action: warn -- the observe stage of rollout decision D15 -- so it reports and never refuses; promotion to block is a separate change once its false-positive rate on real repositories is measured. Waiver 'pragma: allowlist fetch-exec' on the same line (person; HEAD-only for agents)."
