id: agent-devenv-autoexec
name: "Agent Devenv Autoexec"
version: "0.0.1"
description: >
  Warns only (observe): flags files that make a dev tool run code on open, clone or shell entry -- agent
  hooks, helpers, env/BASE_URL overrides, auto-approve; VS Code folderOpen tasks, trust off, repo
  executables; devcontainer initializeCommand; .envrc, mise, husky, lefthook, pre-commit; gitconfig exec
  keys, gitattributes drivers, unsafe .gitmodules. Commit, agent write, turn's end; additions only;
  unreadable configs refused. Friction: misses interpreted code and unlisted files.
artifact: rule
enforcement: advise
mandatory: false
rule:
  text: |
    devenv_autoexec(agent hooks|helpers|env overrides|auto-approve|folderOpen tasks|trust off|devcontainer lifecycle|.envrc|mise|git hooks|gitconfig exec|gitattributes drivers|.gitmodules): changed by people only
    never(add): hook|task|helper|env override|auto-approval; observe: warns at commit+tool_use, enforce later
hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: warn
    message: >
      A file that a developer tool runs on its own (an agent hook or helper, an environment override, an
      auto-approval, a task that runs on folder open, a dev container command, a shell-entry or git hook
      file, a git config that runs a program) was added or changed, or such a config cannot be read.
      Remove it, or ask a person to review it. A reviewed line may carry 'chock: allow <rule-id>' where
      the file has comments; a person adds it in their own commit. In the agent a waiver counts only for a
      line already committed in HEAD, so an agent asks the person rather than writing it.
    params:
      script: agent-devenv-autoexec-gate.py
effects:
- read_only
approval:
  required: false

compliance:
  owasp_asi:
  - control: ASI05
    coverage: partial
    note: "warns (observe rollout) when a change adds a file or setting a developer tool executes without a prompt -- hooks, tasks, helpers, lifecycle commands, shell-entry files, git exec keys; interpreted code (config.js, conftest.py, build scripts) and package lifecycle scripts are out of scope"
  mitre_atlas:
  - control: AML.T0081
    coverage: partial
    note: "flags a change to agent configuration that adds hooks, helpers, environment overrides or auto-approval; protect-agent-config refuses the agent's own writes to many of the same paths at tool use"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial release (roadmap NP03, Wave 3). A script gate at commit, at the agent's file writes and at the turn's end, shipped at action warn: the observe rollout of plan decision D15, so it never refuses until a later PR moves it to block after its false-positive rate is measured. The script still exits 1 for a block-tier finding and 3 for an ask-tier one, so promotion changes only the declared action. It judges only what a change adds: each finding is keyed by rule, place (file and key path) and normalized value, and the engine runs it again on the baseline text. Paths are matched by segment and case-insensitively. JSONC is read with chock_scan.jsonc and YAML with chock_scan.yamlpath; a config either cannot read with certainty (bad syntax, duplicate keys, YAML aliases or merge keys, malformed git config) is reported as dev-unparseable, keyed by a digest, never passed."
  - "Rules (pack/rule, tier): agent-config/dev-claude-hooks (block): hook commands and http hooks in .claude/settings*.json, Cursor/Codex/Windsurf/Devin/Copilot/Grok/Kiro hook files and Gemini settings; apiKeyHelper, awsAuthRefresh, awsCredentialExport, otelHeadersHelper, gcpAuthRefresh, statusLine/subagentStatusLine/fileSuggestion commands; Gemini tool discovery/call commands; Codex notify; Cursor background-agent install/start/terminals; inline shell and front-matter hooks in .claude commands, agents and skills; aider test/lint commands (ask). dev-claude-env-override (block): env names that redirect endpoint, credentials, trust or programs (*_BASE_URL, *_ENDPOINT, proxies, NODE_OPTIONS, LD_PRELOAD, PATH, CA bundles, GIT_SSH_COMMAND, *_API_KEY and more) in settings env, .gemini/.env and Codex shell_environment_policy.set; Codex and aider model endpoint overrides. dev-mcp-autoapprove (block): enableAllProjectMcpServers, enabledMcpjsonServers entries, disableAllHooks, permission-prompt skips, unscoped tool grants in command/agent/skill front matter and Cursor cli.json, Gemini autoAccept/MCP trust/yolo approval/folder trust off, Codex approval_policy never and danger-full-access, MCP autoApprove/alwaysAllow entries, aider yes-always, opencode bash or outside-directory allow. dev-cross-reference (block): a command that runs a file the same change writes (or, at tool use, an untracked file), or a script kept in another agent's folder. dev-agent-spawn (block): an agent CLI started with its safety checks off in a shell, workflow, build or config file. vscode/dev-vscode-folderopen: tasks with runOn folderOpen (block), any task command that fetches and runs or is encoded (block), hidden task output and launch preLaunchTask/postDebugTask (ask). dev-vscode-autoapprove: auto-approve settings (block; a narrow terminal command rule asks). dev-vscode-trust-off (block): workspace trust off, startup prompt or banner never, untrusted files open, task.allowAutomaticTasks on. dev-exec-path-settings: path/executable/command/interpreter/tsdk settings and terminal profiles pointing into the repository (block; under .venv, node_modules and similar tool folders, ask), terminal env overrides (block), JetBrains run configuration scripts and before-launch tasks (ask). dev-vscode-extension-recs (ask): each recommended extension. These apply inside *.code-workspace and devcontainer customizations too. devcontainer/dev-devcontainer-init: initializeCommand (block), lifecycle commands (ask; reaching the network, block), privileged, host namespaces, wide capabilities, unconfined security options, docker.sock or home-credential mounts (block), root user and unpinned features (ask). shell-toolchain/dev-shell-toolchain: .envrc lines, mise tasks, hooks, env directives and trust settings, local-path tool versions, justfile load-time backticks, Taskfile sh vars, Vagrantfile/Brewfile shell-outs, Gitpod tasks and .replit run/onBoot (ask; reaching the network, block), Makefile parse-time $(shell) reaching the network, Taskfile remote includes, Procfile fetch-and-run (block). dev-hook-launchers: .husky and .githooks lines (ask), lefthook commands (ask; on post-checkout/merge/rewrite, block), lefthook remotes, package.json scripts pointing core.hooksPath outside .husky or .githooks, http pre-commit repos (block), pre-commit repos pinned by tag and local system/script hooks (ask). git/dev-gitconfig-exec (block): fsmonitor (not a boolean), sshCommand, pager, editor, hooksPath, askPass, credential helpers, alias !, diff/filter/merge drivers, include paths, url insteadOf, extraHeader, safe.directory, sslVerify/fsckObjects off, protocol allow always. dev-gitattributes-filter (block): filter, diff or merge drivers other than lfs and git's built-in ones. dev-gitmodules-untrusted (block): ext::, http, git://, file: or option-like URLs, paths or names with .. or leading -/, control characters, a carriage return inside a line, paths equal but for case, update !cmd. dev-symlink-escape (block): a written symlink that leaves the repository, points into .git, or stands where a config is read. Any command a surface runs that fetches and runs code, or is encoded, blocks whatever its tier."
  - "Adversarial review, fixed before release: a folder-open task's key carries a digest of the whole task and of the file's shared options, and tasks it depends on (dependsOn, transitively) are judged as folder-open; a cross-reference key carries a digest of the referenced script, so editing it is new; .gitmodules and gitconfig raw blobs are read from the index or HEAD at commit, push and CI, where the engine's text has lost a lone carriage return; devcontainer runArgs are read as flag and value (--volume=, --mount=, -v/, --privileged=true, CAP_ prefixes, --network host in one item) and workspaceMount is judged; lefthook .json/.toml, mise conf.d, mise.<env>.toml and *.local.toml, and nested .devcontainer folders are read; mise [tools] local paths and source refs, [env] overrides, [plugins] and {{exec(...)}} templates are judged; agent spawns through npx @scope/name and path prefixes are caught; every pre-commit entry, Makefile `VAR != command` and justfile shell() are checked for fetch-and-run; CLAUDE_CODE_SHELL(_PREFIX), CLAUDE_ENV_FILE and *_COMMAND/_HELPER/_EXECUTABLE env names count as overrides; a hook's cwd, env, shell and args are in its key and its env is judged; VS Code program settings match by suffix (cmakePath, nodeExecutable, jestCommandLine, runtime) and everything under alternateTools, while folder and data paths (rootPath, *.txt, *.json) are not programs; the object form of terminal auto-approve and catch-all patterns (/^/) block; claudeCode skip-permission settings and chat.agent.terminal.allowList count; front-matter grants like Write(**) or Edit(*) are unscoped; a waiver counts only inside a comment, and in the agent only when both it and the waived line are already committed; a diff driver other than git's built-ins (plus astextplain and jupyternotebook) asks rather than blocks; gitconfig trailer commands, gpg defaultKeyCommand, mergetool/difftool paths, alternateRefsCommand and submodule update are judged; package.json simple-git-hooks commands are judged; symlinks on disk are judged even when git cannot answer; a command over 8192 characters is refused rather than searched (bounded regex time). Re-review, fixed: a raw blob git cannot read is refused (dev-unparseable), not read as clean; an untracked script a hook runs at tool use is keyed by its content; a setting whose name holds an approval word is still judged as a program path when it is not an approval; data-file values exempt only *Path settings. Round 2, fixed: the path scan for cross-references is a tokenizer, linear in the command (a regex there took exponential time on repeated `${a}/`); agent spawns are read statement by statement, with quoted arguments kept but their separators dropped and backslash continuations joined, and Codex `-c approval_policy=never` counts; a waiver inside a quoted value never counts, and `;` marks a comment only at the start of a line (and waivers on lines after the first are now found); `${localEnv:...}` sources in -v/--volume, the whole-home `${localEnv:HOME}${localEnv:USERPROFILE}` mount, quoted sources, `/var`, a user home, a drive root, `--volumes-from` and `--privileged=1` count; test-runner paths (pytestPath) are programs; any terminal auto-approve pattern that matches an arbitrary command blocks; `*_HOST` env names other than DOCKER_HOST are no longer overrides. Round 3, fixed: agent spawns are read by a one-pass shell reader (quotes span lines, redirects such as 2>&1 and &> do not split a statement, a backslash-escaped name and a //usr/bin path count, every agent CLI in a statement is checked, tabs separate flags, --allow-dangerously-skip-permissions counts); waiver lookup blanks strings in one pass and treats an unclosed quote (a multi-line string) as running to the end of the line; doubled and back slashes in cross-referenced paths are normalized."
  - "Coordination with protect-agent-config: that policy refuses the agent's own writes to .claude/settings, MCP and hook client configs, .gemini/settings.json, .codex/config.toml and .git/hooks at tool use, by path, whatever the content; this gate judges content, also at commit (a person's or an agent's), and covers files that policy does not (.vscode/*, .devcontainer, .envrc, mise, husky, lefthook, pre-commit, git files). Both refuse the same agent write, so their verdicts never disagree; a person's commit is judged only here. The launcher `chock sync` writes into agent hook files is recognised whole and not reported: it runs only files protect-agent-config guards. Left to other policies: permission allow-list wildcards and the bypass default mode (block-wildcard-agent-permissions), MCP servers themselves (verify-mcp-allowlist), package.json install scripts (NP04), hook bypass lines (block-hook-bypass-in-files)."
  - "Limits (not caught): interpreted config and build code (*.config.js, conftest.py, setup.py, Gradle, nx/turbo), notebooks, .zed, .continue, .roo rules, .windsurf rules and instruction files; a value assembled by a tool at run time, a variable in a path (`$DIR/x.sh`) for cross-references, a hook command that is chock's launcher in shape but lives in a repository whose .chock/bin is not protected; Makefile recipes and $(shell) without network words; husky `husky install <dir>`; YAML a loader would read through an alias is refused, not resolved; an apostrophe in prose inside a non-shell file can join lines into one statement for the spawn check (more reports, never fewer); PowerShell backtick and cmd caret continuations; `--settings` with inline JSON; `$(pwd)/x.sh` style paths for cross-references; a dockerComposeFile and the compose files a dev container names (privileged services, socket volumes); VS Code per-OS program keys (terminal.external.linuxExec, r.rterm.linux), code-runner.executorMap and go.goroot; a *Path value ending in a data extension (.txt, .json) is exempt even when the file is a program; a script edited without the config that runs it (only a change that writes both is new); .lefthook/ script folders and committed .husky/_ files; a waiver line is matched by text, and a finding's line is the first mention of its key; an agent that sets none of CHOCK_AGENT_COMMIT, CLAUDECODE or AI_AGENT reads as a person at commit; the selection sidecar `.chock/devenv.json` from the roadmap is deferred until the engine's baseline check knows it, so there is no per-pack opt-out yet (the gate only warns). A line number is the first line naming the key, which can point at an earlier mention. Friction, not a security boundary."
