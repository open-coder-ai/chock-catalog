id: block-no-verify
name: "Block No-Verify"
version: "0.3.1"
description: >
  Best-effort guard against skipping git hooks: --no-verify on commit, push, merge, am and rebase,
  -n on commit and am (on push -n is --dry-run, allowed), and core.hooksPath set by -c,
  --config-env, `git config` or GIT_CONFIG_*. Read as parsed commands: wrappers are seen, message
  text is not. Also refuses an agent setting a person-only variable (CHOCK_ALLOW*,
  CHOCK_AGENT_COMMIT, CHOCK_DIFF_LIMIT) or hiding CLAUDECODE/AI_AGENT/CHOCK_AGENT_COMMIT; it says
  ask the person. Bypasses: aliases, scripts.
artifact: rule
enforcement: advise
rule:
  text: |
    never(commit|merge|am|rebase|push): --no-verify|-n(commit|am); never(set): core.hooksPath; never(agent_set|unset): CHOCK_ALLOW*|CHOCK_AGENT_COMMIT|CHOCK_DIFF_LIMIT|CLAUDECODE|AI_AGENT
    if(hook_fails|override_needed): fix_issue|ask_person; never(skip_hook)
effects:
- read_only
approval:
  required: false

provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-09-30T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."
- version: 0.0.2
  date: '2026-08-22'
  changes:
  - "Block git -c core.hooksPath=... (case-insensitive, matched only as the -c value): disabling hooks by config is the same act as --no-verify. Bare valueless form deliberately unmatched; git rejects it with rc=128 before any hook runs."
- version: 0.0.3
  date: '2026-08-22'
  changes:
  - "Delivery bump for the Claude-format plugin packages built from this policy: on republish, their PreToolUse command is a single python3 invocation (the proposed interpreter-fallback chain was rejected after review proved it could erase deny verdicts) and their descriptions state the per-client fail posture. Guard logic and this repo's own artifacts are unchanged."
- version: 0.0.4
  date: '2026-08-23'
  changes:
  - "Short -n now reads as --no-verify only on git commit. On git push, -n is --dry-run -- non-mutating and not a hook bypass (pre-push still runs) -- and the guard wrongly refused it (found in external review of the Copilot marketplace submission). --no-verify stays blocked on both commit and push. Also: only the first commit/push token is the subcommand (a ref named 'commit' no longer reclassifies a push), and a cluster starting with a value-taking option (-m/-F) is that option's value, so -mnote is not a bypass. Five eval cases added."
- version: 0.0.5
  date: '2026-08-24'
  changes:
  - "Prefix-match --no-verify (hardening review): git accepts any unambiguous prefix, so `--no-veri` and `--no-verif` skip hooks exactly as `--no-verify`. Matched as a prefix of --no-verify at least 9 chars long -- the floor is `--no-veri`, because `--no-ver` and shorter collide with --no-verbose, which git rejects as ambiguous (nothing to block there). Applies to both commit and push. Three eval cases added (--no-veri block, --no-ver allow at the floor, push --no-verif block)."
- version: 0.0.6
  date: '2026-08-26'
  changes:
  - "Detect the REAL git subcommand (catalog #11): the subcommand is now the first non-option token after git's global options (-c/-C/--git-dir/--work-tree/... consume their value), not merely the first `commit`/`push` token anywhere. `git status -- commit -c core.hooksPath=/tmp` is `status` -- a pathspec named `commit` no longer reclassifies it as a commit and trips the hooksPath/--no-verify checks. Real `git commit`/`git push` (incl. `git -c core.hooksPath=... commit` and `git -C <dir> commit --no-verify`) still block. One negative eval case added."
- version: 0.0.7
  date: '2026-09-24'
  changes:
  - "Eval cases added so every guard statement is exercised: the real-subcommand scan's
    attached `--flag=value` global option and standalone single-dash flag before the
    subcommand (`git --git-dir=... -p commit --no-verify`, refused), and a bare `git
    --version` with no commit/push subcommand at all (allowed). Guard unchanged."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "Ported from bash to Python: implementations/block-no-verify.py replaces the bash script, stdlib only, deterministic, no network. It ships beside the chock_shellparse package (identical in every ported policy; tests pin the copies), which reads the command with a quote-aware lexer instead of scanning text: it splits at unquoted && || ; | & and newlines, drops redirections and comments, keeps heredoc bodies, and looks through bash|sh|zsh -c, pwsh -Command, cmd /c, eval, sudo, doas, env VAR=x, command, exec, nohup, timeout, nice, time, xargs and subshells, so `cd repo && ...` and `bash -c '...'` are judged on the command they run and `echo ...` on none. Unbalanced quotes fall back to a split at separators and whitespace that still sees redirections and reads an unclosed quote as one word; CHOCK_TOOL=powershell|pwsh selects PowerShell reading (backslash paths, cmdlets), and without it the text decides. An unexpected exception exits 2 (a guard fault), never 1 (a block)."
  - "Bypasses closed, each with eval cases: `cd repo && git commit --no-verify`, `bash -c 'git commit --no-verify'`, and the same behind sudo/env/xargs/pwsh -Command; `git config core.hooksPath <path>` in any scope (reading the value with --get, listing, or unsetting it stays allowed); `--config-env=core.hooksPath=VAR`; and the environment forms GIT_CONFIG_COUNT with GIT_CONFIG_KEY_n=core.hooksPath (inline or exported on an earlier line) and GIT_CONFIG_PARAMETERS. A separator inside quotes (`-m ';' --no-verify`) no longer hides the flag."
  - "False block removed: the value of -m/-F/-C/-c/--message and the like is skipped, so `git commit -m \"-n stays in the message\"` is allowed, and `echo git commit --no-verify` is not a commit. The flag rules are otherwise unchanged: --no-verify and its unambiguous prefixes (--no-veri floor) on commit and push, short -n only on commit."
- version: 0.2.0
  date: '2026-09-29'
  changes:
  - "Refuse an agent command that SETS a person-only override, so the engine's CHOCK_ALLOW (answers an ask gate at commit or push) and CHOCK_AGENT_COMMIT (0/false says a person is committing) cannot be defeated from inside the command, nor limit-diff-size's CHOCK_ALLOW_LARGE_DIFF and CHOCK_DIFF_LIMIT. Every spelling is read from the parsed command: an env prefix, env and sudo wrappers, export (also with a trailing note), declare/typeset/readonly/local -x, make NAME=v, set NAME=v and setx/setenv, PowerShell $env:NAME = v (also += and a value holding a slash), Set-Item/New-Item Env:NAME and [Environment]::SetEnvironmentVariable, each also inside bash -c or pwsh -Command. Reading is not setting: echo $CHOCK_ALLOW, grep CHOCK_ALLOW file, printenv and a quoted commit message stay allowed. The refusal names the variable and tells the agent to ask the person to run the command themselves."
  - "-n is --no-verify only where git says so: git commit and git am. `python -m pytest -q -n auto`, git merge -n (--no-stat), git rebase -n and git push -n are not bypasses and stay allowed. --no-verify (and its --no-veri floor) and the core.hooksPath checks now cover merge, am and rebase as well as commit and push, since each runs hooks that flag skips. Twenty-one eval cases and the pytest rows pin both directions."
- version: 0.3.0
  date: '2026-09-29'
  changes:
  - "Refuse an agent command that hides the markers the engine detects an agent by, the same bypass as CHOCK_AGENT_COMMIT=0: `unset` / `unset -v` of CLAUDECODE, AI_AGENT or CHOCK_AGENT_COMMIT; `env -u NAME`, `env -uNAME` and `env --unset[=]NAME`; `env -i` (or `--ignore-environment`, or a lone `-`) in front of a commit, push, merge, am or rebase, since it wipes the whole environment; any assignment to a marker (`CLAUDECODE= git commit`, `AI_AGENT=0 ...`, export, declare, set, `$env:X = $null`); `export -n`; fish `set -e`; PowerShell `Remove-Item`/`Clear-Item Env:NAME` and `[Environment]::SetEnvironmentVariable`; each also inside bash -c or pwsh -Command. Reading stays allowed (`echo $CLAUDECODE`, `printenv AI_AGENT`, `env | grep CLAUDECODE`), as do `env -i` in front of a non-git program and text inside a quoted message. CLAUDECODE and AI_AGENT now count as person-only variables for every spelling the override guard reads."
  - "eval keeps its exports: chock_shellparse now returns the environment an `eval` script leaves behind, so `eval 'export CHOCK_ALLOW=x'; git commit` is refused (a `bash -c` script is a child shell and still leaks nothing). The lexer change is copied byte for byte into every policy that ships it. Nineteen eval cases (suite.yaml folds each case onto two lines to stay under the line budget) and pytest rows pin both directions."
- version: 0.3.1
  date: '2026-09-30'
  changes:
  - "Wording only, verdicts unchanged: the description now says the guard also covers merge, am and rebase and -n on am (and commit), and the rule text states the person-only-variable refusal. The override message said the variable 'decides whether a gate sees an agent's commit', which is wrong for CHOCK_DIFF_LIMIT and CHOCK_ALLOW_LARGE_DIFF; it now calls each a person-only setting (who is committing, an ask answer, the diff limit). The description fits the 500-char budget. source_repo points at chock-catalog."
