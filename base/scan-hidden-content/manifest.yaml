id: scan-hidden-content
name: "Scan Hidden Content"
version: "0.0.2"
description: >
  Warns (observe) when a change adds text a reader cannot see, or a URL that carries data out, to
  Markdown, HTML, SVG, XML, Word, agent instruction files, docs and templates: instruction-like or long
  comments, CSS-hidden, white or 1pt text, hidden Word runs, URLs with secret words, long queries,
  placeholders or encoded parts, remote embeds, camo runs, HTML data URIs. Runs: commit, agent write,
  turn's end. Waiver: a person's marker comment line above. Friction, not a boundary.
artifact: hook
enforcement: advise
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: warn
    message: >
      This change adds text a reader cannot see (a comment or hidden element that reads as an
      instruction, white or zero-size text) or a URL that can carry data out (a secret word or
      data-shaped part in its query or path, a remote embed, a dictionary of image URLs). Remove the
      hidden text or make it visible, and link only to fixed URLs that carry nothing from the
      repository or the session. A person may keep a reviewed line with a comment line just above it
      that holds only 'chock: allow scan-hidden-content', committed from their own shell; in the agent
      only a waiver already committed in HEAD counts, so an agent asks the person instead.
    params:
      script: scan-hidden-content-gate.py

compliance:
  mitre_atlas:
  - control: AML.T0051
    coverage: partial
    note: "warns on instructions hidden from a human reviewer in committed Markdown, HTML, SVG, XML and Word files; plain-text injection is not judged"
  - control: AML.T0086
    coverage: partial
    note: "warns on image and link URLs shaped to carry data out when rendered; URLs built at run time or fetched are not seen"
  owasp_asi:
  - control: ASI01
    coverage: partial
    note: "warns on the hidden-comment and hidden-styling carriers of goal hijack in committed files; semantic injection stays with injection-defense"
  owasp_llm_2025:
  - control: LLM01
    coverage: partial
    note: "Prompt Injection: hidden comments, hidden styling and hidden Word runs in committed files only"
  - control: LLM02
    coverage: partial
    note: "Sensitive Information Disclosure: Markdown and HTML URLs whose query or path is shaped to carry data, in committed files only"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.2
  date: '2026-10-07'
  changes:
  - "The shared host reader (chock_scan) now refuses a name holding a letter whose lowercase Unicode 3.2 lacks (Georgian U+10A0-10C5, Cherokee U+13A0-13F4, U+04C0, U+2132, U+2183) on every Python. From CPython 3.12.15 (gh-155292, CVE-2026-17084) the stdlib IDNA2003 codec keeps those letters while the URL Standard lowercases them, so the two read two different hosts; older interpreters lowercased them and accepted the name. Such a name now gets the verdict for a host that cannot be read, the same on every interpreter."
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP01, class K07). A script gate that ships in observe (D15): every finding warns (exit 4, action warn), and each finding's message names the verdict it will have once a separate PR promotes it: block for a Markdown image or HTML/CSS source whose query names a secret word and for a URL dictionary, ask for the rest. The script prints a findings document and the engine re-runs it on the baseline, so only what a change adds is judged. Keys never hold a line number or a full URL: rule, host and path shape (segments that are not plain words become *, query names sorted); a hash of a dictionary member's URL; a hash of the whole normalized hidden text (comments, hidden elements, Word runs); a hash of the line for KaTeX and data URIs; a raw hash of the whole file when it is too large."
  - "Scope: *.md, *.mdx, *.markdown, *.mdc, *.html, *.htm, *.xhtml, *.svg, *.xml and *.docx anywhere; .cursorrules, .windsurfrules, .clinerules, .goosehints, llms.txt and llms-full.txt (read as Markdown); every file under .cursor/rules, .roo/rules, .kiro/steering, .clinerules/ and .github/instructions, prompts, agents, ISSUE_TEMPLATE, PULL_REQUEST_TEMPLATE and DISCUSSION_TEMPLATE; .rst, .txt and .adoc under docs/ or doc/. Not judged: chock's managed .agents/policies/ and .chock/ (protect-agent-config guards them). A text file over 1 MiB is not parsed (the 30-second budget covers the baseline run too): it is reported as too large, with the would-block verdict (padding a file past the cap must not soften what it holds), keyed by its raw text, so every change to it is new; more than 10000 findings in one run collapse to one finding marked new; files are read smallest first, and files not reached within 10 seconds of one run (the engine's 30 seconds cover the baseline run too) are each reported as not judged, marked new, with the would-block verdict, so a slow file can neither cost the commit's other findings nor soften them."
  - "Markdown is read twice: URLs with certain code blanked (code is shown, not fetched), and tags and comments with only the '<' of certain code removed, so code inside a comment or an HTML block still counts. Only code this reader is certain of is blanked, since an error there would hide what a renderer passes through, while reading code as text only reports more: a fence outside any list item or block quote that a later line closes, with no fence-like line left unread before it in the file; an indented code block outside any list item or block quote; a code span whose two backtick runs sit on one paragraph line with no unpaired run earlier in the paragraph, and on a line with a pipe only where it pairs both as GFM table cells and as one line (a renderer without tables). A backslash-escaped '<' is text outside an HTML block and opens a tag inside one; which lines are in a block is not certain, so tags and comments are read both ways and every finding of either counts. Likewise a renderer writes its own tags (</p>, <li>) where a block starts, and raw HTML in a paragraph must close within it, so a bogus comment, declaration or tag left open above ends there; HTML is also read with a '>' opening each such line, and findings of both readings count. Two more readings: one with no '<' that opens a comment, declaration, processing instruction or bogus comment and no raw-text element, and one in which everything that may be code is code (every fence-like region to its closing fence or the end of the file, indented blocks after a blank line, backtick pairs across a paragraph), its '<' and '>' removed as a renderer escapes them. Certain code has its '>' removed too. A last reading writes paragraphs as a renderer does: there only a complete inline tag, comment, processing instruction, declaration or CDATA section passes through raw, and every other '<' and '>' is escaped, with only the lines certainly in an HTML block kept raw (an HTML block in a list item or block quote ends, for this reading, at a line left of its content or outside its quote). A block start also closes an open attribute value (a renderer's own tags carry quotes). End tags follow the HTML standard's rule for special elements: one for a non-special element is ignored while a special element (pre, div, li) is open above its match. An HTML block of types 1-5 runs to its end condition (</pre>, -->, ?>, >, ]]>), types 6-7 to a blank line, and a type 7 tag line cannot interrupt an open paragraph this reader is certain of: one outside any list item and block quote, in no run of lines with a pipe (a GFM table's end is up to the renderer). An HTML block may open after list and block quote markers, and a line inside a type 6-7 block that would open a type 1-5 block keeps the reading in HTML to that block's end, then to a blank line, since the line that opened the type 6-7 block may have been text."
  - "Judged: (a) remote URLs: bare, Markdown inline and reference destinations (entities and CommonMark backslash escapes decoded, a destination on the next line, definitions inside block quotes), HTML attribute URLs (src, srcset, data, action, formaction, poster, background, and href or xlink:href on link, image, use, feImage, base and script), CSS url(), @import and image-set(). A Markdown image (also through a reference an image uses; link text is read in one forward pass where a bare ] closes nothing and brackets inside an inline tag or autolink are skipped, so any open image opener makes the destination an image's, the stricter reading) or an HTML/CSS source whose query names a secret word (token, key, env, ssh, secret, password, credential, apikey, auth, bearer; split on punctuation and camelCase) would block; a plain link with one would ask. A query of 40 or more characters (on an allowlisted host, one value that long), a placeholder ({x}, ${, $VAR, [DATA], <x>, %s) or a hex or mixed-case base64 segment of 32 or more characters would ask; an HTML or CSS source on a host outside the allowlist would ask (a Markdown image is judged by shape, as the roadmap says); a URL the EP11 parser refuses would ask; five or more camo.githubusercontent.com URLs, or five or more one- or two-character names under one path on one host, would block, each URL its own finding so a growing dictionary reports what it gains. One URL is judged once per line however many readings find it. Hosts are normalised with chock_scan (EP11). Allowlisted (only without a query, the roadmap's FP control): shields.io, badgen.net, badge.fury.io, codecov.io, coveralls.io, github.com, gitlab.com, raw, user-images, avatars and private-user-images.githubusercontent.com, Scorecard and Best Practices badges, readthedocs. (b) Comments an HTML parser hides (<!-- -->, <!x>, <?x>, </ x>, CDATA; an unclosed <!-- runs to the end), MDX {/* */} comments and Markdown reference-definition titles, with an imperative (run, execute, exec, send, upload, approve, push, curl, wget, exfiltrate), override wording, a key or env path, or more than 200 characters; lint, TOC, generator and chock marker comments that match a marker exactly are not. Matching drops format characters (HP15 reports those), decodes entities and applies NFKC. (c) Elements whose text is hidden: the hidden attribute, display none, visibility or content-visibility hidden, opacity 0, font size 0 or 1px/1pt, scale near 0, off-screen offsets or translation, clipping, zero height or width with overflow hidden, text colour equal to the background behind it or transparent (the 148 CSS named colours, hex, rgb() in numbers or percent, hsl(); the background inherited from ancestors, bgcolor included, white on an HTML or Markdown page when none is set, inline SVG included), aria-hidden over 100 or more characters, SVG fill none or fill-opacity 0, SVG text offset 999 or more off canvas, text inside SVG metadata, defs, symbol, clipPath or mask, -webkit-text-fill-color, offsets of 9999px or more, font color, a class or id a style rule hides, hidden rules in style elements; KaTeX white or transparent colour and phantom boxes. Read as browsers read them: CSS escapes decoded, the last valid declaration wins (an invalid later one is dropped), the first of duplicate attributes wins, '/>' on a non-void HTML element is ignored, an end tag that would close past an open table cell, select, object, marquee, applet or a foreign-content integration point is ignored, and a table part with no table open is dropped. An animation never exempts a block: whether and for how long a keyframe shows the text is not settled by reading it. (d) Word documents: runs with vanish, specVanish, webHidden, white colour or a size of 1 point or less, in any member of the zip that reads as XML whatever its name and however much whitespace precedes its first tag (Word finds parts through relationships), parsed as a stream by namespace (any prefix, transitional or strict), deleted text included; HTML data URIs anywhere in scope, decoded destinations included."
  - "Word documents are read from git (the index at commit, HEAD at push and CI) because the write tools carry text, not a zip; they are not judged at tool use, and at push and CI every hidden run in a changed document counts as new (the base revision is not in the gate's input). A document that is not a bounded zip (encrypted, a member past 32 MB, past 64 MB unpacked in all, over 4096 members, over 1000000 XML elements) or holds a part with a DTD, malformed XML or UTF-16 XML is reported as unreadable, with the would-block verdict."
  - "Waiver: a line holding nothing but the marker as a comment (<!-- chock: allow scan-hidden-content -->, its MDX or [//]: # form, or # in YAML) just above the finding, honoured at a person's commit, push and CI. A marker on the finding's own line, inside the hidden text or the URL is part of what is judged, never a waiver, and CI does not honour a waiver on a would-block finding (a pull request's author may be anyone); CI still honours one on an ask-tier finding, as the engine honours waivers in a pull request's range, so a reviewer reads any waiver a pull request adds."
  - "Adversarial review before release (a separate agent, real scripts, CommonMark and HTML5 parsers as references), fixed: code blanking erased comments that hold code or sit in an HTML block; bogus comments were not read; '/>' and table-scope end tags let text escape a hidden element; an invalid later CSS declaration overrode a hiding one; colours other than hex, integer rgb() and three names were not compared, and bgcolor and SVG fill were not read; backslash-escaped and next-line Markdown destinations and decoded data URIs were missed; keys collided (a constant dictionary key, hidden text hashed only to 2000 characters, style rules keyed by selector with their targets never judged, URLs deduplicated per host and line, the too-large key normalized, KaTeX keyed by 120 characters); a closing-parenthesis run, a one-line run of comments and a long style sheet were quadratic; a huge Word size value crashed the gate; Word variants (open/close pairs, other prefixes, quoting, entities, deleted text, renamed parts) were missed; a waiver inside the finding counted; a dictionary was counted twice; plain links with a secret word would have blocked. Eval cases tc-040 to tc-045, and tests/policies/test_scan_hidden_content_review.py pins each."
  - "Adversarial review, round 2, fixed: escaped backticks, block starts and backtick-info fences paired code spans across real comments, and a <pre> block across a blank line was blanked as a fence; any animation switched off every CSS check (round 4 removes the exemption altogether); select, object, marquee and applet were not scope barriers, and a stray table cell outside a table froze later end tags; inline SVG in an HTML page had no page background; an escaped bracket or 1000 characters of alt text turned an image into a link (image link text is now found in one forward pass, an unopened `](` read as an image); the waiver line was matched with backtracking per finding; a Word document's total unpacked size and element count were unbounded and every part was kept in memory; a Word part not named .xml was skipped. Eval cases are unchanged; tests/policies/test_scan_hidden_content_review.py pins each case."
  - "Adversarial review, round 3, fixed: setext underlines, list items with indented HTML and GFM table rows paired code spans across real comments; a ] inside inline HTML or an autolink turned an image into a link; any @keyframes whose body named a hiding property (even in a comment, as part of background-color, setting it to a hidden value, or paused, zero-length or long-delayed) exempted an animated block; whitespace before a Word part's first tag skipped the part, and UTF-16 without a BOM after whitespace was read silently; IMAGE_REF scanned 999 characters per opener; the time budget was per run, not per file; an animated rule naming its keyframe elsewhere was reported again. CodeQL's HTML-filter alert on the block end markers: they are now the spec's literal strings, and a type 2 block still ends only at -->, as CommonMark ends it. Eval cases are unchanged; tests/policies/test_scan_hidden_content_review.py pins each case."
  - "Adversarial review, round 4, fixed: the animation exemption could still be satisfied by a keyframe applied only in prose or a decoy element, by a keyframe named like a reserved word (linear, infinite), or by animations that never stay shown (an exponent delay, a 1 ms flash, zero iterations, a keyframe that ends hidden): the exemption is removed, so an animated reveal is reported (a known false positive); the header row of a GFM table that interrupts a paragraph paired code spans with the paragraph; a ]( inside an inline tag or autolink still turned an image into a link; the deadline reported a file it did not reach as would-ask, and judged files in path order. Also: indented code blocks are blanked again as code (round 3 read any indented HTML as HTML, a false positive on indented examples). Eval cases are unchanged; tests/policies/test_scan_hidden_content_review.py pins each case."
  - "Adversarial review, round 5 (with a differential fuzz against commonmark.js), fixed: an unclosed fence inside a list item ran to the end of the file instead of ending with the item; a type 7 tag line opened an HTML block inside a paragraph, so a list after it kept the wrong content column; blanking inline tags before reading destinations hid a destination holding a tag and an angle-bracket destination after whitespace (a round 4 regression): destinations are read from the text as written, at each ]( outside an inline tag, never inside a destination already read."
  - "Adversarial review, round 6 (differential fuzz against commonmark.js: 1, 3 and 4 misses on three seeds), fixed by design rather than case by case: modelling CommonMark's containers, paragraph ends and code-span pairing one shape at a time kept leaving a shape where the gate blanked as code what a renderer passes through (an ordered list not starting at 1, a mismatched table delimiter, a type 7 line after a heading, a list column outliving its list, a stray <...> read as an inline tag). Now only certain code is blanked (see the Markdown entry), inline tags are recognised by CommonMark's grammar, and anything uncertain is read as text. After the change the same fuzz finds no miss in 48000 documents across 12 seeds; the repository sweep reports 19 files of 851 (17 before), the two more being security research notes that quote attack strings in inline code."
  - "Adversarial review, round 7 (fuzz with a parse5 oracle for hidden elements: 54-70 misses per seed; 5-7 image misses), fixed: an escaped \\<!-- read as a comment that swallowed the rest of the file (now read both ways, above); a `](` inside an earlier unclosed destination such as [x]( was skipped, so the image after it went unread (every `](` is now read); an unterminated <![CDATA[ in HTML swallowed the rest of the file in Python's parser where a browser ends it at the first '>' (now read as a browser does, also inside SVG, which only reports more); a line read as a table row inside a list item paired code a renderer without tables pairs differently (now both readings must agree); a bogus comment or unclosed tag left open in one block swallowed elements a renderer's own tags let through (now also read with those tags' '>'); and a type 7 tag line after a list item or block quote whose content was code was taken for paragraph text, so code spans after it were blanked inside what a renderer passes through as an HTML block (now only a certain paragraph keeps a type 7 line from opening one); an HTML block opened after a list or block quote marker (> <pre>) was not seen; and a <pre> inside what was read as a type 7 block was cut at the next blank line, though if the type 7 line was text a renderer keeps it raw to </pre> (both now read as HTML). After the change the same fuzz finds no miss in 48000 documents across 12 seeds; the repository sweep reports 18 files of 851 (19 before: lines with a pipe outside a table now blank the code both readings agree on)."
  - "Adversarial review, round 8 (fuzz with new block and comment shapes: 6-10 hidden-element misses per seed, one cause), fixed: <!--> and <!---> are empty comments to a browser and to CommonMark, but Python's html.parser read on to the next -->, so elements and embeds between went unseen. Comments are now read as a browser reads them on every Python release: those two forms are empty, and any other comment ends at the first --> or --!>. The same fuzz then found markup swallowed by a comment opener, a processing instruction or a raw-text element (<script>) left in code this reader is not certain of; Markdown is now also read with no '<' that opens a comment, declaration, processing instruction or bogus comment, and no element holding raw text, and findings of every reading count. After the change: no hidden-element or image miss in 36000 documents across 12 seeds; one comment, inside a comment that CommonMark leaves open past an escaped --!>, is reported as a hidden element instead."
  - "Adversarial review, round 9 (fuzz: no hidden-element or image miss; two minimised bypasses), fixed: a --> inside code ended a comment for the gate though a renderer escapes it, so the comment ran on in the browser; and an open attribute quote in code this reader is not certain of swallowed a later hidden element. Both now fall to the reading in which what may be code is code (see the Markdown entry)."
  - "Adversarial review, round 10 (fuzz with HTML-block openers and code-held closers), fixed: a --> or --!> written as Markdown text, which a renderer escapes, ended a comment opened in an HTML block above; an attribute value left open was closed in the browser by the quotes of a renderer's own tags (class=\"language-x\") but not in the gate; </span> closed a hidden span across an open <pre>, where a browser ignores it; and an HTML block in a list item or block quote was read on past a line that ends the container, so a --> there, which a renderer escapes, ended its comment. Each Markdown file is now read in up to ten ways; the deadline is checked between readings and every 512 tags too, so the most adversarial shapes near 1 MiB are reported as not judged (would block) once it passes."
  - "Adversarial review, round 11 (fuzz of the paragraph reading and of raw HTML tree rules), fixed: a line holding an incomplete tag (<a title=\"x) opened a type 7 HTML block for the gate but not for CommonMark, so its open quote swallowed the next block's element (where a renderer may write its own tags, a type 7 line must now be a whole tag); a stray <body hidden> or <html style=\"display:none\">, whose attributes a browser gives the page, hid text written before it (the whole page's text is now a finding); and a block start tag inside an open <p> did not close it, so a later </p> ended a hidden <div> (now closed as a browser closes it, in button scope; not for <table>, which quirks mode leaves inside the <p>). The same fuzz then found a hiding formatting element (<code>, <small>, <s>) that a browser rebuilds after an implied end tag, a table part inside <template> dropped as if outside a table, <!--> on its own line read as an open comment block, and === with no paragraph above read as an underline; HTML with a hiding element is now also read with each hiding element open until its own end tag (a nested one too), and the rest are read as CommonMark and browsers read them. After the change the reviewer's harnesses find no miss."
  - "Adversarial review, round 12, fixed: the reading that keeps hiding elements open grew quadratic with many of them (each text fed every open one; now only the outermost counts text, and the HTML reader checks the deadline as it goes); script and style inside inline SVG or MathML were read as raw text, though a browser parses markup there; and </form> closed what the form held, where a browser takes only the form off the stack (now a </form> with children open is ignored, which errs toward reporting). The fuzz then found a <col hidden> in MathML read as void, though there it holds what follows (void elements are now void only in HTML content); text written directly in a hidden <select>, which a browser does not show, is left unjudged. Also, a file too large to parse and a Word document that cannot be read now carry the would-block verdict."
  - "Adversarial review, round 13: no blocking finding. Every shape timed grows linearly and stops within about 10 seconds of one run, as not judged (would block) where it must; the tree-rule, paragraph and held-element fuzzers find no miss."
  - "Limits (not caught): a URL built from parts or by a script, or fetched at run time; data in a URL fragment (after #), which is not sent with the request; a URL on an allowlisted host's path with no query; a URL whose value changes in place (the key holds the host, path shape and query names, so ?token=public becoming ?token=${GITHUB_TOKEN} reads as old); text hidden by a style sheet in another file, by a selector other than a final class or id, by a background image, by a parent's overflow, by a colour near but not equal to the background,  or in a standalone SVG by white fill over a painted shape or on GitHub's light page (standalone SVG text is compared only with a background an ancestor declares); SVG text positioned past the right or bottom edge of its canvas; colours in oklch(), lab() and other newer CSS colour functions; text-indent image replacement; SVG desc and title (screen readers present them); text in details, template, noscript, noembed, iframe, img alt and title attributes, and script type=text/plain; MathJax \\style and KaTeX \\htmlStyle; Word text hidden through a style, a theme colour or a near-white colour, and field-code text (instrText); RST and AsciiDoc comment syntax in docs, root README.rst/.adoc, .ipynb and other document formats (.docm, .dotx, .rtf, .odt); YAML-escaped markup in issue forms; a definition title spanning lines; definitions inside list items; instructions in a language or wording the vocabulary does not hold, or split by a character that is not a format character (U+034F); code inside a list item or block quote, an unclosed fence, every fence after a fence-like line left unread, and a code span spanning lines are read as text (errs toward reporting); HTML tree construction is modelled only where it ends or keeps hidden text (table scope, special elements, closing an open <p>, a stray <body> or <html>), not foster parenting or the adoption agency, whose formatting-element cases this reader errs toward reporting; in the reading with a renderer's tags, a '>' also opens each line after a blank line, so a bogus comment or tag left open across a blank line inside a <pre>, <script>, <style> or <textarea> block ends there in that reading (the reading as written keeps it open). Known false positives: text an animation reveals (a typing or slide-in demo), a comment that explains a maintenance step ('run the generator'), a generated-file header naming its regenerating command, a long license or explanatory comment over 200 characters in HTML, XML or SVG, KaTeX phantom used for alignment, sr-only clip patterns and label hidden, a Codecov badge token and a GitHub search link with a long query on allowlisted hosts, a plain link whose query names a secret word (asked, not blocked), hex digests in URL paths and JavaScript template placeholders in HTML on hosts outside the allowlist, fonts and CDNs loaded by HTML pages; in Markdown, commented-out HTML (an old badge's <img>, a <div hidden> of old notes) and an <img> or hidden element written inside a <script> string, since a reading in which nothing swallows markup reads them as markup; in HTML with a hiding element, text a browser moves out of it (out of a hidden <table>, past a closed <select>), since one reading keeps each hiding element open to its own end tag. Also: a comment or URL quoted in code inside a list item, in an unclosed fence, after an ambiguous fence or in a multi-line code span. Measured before merge over every file in scope in chock-catalog, chock and org-plan (851 files, read whole rather than as changes): 18 files reported, all of these kinds. The allowlist and vocabulary ship in the policy's data table; widening them is a change to this policy."
