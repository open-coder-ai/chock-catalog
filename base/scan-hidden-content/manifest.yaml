id: scan-hidden-content
name: "Scan Hidden Content"
version: "0.0.1"
description: >
  Warns (observe) when a change adds text a reader cannot see, or a URL that carries data out, to
  Markdown, HTML, SVG, XML, Word, agent instruction files, docs and templates: instruction-like or long
  comments, CSS-hidden, white or 1pt text, hidden Word runs, URLs with secret words, long queries,
  placeholders or encoded parts, remote embeds, camo runs, HTML data URIs. Runs: commit, agent write,
  turn's end. Waiver: a person's marker comment line above. Friction, not a boundary.
artifact: hook
enforcement: advise
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: warn
    message: >
      This change adds text a reader cannot see (a comment or hidden element that reads as an
      instruction, white or zero-size text) or a URL that can carry data out (a secret word or
      data-shaped part in its query or path, a remote embed, a dictionary of image URLs). Remove the
      hidden text or make it visible, and link only to fixed URLs that carry nothing from the
      repository or the session. A person may keep a reviewed line with a comment line just above it
      that holds only 'chock: allow scan-hidden-content', committed from their own shell; in the agent
      only a waiver already committed in HEAD counts, so an agent asks the person instead.
    params:
      script: scan-hidden-content-gate.py

compliance:
  mitre_atlas:
  - control: AML.T0051
    coverage: partial
    note: "warns on instructions hidden from a human reviewer in committed Markdown, HTML, SVG, XML and Word files; plain-text injection is not judged"
  - control: AML.T0086
    coverage: partial
    note: "warns on image and link URLs shaped to carry data out when rendered; URLs built at run time or fetched are not seen"
  owasp_asi:
  - control: ASI01
    coverage: partial
    note: "warns on the hidden-comment and hidden-styling carriers of goal hijack in committed files; semantic injection stays with injection-defense"
  owasp_llm_2025:
  - control: LLM01
    coverage: partial
    note: "Prompt Injection: hidden comments, hidden styling and hidden Word runs in committed files only"
  - control: LLM02
    coverage: partial
    note: "Sensitive Information Disclosure: Markdown and HTML URLs whose query or path is shaped to carry data, in committed files only"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial draft (roadmap NP01, class K07). A script gate that ships in observe (D15): every finding warns (exit 4, action warn), and each finding's message names the verdict it will have once a separate PR promotes it: block for a Markdown image or HTML/CSS source whose query names a secret word and for a URL dictionary, ask for the rest. The script prints a findings document and the engine re-runs it on the baseline, so only what a change adds is judged. Keys never hold a line number or a full URL: rule, host and path shape (segments that are not plain words become *, query names sorted); a hash of a dictionary member's URL; a hash of the whole normalized hidden text (comments, hidden elements, Word runs); a hash of the line for KaTeX and data URIs; a raw hash of the whole file when it is too large."
  - "Scope: *.md, *.mdx, *.markdown, *.mdc, *.html, *.htm, *.xhtml, *.svg, *.xml and *.docx anywhere; .cursorrules, .windsurfrules, .clinerules, .goosehints, llms.txt and llms-full.txt (read as Markdown); every file under .cursor/rules, .roo/rules, .kiro/steering, .clinerules/ and .github/instructions, prompts, agents, ISSUE_TEMPLATE, PULL_REQUEST_TEMPLATE and DISCUSSION_TEMPLATE; .rst, .txt and .adoc under docs/ or doc/. Not judged: chock's managed .agents/policies/ and .chock/ (protect-agent-config guards them). A text file over 1 MiB is not parsed (the 30-second budget covers the baseline run too): it is reported as too large, keyed by its raw text, so every change to it is new; more than 10000 findings in one run collapse to one finding marked new."
  - "Markdown is read twice: URLs with fenced blocks and code spans blanked (code is shown, not fetched), and tags and comments with only the '<' of code removed, so code inside a comment or an HTML block (where CommonMark reads no code) still counts. Fences do not open inside an HTML block or an open comment."
  - "Judged: (a) remote URLs: bare, Markdown inline and reference destinations (entities and CommonMark backslash escapes decoded, a destination on the next line, definitions inside block quotes), HTML attribute URLs (src, srcset, data, action, formaction, poster, background, and href or xlink:href on link, image, use, feImage, base and script), CSS url(), @import and image-set(). A Markdown image (also through a reference an image uses) or an HTML/CSS source whose query names a secret word (token, key, env, ssh, secret, password, credential, apikey, auth, bearer; split on punctuation and camelCase) would block; a plain link with one would ask. A query of 40 or more characters (on an allowlisted host, one value that long), a placeholder ({x}, ${, $VAR, [DATA], <x>, %s) or a hex or mixed-case base64 segment of 32 or more characters would ask; an HTML or CSS source on a host outside the allowlist would ask (a Markdown image is judged by shape, as the roadmap says); a URL the EP11 parser refuses would ask; five or more camo.githubusercontent.com URLs, or five or more one- or two-character names under one path on one host, would block, each URL its own finding so a growing dictionary reports what it gains. One URL is judged once per line however many readings find it. Hosts are normalised with chock_scan (EP11). Allowlisted (only without a query, the roadmap's FP control): shields.io, badgen.net, badge.fury.io, codecov.io, coveralls.io, github.com, gitlab.com, raw, user-images, avatars and private-user-images.githubusercontent.com, Scorecard and Best Practices badges, readthedocs. (b) Comments an HTML parser hides (<!-- -->, <!x>, <?x>, </ x>, CDATA; an unclosed <!-- runs to the end), MDX {/* */} comments and Markdown reference-definition titles, with an imperative (run, execute, exec, send, upload, approve, push, curl, wget, exfiltrate), override wording, a key or env path, or more than 200 characters; lint, TOC, generator and chock marker comments that match a marker exactly are not. Matching drops format characters (HP15 reports those), decodes entities and applies NFKC. (c) Elements whose text is hidden: the hidden attribute, display none, visibility or content-visibility hidden, opacity 0, font size 0 or 1px/1pt, scale near 0, off-screen offsets or translation, clipping, zero height or width with overflow hidden, text colour equal to the background behind it or transparent (the 148 CSS named colours, hex, rgb() in numbers or percent, hsl(); the background inherited from ancestors, bgcolor included, white on an HTML page when none is set), aria-hidden over 100 or more characters, SVG fill none or fill-opacity 0, SVG text offset 999 or more off canvas, long SVG metadata or defs text, font color, a class or id a style rule hides, hidden rules in style elements; KaTeX white or transparent colour and phantom boxes. Read as browsers read them: CSS escapes decoded, the last valid declaration wins (an invalid later one is dropped), the first of duplicate attributes wins, '/>' on a non-void HTML element is ignored, and an end tag outside an open table cell is ignored. (d) Word documents: runs with vanish, specVanish, webHidden, white colour or a size of 1 point or less, in any XML part of the zip (Word finds parts through relationships, so a renamed part is read), parsed by namespace (any prefix, transitional or strict), deleted text included; HTML data URIs anywhere in scope, decoded destinations included."
  - "Word documents are read from git (the index at commit, HEAD at push and CI) because the write tools carry text, not a zip; they are not judged at tool use, and at push and CI every hidden run in a changed document counts as new (the base revision is not in the gate's input). A document that is not a bounded zip (encrypted, a member past 32 MB, over 4096 members) or holds a part with a DTD or malformed XML is reported as unreadable."
  - "Waiver: a line holding nothing but the marker as a comment (<!-- chock: allow scan-hidden-content -->, its MDX or [//]: # form, or # in YAML) just above the finding, honoured at a person's commit, push and CI. A marker on the finding's own line, inside the hidden text or the URL is part of what is judged, never a waiver, and CI does not honour a waiver on a would-block finding (a pull request's author may be anyone)."
  - "Adversarial review before release (a separate agent, real scripts, CommonMark and HTML5 parsers as references), fixed: code blanking erased comments that hold code or sit in an HTML block; bogus comments were not read; '/>' and table-scope end tags let text escape a hidden element; an invalid later CSS declaration overrode a hiding one; colours other than hex, integer rgb() and three names were not compared, and bgcolor and SVG fill were not read; backslash-escaped and next-line Markdown destinations and decoded data URIs were missed; keys collided (a constant dictionary key, hidden text hashed only to 2000 characters, style rules keyed by selector with their targets never judged, URLs deduplicated per host and line, the too-large key normalized, KaTeX keyed by 120 characters); a closing-parenthesis run, a one-line run of comments and a long style sheet were quadratic; a huge Word size value crashed the gate; Word variants (open/close pairs, other prefixes, quoting, entities, deleted text, renamed parts) were missed; a waiver inside the finding counted; a dictionary was counted twice; plain links with a secret word would have blocked. Eval cases tc-040 to tc-045, and tests/policies/test_scan_hidden_content_review.py pins each."
  - "Limits (not caught): a URL built from parts or by a script, or fetched at run time; data in a URL fragment (after #), which is not sent with the request; a URL on an allowlisted host's path with no query; a URL whose value changes in place (the key holds the host, path shape and query names, so ?token=public becoming ?token=${GITHUB_TOKEN} reads as old); text hidden by a style sheet in another file, by a selector other than a final class or id, by a background image, by a parent's overflow, by a colour near but not equal to the background, by an animation (an animated rule is not judged, since it may reveal its text), or in SVG by white fill over a painted shape (SVG text is compared only with a background an ancestor declares); SVG desc and title (screen readers present them); text in details, template, noscript, noembed, iframe, img alt and title attributes, and script type=text/plain; MathJax \\style and KaTeX \\htmlStyle; Word text hidden through a style, a theme colour or a near-white colour; RST and AsciiDoc comment syntax in docs, root README.rst/.adoc, .ipynb and other document formats (.docm, .dotx, .rtf, .odt); YAML-escaped markup in issue forms; a definition title spanning lines; definitions inside list items; instructions in a language or wording the vocabulary does not hold, or split by a character that is not a format character (U+034F); indented code blocks are judged as text (errs toward reporting). Known false positives: a comment that explains a maintenance step ('run the generator'), a generated-file header naming its regenerating command, a long license or explanatory comment over 200 characters in HTML, XML or SVG, KaTeX phantom used for alignment, sr-only clip patterns and label hidden, a Codecov badge token and a GitHub search link with a long query on allowlisted hosts, a plain link whose query names a secret word (asked, not blocked), hex digests in URL paths and JavaScript template placeholders in HTML on hosts outside the allowlist, fonts and CDNs loaded by HTML pages. Measured before merge over every file in scope in chock-catalog, chock and org-plan (851 files, read whole rather than as changes): 17 files reported, all of these kinds. The allowlist and vocabulary ship in the policy's data table; widening them is a change to this policy."
