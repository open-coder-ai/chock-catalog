id: pin-github-actions
name: "Pin GitHub Actions"
version: "0.0.6"
description: >
  Blocks uses: of an action or reusable workflow at a movable ref (not a lowercase 40-hex SHA)
  and a docker:// image without @sha256, in quoted, JSON, flow, anchored and next-line forms;
  local ./ passes. Scope: .github/workflows/, .github/actions/, action.y*ml. Line regex, not a
  YAML parser: container/services image tags, impostor SHAs and a tag named like a SHA pass.
  Waiver: 'pragma: allowlist unpinned-action' same line. Person's commit: honoured. Agent: only
  if in HEAD; MCP gateway: never.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false
applies_to:
  # Where a `uses:` line can reach a third-party action: workflows, the composite actions they
  # call, and an action repo's own action.yml at any depth. Without this bound the gate judges
  # every file it is shown -- at the turn's end the whole worktree -- and refuses the README
  # that documents how to pin an action. fnmatch: `*` crosses `/`.
  paths:
  - ".github/workflows/*"
  - ".github/actions/*"
  - "action.y*ml"
  - "*/action.y*ml"

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Unpinned GitHub Action detected: a workflow references an action by a tag or branch
      (owner/repo at a movable ref) rather than a full 40-character commit SHA, uses a
      docker:// image without an @sha256: digest, or writes the reference in a form this
      line check cannot read (an escape, a quote left open). Pin it to the lowercase SHA (or the
      image digest) -- keep the version in a trailing comment for readability -- so a re-tagged or
      compromised release cannot change what runs. Waiver: 'pragma: allowlist unpinned-action' on the same line. A person's commit honours it; in the agent (write, the turn's end, an agent's commit) only a line already in HEAD counts, and the MCP gateway never does. An agent asks a person; it never writes the pragma.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+unpinned-action'
      # Verbose regex, one line judged at a time. The [s]/[e] classes keep it from matching its
      # own source (#32). A pin is a lowercase 40-hex SHA, or for docker:// an @sha256: digest,
      # ending at a scalar boundary (quote, space, flow ',' '}' ']', end of line).
      content_pattern: |-
        (?x)
        # 1. a uses key (bare, quoted, flow or JSON; anchor or tag allowed) naming a remote action
        #    or reusable workflow at a non-SHA ref, or a docker:// image without a digest
        ["']?use[s]["']?\s*:\s*(?:[&!]\S*\s+)*["']?
          (?: (?!(?i:docker)://|\./) [^\s"'@,\]}]+ @ (?![0-9a-f]{40}(?:["'\s,\]}]|$))
            | (?i:docker):// (?![^\s"'@,\]}]*@sha256:[0-9a-f]{64}(?:["'\s,\]}]|$)) )
        # 2. an action's image key holding a docker:// image without a digest
        | ["']?imag[e]["']?\s*:\s*(?:[&!]\S*\s+)*["']?
            (?i:docker):// (?![^\s"'@,\]}]*@sha256:[0-9a-f]{64}(?:["'\s,\]}]|$))
        # 3. a quoted uses value this check cannot read: an escape, or a quote left open
        | ["']?use[s]["']?\s*:\s*(?:[&!]\S*\s+)*(?:"[^"]*(?:\\|$)|'[^']*$)
        # 4. an anchor holding an owner/repo@non-SHA or docker:// value, or an escaped one
        | &\S+\s+(?: "[^"]*\\
            | ["']? [A-Za-z0-9-]+/[A-Za-z0-9._-]+(?:/[^\s"'@]*)? @ (?![0-9a-f]{40}(?:["'\s,\]}]|$))
            | ["']? (?i:docker):// (?![^\s"'@,\]}]*@sha256:[0-9a-f]{64}(?:["'\s,\]}]|$)) )
        # 5. a value alone on its line (uses:, uses: >- or a complex key above it)
        | ^\s*(?::\s+)?(?:[&!]\S*\s+)*["']?
            (?: [A-Za-z0-9-]+/[A-Za-z0-9._-]+(?:/[^\s"'@]*)? @ (?![0-9a-f]{40}(?:["'\s,\]}]|$))
              | (?i:docker):// (?![^\s"'@,\]}]*@sha256:[0-9a-f]{64}(?:["'\s,\]}]|$)) )
            \S*\s*(?:\#.*)?$
        # 6. a bare double-quoted line escaping a slash; an escaped key; an escaped @ anywhere
        | ^\s*"[^"]*\\(?:/|x2[fF]|u002[fF]|U0000002[fF])
        | (?:^\s*(?:[-?]\s+)*|[{,]\s*) "[^"]*\\(?:[^"]*"\s*:|$)
        | \\(?:x40|u0040|U00000040)

compliance:
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "blocks the unpinned-action acquisition path a diff can show; signature/provenance verification and non-Actions supply chain remain out of scope"
  mitre_atlas:
  - control: AML.T0109
    coverage: partial
    note: "SHA pinning removes the floating-ref carrier of a re-tag / rug-pull on a third-party action"

provenance:
  author: "chock-core"
  created_at: "2026-08-26T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-26'
  changes:
  - "Initial draft: content_regex gate over GitHub Action references pinned to a tag or branch instead of a full 40-char commit SHA. Self-safe pattern (single-char class, #32); 40-hex SHA and local (ref-less) actions pass; 'pragma: allowlist unpinned-action' escapes."
- version: 0.0.2
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so an unpinned action reference is caught as the agent writes the workflow, not only at commit. No pattern change. Message notes the allowlist pragma is a commit-review concept NOT honored at tool-use (live, attacker-controllable tool argument -- a match always blocks, matching the gateway's content_regex semantics)."
- version: 0.0.3
  date: '2026-09-20'
  changes:
  - "Bound the gate to the files a `uses:` reference can live in (applies_to.paths: .github/workflows/*, .github/actions/*). The engine now runs this policy at the agent's write path and at the end of a turn, where the text under judgement is whatever was written -- unbounded, a README that documents how to pin an action was refused, and a control that fires on a correct change has failed. No pattern change; the commit-time behaviour on workflow files is unchanged. Evals tc-010 (a README quoting an unpinned action is allowed) and tc-011 (a composite action under .github/actions/ is blocked) prove the bound both ways."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, an agent's commit (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT or agent_commit_env)) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Wording only, pattern and bound unchanged: the description no longer says 'third-party'. Every owner/repo@non-SHA is blocked, actions/* and reusable workflows included. It states the .github/workflows/ and .github/actions/ bound and where each check runs (commit, agent write, turn's end), and the gate message carries the standard waiver sentence (person's commit honours it; in the agent only a line already in HEAD counts; the MCP gateway never does). The description fits the 500-char budget. source_repo points at chock-catalog."
- version: 0.0.6
  date: '2026-10-02'
  changes:
  - "HP14 regex tier. Blocks a docker:// image (uses: or an action's image:) without an @sha256: digest; a uses key written quoted, JSON-style or with a space before the colon; a flow mapping; a value behind a YAML anchor, tag or alias definition; a value alone on the line under uses:, uses: >- or a complex key; and a uses value this line check cannot read (an escape, an unclosed quote, an escaped @ or slash, an escaped key). A pin is now a lowercase 40-hex SHA ending at a scalar boundary (quote, space, flow ',' '}' ']', end of line): an uppercase or short SHA, a SHA followed directly by '#', and a ref outside the old [A-Za-z0-9._/-] class (owner/repo@+x) are blocked. Scope adds an action repo's action.yml/action.yaml at any depth. Limits (the YAML key-path ci-github-actions bundle, wave 3, owns them): container/services image tags, impostor commits from a fork network, a tag or branch named as 40 lowercase hex, a local ./ action checked out from another repo, and YAML constructs spread over lines in ways this list does not name."
