id: block-persistence-shapes
name: "Block Persistence Shapes"
version: "0.0.4"
description: >
  Best-effort guard against shell commands that publish or keep access after the session: npm/pnpm/yarn/twine/
  poetry/uv/cargo/gem publish, docker/podman push and login, npm token and registry edits, repos made public;
  user services, launch agents, cron/at/schtasks, Run keys, authorized_keys, runner registration, sudoers, setuid
  bits, detached downloads. Asks on gh release create, git remote add, git push to a URL. Misses: scripts,
  aliases, system units, shell rc files, ssh-run commands.
artifact: rule
enforcement: advise
rule:
  text: |
    never(run): publish(npm|pnpm|yarn|twine|poetry|uv|cargo|gem|docker|podman), registry_login_or_token, repo_public, persist(user_service|launch_agent|cron|at|schtasks|run_key|authorized_keys|runner|sudoers|setuid|detached_download)
    ask(person): release_create, remote_add, push_to_url; allow: dry_run, pack, build, status, list  # human decisions
effects:
- read_only
approval:
  required: false

compliance:
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "refuses publishing with the person's registry credentials, minting or storing registry tokens, and writing ssh login keys or sudoers rules from the shell; secret-store reads and the credential files themselves stay with other policies"
  - control: ASI10
    coverage: partial
    note: "refuses the shell shapes that keep an agent's access after the session ends (user services, launch agents, scheduled jobs, Run keys, runner registration, detached downloads); a script file, alias or program built at run time is out of reach"

provenance:
  author: "chock-core"
  created_at: "2026-10-02T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: production
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.4
  date: '2026-10-07'
  changes:
  - "Status draft -> production by the BV-C3 promotion rule, measured at catalog main 9e3e2fe: every eval case executed and passing in the replay, tier best-effort, no open bug issue, no chock check warning. Behaviour unchanged."
- version: 0.0.1
  date: '2026-10-02'
  changes:
  - "Initial baseline: a Python guard (implementations/block-persistence-shapes.py, stdlib only, beside the shared chock_shellparse and chock_scan data_table copies and the verb, flag and path tables in implementations/data/shapes.json) reads the command actually run, after cd, bash -c, sudo/env wrappers, python -m and npx-style launchers. It refuses package, image and release publishing (dry-run and pack forms stay allowed), registry token and auth edits, making a repository public, and the persistence shapes listed in the description; it asks before gh release create, git remote add or set-url, and git push to an explicit URL (every URL is asked about; the egress allowlist file is not read). Probed misses, all allowed: a verb or path built in a variable (P=publish; npm $P), $'..' quoting and brace expansion of a verb, a script file run by name, system-level systemctl enable, shell rc files and XDG autostart, a command run over ssh, docker buildx build --push, a grouped { curl ...; } &, find -exec chmod u+s, publishing through xargs, npx -c or npm exec -c, find -exec, su -c or a pipe to a shell, wget -b, nohup of a script, screen or tmux, PowerShell Start-Process or a Run-key path in a variable, systemd-run, sudo -e, Runner.Listener configure, a write after a two-step cd into a persistence folder, writes to ~/.npmrc. Known false blocks: curl ... & wait, the indicator name gh-token-monitor anywhere in the line (git log --grep, cat), cargo publish -n, and an argument spelled like a verb after a subcommand the table does not list. Advisory (a PreToolUse guard on the shell only): maps to OWASP ASI03 and ASI10 as partial coverage."
- version: 0.0.2
  date: '2026-10-02'
  changes:
  - "Independent verification round. Fixed: a download saved with clustered short flags (curl -sSLo FILE, wget -qO FILE, -qP DIR) or glued to the path now counts as a write to a persistence path; cp, mv, install and ln -t DIR or --target-directory DIR check the folder and each source named in it; python -mMODULE (glued), python -m twine.cli and the py launcher are followed to the module; yarn workspace NAME publish is read when NAME is spelled like a yarn command; git config remote.NAME.url|pushurl and url.BASE.insteadOf set to a value ask like git remote set-url; chmod with several symbolic operations (u-x+s) is read for the setuid bit. A command line the parser cannot read within five seconds (an unbalanced quote followed by thousands of escaped quotes takes the shared chock_shellparse cubic time) is now refused with a reason instead of running past the hook timeout. Probed misses, all allowed, held by tests/policies/test_stated_limits.py: a shell fed by a here-document or here-string (bash <<< 'npm publish'), eval or source of a command built by substitution, publish started from interpreter code (python -c subprocess, node -e), wrappers the shared parser does not unwrap (flock, watch, strace, unbuffer, runuser, chroot, taskset, parallel, busybox, env -S, fish -c), paths written as a glob, brace list or substitution (~/.ssh/auth*, ~/.ssh/{authorized_keys,x}), writers outside the shared table (tar -C, unzip -d, rsync, sort -o, sed w, sponge, awk -i inplace, editors, aria2c, PowerShell Set-Content, Out-File and -OutFile), a parent folder (cp -r x ~/.config/systemd/), other startup and login locations (/etc/init.d, rc.local, /etc/profile.d, ld.so.preload, udev rules, ~/.xprofile, environment.d, ~/.local/share/systemd/user, the Windows Startup folder, macOS login items through defaults write or osascript), registry and cloud credential files written directly (~/.pypirc, ~/.cargo/credentials, ~/.docker/config.json), publishers and uploaders the table does not list (hatch, flit, pdm, maturin, setup.py upload, dotnet nuget push, mvn deploy, helm push, oras, vsce, buildah, skopeo, crane, nerdctl, gh release upload, curl or wget calls to a registry or the GitHub API, gh api graphql visibility changes, deploy keys through gh api or gh ssh-key), registry account edits (npm unpublish, owner, access, dist-tag, deprecate), git push --tags or a tag to a named remote, git hooks and core.hooksPath (other policies), account changes (usermod, useradd, passwd), setcap, and an scp-style host:path push URL with a bare host. Shared chock_shellparse gaps (-- after eval or -c, array and += assignments) are fixed separately in PR 152 and stay known limits here until that lands."
- version: 0.0.3
  date: '2026-10-03'
  changes:
  - "The shared command reader (chock_shellparse, the same copy in every Python guard) changed: it skips a `--` and the shell options between `-c` and the script (`bash -c -- '...'`, `sh -c -x '...'`, `eval -- '...'`), reads `name=(...)`, `name+=` and `name[i]=` assignments, looks through the `{` that opens a function body or group, splits a line whose quotes do not balance in one pass, and in a short-option cluster every `o` or `O` takes the next word while a lone `-` or `+` ends the options. Closed here: `eval -- npm publish` and the `--`/option forms after `-c` are now judged; a command built from an array expansion (`arr=(npm); arr+=(publish)` then the array expanded inside double quotes) is still not seen, so the array and += assignments limit stays. See protect-agent-config 0.2.7."
