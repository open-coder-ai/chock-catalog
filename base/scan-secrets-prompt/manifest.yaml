id: scan-secrets-prompt
name: "Scan Secrets in Prompts"
version: "0.0.1"
description: >
  Screens a prompt for a credential before the model reads it: vendor tokens (AWS, GitHub, GitLab,
  Slack, OpenAI, Anthropic, HF, ...), private keys with a body, JWTs, URI logins, Authorization
  literals. Installed with chock it refuses the prompt; a plugin alone carries text only. No name-based
  rule, so code that mentions a password passes. Allows AWS example keys, masked keys and variable
  names. Misses: a bare password, a split or encoded value, a vendor shape not listed. No waiver.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [prompt_submit]
    action: block
    message: >
      A credential was found in this prompt, so it was not sent. Remove it and submit again; if it was
      a real credential, rotate it, because it may already sit in a terminal history or a log.
    params:
      content_pattern: |-
        (?x)
        # vendor token shapes of scan-secrets, case-sensitive; an AWS key ending EXAMPLE is the documentation convention
        (?<![0-9A-Za-z])(?:AKIA|ASIA)(?![0-9A-Z]{9}EXAMPLE(?![0-9A-Z]))[0-9A-Z]{16}
        |gh[oprsu]_[0-9A-Za-z]{36}
        |github_pat_[0-9A-Za-z_]{22,}
        |xox[bpas]-[0-9A-Za-z-]{10,}
        |(?:sk|rk)_live_[0-9A-Za-z]{16,}
        |(?<![0-9A-Za-z])sk-proj-[0-9A-Za-z_-]{20,}
        |(?<![0-9A-Za-z])sk-ant-[0-9A-Za-z_-]{20,}
        |(?<![0-9A-Za-z])sk-[0-9A-Za-z]{20,}
        |AIza[0-9A-Za-z_-]{35}
        |npm_[0-9A-Za-z]{36}
        |SG\.[0-9A-Za-z_-]{16,}\.[0-9A-Za-z_-]{16,}
        # JWT: three dotted segments, the first two not empty, so a mask of dots alone is allowed
        |eyJ[A-Za-z0-9_-]{1,512}\.[A-Za-z0-9_-]{1,16384}\.[A-Za-z0-9_-]*
        # a private-key block: the BEGIN line and a base64 body, not the header named in a sentence
        |-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE\ KEY(?:\ BLOCK)?-----\s*(?:[A-Za-z][A-Za-z -]{0,30}:[^\n]{0,200}\n\s*){0,4}[A-Za-z0-9+/]{40}
        # credentials in a URI: scheme://user:password@host, not localhost or example hosts, not a placeholder;
        # userinfo has no unescaped \ # ? / (RFC 3986), so a URL parser test vector is not a login
        |\b[a-z][a-z0-9+.-]{1,20}://(?P<uri_user>[^\s/:@'"#?\\]*):(?!(?P=uri_user)@)
         (?!(?:\$|\{|<|%|\*|\\|x{3}|\.\.\.|(?:pass(?:word|wd)?|pwd|secret|foo(?:bar)?|bar|baz|changeme|token|example|dummy|redacted|placeholder)@))
         [^\s/:@'"#?\\]{3,}@(?!(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|(?:[\w-]+\.)*example(?:\.(?:com|org|net))?|host|hostname|sha(?:256|512))(?:[:/\s'"]|$))
        # Authorization header literal: a scheme word and 20 token characters, not a placeholder or a plain word
        |(?i:\bauthorization)["'`]?\]?\s*[:=,]\s*["'`]?(?!(?i:bearer|token)\s+[A-Za-z._~+/-]{1,512}(?:["'`\s,;)]|$))
         (?i:bearer|basic|token)\s+(?!(?i:\$|\{|<|%|\*|x{3}|\.\.\.|your|example)|[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+(?:["'`\s,;)]|$))
         [A-Za-z0-9._~+/-]{20,}
        # more vendor token shapes
        |\bgl(?:pat|dt|rtr?|cbt|ptt|ft|imt|agent|oas|soat|ffct|wt)-[0-9A-Za-z_-]{20,}
        |\bGR1348941[0-9A-Za-z_-]{20,}
        |\b(?:hf|api_org)_[A-Za-z0-9]{34}\b
        |\bya29\.[0-9A-Za-z_-]{20,}
        |hooks\.slack\.com/(?:services|workflows|triggers)/[A-Za-z0-9]{8,}/[A-Za-z0-9/]{16,}
        |\bxox[er]-[0-9A-Za-z-]{10,}|\bxoxe\.xox[bp]-[0-9A-Za-z-]{10,}|\bxapp-\d-[0-9A-Za-z-]{10,}
        |\bSK[0-9a-f]{32}\b
        |\bdapi[0-9a-f]{32}\b
        |\bdp\.(?:pt|st|sa|said|ct|scim|audit)\.(?:[a-z0-9_-]{2,35}\.)?[0-9A-Za-z]{40,}
        |\bpul-[0-9a-f]{40}\b
        |\bhv[sbr]\.[0-9A-Za-z_-]{24,}
        |\bshp(?:at|ca|pa|ss)_[0-9a-fA-F]{32}\b
        |\bsntry[usai]_[0-9A-Za-z+/=_]{40,}
        |\bglsa_[0-9A-Za-z]{32}_[0-9a-fA-F]{8}\b|\bglc_[0-9A-Za-z+/]{32,}
        |\bdo[por]_v1_[0-9a-f]{64}\b
        |\blin_(?:api|oauth)_[0-9A-Za-z]{40}\b
        |\bntn_[0-9A-Za-z]{40,}|\bsecret_[0-9A-Za-z]{43}\b
        |\bpplx-[0-9A-Za-z]{48}\b
        |\bpscale_(?:tkn|oauth|pw)_[0-9A-Za-z_=.-]{32,}
        |\bPMAK-[0-9a-f]{24}-[0-9a-f]{34}\b
        |\bHRKU-[0-9A-Za-z_-]{36,}
        |\bpypi-[0-9A-Za-z_-]{85,}
        |\brubygems_[0-9a-f]{48}\b
        |\bsk-(?:svcacct|admin)-[0-9A-Za-z_-]{20,}

compliance:
  mitre_atlas:
  - control: AML.T0055
    coverage: partial
    note: "refuses a credential value a prompt carries; a bare password, an encoded value and any vendor shape not listed pass"

provenance:
  author: "chock-core"
  created_at: "2026-11-22T00:00:00Z"
  updated_at: "2026-11-22T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-11-22'
  changes:
  - "Initial draft (R13-11): a content_regex gate at prompt_submit, so a pasted credential is refused before the model reads it. The shapes are scan-secrets' vendor tokens, private-key blocks, JWTs, URI logins and Authorization literals, with none of its name-based rules (password = ..., api_key: ...) or command password flags, which would refuse a person describing code. Four shapes are tighter for prose: they are case-sensitive (Authorization and its scheme word aside), a private key needs a base64 body after the BEGIN line, a JWT needs a non-empty header and payload, and an Authorization literal needs 20 token characters. An AWS key whose last seven characters are EXAMPLE is allowed. Stays draft until a refusal is witnessed live in Claude Code."
