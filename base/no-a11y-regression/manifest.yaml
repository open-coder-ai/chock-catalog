id: no-a11y-regression
name: "No Accessibility Regression Rule"
version: "0.1.1"
description: >
  trigger: remediating accessibility, editing markup, emptying or removing an alt, aria-label,
  label or lang that an element already had, deleting a flagged element.
  avoid: breaking a requirement the previous revision met; interrupting a correct fix.
artifact: rule
enforcement: advise
effects: [read_only]
rule:
  text: |
    never(break): name|lang an element already had -- remove, empty(alt=""), aria-hidden, role=presentation|none; never(resolve_violation_by): delete(element)
    on(name_added): record, never_ask; alt="" asserts decorative and only its author may retract a description; present -> present (reworded label) is a copy decision, stay silent
provenance:
  author: "chock-core"
  created_at: "2026-09-10T00:00:00Z"
  updated_at: "2026-09-10T22:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-09-10'
  changes:
  - "Initial draft. Rule text only: the two transitions it names are invisible to every violation-diffing tool, but no adapter wires a file-content guard, so no enforcement tier is claimed. Mechanism prototyped and tested at open-coder-ai/org-plan prototypes/a11y-guard."
- version: 0.0.2
  date: '2026-09-10'
  changes:
  - "Add the implicit eval case the `chock new policy` scaffold prescribes and this suite omitted: the same intent phrased obliquely, without naming the forbidden action. A reviewer asking for a chatty page to be quietened is asking for the refused transition without saying so, and the four existing categories all name the action outright. No mechanism change."
- version: 0.1.0
  date: '2026-09-10'
  changes:
  - "Ship the guard. implementations/no-a11y-regression-pre-commit.py compares the staged revision of every markup file against its predecessor and refuses the commit when an assertion the previous revision carried has disappeared. 24 elements and their accepted name sources live in implementations/data/element_requirements.json; the decision is a lookup in a closed sixteen-row table over the before and after states, so the script implements no accessibility rules of its own. effects: read_only, now observed rather than asserted -- tools/check_effects.py was blind to a Python guard and to an argv-less event script, and this release teaches it both."
  - "artifact and enforcement are unchanged, and not because nothing changed. The manifest schema admits artifact: hook only with a hook.gate whose kind is one of four declarative kinds, and manifest_block_needs_gate rejects enforcement block or verify without one -- so a script-backed gate cannot declare what it does. The honest enforcement ceiling is carried instead by the derived registry labels, which tools/check_registry.py now computes for a git-event script: commit-time guard script, enforced-at-commit. Making artifact: hook expressible for a script-backed gate is an engine change, not a catalog one."
- version: 0.1.1
  date: '2026-09-10'
  changes:
  - "Stop refusing correct markup. Five shapes alarmed that should never have: an icon link or button named by its child image's alt (plain HTML, and the parser gave the name to the image alone); a JSX component child or a `{...props}` spread, neither of which this parser can resolve; and an interpolated value like alt={logo}, refused because the variable's name happened to be a noise word. A sixth was the cause of the first: `<img src=...>` written without a closing slash looked like an open element, so every element after it counted as its child. A control that fires on a correct change has failed, and this one had five ways to."
  - "Adds a sixth state, unevaluated, for markup whose name is not decidable from the markup. Every transition into or out of it is silent, so the guard now errs toward saying nothing rather than toward refusing. A requirement no subtree could satisfy -- lang on <html> -- is exempt from that excuse, or removing lang would go quiet."
  - "A name's quality is judged only where the change presents it as a fix, not on a reword between two present names: the rule text already said a copy decision stays silent, and the code did not."
  - "Link-text noise is its own list, because 'Continue' names a button honestly while 'more' names no link. Phrases verified against the ambiguous-link-text list in Community-Access/accessibility-agents (MIT); four template suffixes come from the same repository's UI-file list."
