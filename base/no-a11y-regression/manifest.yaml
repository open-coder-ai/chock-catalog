id: no-a11y-regression
name: "Keep Accessibility From Regressing"
version: "1.3.0"
description: >
  trigger: remediating accessibility, editing markup, emptying or removing an alt, aria-label,
  label or lang that an element already had, deleting a flagged element.
  avoid: breaking a requirement the previous revision met; interrupting a correct fix.
  Misses: a name lost while an element moves to another file, a new element or a supplied name that is weak (these warn and do not block), and Thymeleaf th:attr, which sets several attributes at once.
  Not production-grade: caught 34 of 51 regressions and refused 6 of 58 correct changes on the 2026-11-15 hardening review's pairs, measured 2026-11-28; known gaps are JSP, ERB, Pug and Lit syntax, an icon component whose own children hide its name, and an alt removed in some forms.
artifact: rule
enforcement: block
effects: [read_only]
rule:
  text: |
    never(break): name|lang an element already had -- remove, empty(alt=""), aria-hidden, role=presentation|none; never(resolve_violation_by): delete(element)
    on(name_added): record, never_ask; alt="" asserts decorative and only its author may retract a description; present -> present (reworded label) is a copy decision, stay silent
hook:
  script:
    "on": [commit]
  gate:
    kind: script
    "on": [tool_use]
    action: block
    message: "A markup write retracts an accessibility name the file already carried (alt emptied, aria-label removed, aria-hidden added, flagged element deleted). Restore it, or say the element is decorative where a reviewer sees it."
    params:
      script: no-a11y-regression-write.py
provenance:
  author: "chock-core"
  created_at: "2026-09-10T00:00:00Z"
  updated_at: "2026-11-28T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-09-10'
  changes:
  - "Initial draft. Rule text only: the two transitions it names are invisible to every violation-diffing tool, but no adapter wires a file-content guard, so no enforcement tier is claimed. Mechanism prototyped and tested at open-coder-ai/org-plan prototypes/a11y-guard."
- version: 0.0.2
  date: '2026-09-10'
  changes:
  - "Add the implicit eval case the `chock new policy` scaffold prescribes and this suite omitted: the same intent phrased obliquely, without naming the forbidden action. A reviewer asking for a chatty page to be quietened is asking for the refused transition without saying so, and the four existing categories all name the action outright. No mechanism change."
- version: 0.1.0
  date: '2026-09-10'
  changes:
  - "Ship the guard. implementations/no-a11y-regression-pre-commit.py compares the staged revision of every markup file against its predecessor and refuses the commit when an assertion the previous revision carried has disappeared. 24 elements and their accepted name sources live in implementations/data/element_requirements.json; the decision is a lookup in a closed sixteen-row table over the before and after states, so the script implements no accessibility rules of its own. effects: read_only, now observed rather than asserted -- tools/check_effects.py was blind to a Python guard and to an argv-less event script, and this release teaches it both."
  - "artifact and enforcement are unchanged, and not because nothing changed. The manifest schema admits artifact: hook only with a hook.gate whose kind is one of four declarative kinds, and manifest_block_needs_gate rejects enforcement block or verify without one -- so a script-backed gate cannot declare what it does. The honest enforcement ceiling is carried instead by the derived registry labels, which tools/check_registry.py now computes for a git-event script: commit-time guard script, enforced-at-commit. Making artifact: hook expressible for a script-backed gate is an engine change, not a catalog one."
- version: 0.1.1
  date: '2026-09-10'
  changes:
  - "Stop refusing correct markup. Five shapes alarmed that should never have: an icon link or button named by its child image's alt (plain HTML, and the parser gave the name to the image alone); a JSX component child or a `{...props}` spread, neither of which this parser can resolve; and an interpolated value like alt={logo}, refused because the variable's name happened to be a noise word. A sixth was the cause of the first: `<img src=...>` written without a closing slash looked like an open element, so every element after it counted as its child. A control that fires on a correct change has failed, and this one had five ways to."
  - "Adds a sixth state, unevaluated, for markup whose name is not decidable from the markup. Every transition into or out of it is silent, so the guard now errs toward saying nothing rather than toward refusing. A requirement no subtree could satisfy -- lang on <html> -- is exempt from that excuse, or removing lang would go quiet."
  - "A name's quality is judged only where the change presents it as a fix, not on a reword between two present names: the rule text already said a copy decision stays silent, and the code did not."
  - "Link-text noise is its own list, because 'Continue' names a button honestly while 'more' names no link. Phrases verified against the ambiguous-link-text list in Community-Access/accessibility-agents (MIT); four template suffixes come from the same repository's UI-file list."
- version: 0.2.0
  date: '2026-09-10'
  changes:
  - "Cover component markup, and stop refusing it. The parser lowercases tag names, so <Button label=\"Save\" />, <Input label=\"Email\" />, <Select>, <Table> and <Form> were judged by the HTML element they shadow -- whose table has no `label` or `caption` source -- and every newly added one was refused. Component names colliding with HTML names is the norm in a design system, not an edge case. The original case survives only in the tokenizer's raw source text, which now distinguishes a component (capitalised, or dotted) and a custom element (hyphenated, which the HTML spec requires of them and forbids to its own) from an HTML element."
  - "A seventh state, nameless, carries the coverage: a component with no name prop. Whether <Thumbnail> needs a name is not decidable from markup, so absence is silent from every direction and only removal is refused -- (satisfied, nameless) and (suppressed, nameless) deny, every (nameless, *) is silent, and a test pins that property rather than the rows. That asymmetry is why this needs no per-framework component registry: React, Vue, Svelte, Angular, React Native, web components and a team's own components are covered by the same nine prop names in JSON. The table stays closed and total at forty-nine cells."
  - "A component is compared across revisions only when the markup gives it a stable identity (data-testid, id, name, src, href). Ordinal position is not identity: inserting one component would shift every later one onto a different element's state and invent a lost name out of the reordering."
- version: 0.3.0
  date: '2026-09-11'
  changes:
  - "Say what this policy does. hook.script declares the event its guard runs at, so enforcement becomes block rather than the advise this manifest carried while a commit hook was already refusing -- an understatement forced until now by the schema, which admitted artifact: hook only with a hook.gate whose kind is one of four declarative kinds and rejected block or verify without one. artifact stays rule on purpose: a hook artifact has no payload for rule text and renders its ambient surface from the gate spec, which a script-backed gate does not have, so claiming it would have traded the two hand-authored lines an agent reads for a near-empty stub."
  - "The declaration is load-bearing, not a label. The compiler wires exactly the events `on` names rather than whatever the implementations directory happens to contain, and DET-5 fails the build when a declared event ships no script or a shipped git-event script goes undeclared -- the second is why this entry could not simply be skipped: the engine now refuses the undeclared script this policy has shipped since 0.1.0."
- version: 0.3.1
  date: '2026-09-11'
  changes:
  - "Stop refusing a label being added. <button>Go</button>, <th>Q1</th> and <button>OK</button> had been refused since 0.1.0 by a global three-character minimum name length -- on a missing -> satisfied transition, someone ADDING a label, which is the one change this policy must never interrupt. min_length exists to catch two characters of alt text, which describe no image; it now applies only where the name is a description rather than the label a reader sees, derived from whether the element's row accepts a `text` source, so it follows the table rather than a second list. A component counts as labelled: its props carry labels as often as descriptions and the markup does not say which. Both directions stay pinned -- alt=\"Go\" on an image is still refused, and a link reading \"go\" is still refused by its own list."
  - "The false alarm was found by a suite rather than by a reader, and that suite now runs in CI. tools/check_a11y_rules.py drives the shipped script over every entry of the two rule files it executes -- 295 cases over 28 requirement rows: three per row (losing the required name, meeting the requirement, comparing a revision to itself), every suppression against every suppressible element, every component name prop removed and emptied, every void element, and every noise word, filename extension and link phrase rejected as a fix. It then runs the guard in a throwaway git repository, because evaluate can be right while the front end reads the wrong revision, skips the file by its suffix, or returns the wrong exit code -- and only the exit code refuses a commit. A requirement row must also cite a well-formed WCAG criterion and an anchor in a spec the rule file lists: a generated case proves the guard acts on a row, never that the row should exist. check_effects.py proved a guard does not write; nothing until now proved one decides correctly."
- version: 0.3.2
  date: '2026-09-11'
  changes:
  - "Stop refusing a template placeholder. A name the markup does not resolve is not a name, and the guard already knew that for a JSX or template expression -- alt={logo} and alt=\"{{ logo }}\" were left alone -- while alt=\"__ALT__\" was refused as placeholder wording, because the bare word reads as one. A build step fills __TOKEN__ in; no reader ever hears it. This one was not thought up: a coding agent hit it extracting three pages' shared markup into a parameterised partial, which is the correct answer to that task and the shape this repository's own conventions prescribe."
  - "The tests that developed this guard now live beside it. tools/check_a11y_table.py carries the decision table and the parser -- the forty-nine cells and the property that absence of a name on a component can never alarm, the only_when and by_type qualifiers, a name borne by a subtree, quality judged only where a change presents a fix, and markup this parser cannot resolve -- 64 cases over six fixtures, ported from the pytest suite of the prototype that built the mechanism. The guard had two homes and drifted between them twice; it has one now, and its tests came with it rather than staying with the copy that no longer exists."
- version: 0.3.3
  date: '2026-09-11'
  changes:
  - "Stop refusing a block that is correctly deleted. An unnamed element disappearing is how a violation gets resolved by deletion -- and it is also what happens to every legacy block holding one when the block is rightly removed. The gate could not tell those apart and refused both, so removing a deprecated widget was refused because it contained one unnamed image, the way old markup does. A live agent hit exactly that, doing what it was asked. The evidence is in the same diff: nobody hides a missing name by also deleting content that carried one, so when an element in a state an author deliberately created -- named, or explicitly marked decorative -- disappeared from the same file, the block went and the unnamed element went with it. The rule text is unchanged: resolving a violation by deleting the element is still refused, and still fires when the unnamed element goes alone while its named siblings stay."
  - "The unit is the file, because that is what the hook reads per path. Coarser than the block, which errs toward silence -- the direction a gate wired at block must err in, and the trade is stated rather than assumed: a deletion that removes an unnamed element in one part of a file and, for unrelated reasons, a named one elsewhere in it now passes. Four cases in tools/check_a11y_table.py hold both edges, including the residual this does not fix -- a file where nothing was ever named offers no evidence either way and is still refused -- so it stays a decision rather than becoming an accident. Over-broadening the rule to any deletion is caught by three of them."
- version: 0.3.4
  date: '2026-09-12'
  changes:
  - "See a name retracted by an ancestor. aria-hidden=\"true\" removes an element AND its subtree from the accessibility tree, so a wrapper carrying it silences every name inside while each alt stays in the markup, untouched -- and the guard compared attributes per element, so it saw nothing move. Six named icons were silenced with the gate silent. This was a false negative on the policy's headline transition, satisfied -> suppressed, reached by the attribute ARIA specifies for hiding a subtree rather than by anything exotic. A live agent found it: refused the narrower change, it put aria-hidden on the <nav>, reported removing all six icons from the accessibility tree, and the commit went through."
  - "The ancestry had to be tracked separately. `_stack` holds only elements this table has requirements for, and a <nav> or <div> is in neither it nor the table, so the scanner now keeps its own stack of tags that opened a hidden subtree and every node records whether one enclosed it. The known limit is pinned rather than left to be discovered: a subtree hidden by a nested tag of the same name ends at the inner close, which errs toward silence -- the direction a gate wired at block must err in."
  - "aria-hidden is no longer gated by `suppressible`. That list names elements where marking something decorative is a legitimate authored act, which is right for role and for an emptied alt; aria-hidden is not an element-specific assertion, and an <a> or a <button> losing its name to it loses it just the same. Eight cases in tools/check_a11y_table.py hold the edges: the wrapper, two levels up, the element itself on a tag the list omits, and -- silent, because nothing was retracted -- a subtree hidden in both revisions, the hiding removed again, a wrapper closed over an image that never had a name, and role=presentation on a container, which ARIA does not propagate to descendants."
- version: 0.3.5
  date: '2026-09-12'
  changes:
  - "Stop refusing the correct alt text for a well-named file. The quality rule that rejects a name merely repeating the src compared the name against the whole path with punctuation stripped, so alt=\"Home\" on /home.svg, alt=\"Search\" on /icons/search.svg, alt=\"Acme logo\" on /acme-logo.svg and alt=\"Jane Doe\" on /avatars/jane-doe.jpg were all refused. Naming a file after what it shows is good practice, and the word the file is named after is usually the right alt text, so the rule punished exactly the adopters who name their files well -- and it fired on a name being ADDED, which is a fix. Found while pinning the aria-hidden cases in 0.3.4 and reported then rather than folded into that change."
  - "What remains is the case the rule was for: a path segment pasted where a description belongs. Three conditions now, all of them evidence -- the name is one unspaced token, it is joined by punctuation no word carries inside itself, and the src spells it. alt=\"icons/home\" and alt=\"hero_banner\" are still refused; nav/primary on an unrelated src, \"Speed in km/h\", and every name above are not. The hyphen is deliberately excluded: it is the commonest filename separator and the commonest punctuation inside a word, so it cannot tell hero-banner from Sign-in or e-mail, and a hyphen-joined slug now goes unremarked. That cost is pinned by a case. This rule judges the quality of a name supplied as a fix, not either transition the policy exists for, so a weak name accepted is the cheaper error than a good one refused."
  - "Thirteen cases in tools/check_a11y_rules.py, 308 now. Nine of them failed against the shipped 0.3.4 -- eight false alarms on correct alt text plus the hyphen slug -- and each half of the new condition was removed on its own to show what it holds: dropping the src agreement refuses a path-shaped name the src does not spell; putting the hyphen back refuses Sign-in, e-mail and the slug case."
- version: 1.0.0
  date: '2026-09-13'
  changes:
  - "Graduate to production. The guards spec \u00a78 puts on the transition are met rather than waived: a schema-valid manifest, the security block present, and against the three eval cases it asks for, 13 declared cases plus 384 executable ones -- 308 in tools/check_a11y_rules.py over every row of the two rule files the guard reads, 76 in tools/check_a11y_table.py over the decision table and the parser. Production freezes this version: the next behaviour change is a new version, not an edit here."
  - "The number rests on six releases of being wrong in public. Five false alarms -- 0.1.1, 0.3.1, 0.3.2, 0.3.3, 0.3.5 -- and one false negative on the headline transition, 0.3.4, where aria-hidden on a wrapper silenced six named icons with the gate silent. Three of the five were found by running the guard against a live coding agent rather than by reading it. The premise replicates on a second vendor: asked to quieten a chatty page, two different agents destroyed names that no violation report flags, by three mechanisms, with every violation count identical before and after -- and in one the markup only GAINED an attribute. A refusal has been witnessed in a vendor's own client, not only in a harness."
  - "The residuals are named, because production is not a claim of completeness. A deletion is judged per file rather than per block, so removing an unnamed element while unrelated named content goes elsewhere in the same file passes (0.3.3). A subtree hidden by a nested tag of the same name ends at the inner close (0.3.4). A hyphen-joined slug pasted where a description belongs goes unremarked, the price of not refusing Sign-in (0.3.5). Each errs toward silence, the direction a gate wired at block must err in, and each is pinned by a case. One second-vendor run is void rather than green -- the partial the agent created could not be read back -- so 0.3.2's placeholder case stays witnessed on one vendor."
- version: 1.0.1
  date: '2026-09-13'
  changes:
  - "Name the fourth residual: a name that moves into a parameterised partial leaves this guard's reach. The unit of comparison is the file and identity is data-testid, id, name, src or href, so extracting a repeated block rewrites identity -- alt=\"__ALT__\" on an img whose src is __IMAGE__ is not the img the page carried. The pages therefore read as names disappearing and the partial as names arriving, and satisfied -> gone has been silent by design since 0.3.3, so nothing in that shape says whether each include still passes the page its own description. The guard never reads the call sites, and no revision of one file could."
  - "Measured, not reasoned: a live agent given three pages repeating a hero block did the right thing -- it parameterised both per-page names rather than collapsing three descriptions into one wording, which the task made the easier answer -- and the twenty-four transitions it produced are the same shape collapsing them would have produced. Correct and incorrect are indistinguishable here, which is why this is stated rather than left for an adopter to discover. Recorded at open-coder-ai/org-plan discovery/2026-09-13-codex-dedupe-hero-and-what-extraction-hides.md."
  - "Behaviour is unchanged and the rule text is deliberately unchanged with it: the guard cannot see this case, so naming it in the two lines an agent reads would assert an enforcement this policy does not have. A production version is immutable, so stating what 1.0.0 did not state costs a version and nothing else."
- version: 1.1.0
  date: '2026-09-29'
  changes:
  - "Judge the agent as well as the commit. hook.gate (kind: script, on: [tool_use], action: block) runs implementations/no-a11y-regression-write.py at PreToolUse, on the file as the write would leave it, and at Stop, on what the turn left on disk. It loads the commit guard from beside itself and calls its evaluate(), so the decision table is one table: the two surfaces cannot disagree. A regex could not express it, the check compares two revisions of a file."
  - "The baseline is the file on disk, or HEAD when disk already holds the written text (the turn's end), so a Stop judges the whole turn against the last commit. The commit script is unchanged and still owns the commit event: a gate and a script may not share a git event, and the gate declares tool_use only."
- version: 1.1.1
  date: '2026-09-30'
  changes:
  - "Metadata: source_repo points at chock-catalog, where this policy lives, not at chock."
- version: 1.1.2
  date: '2026-09-30'
  changes:
  - "Correct how the registry and the generated page describe the policy. They called it a commit-time guard script, which left out the hook.gate that has judged the agent at tool use since 1.1.0. tools/mechanism.py now names both, `commit-time guard script + tool-use script gate`, and the page says the tool-use point is best-effort (it needs the agent's hook installed and fails open if the hook crashes) while the commit stays the enforced one. The enforcement ceiling, enforced-at-commit, is unchanged, and so is behaviour: no script, rule text or gate moved."
- version: 1.1.3
  date: '2026-10-27'
  changes:
  - "Title wording only (IR-F40): \"No Accessibility Regression Rule\" is now \"Keep Accessibility From Regressing\". The id, guard and tests are unchanged."
- version: 1.1.4
  date: '2026-11-09'
  changes:
  - "Changelog order only (IR-F46): entries had been added at the top of a list that ran oldest-first, so it rose and fell by version; they now run oldest-first throughout. No entry's text or version, and no rule, guard or eval, changed. Patch bump because the manifest is part of the published pack hash."
- version: 1.1.5
  date: '2026-11-15'
  changes:
  - "Block a regression, not a new element or the wording of a name (hardening review REVIEW-no-a11y-regression, 2026-11-15, section 7 item 1). The guard now refuses only an element that had a name or a required attribute and lost it. A new element that lacks its name (gone -> missing) and the quality test on a supplied name now print a warning and exit 0, and min_length no longer applies to lang, so lang=\"en\" passes. A named element replaced by an unnamed one of the same tag in the same stretch of the file (an image swapped with its alt dropped, a label removed with the input's id renamed) is still a lost name and still blocks: the pairing key is what such an edit changes, so the elements are aligned by position in the diff. On the review's own pairs: caught 25 of 51 before and 23 of 51 after, correct work refused 36 of 58 before and 17 of 58 after; the two catches given up, R35 and R37 (a name lost while an element moves to another file), were caught only by refusing every new element, and are now named in the description's Misses text until cross-file pairing exists."
- version: 1.1.6
  date: '2026-11-17'
  changes:
  - "Status production -> draft (owner decision 2026-11-15, CAT-S1; review record discovery/2026-11-15-review-no-a11y-regression.md). Measured after 1.1.5: caught 23 of 51 regressions, correct work refused 17 of 58. Known to be wrong: framework attribute syntax is not read (Angular, Vue, Thymeleaf, JSP, ERB, Pug, Lit), an aria-label lost from an icon-only control is left unevaluated, an alt removed in some forms is missed, and there is no waiver a person can record. It returns to production when the hardening items are done and the counts are measured again. No rule, script or eval changed."
- version: 1.2.0
  date: '2026-11-28'
  changes:
  - "Read framework attribute syntax, labels that wrap their control, and a `>` inside a JSX attribute expression (R13-5a, from the hardening review's section 7 items 2 to 5). A bound attribute is the attribute it binds: Vue `:x` and `v-bind:x`, Angular `[x]` and `[attr.x]`, Thymeleaf `th:x`, and JSX `htmlFor` for `for`, listed in element_requirements.json. Its value is present and unknown, so it meets a requirement and is never judged for quality; Thymeleaf `th:attr` is not read. An input, select, textarea, meter or progress inside a `<label>` that has text, or a name-bearing child, is named. A `>` inside a `{...}` attribute value no longer ends the tag, so an arrow-function handler no longer hides the alt that follows it. The same spellings are read in plain .html, which tools/a11y_fixtures cases B01 to B04 record and do not tune."
  - "Every pair in tools/a11y_fixtures/review_pairs.json now carries `expect` (block, warn or silent) and tools/check_a11y_pairs.py fails any pair whose verdict differs, in place of the rule that failed any pair blocked where the review saw it allowed. tests/a11y/test_a11y_pairs.py holds two lists that only shrink: regressions not blocked, and correct work refused. Measured on the 120 pairs: caught 23 of 51 before and 29 of 51 after, correct work refused 17 of 58 before and 11 of 58 after. Newly caught: R17, R18, R19, R21, R29, R44, and P21 (outside the 51). Newly silent: N08, N17, N18, N19, N21, N22, and N37 to N41, N49, N50 no longer warn. No earlier catch was lost. A bound value that is empty, whitespace or valueless is no name, and a bound or brace value that is an empty literal (`''`, `\"\"`, a backtick pair, `undefined`, `null`) reads as the empty value, so `:alt=\"\"`, `[alt]`, `th:alt=\"\"`, `:alt=\"''\"`, an emptied `:lang`, and JSX `alt={\"\"}`, `alt={''}`, `alt={``}`, `alt={undefined}`, `alt={null}` block (cases X01 to X11); the JSX five were new catches over main, the first six already blocked there."
- version: 1.3.0
  date: '2026-11-28'
  changes:
  - "Treat an icon-only control as unnamed, and name a component by its children (R13-5b, from the hardening review's section 7 item 3). A `button`, `a[href]` or `summary` whose subtree has no text and whose element children lend no name is now missing a name, where it was left unevaluated, so losing its own aria-label blocks. A child lends a name when it is an `img` with a non-empty alt, an `svg` with a `<title>` or an aria-label, or any element with an aria-label; an aria-hidden child lends nothing, and neither does text inside one or the name of a glyph in an icon font (`<mat-icon>delete</mat-icon>`, class `material-icons`: `glyph_text` in element_requirements.json). A component with text children is named by that text, so removing a redundant aria-label or title from it, or moving a label prop into its children, is silent. A component inside one that carries a name prop is named by it, so moving a label to a wrapping `<Field>` is silent. `title` leaves the component name props, because a component's `title` is a plain prop (N55, Card title to heading); `label` stays, because dropping it loses R38 (label renamed to tooltip), a catch the review made."
  - "Also fixes a gap that predates this item: a wrapping `<label>` whose only text is aria-hidden is no longer a name (X12), and the same holds for any text inside an aria-hidden element. Measured on the 125 pairs (tools/check_a11y_pairs.py): caught 29 of 51 before and 34 of 51 after, correct work refused 11 of 58 before and 6 of 58 after. Newly caught: R03, R05, R16, R22, R46, and X13 and X12 outside the 51. Newly silent: N11, N12, N54, N55, N56. No earlier catch was lost. New cases X14 to X16 (a child img alt, a child svg title, an aria-hidden icon beside visible text) stay silent."
