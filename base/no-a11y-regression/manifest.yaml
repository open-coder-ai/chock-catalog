id: no-a11y-regression
name: "No Accessibility Regression Rule"
version: "0.3.2"
description: >
  trigger: remediating accessibility, editing markup, emptying or removing an alt, aria-label,
  label or lang that an element already had, deleting a flagged element.
  avoid: breaking a requirement the previous revision met; interrupting a correct fix.
artifact: rule
enforcement: block
effects: [read_only]
rule:
  text: |
    never(break): name|lang an element already had -- remove, empty(alt=""), aria-hidden, role=presentation|none; never(resolve_violation_by): delete(element)
    on(name_added): record, never_ask; alt="" asserts decorative and only its author may retract a description; present -> present (reworded label) is a copy decision, stay silent
hook:
  script:
    "on": [commit]
provenance:
  author: "chock-core"
  created_at: "2026-09-10T00:00:00Z"
  updated_at: "2026-09-11T15:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-09-10'
  changes:
  - "Initial draft. Rule text only: the two transitions it names are invisible to every violation-diffing tool, but no adapter wires a file-content guard, so no enforcement tier is claimed. Mechanism prototyped and tested at open-coder-ai/org-plan prototypes/a11y-guard."
- version: 0.0.2
  date: '2026-09-10'
  changes:
  - "Add the implicit eval case the `chock new policy` scaffold prescribes and this suite omitted: the same intent phrased obliquely, without naming the forbidden action. A reviewer asking for a chatty page to be quietened is asking for the refused transition without saying so, and the four existing categories all name the action outright. No mechanism change."
- version: 0.1.0
  date: '2026-09-10'
  changes:
  - "Ship the guard. implementations/no-a11y-regression-pre-commit.py compares the staged revision of every markup file against its predecessor and refuses the commit when an assertion the previous revision carried has disappeared. 24 elements and their accepted name sources live in implementations/data/element_requirements.json; the decision is a lookup in a closed sixteen-row table over the before and after states, so the script implements no accessibility rules of its own. effects: read_only, now observed rather than asserted -- tools/check_effects.py was blind to a Python guard and to an argv-less event script, and this release teaches it both."
  - "artifact and enforcement are unchanged, and not because nothing changed. The manifest schema admits artifact: hook only with a hook.gate whose kind is one of four declarative kinds, and manifest_block_needs_gate rejects enforcement block or verify without one -- so a script-backed gate cannot declare what it does. The honest enforcement ceiling is carried instead by the derived registry labels, which tools/check_registry.py now computes for a git-event script: commit-time guard script, enforced-at-commit. Making artifact: hook expressible for a script-backed gate is an engine change, not a catalog one."
- version: 0.1.1
  date: '2026-09-10'
  changes:
  - "Stop refusing correct markup. Five shapes alarmed that should never have: an icon link or button named by its child image's alt (plain HTML, and the parser gave the name to the image alone); a JSX component child or a `{...props}` spread, neither of which this parser can resolve; and an interpolated value like alt={logo}, refused because the variable's name happened to be a noise word. A sixth was the cause of the first: `<img src=...>` written without a closing slash looked like an open element, so every element after it counted as its child. A control that fires on a correct change has failed, and this one had five ways to."
  - "Adds a sixth state, unevaluated, for markup whose name is not decidable from the markup. Every transition into or out of it is silent, so the guard now errs toward saying nothing rather than toward refusing. A requirement no subtree could satisfy -- lang on <html> -- is exempt from that excuse, or removing lang would go quiet."
  - "A name's quality is judged only where the change presents it as a fix, not on a reword between two present names: the rule text already said a copy decision stays silent, and the code did not."
  - "Link-text noise is its own list, because 'Continue' names a button honestly while 'more' names no link. Phrases verified against the ambiguous-link-text list in Community-Access/accessibility-agents (MIT); four template suffixes come from the same repository's UI-file list."
- version: 0.2.0
  date: '2026-09-10'
  changes:
  - "Cover component markup, and stop refusing it. The parser lowercases tag names, so <Button label=\"Save\" />, <Input label=\"Email\" />, <Select>, <Table> and <Form> were judged by the HTML element they shadow -- whose table has no `label` or `caption` source -- and every newly added one was refused. Component names colliding with HTML names is the norm in a design system, not an edge case. The original case survives only in the tokenizer's raw source text, which now distinguishes a component (capitalised, or dotted) and a custom element (hyphenated, which the HTML spec requires of them and forbids to its own) from an HTML element."
  - "A seventh state, nameless, carries the coverage: a component with no name prop. Whether <Thumbnail> needs a name is not decidable from markup, so absence is silent from every direction and only removal is refused -- (satisfied, nameless) and (suppressed, nameless) deny, every (nameless, *) is silent, and a test pins that property rather than the rows. That asymmetry is why this needs no per-framework component registry: React, Vue, Svelte, Angular, React Native, web components and a team's own components are covered by the same nine prop names in JSON. The table stays closed and total at forty-nine cells."
  - "A component is compared across revisions only when the markup gives it a stable identity (data-testid, id, name, src, href). Ordinal position is not identity: inserting one component would shift every later one onto a different element's state and invent a lost name out of the reordering."
- version: 0.3.0
  date: '2026-09-11'
  changes:
  - "Say what this policy does. hook.script declares the event its guard runs at, so enforcement becomes block rather than the advise this manifest carried while a commit hook was already refusing -- an understatement forced until now by the schema, which admitted artifact: hook only with a hook.gate whose kind is one of four declarative kinds and rejected block or verify without one. artifact stays rule on purpose: a hook artifact has no payload for rule text and renders its ambient surface from the gate spec, which a script-backed gate does not have, so claiming it would have traded the two hand-authored lines an agent reads for a near-empty stub."
  - "The declaration is load-bearing, not a label. The compiler wires exactly the events `on` names rather than whatever the implementations directory happens to contain, and DET-5 fails the build when a declared event ships no script or a shipped git-event script goes undeclared -- the second is why this entry could not simply be skipped: the engine now refuses the undeclared script this policy has shipped since 0.1.0."
- version: 0.3.1
  date: '2026-09-11'
  changes:
  - "Stop refusing a label being added. <button>Go</button>, <th>Q1</th> and <button>OK</button> had been refused since 0.1.0 by a global three-character minimum name length -- on a missing -> satisfied transition, someone ADDING a label, which is the one change this policy must never interrupt. min_length exists to catch two characters of alt text, which describe no image; it now applies only where the name is a description rather than the label a reader sees, derived from whether the element's row accepts a `text` source, so it follows the table rather than a second list. A component counts as labelled: its props carry labels as often as descriptions and the markup does not say which. Both directions stay pinned -- alt=\"Go\" on an image is still refused, and a link reading \"go\" is still refused by its own list."
  - "The false alarm was found by a suite rather than by a reader, and that suite now runs in CI. tools/check_a11y_rules.py drives the shipped script over every entry of the two rule files it executes -- 295 cases over 28 requirement rows: three per row (losing the required name, meeting the requirement, comparing a revision to itself), every suppression against every suppressible element, every component name prop removed and emptied, every void element, and every noise word, filename extension and link phrase rejected as a fix. It then runs the guard in a throwaway git repository, because evaluate can be right while the front end reads the wrong revision, skips the file by its suffix, or returns the wrong exit code -- and only the exit code refuses a commit. A requirement row must also cite a well-formed WCAG criterion and an anchor in a spec the rule file lists: a generated case proves the guard acts on a row, never that the row should exist. check_effects.py proved a guard does not write; nothing until now proved one decides correctly."
- version: 0.3.2
  date: '2026-09-11'
  changes:
  - "Stop refusing a template placeholder. A name the markup does not resolve is not a name, and the guard already knew that for a JSX or template expression -- alt={logo} and alt=\"{{ logo }}\" were left alone -- while alt=\"__ALT__\" was refused as placeholder wording, because the bare word reads as one. A build step fills __TOKEN__ in; no reader ever hears it. This one was not thought up: a coding agent hit it extracting three pages' shared markup into a parameterised partial, which is the correct answer to that task and the shape this repository's own conventions prescribe."
  - "The tests that developed this guard now live beside it. tools/check_a11y_table.py carries the decision table and the parser -- the forty-nine cells and the property that absence of a name on a component can never alarm, the only_when and by_type qualifiers, a name borne by a subtree, quality judged only where a change presents a fix, and markup this parser cannot resolve -- 64 cases over six fixtures, ported from the pytest suite of the prototype that built the mechanism. The guard had two homes and drifted between them twice; it has one now, and its tests came with it rather than staying with the copy that no longer exists."
