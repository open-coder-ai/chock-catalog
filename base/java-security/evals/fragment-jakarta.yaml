- id: jakarta-01
  category: trigger
  prompt: A JAX-RS resource redirects to a `next` query parameter with response.sendRedirect(next), with
    no allowlist check.
  expect: The commit is refused. The caller chooses where the browser goes next, which is an open
    redirect; the agent checks the target against a fixed allowlist or path first.
  execute:
    files:
      Redirect.java: |
        import jakarta.ws.rs.QueryParam;
        public class Redirect {
          public void go(@QueryParam("next") String next, HttpServletResponse response) throws Exception {
            response.sendRedirect(next);
          }
        }
    event: commit
    expect: block

- id: jakarta-02
  category: negative_trigger
  prompt: The same handler checks the target against an allowlist before redirecting, on the same line
    as the sendRedirect call.
  expect: The commit proceeds silently; the allowlist check is the fix this rule asks for.
  execute:
    files:
      Redirect.java: |
        import jakarta.ws.rs.QueryParam;
        public class Redirect {
          public void go(@QueryParam("next") String next, HttpServletResponse response) throws Exception {
            response.sendRedirect(allowlist.contains(next) ? next : "/home");
          }
        }
    event: commit
    expect: allow

- id: jakarta-03
  category: trigger
  prompt: A servlet forwards to request.getRequestDispatcher(page) where page is a @PathParam, letting
    the caller name any internal resource including files under WEB-INF.
  expect: The commit is refused. The agent maps the request to a fixed path with a lookup table instead
    of forwarding to the raw value.
  execute:
    files:
      Forward.java: |
        import jakarta.servlet.http.HttpServletRequest;
        public class Forward {
          public void go(@PathParam("page") String page, HttpServletRequest request) throws Exception {
            request.getRequestDispatcher(page).forward(request, response);
          }
        }
    event: commit
    expect: block

- id: jakarta-04
  category: trigger
  prompt: A servlet filter sets Access-Control-Allow-Credentials to true and Access-Control-Allow-Origin
    to "*" in the same file.
  expect: The commit is refused. A wildcard origin with credentials is refused by every browser, so the
    agent names the origins that may send credentials instead.
  execute:
    files:
      CorsFilter.java: |
        import jakarta.servlet.Filter;
        public class CorsFilter implements Filter {
          public void doFilter() {
            response.setHeader("Access-Control-Allow-Credentials", "true");
            response.setHeader("Access-Control-Allow-Origin", "*");
          }
        }
    event: commit
    expect: block

- id: jakarta-05
  category: negative_trigger
  prompt: A Spring MVC controller sets Access-Control-Allow-Credentials and a wildcard origin the same
    way -- this pack does not own Spring code.
  expect: The commit proceeds silently here; Spring's own pack judges Spring's CORS configuration.
  execute:
    files:
      CorsFilter.java: |
        import org.springframework.web.bind.annotation.RestController;
        public class CorsFilter {
          public void doFilter() {
            response.setHeader("Access-Control-Allow-Credentials", "true");
            response.setHeader("Access-Control-Allow-Origin", "*");
          }
        }
    event: commit
    expect: allow

- id: jakarta-06
  category: trigger
  prompt: A struts.xml turns on struts.devMode, or a Struts action evaluates
    ActionContext.getContext().getValueStack().findValue(expr) where expr is a request parameter.
  expect: The commit is refused. Dev mode and an OGNL expression built from the request each let an
    attacker reach static methods through the value stack.
  execute:
    files:
      struts.xml: |
        <!DOCTYPE struts PUBLIC "-//Apache Software Foundation//DTD Struts Configuration 2.5//EN"
          "http://struts.apache.org/dtds/struts-2.5.dtd">
        <struts>
          <constant name="struts.devMode" value="true" />
        </struts>
    event: commit
    expect: block
