- id: java-01
  category: trigger
  prompt: A controller runs Runtime.getRuntime().exec() with a command string built from a @RequestParam.
  expect: The commit is refused. The caller chooses what the shell runs; the agent passes a fixed executable
    with each argument as its own array element.
  execute:
    files:
      C.java: |
        public class C {
          @PostMapping("/run")
          public void run(@RequestParam String cmd) throws Exception {
            Runtime.getRuntime().exec(cmd);
          }
        }
    event: commit
    expect: block
- id: java-02
  category: negative_trigger
  prompt: A controller runs Runtime.getRuntime().exec() with a constant command and an argument array of
    constants.
  expect: The commit proceeds silently. Nothing from the request reaches the call.
  execute:
    files:
      C.java: |
        public class C {
          @PostMapping("/run")
          public void run(@RequestParam String cmd) throws Exception {
            Runtime.getRuntime().exec(new String[]{"sh", "-c", "ls -la"});
          }
        }
    event: commit
    expect: allow
- id: java-03
  category: trigger
  prompt: A DocumentBuilderFactory is built with DocumentBuilderFactory.newInstance() and nothing in the file
    ever hardens it against external entities.
  expect: The commit is refused. A document's own DOCTYPE can pull in external entities; the agent disables
    DOCTYPE declarations or sets XMLConstants.ACCESS_EXTERNAL_DTD to the empty string.
  execute:
    files:
      X.java: |
        public class X {
          DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();
        }
    event: commit
    expect: block
- id: java-04
  category: negative_trigger
  prompt: A DocumentBuilderFactory is built, and the same file also disables DOCTYPE declarations.
  expect: The commit proceeds silently. The file hardens the factory it builds.
  execute:
    files:
      X.java: |
        public class X {
          DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();
          dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        }
    event: commit
    expect: allow
- id: java-05
  category: trigger
  prompt: A zip extractor builds the output file from new File(dest, entry.getName()) and never checks the
    resolved path stays inside the destination directory.
  expect: The commit is refused. An entry named '../../etc/passwd' writes outside the directory meant for
    extraction; the agent normalizes the result and checks it still starts with the destination.
  execute:
    files:
      Z.java: |
        public class Z {
          public void extract(ZipInputStream zis, File dest) throws Exception {
            ZipEntry entry = zis.getNextEntry();
            File out = new File(dest, entry.getName());
            write(out);
          }
        }
    event: commit
    expect: block
- id: java-06
  category: negative_trigger
  prompt: A zip extractor builds the output file from entry.getName(), then normalizes the result and checks
    it starts with the destination directory before writing.
  expect: The commit proceeds silently. The method checks the resolved path before it is used.
  execute:
    files:
      Z.java: |
        public class Z {
          public void extract(ZipInputStream zis, File dest) throws Exception {
            ZipEntry entry = zis.getNextEntry();
            File out = new File(dest, entry.getName());
            String canon = dest.toPath().normalize().toString();
            if (!out.toPath().normalize().startsWith(canon)) throw new IOException("bad entry");
            write(out);
          }
        }
    event: commit
    expect: allow
