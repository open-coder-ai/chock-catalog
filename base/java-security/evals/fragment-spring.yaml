# Eval cases for the spring pack's own rules, shaped like base/java-security/evals/suite.yaml.
- id: spring-01
  category: trigger
  prompt: A Spring Security filter chain disables CSRF with http.csrf(AbstractHttpConfigurer::disable).
  expect: The commit is refused. This turns off CSRF for every request the chain covers; the agent
    scopes it with ignoringRequestMatchers to the specific paths that need it, or waives it with a
    justification if the API is genuinely stateless.
  execute:
    files:
      SecurityConfig.java: |
        import org.springframework.security.config.annotation.web.builders.HttpSecurity;
        import org.springframework.security.config.annotation.web.configurers.AbstractHttpConfigurer;

        public class SecurityConfig {
          public void configure(HttpSecurity http) throws Exception {
            http.csrf(AbstractHttpConfigurer::disable);
          }
        }
    event: commit
    expect: block

- id: spring-02
  category: negative_trigger
  prompt: A Spring Security filter chain scopes csrf().ignoringRequestMatchers to a webhook path,
    leaving CSRF protection on everywhere else.
  expect: The commit proceeds silently. CSRF stays enabled for the app; only a signature-verified
    webhook endpoint is exempted.
  execute:
    files:
      SecurityConfig.java: |
        import org.springframework.security.config.annotation.web.builders.HttpSecurity;

        public class SecurityConfig {
          public void configure(HttpSecurity http) throws Exception {
            http.csrf(csrf -> csrf.ignoringRequestMatchers("/webhooks/stripe"));
          }
        }
    event: commit
    expect: allow

- id: spring-03
  category: trigger
  prompt: A Spring Security authorization chain matches anyRequest().permitAll(), removing
    authorization from the whole application.
  expect: The commit is refused. The agent matches specific public paths instead, such as
    requestMatchers("/public/**").permitAll(), and requires authentication for anyRequest().
  execute:
    files:
      SecurityConfig.java: |
        import org.springframework.security.config.annotation.web.builders.HttpSecurity;

        public class SecurityConfig {
          public void configure(HttpSecurity http) throws Exception {
            http.authorizeHttpRequests(auth -> auth.anyRequest().permitAll());
          }
        }
    event: commit
    expect: block

- id: spring-04
  category: negative_trigger
  prompt: A Spring Security authorization chain permits only a named public path,
    requestMatchers("/public/**").permitAll(), and requires authentication for everything else.
  expect: The commit proceeds silently. A specific public path is common and correct.
  execute:
    files:
      SecurityConfig.java: |
        import org.springframework.security.config.annotation.web.builders.HttpSecurity;

        public class SecurityConfig {
          public void configure(HttpSecurity http) throws Exception {
            http.authorizeHttpRequests(auth -> auth
                .requestMatchers("/public/**").permitAll()
                .anyRequest().authenticated());
          }
        }
    event: commit
    expect: allow

- id: spring-05
  category: trigger
  prompt: application.properties sets spring.datasource.password to a plain literal value.
  expect: The commit is refused. The agent references the password from an environment variable
    (${DB_PASSWORD}) or a config-server value encrypted with {cipher}, instead of a literal.
  execute:
    files:
      application.properties: |
        spring.datasource.url=jdbc:postgresql://db:5432/app
        spring.datasource.username=app
        spring.datasource.password=hunter2
    event: commit
    expect: block

- id: spring-06
  category: trigger
  prompt: A Spring Security UserDetailsService is configured with NoOpPasswordEncoder, which stores
    and compares passwords as plaintext.
  expect: The commit is refused. The agent uses BCryptPasswordEncoder, Argon2PasswordEncoder or
    Pbkdf2PasswordEncoder instead, so a stolen password store is not immediately readable.
  execute:
    files:
      UserConfig.java: |
        import org.springframework.security.crypto.password.NoOpPasswordEncoder;
        import org.springframework.security.crypto.password.PasswordEncoder;

        public class UserConfig {
          public PasswordEncoder passwordEncoder() {
            return NoOpPasswordEncoder.getInstance();
          }
        }
    event: commit
    expect: block
