# Eval cases for the persistence pack's new rules, shaped like base/java-security/evals/suite.yaml.
- id: persistence-01
  category: trigger
  prompt: A JdbcTemplate query is built by joining a request-derived name into the SQL text with +.
  expect: The commit is refused. The joined value controls the statement; the agent binds it with a placeholder.
  execute:
    files:
      UserDao.java: |
        import org.springframework.jdbc.core.JdbcTemplate;
        public class UserDao {
          public void run(JdbcTemplate jdbc, String name) {
            jdbc.query("SELECT * FROM users WHERE name = '" + name + "'", mapper);
          }
        }
    event: commit
    expect: block
- id: persistence-02
  category: negative_trigger
  prompt: A JDBC PreparedStatement binds its value with a ? placeholder instead of joining it into the SQL text.
  expect: The commit proceeds silently. A bind parameter carries the value; the text itself never changes.
  execute:
    files:
      UserDao.java: |
        import java.sql.Connection;
        public class UserDao {
          public void run(Connection conn) throws Exception {
            conn.prepareStatement("SELECT * FROM users WHERE name = ?");
          }
        }
    event: commit
    expect: allow
- id: persistence-03
  category: trigger
  prompt: A JDBC URL sets autoDeserialize=true, letting the server hand the driver a serialized object to deserialize.
  expect: The commit is refused. The flag must be removed regardless of which host the URL points at.
  execute:
    files:
      Db.java: |
        String url = "jdbc:mysql://db.example.com:3306/app?autoDeserialize=true";
    event: commit
    expect: block
- id: persistence-04
  category: trigger
  prompt: application.properties sets spring.jpa.hibernate.ddl-auto=create in the main configuration.
  expect: The commit is refused. Hibernate would rewrite the schema itself on deploy; the agent uses validate/none
    and a migration tool.
  execute:
    files:
      application.properties: |
        spring.jpa.hibernate.ddl-auto=create
    event: commit
    expect: block
- id: persistence-05
  category: negative_trigger
  prompt: The same ddl-auto=create setting appears only in an application-dev.properties profile, and a MongoDB
    document is parsed from a fixed, literal JSON string.
  expect: The commit proceeds silently. A dev-only profile is not the deploy configuration, and a fixed literal
    carries no attacker-controlled operators.
  execute:
    files:
      application-dev.properties: |
        spring.jpa.hibernate.ddl-auto=create
      M.java: |
        import org.bson.Document;
        public class M {
          public void run() {
            Document d = Document.parse("{ 'active': true }");
          }
        }
    event: commit
    expect: allow
