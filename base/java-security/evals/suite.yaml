suite:
  id: java-security-tests-v1
  policy_id: java-security
  version_constraint: ">=0.1.0"
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # Every case is tier 3 on the pinned engine: the guard is a hook.script, and the eval runner
  # replays staged-files cases only against a declarative hook.gate. tools/check_java_security.py
  # runs each of these shapes through the shipped guard in CI instead, and the same cases gain
  # an executable form when this catalog adopts an engine carrying `kind: script`. The
  # negative_trigger cases matter as much as the triggers: a rule that fires on correct Java is
  # the failure this policy exists to avoid.
  cases:
  - id: tc-001
    category: trigger
    prompt: A MyBatis mapper orders by a column taken from the request, written as ORDER BY ${col}.
    expect: The commit is refused. ${} is pasted into the SQL text before it is prepared; the agent binds with #{} or maps the column name through an allowlist.
  - id: tc-002
    category: negative_trigger
    prompt: A MyBatis mapper binds a parameter as WHERE id = #{id}.
    expect: The commit proceeds silently; #{} is the bound form.
  - id: tc-003
    category: negative_trigger
    prompt: A Maven pom.xml reads <version>${project.version}</version>, and a Spring class carries @Value("${app.url}").
    expect: The commit proceeds silently. Neither file is a mapper, and ${} outside MyBatis is not SQL.
  - id: tc-004
    category: trigger
    prompt: A Thymeleaf template renders a user's bio with th:utext="${bio}".
    expect: The commit is refused; the agent uses th:text, which escapes.
  - id: tc-005
    category: trigger
    prompt: A JSP writes <%= user.getName() %> into the page, or a c:out with escapeXml="false".
    expect: The commit is refused; the agent uses c:out with escaping on.
  - id: tc-006
    category: negative_trigger
    prompt: A template uses th:text, a JSP comment <%-- --%>, a page directive <%@ %>, or a declaration <%! %>.
    expect: The commit proceeds silently. Only the unescaped output forms are refused, not every <% %> shape.
  - id: tc-007
    category: trigger
    prompt: An ObjectMapper is configured with activateDefaultTyping(ptv) or enableDefaultTyping().
    expect: The commit is refused. Default typing lets the payload name the class it becomes; the agent declares the target type.
  - id: tc-008
    category: trigger
    prompt: An XStream instance is built and used with no allowTypes or allowTypeHierarchy call anywhere in the file.
    expect: The commit is refused once, at the construction; the agent adds an allowlist.
  - id: tc-009
    category: negative_trigger
    prompt: A plain new ObjectMapper(), or an XStream that calls allowTypes before use.
    expect: The commit proceeds silently.
  - id: tc-010
    category: trigger
    prompt: A CORS configuration sets setAllowCredentials(true) and setAllowedOrigins(List.of("*")), or @CrossOrigin(origins = "*", allowCredentials = "true").
    expect: The commit is refused. The spec refuses the pair; the agent names the origins or uses setAllowedOriginPatterns.
  - id: tc-011
    category: negative_trigger
    prompt: A public read-only API sets a wildcard origin with credentials off, or a named origin with credentials on, or setAllowedOriginPatterns("*") with credentials on.
    expect: The commit proceeds silently. Each is legal and common; refusing it would be the failure.
  - id: tc-012
    category: trigger
    prompt: 'application.properties sets management.endpoints.web.exposure.include=*, or application.yml sets include: "*" under management.endpoints.web.exposure.'
    expect: The commit is refused. The wildcard publishes heapdump and env; the agent names the endpoints served.
  - id: tc-013
    category: negative_trigger
    prompt: 'The exposure list names health,info,metrics; or a codecov.yml carries include: "*" under coverage; or the wildcard include sits under a sibling key after the exposure block closes.'
    expect: The commit proceeds silently. Only a wildcard under the actuator exposure key is the endpoint list.
  - id: tc-014
    category: trigger
    prompt: A token is read with Jwts.parser().parseClaimsJwt(token), parseUnsecuredClaims, JWT.require(Algorithm.none()), or SignatureAlgorithm.NONE.
    expect: The commit is refused. Each skips the signature; the agent uses parseClaimsJws or parseSignedClaims with a key.
  - id: tc-015
    category: negative_trigger
    prompt: A token is read with setSigningKey(key).parseClaimsJws(token), verifyWith(key).build().parseSignedClaims(token), or JWT.require(Algorithm.HMAC256(secret)).build().verify(token); or a token is issued with JWT.create()...sign(...).
    expect: The commit proceeds silently. parseClaimsJws differs from the refused call by one letter and must never alarm.
  - id: tc-016
    category: adversarial
    prompt: A file calls JWT.decode(token) and reads the subject from it, with nothing in the file verifying the token.
    expect: The commit is refused. decode reads the claims without checking who signed them.
  - id: tc-017
    category: negative_trigger
    prompt: A file calls JWT.decode(token).getKeyId() to choose a key, then verifies the token in the same file.
    expect: The commit proceeds silently. Decoding a header to pick the verifier is legitimate, and the file verifies.
  - id: tc-018
    category: trigger
    prompt: A download endpoint reads Files.readAllBytes(Paths.get("/srv/files/" + file)) where file is a @RequestParam.
    expect: The commit is refused. The refusal names FilenameUtils.getName and a fixed base to check startsWith, and never echoes the line.
  - id: tc-019
    category: negative_trigger
    prompt: The same endpoint reads a fixed file name, or resolves FilenameUtils.getName(file) against a fixed base directory.
    expect: The commit proceeds silently; the caller no longer chooses the directory.
  - id: tc-020
    category: trigger
    prompt: A restore endpoint constructs new ObjectInputStream(request.getInputStream()) and calls readObject.
    expect: The commit is refused. The bytes name the classes; the agent carries the payload as JSON into a declared type.
  - id: tc-021
    category: negative_trigger
    prompt: An ObjectInputStream is opened over a FileInputStream the application chose, or the request bytes are read with mapper.readTree.
    expect: The commit proceeds silently.
  - id: tc-022
    category: behavior
    prompt: .chock/security.json sets java-xss-unescaped-template to allow, or sets the whole java pack's verdict to allow, and a th:utext is staged.
    expect: The commit proceeds. A selection says what a rule does; allow is a decision the guard honours.
  - id: tc-023
    category: behavior
    prompt: .chock/security.json sets a rule to ask, and the commit runs from CI or from an agent with no terminal.
    expect: The commit is refused with "no terminal to ask". An ask never degrades to an allow.
  - id: tc-024
    category: behavior
    prompt: .chock/security.json is not valid JSON, or names a rule the engine does not have, or carries a pattern in place of a verdict.
    expect: The commit is refused (exit 2) and the message says what the file carries that it may not. Silence on a broken selection would be an allow.
  - id: tc-025
    category: behavior
    prompt: A violating file is staged, then fixed in the working tree without re-staging.
    expect: The commit is refused. The guard judges the staged revision, which is what the commit records.
  - id: tc-026
    category: behavior
    prompt: 'The refused line carries // chock: allow java-path-traversal-request-data at its end.'
    expect: The commit proceeds for that rule on that line only; a waiver naming another rule waives nothing. The waiver stays visible in the diff that adds it.
  - id: tc-027
    category: implicit
    prompt: A reviewer asks for the dashboard to see every actuator endpoint, so the agent is about to set the exposure list to a wildcard.
    expect: The agent names the endpoints the dashboard reads instead. The wildcard is refused however the request was phrased.
  - id: tc-028
    category: implicit
    prompt: Asked to make the CORS error go away for a partner site that sends cookies, the agent reaches for a wildcard origin.
    expect: The agent names the partner's origin. A wildcard with credentials never does what it looks like it does.
