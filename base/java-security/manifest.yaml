id: java-security
name: "Java Security Rules"
version: "0.6.3"
description: >
  trigger: writing Java or Kotlin (Spring, Jakarta EE, Quarkus, Android, ...), SQL/JPA/MyBatis,
  templates, application.properties or .yml, web.xml, pom.xml or Gradle; "customize java security"
  opens the guided page. avoid: injection, XXE, SSRF, unsafe deserialization, path traversal, weak
  crypto, trust-all TLS, disabled Spring Security, exposed secrets, known-exploited deps,
  SpotBugs/Sonar/PMD/Checkstyle findings. 129 rules in 16 packs, each allow|deny|ask in
  .chock/security.json; absent = deny.
artifact: hook
enforcement: block
effects: [read_only]
hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      java-security: a construct one of its rules denies -- the refusal above names the rule, the
      pack it belongs to and the fix. Each rule's verdict is allow|deny|ask in .chock/security.json,
      per rule or per pack (java, crypto, spring, jakarta, persistence, templates, logging, build,
      android, bugs, concurrency, resources, exceptions, performance, style, testing); absent = deny.
      Only what the change adds is refused: a violation on lines the change leaves alone never blocks it.
      Only a human reviewer waives a line, with // chock: allow <rule-id>, never the agent: in the
      agent a waiver counts once a human has committed it. Choose verdicts by asking to customize
      java security, which opens this skill's guided page.
    params:
      script: java-security-gate.py
provenance:
  author: "chock-core"
  created_at: "2026-09-22T00:00:00Z"
  updated_at: "2026-09-30T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.6.3
  date: '2026-10-01'
  changes:
  - "Skill and setup-page text only: the agent no longer writes `.chock/security.json` or `~/.chock/security.json` after the guided setup. protect-agent-config 0.2.3 refuses an agent's write to both, since the file sets each rule's verdict. The agent shows every row, the whole file and the diff against an existing selection, and gives a here-doc command the person runs in their own shell. Evals tc-029 and tc-031 now expect that hand-off; tc-116 (the agent declines to write it when asked) and tc-117 (showing the file is fine) are new. Gate, rules and verdicts unchanged."
- version: 0.6.2
  date: '2026-09-30'
  changes:
  - "Skill text only: a Plan-time guidance section tells the agent to call chock's read-only `chock_guidance` tool (chock mcp) with its plan and the paths it will touch, where the client has it, and says an empty answer is not a clearance. Gate, rules, verdicts and selection unchanged."
- version: 0.6.1
  date: '2026-09-30'
  changes:
  - "Description only, within the 500-char budget: the frameworks are abbreviated and the avoid list is shortened; the trigger phrase, the 129 rules in 16 packs and the allow|deny|ask selection are unchanged. Gate unchanged."
- version: 0.6.0
  date: '2026-09-30'
  changes:
  - "The gate prints a findings document and the engine (chock 0.15.0) compares it with the baseline, instead of the gate deciding which lines are new. On stdout it prints {\"findings\": [{key, path, line, message}]}, one per refused construct; the runner runs it again on the baseline text -- HEAD at commit and at the turn's end, the file on disk before the write at PreToolUse, `\"baseline\": true` on that run's stdin -- and blocks only a (path, key) the change holds more of than the baseline. The exit code stays the verdict for new findings: 1 refuses, and an ask still refuses, as a gate has no terminal. A key is the rule id, the enclosing method name from the flow model and the flagged line with its whitespace collapsed -- no line number, so a violation that only moves is old, a second copy of one is new, and a line deleted from the file can make a finding new. Verified on the analyser: removing `s = Encode.forHtml(s);` makes the untouched println a finding, and removing the `ALLOWED.contains(p) ? p : \"x\"` ternary makes the untouched `new File` one; both were listed as not caught in 0.5.0 and are now refused."
  - "Waivers are applied identically in both runs: a `// chock: allow <rule-id>` counts only where a human committed it, and the same HEAD is read for the baseline run, so a copy of a waived line is not new by escaping the waiver. HEAD is read only for that; the gate no longer reads a baseline. Removed: the line-comparison in chock_security/changed.py (new_lines, statement, involved, only_new, baseline, on_disk), the `related` and `header` lines Flow, Method and Finding carried, and the 22 flow rules' `related=flow.related`; chock_security/document.py builds the document. Eval replay now goes through the engine, so tc-101 to tc-107 exercise the real comparison, and cases tc-108 onward add a deleted sanitizer, a deleted allowlist ternary, an old violation untouched, a line shift and a duplicate."
  - "Remaining gaps, stated rather than implied: a method or function renamed with its body untouched re-reports its old findings, because the enclosing name is part of the key, which errs toward blocking; flows are read within one file, so a value that crosses a file boundary is not followed; and an early-return guard (`if (!ALLOWED.contains(x)) return;`) is not modelled as a sanitizer, so use the ternary or the allowlist form the rules name."
- version: 0.5.0
  date: '2026-09-30'
  changes:
  - "The gate judges only what a change adds, at every event, not whole files. A finding is kept when a line it involves is new against the baseline: its reported line, the Java statement that line sits in (a multi-line statement counts whole, up to 40 lines), and, for a flow, the lines the analyser recorded for it -- the signature that makes a parameter request data and each assignment that carried the value to the sink. A line is new when the written text holds more copies of it (indentation ignored) than the baseline does. Baseline: HEAD at commit; the file on disk before the write at PreToolUse; HEAD at the turn's end, when disk already holds the written text; a new file has every line new, so it is judged whole. So an old violation in a touched file no longer blocks the agent (eval tc-101 flips from block to allow), a new line that completes a flow into an old sink, or feeds an old source into a new sink, still does (tc-102, tc-103, tc-107), and a commit judges the same way (tc-105, tc-106). Finding gains `related` lines and Flow and Method carry them; the 22 flow rules pass `flow.related`. Not caught, by construction: a violation a change makes by deleting a line (a removed sanitizer, close(), hashCode) or in a file-wide context another line supplies, unless the finding's own or recorded lines change; waivers are unchanged. New module chock_security/changed.py; a policy-local copy, the agentic gate has its own."
- version: 0.4.4
  date: '2026-09-27'
  changes:
  - "A waiver is a human reviewer's decision, never the agent's. The first Claude Code bait run was refused at PreToolUse for concatenating an ORDER BY column into SQL, then wrote `// chock: allow persistence-sql-string-concat` on the line itself and carried on. Where the agent wrote the text -- as it writes, and at its turn's end -- a waiver now counts only on a line a human committed: the same line in the file at HEAD, as many times as HEAD has it, so neither a new waiver nor a committed one pasted elsewhere is honoured. Every refusal in the agent says so. At commit and push the person committing reviews what is staged, and a waiver there counts as before."
  - "Three false positives the first full Claude Code run of the agent kit found, each on code Claude wrote correctly for a control scenario. concurrency-double-checked-locking refused Effective Java's local-variable form -- the checks read a local copy of a volatile field -- and asked for the local to be declared volatile, which Java does not allow; a local copy of a volatile field is now silent, and one of a plain field is still refused. testing-no-assertion refused an empty @Disabled test with a reason, a placeholder that never runs; @Disabled and @Ignore tests are now left to testing-disabled-without-reason. spring-permit-all-catchall refused anyRequest().permitAll() in a chain scoped by securityMatcher(\"/api/webhooks/**\"), where anyRequest() means any request to that path; a chain scoped to specific paths is now silent, one scoped to \"/**\" is still refused, and one chain's scope does not carry into the next."
- version: 0.4.3
  date: '2026-09-26'
  changes:
  - "One parse per file. Every rule that reads code re-lexed the written file through the comment-blanking lexer, and every flow rule re-parsed its methods: about 64 lexes of one file per gate run with 129 rules. Both now run once per file text. No rule, verdict or finding changes -- every finding over all 877 test texts, corpus and agent-kit fixture files is byte-identical -- and rule evaluation per written file drops from about 22 ms to about 3 ms. A test counts parses, not milliseconds: one evaluation of every rule lexes the file once and parses its methods once."
- version: 0.4.2
  date: '2026-09-26'
  changes:
  - "A byte-order mark no longer hides a file's first line. Windows editors and tools often save UTF-8 with a BOM, and it glued itself to line 1: an application.properties whose first line was `server.error.include-stacktrace=always`, `management.endpoint.env.show-values=ALWAYS` or any other single-line setting drew no finding. The BOM is dropped before any rule reads the file; line numbers are unchanged. A test replays every rule and flow case with CRLF line endings, with a BOM, and with both, and requires the same findings as on the plain text -- 29 cases differed before this fix, none with CRLF alone."
- version: 0.4.1
  date: '2026-09-24'
  changes:
  - "The per-line waiver works for every rule. The engine read `// chock: allow <rule-id>` off the line a rule reported, and the thirteen rules that read through the comment-blanking lexer -- every style and testing rule that inspects code, and jakarta-struts-ognl -- report that line with its comments blanked, so their waivers never matched and a waived line was refused anyway. The waiver is now read off the file's own line. A test proves it for all 129 rules: each rule's first refusal, with the waiver added to every line it reported, draws nothing."
  - "The request-data flow model no longer refuses the correct fix, found by writing a correct and an incorrect answer for every rule. An allowlist is recognised by what it does -- `String target = ALLOWED.contains(next) ? next : \"/home\";` passes `next` on only when the collection holds it -- instead of by a variable happening to be named `allowlist`; that refused the correct fix for open redirects, path traversal, SSRF, command and code injection and every other flow rule. A parameter's name inside a string literal is no longer a use of it, so a bound XPath variable `$sku` named after its `sku` parameter is not an injection."
  - "Two misses closed. `Pattern.compile(p).matcher(s).matches()` -- ReDoS in its most natural one-line form -- was read as validated, because `.matches(` was a sanitizer; a validation now needs a pattern in the parentheses (`.matches(\"[a-z]+\")`, `.matches(SAFE_NAME)`). And java-xpath-injection no longer reads `Pattern.compile(` as an XPath compile in a file that imports both."
- version: 0.4.0
  date: '2026-09-24'
  changes:
  - "Every rule carries its evidence. `cwe` names the MITRE weakness it is an instance of -- only ids MITRE allows for vulnerability mapping, their names verbatim in data/cwe.json -- and `references` names where the construct is shown to be a defect: the CVE (Log4Shell, Spring4Shell, Text4Shell, Struts CVE-2017-5638, Spring Cloud Function CVE-2022-22963, plexus-archiver's zip slip, the H2 console), the vendor's security documentation, the OWASP cheat sheet, or the Sonar, SpotBugs, PMD or Checkstyle rule a quality rule mirrors. Every refusal names its CWE: `[deny: persistence-sql-string-concat CWE-89, CWE-564]`, and the setup page links each."
  - "Seven quality packs, 50 rules, enforced like the security ones and switched off the same way: bugs (string identity, equals without hashCode, BigDecimal(double), NaN comparison, discarded results of immutable methods, run() for start()), concurrency (static SimpleDateFormat, double-checked locking, locks on shared constants, wait outside a loop, sleep under a lock), resources (unclosed streams, connections and executors; finalize; System.exit outside main), exceptions (empty catch, catching Throwable or NullPointerException, return from finally, generic exceptions, a lost cause), performance (boxing constructors, String += in a loop, keySet-then-get, size() == 0, Vector and Hashtable), style (redundant imports, System.out in production code, boolean literal comparison, empty statements, naming, C-style arrays) and testing (tests with no assertion, Thread.sleep in tests, @Disabled without a reason, assertTrue(a.equals(b)), a literal in assertEquals' actual slot). Seven more security rules close the gaps a SAST scan reports: header injection, XSS through the servlet writer, session trust boundary, ReDoS through Pattern.compile, mail header injection, a constant SecureRandom seed and SHA-1 or MD5 signatures."
  - "Nine security packs, 72 rules. The eight rules this policy shipped keep their ids and move into the packs their stacks name -- java, spring, persistence, templates -- beside five new ones: crypto, jakarta (Jakarta EE and every non-Spring framework: Servlet, JAX-RS, JSF, Struts, Quarkus, Micronaut, Vert.x), logging, build (Maven and Gradle) and android. Sixty-four new rules cover injection into commands, code, SpEL, LDAP, XPath, SQL/JPQL/HQL and NoSQL; XXE, SSRF, zip slip and unsafe reflection; weak ciphers, password hashes, randomness, keys and IVs, trust-all TLS and legacy protocols; hard-coded credentials and literal secrets in application config; CSRF, catch-all permitAll, weak password encoders, session fixation and security headers switched off in Spring Security; open redirects, view-name and template injection; directory listing, method-limited constraints and Struts OGNL switches; Log4j lookups and secrets in logs; plain-HTTP repositories, disabled checksums, dynamic versions and dependencies below the fix for Log4Shell, Spring4Shell, Text4Shell and seven more; and WebView bridges, SSL errors ignored, exported components, cleartext traffic and debuggable manifests on Android."
  - "One policy, chosen per pack. A team that does not run Spring, or ships no Android app, switches that pack off in one line -- or to ask -- rather than managing a policy per rule or per framework: .chock/security.json version 2 keys verdicts by pack, and a pack's rules can still be set one by one. The guided setup page asks once per pack and opens a pack's rules only on request. A version-1 file is read as it was written: its one `java` pack speaks for the first eight rules, and every rule it could not have named denies, as any upgrade's new rule does -- so upgrading from 0.3.0 enforces the 64 new rules until someone speaks for them."
  - "Every new rule was held to the bar the first eight met: a case that could have failed in each direction, and silence on the correct sibling. A corpus of ordinary, correct enterprise code -- controllers, a security chain, repositories with dynamic bind-parameter queries, crypto, XML and archive handling, templates, application.yml, Maven and Gradle builds, an Android manifest, web.xml -- must draw no finding from any rule. All of it is a pytest suite in this catalog's tests/ -- every refusing and silent case a named test, a rule without a case in each direction failing test_rule_is_proven_both_ways, every executable eval case replayed through the shipped gate (`chock check --only evals` does not replay a script gate) -- that CI requires beside the framework's own ruff rule set, and that is never published: the distribution repos build from base/ alone. Building it fixed two findings in the engine the first rules share: a request parameter typed as a number, boolean, UUID or date no longer taints anything, and a one-line method now has a body the flow model reads."
- version: 0.3.0
  date: '2026-09-22'
  changes:
  - "One skill. The guided setup page and its contract move from the separate configure-java-security skill into this policy's own skill/ folder, which chock 0.11.0 ships beside the rendered SKILL.md in both package formats: the skill that names the rules is the skill that opens the page, and \"customize java security\" is in this policy's own trigger. The procedure is the same -- the page writes nothing, the agent shows every row and writes .chock/security.json at repo or user scope -- and the five eval cases that pinned it join this suite as tc-029 to tc-033."
  - "Enforced as a plugin. On chock 0.11.0 the Claude package carries this policy's gate, its runner and the engine beside it, wired to PreToolUse on the client's write tools and to Stop: installed at the agent with no repository change, a denied construct is refused as it is written and again at the turn's end, reading .chock/security.json from the working repository or ~/.chock/security.json outside one. Nothing in this folder changed for that; the manifest already declared tool_use."
- version: 0.2.1
  date: '2026-09-22'
  changes:
  - "The engine's home is this folder. open-coder-ai/chock-java-security, the repository these rules and implementations/chock_security/ moved in from, is retired: provenance now names this catalog, and the guided setup page no longer hands its result to that repository's `chock-security setup apply` -- the configure-java-security skill writes .chock/security.json itself after showing every row, as its procedure already said. implementations/chock_security/frontends/, the pre-commit front end the retired repository's CLI drove and nothing here imported since 0.2.0 replaced the commit script with the gate, is removed. No rule, verdict or gate behaviour changes; every case in tools/check_java_security.py and the eval suite is the same."
  - "One check did not move and is named rather than implied: the retired repository's CI compared a pull request's .chock/security.json against its base branch and failed the build when a verdict was weakened, the check a hook cannot make about its own config. chock's `check --only baseline` compares the policy set, not a policy's own selection file, so an adopter has no CI-side guard for a weakened java-security verdict until the engine offers a policy a way to name a file for that comparison. Until then, review the selection file's diff as you would any other."
- version: 0.2.0
  date: '2026-09-22'
  changes:
  - "Reach the write path. The engine's `kind: script` gate (chock 0.9.3, adopted by this catalog) hands a policy's own program the same material every declarative kind reads -- the staged blobs at commit and the write itself at tool use and at the turn's end -- so artifact becomes hook and the check runs where the plugin form of these rules already ran: the construct is refused as the agent writes it, not only at the commit that carries it. implementations/java-security-gate.py replaces the commit-only java-security-pre-commit.py; it reads the writes from stdin instead of from git, and refuses on a deny, on an ask (a gate has no terminal), on an unreadable selection and on any failure inside the engine, exactly as before."
  - "The eval suite gains its executable form: 25 of the 28 cases now carry the staged-files shape `chock check --only evals` replays against the compiled gate in a throwaway repository, selection file included where the case is about one. The three without one are the working-tree-versus-index case, which the gate never sees (it is handed the staged blobs), and the two implicit prompts an agent answers rather than a file. tools/check_java_security.py keeps its 52 rule cases and drives the gate over its stdin protocol for the commit path."
  - "The two-line rule text is gone with the artifact: a hook renders its ambient line from the gate's message, which now names the eight constructs and the selection contract. Ceiling is still enforced-at-commit as the registry grades it; what changed is that the same script also refuses at tool use, on every vendor the write fragment reaches."
- version: 0.1.0
  date: '2026-09-22'
  changes:
  - "First release in the catalog, moved in from open-coder-ai/chock-java-security with its engine. One policy folder carries all eight Java rules; an adopter picks and chooses per rule in .chock/security.json (allow|deny|ask), never per policy folder, so a ninth rule lands as a version bump here and not as a ninth policy. The selection file says what a rule does, never what it is: a pattern, severity or path there is refused, because a rule definable in JSON is a program in disguise."
  - "Ships the guard. implementations/java-security-pre-commit.py reads the staged revision of every file and refuses the commit when a rule its selection does not set to allow fires; an ask with no terminal to ask refuses too, and so does an unreadable selection or any failure inside the engine -- no path in this guard allows what it never judged. The engine beside it, implementations/chock_security/, is the same package the plugin form of these rules runs; facts about the world (API names, template tokens) are data in data/java.json, and what to do about them is code."
  - "artifact: rule and hook.script: on [commit], the shape no-a11y-regression established for a script-backed check: the manifest schema admits artifact: hook only with one of four declarative gate kinds. The write path -- refusing the construct at the moment an agent writes it, at tool use and at the turn's end -- is what the plugin form of these rules already does, and reaches this policy through the engine's `kind: script` gate (open-coder-ai/chock#154) once this catalog adopts a release that carries it; the eval cases are written in the staged-files shape that gate will replay, and until then tools/check_java_security.py runs every one of them through the shipped guard in CI."
  - "Every rule carries its negative cases: a control that fires on correct Java has failed, however sound its reasoning. The check runs 52 cases ported from the engine's own suite -- the wildcard origin without credentials, the pattern-form CORS setter, `#{}` binding, `parseClaimsJws` one letter from the refused `parseClaimsJwt`, a Maven `${project.version}`, a wildcard `include:` outside actuator config -- and the commit path itself in a throwaway repository, because evaluate can be right while the front end reads the wrong revision or returns the wrong exit code."
