id: block-invisible-unicode
name: "Block Bidi and Tag Unicode"
version: "0.0.6"
description: >
  Blocks bidi override/embed/isolate controls (U+202A-202E, U+2066-2069; Trojan Source,
  CVE-2021-42574) and Unicode tag characters (U+E0001-E007F), which smuggle instructions. NOT
  matched: ZWSP U+200B, U+2060, U+FEFF, U+061C, variation selectors, ZWJ/ZWNJ, LRM/RLM. Runs:
  commit, agent write, turn's end. Waiver: 'pragma: allowlist invisible-unicode' same line.
  Person's commit: honoured. Agent: only if that line is already in HEAD; MCP gateway: never.
  Agent asks a person.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Bidi-control or Unicode tag characters detected in this change. They change how code
      reads to a human or hide instructions an agent will still obey. Remove them. Waiver:
      'pragma: allowlist invisible-unicode' on the same line. A person's commit honours it; in
      the agent (write, the turn's end, an agent's commit) only a line already in HEAD counts,
      and the MCP gateway never does. An agent asks a person; it never writes the pragma.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+invisible-unicode'
      # \u escapes, never literal characters: the pattern must not carry the bytes it
      # blocks, or committing this policy folder would trip its own gate (#32 class).
      content_pattern: '[\u202A-\u202E\u2066-\u2069\U000E0001-\U000E007F]'

compliance:
  mitre_atlas:
  - control: AML.T0051
    coverage: partial
    note: "blocks the hidden-character carrier of indirect injection; semantic injection stays advisory"
  owasp_asi:
  - control: ASI01
    coverage: partial
    note: "blocks the hidden-character slice of goal-hijack payloads a diff can show; semantic injection defense remains advisory (injection-defense, owasp-asi01-agent-goal-hijack)"
  owasp_llm_2025:
  - control: LLM01
    coverage: partial
    note: "Prompt Injection: blocks the bidi and tag-character carriers of hidden instructions; other invisible characters and plain-text injection are not judged"

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release. Anchors: OWASP LLM01/ASI01, MITRE ATLAS AML.T0051 (indirect), CVE-2021-42574 (Trojan Source)."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.3
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so the same pattern enforces as the agent writes (mcp-gateway / agent guard) and not only over a git diff -- the write-time point matters most here, since tag-block smuggling targets exactly what the agent writes and reads. No pattern change. Message generalized from 'staged changes' to 'this change' and notes the allowlist pragma is a commit-review concept NOT honored at tool-use (live, attacker-controllable tool argument -- a match always blocks, matching the gateway's content_regex semantics)."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, an agent's commit (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT or agent_commit_env)) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Rename (display name only, id unchanged): 'Block Invisible Unicode' becomes 'Block Bidi and Tag Unicode', since only bidi controls (U+202A-202E, U+2066-2069) and tag characters (U+E0001-E007F) are matched."
  - "Disclosure, no behaviour change: the description lists what is not matched -- ZWSP U+200B, U+2060, U+FEFF, U+061C, variation selectors, ZWJ/ZWNJ and LRM/RLM. The gate message names what it matches and carries the standard waiver sentence. The description names where each check runs and fits the 500-char budget."
- version: 0.0.6
  date: '2026-10-02'
  changes:
  - "Metadata, no behaviour change: the OWASP LLM01 anchor named in the 0.0.1 entry is now machine-readable, compliance.owasp_llm_2025: LLM01 (partial), checked by tools/check_registry.py against the OWASP Top 10 for LLM Applications 2025."
