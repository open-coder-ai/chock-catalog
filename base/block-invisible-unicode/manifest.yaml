id: block-invisible-unicode
name: "Block Invisible Unicode"
version: "0.1.0"
description: >
  Blocks hidden Unicode in added lines: bidi, tag and plane-14 chars, word joiner,
  chained invisibles, zero-width/joiners/fillers by ASCII, mid-line BOM, LRM/RLM outside
  RTL text, selectors after ASCII, private-use runs of 16+. Allows emoji, RTL/Indic/Thai/CJK
  text, line-start BOM. Not caught: homoglyphs, a joiner between non-ASCII, binary
  files and text after U+2028 at commit. Runs: commit, agent write, turn's end. Waiver:
  'pragma: allowlist invisible-unicode' same line; agent: HEAD only.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Hidden Unicode detected in this change: a bidi control, a tag character, a word joiner,
      two invisible characters in a row, a zero-width character, joiner or filler beside ASCII,
      a BOM after the start of a line, a direction mark outside right-to-left text, a variation
      selector after ASCII, or a long private-use run. It changes how code reads to a human or
      hides instructions an agent will still obey. Remove it; where the character is meant,
      write it as an escape sequence instead. Waiver: 'pragma: allowlist invisible-unicode' on
      the same line. A person's commit honours it; in the agent (write, the turn's end, an
      agent's commit) only a line already in HEAD counts, and the MCP gateway never does. An
      agent asks a person; it never writes the pragma.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+invisible-unicode'
      # \u escapes, never literal characters: the pattern must not carry the bytes it
      # blocks, or committing this policy folder would trip its own gate (#32 class).
      # Judged one line at a time. Alternatives, in order:
      #  1 always: bidi embed/override/isolate 202A-202E and the whole 2060-206F block (word
      #    joiner, invisible operators, isolates, deprecated format controls), noncharacters
      #    FDD0-FDEF FFFE FFFF, interlinear annotation FFF9-FFFB, lone surrogates (reachable only
      #    through an agent's tool input), the tag block E0000-E007F (subdivision flags too) and
      #    the unassigned plane-14 ranges E0080-E00FF, E01F0-E0FFF
      #  2 any two adjacent invisible or default-ignorable characters (soft hyphen, CGJ, ALM,
      #    Hangul fillers, Khmer inherent vowels, Mongolian selectors, 200B-200F, 2060-206F,
      #    variation selectors, BOM, musical format controls, plane 14), except FE0F then ZWJ,
      #    which every emoji ZWJ sequence uses: no legitimate text chains two of them
      #  3-4 ZWSP, ZWNJ, ZWJ, Mongolian vowel separator, Khmer inherent vowels or a Hangul filler
      #    beside an ASCII word character, or with ASCII (or a line edge) on both sides; between
      #    two non-ASCII characters (emoji, Persian, Indic, Malayalam, Thai, CJK) they pass
      #  5 BOM FEFF anywhere but the start of a line
      #  6-7 ALM/LRM/RLM 061C 200E 200F between two ASCII word characters, or on a line with no
      #    right-to-left letter; on a line of RTL prose they pass (the ask class)
      #  8-9 a variation selector after an ASCII letter, digit or underscore (unless a keycap
      #    follows), or a supplementary one (E0100-E01EF) not after a CJK ideograph
      #  10 private use E000-F8FF F0000-10FFFD in runs of 16+: icon-font prompts and status
      #    bars stay well under it, encoded payloads do not
      content_pattern: '[\u202A-\u202E\u2060-\u206F\uFDD0-\uFDEF\uFFF9-\uFFFB\uFFFE\uFFFF\uD800-\uDFFF\U000E0000-\U000E00FF\U000E01F0-\U000E0FFF]|(?!\uFE0F\u200D)[\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180B-\u180F\u200B-\u200F\u2060-\u206F\u3164\uFE00-\uFE0F\uFEFF\uFFA0\uFFF9-\uFFFB\U0001D173-\U0001D17A\U000E0000-\U000E0FFF][\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180B-\u180F\u200B-\u200F\u2060-\u206F\u3164\uFE00-\uFE0F\uFEFF\uFFA0\uFFF9-\uFFFB\U0001D173-\U0001D17A\U000E0000-\U000E0FFF]|(?<=[A-Za-z0-9_])[\u115F\u1160\u17B4\u17B5\u180E\u200B-\u200D\u3164\uFFA0]|[\u115F\u1160\u17B4\u17B5\u180E\u200B-\u200D\u3164\uFFA0](?=[A-Za-z0-9_])|(?:^|(?<=[\x00-\x7F]))[\u115F\u1160\u17B4\u17B5\u180E\u200B-\u200D\u3164\uFFA0](?:$|(?=[\x00-\x7F]))|(?<!^)\uFEFF|(?<=[A-Za-z0-9_])[\u061C\u200E\u200F](?=[A-Za-z0-9_])|^(?!.*[\u0590-\u061B\u061D-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFC\U00010800-\U00010FFF\U0001E800-\U0001EFFF]).*[\u061C\u200E\u200F]|[A-Za-z0-9_][\uFE00-\uFE0F\U000E0100-\U000E01EF](?!\u20E3)|(?<![\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\U00020000-\U0003FFFF])[\U000E0100-\U000E01EF]|[\uE000-\uF8FF\U000F0000-\U0010FFFD]{16,}'
      # Not matched (limits): homoglyphs, mixed-script and fullwidth identifiers (the
      # confusable-identifiers script tier); one soft hyphen or CGJ, or one joiner or ZWSP
      # between two non-ASCII letters (one bit per visible character); private-use runs under
      # 16; supplementary noncharacters; a BOM at the start of a later line. Engine limits at
      # commit and CI: a file git treats as binary (a NUL byte, UTF-16, `-diff` or `binary` in
      # .gitattributes) has no added lines, and the text after U+2028/2029, NEL, VT, FF,
      # U+001C-001E or a lone CR on an added line is not judged (the agent's write and turn
      # end still judge both). Escaped forms (a JSON or HTML escape) are visible ASCII and pass.

compliance:
  mitre_atlas:
  - control: AML.T0051
    coverage: partial
    note: "blocks the hidden-character carrier of indirect injection; semantic injection stays advisory"
  owasp_asi:
  - control: ASI01
    coverage: partial
    note: "blocks the hidden-character slice of goal-hijack payloads a diff can show; semantic injection defense remains advisory (injection-defense, owasp-asi01-agent-goal-hijack)"

