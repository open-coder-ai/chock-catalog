id: block-invisible-unicode
name: "Block Invisible Unicode"
version: "0.1.0"
description: >
  Blocks invisible Unicode in added lines: bidi controls (CVE-2021-42574), tag chars
  U+E0000-E007F, zero-width/joiners beside ASCII or in runs, mid-line BOM, variation-selector
  runs or after ASCII letters, private-use runs of 3+, noncharacters. Allows emoji ZWJ,
  RTL/Indic/Thai text, line-start BOM. Not caught: homoglyphs, LRM/RLM in prose, U+2028. Runs:
  commit, agent write, turn's end. Waiver: 'pragma: allowlist invisible-unicode' same line;
  agent: only if in HEAD; MCP gateway: never.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Invisible or direction-changing Unicode detected in this change: a bidi control, a tag
      character, a zero-width character or joiner beside ASCII or in a run, a BOM after the
      start of a line, a variation-selector run, a private-use run or a noncharacter. It changes
      how code reads to a human or hides instructions an agent will still obey. Remove it; where
      the character is meant, write it as an escape sequence instead. Waiver: 'pragma: allowlist
      invisible-unicode' on the same line. A person's commit honours it; in the agent (write,
      the turn's end, an agent's commit) only a line already in HEAD counts, and the MCP gateway
      never does. An agent asks a person; it never writes the pragma.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+invisible-unicode'
      # \u escapes, never literal characters: the pattern must not carry the bytes it
      # blocks, or committing this policy folder would trip its own gate (#32 class).
      # Judged one line at a time. Alternatives, in order:
      #  1 always: bidi embed/override/isolate 202A-202E 2066-2069, deprecated format
      #    206A-206F, word joiner and invisible operators 2060-2064, noncharacters FDD0-FDEF
      #    FFFE FFFF, lone surrogates, the whole tag block E0000-E007F (subdivision flags too)
      #  2 any run of 2+ zero-width characters (180E 200B-200D 2060-2064 FEFF): binary stego
      #  3-4 ZWSP 200B or Mongolian vowel separator 180E unless both neighbours are in a
      #    script written without spaces (Thai, Lao, Tibetan, Myanmar, Khmer, Mongolian)
      #  5-6 ZWNJ/ZWJ 200C 200D beside an ASCII character or a line edge; emoji sequences and
      #    Persian/Indic joiners sit between two non-ASCII characters and pass
      #  7 BOM FEFF anywhere but the start of a line
      #  8 ALM/LRM/RLM 061C 200E 200F between two ASCII word characters (reorders an identifier);
      #    next to RTL prose, spaces or punctuation they pass (the ask class, not this regex)
      #  9-11 variation selectors FE00-FE0F E0100-E01EF: a run of 2+ (byte encoding), one after
      #    an ASCII letter or underscore, or a supplementary one not after a CJK ideograph
      #  12 private use E000-F8FF F0000-10FFFD in runs of 3+
      content_pattern: '[\u202A-\u202E\u2060-\u2064\u2066-\u206F\uFDD0-\uFDEF\uFFFE\uFFFF\uD800-\uDFFF\U000E0000-\U000E007F]|[\u180E\u200B-\u200D\u2060-\u2064\uFEFF]{2,}|(?<![\u0E00-\u0FFF\u1000-\u109F\u1780-\u18AF])[\u180E\u200B]|[\u180E\u200B](?![\u0E00-\u0FFF\u1000-\u109F\u1780-\u18AF])|(?:^|[\x00-\x7F])[\u200C\u200D]|[\u200C\u200D](?:[\x00-\x7F]|$)|(?<!^)\uFEFF|(?<=[A-Za-z0-9_])[\u061C\u200E\u200F](?=[A-Za-z0-9_])|[\uFE00-\uFE0F\U000E0100-\U000E01EF]{2,}|[A-Za-z_][\uFE00-\uFE0F\U000E0100-\U000E01EF]|(?<![\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\U00020000-\U0003FFFF])[\U000E0100-\U000E01EF]|[\uE000-\uF8FF\U000F0000-\U0010FFFD]{3,}'
      # Not matched (limits): homoglyphs, mixed-script and fullwidth identifiers and soft
      # hyphens (the confusable-identifiers script tier); one joiner or VS between two
      # non-ASCII characters (one bit or byte per visible character); LRM/RLM/ALM beside
      # non-word ASCII; supplementary noncharacters; a BOM at the start of a later line; and
      # U+2028/2029, U+0085, VT, FF, U+001C-001E and a lone CR, which the line split consumes:
      # at commit the text after one of them on an added line is not judged at all (engine
      # follow-up). Escaped forms (\u200B in JSON, &#8203; in HTML) are visible ASCII and pass.

compliance:
  mitre_atlas:
  - control: AML.T0051
    coverage: partial
    note: "blocks the hidden-character carrier of indirect injection; semantic injection stays advisory"
  owasp_asi:
  - control: ASI01
    coverage: partial
    note: "blocks the hidden-character slice of goal-hijack payloads a diff can show; semantic injection defense remains advisory (injection-defense, owasp-asi01-agent-goal-hijack)"

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release. Anchors: OWASP LLM01/ASI01, MITRE ATLAS AML.T0051 (indirect), CVE-2021-42574 (Trojan Source)."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.3
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so the same pattern enforces as the agent writes (mcp-gateway / agent guard) and not only over a git diff -- the write-time point matters most here, since tag-block smuggling targets exactly what the agent writes and reads. No pattern change. Message generalized from 'staged changes' to 'this change' and notes the allowlist pragma is a commit-review concept NOT honored at tool-use (live, attacker-controllable tool argument -- a match always blocks, matching the gateway's content_regex semantics)."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, an agent's commit (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT or agent_commit_env)) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Rename (display name only, id unchanged): 'Block Invisible Unicode' becomes 'Block Bidi and Tag Unicode', since only bidi controls (U+202A-202E, U+2066-2069) and tag characters (U+E0001-E007F) are matched."
  - "Disclosure, no behaviour change: the description lists what is not matched -- ZWSP U+200B, U+2060, U+FEFF, U+061C, variation selectors, ZWJ/ZWNJ and LRM/RLM. The gate message names what it matches and carries the standard waiver sentence. The description names where each check runs and fits the 500-char budget."
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "v2 regex tier (roadmap HP15). Widens the pattern from bidi controls and tags to the invisible classes: the tag block now starts at U+E0000; deprecated format controls U+206A-206F; word joiner and invisible operators U+2060-2064; zero-width space and Mongolian vowel separator except between letters of a script written without spaces; ZWNJ/ZWJ beside an ASCII character or a line edge; any run of two or more zero-width characters; a BOM anywhere but the start of a line; ALM/LRM/RLM between two ASCII word characters; variation selectors in runs of two or more, after an ASCII letter, or (supplementary) not after a CJK ideograph; private-use runs of three or more; BMP noncharacters and lone surrogates. Display name back to 'Block Invisible Unicode'."
  - "Allowed by design and pinned by evals: emoji ZWJ and keycap sequences, Persian/Indic joiners, Thai word-break ZWSP, ideographic variation sequences, LRM next to RTL prose, a BOM at the start of a file, two adjacent icon-font glyphs. Stricter than 0.0.5: a ZWJ between ASCII characters (old tc-005) now blocks, so tc-005 pins an emoji sequence instead."
  - "Limits, in the description and the pattern comments: homoglyphs and mixed-script identifiers (the confusable-identifiers script tier), a single joiner or selector between two non-ASCII characters, LRM/RLM in prose, supplementary noncharacters, a BOM at the start of a later line, escaped forms, and line separators: at commit the text after U+2028/2029, NEL, VT, FF or a lone CR on an added line is not judged (engine follow-up). Subdivision flag emoji are built from tag characters and block; a person waives them."
