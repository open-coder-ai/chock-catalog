changelog:
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release. Anchors: OWASP LLM01/ASI01, MITRE ATLAS AML.T0051 (indirect), CVE-2021-42574 (Trojan Source)."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.3
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so the same pattern enforces as the agent writes (mcp-gateway / agent guard) and not only over a git diff -- the write-time point matters most here, since tag-block smuggling targets exactly what the agent writes and reads. No pattern change. Message generalized from 'staged changes' to 'this change' and notes the allowlist pragma is a commit-review concept NOT honored at tool-use (live, attacker-controllable tool argument -- a match always blocks, matching the gateway's content_regex semantics)."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, an agent's commit (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT or agent_commit_env)) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.5
  date: '2026-09-30'
  changes:
  - "Rename (display name only, id unchanged): 'Block Invisible Unicode' becomes 'Block Bidi and Tag Unicode', since only bidi controls (U+202A-202E, U+2066-2069) and tag characters (U+E0001-E007F) are matched."
  - "Disclosure, no behaviour change: the description lists what is not matched -- ZWSP U+200B, U+2060, U+FEFF, U+061C, variation selectors, ZWJ/ZWNJ and LRM/RLM. The gate message names what it matches and carries the standard waiver sentence. The description names where each check runs and fits the 500-char budget."
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "v2 regex tier (roadmap HP15). Widens the pattern from bidi controls and tags to hidden-character classes: the tag block from U+E0000 and the unassigned plane-14 ranges; the whole U+2060-206F block (word joiner, invisible operators, deprecated format controls); interlinear annotation controls; any two adjacent invisible or default-ignorable characters, except the FE0F+ZWJ pair emoji sequences use; ZWSP, ZWNJ, ZWJ, Mongolian vowel separator, Khmer inherent vowels and Hangul fillers beside an ASCII word character or between ASCII characters; a BOM anywhere but the start of a line; ALM/LRM/RLM inside an ASCII identifier or on a line with no right-to-left letter; a variation selector after an ASCII letter, digit or underscore, or a supplementary one not after a CJK ideograph; private-use runs of 16 or more; BMP noncharacters; lone surrogates (agent tool input only). Display name back to 'Block Invisible Unicode'."
  - "Allowed by design and pinned by evals: emoji ZWJ, keycap and presentation sequences; Persian, Indic and Malayalam joiners, including before a space; Thai and Japanese word-break ZWSP; ideographic variation sequences; LRM/RLM/ALM in RTL prose; a BOM at the start of a file; icon-font glyph runs under 16; soft hyphens in prose. Stricter than 0.0.5: a ZWJ between ASCII characters (old tc-005) now blocks, so tc-005 pins an emoji sequence instead. Deviation from the roadmap: private-use runs block at 16, not 3, because three adjacent Nerd Font glyphs are ordinary prompt and status-bar config."
  - "Limits, in the description and the pattern comments: homoglyphs and mixed-script identifiers (the confusable-identifiers script tier); one joiner, ZWSP, soft hyphen or CGJ between two non-ASCII characters; supplementary noncharacters; a BOM at the start of a later line; escaped forms. Engine limits at commit and CI: a file git treats as binary (NUL byte, UTF-16, -diff or binary in .gitattributes) has no added lines, and the text after U+2028/2029, NEL, VT, FF or a lone CR on an added line is not judged; the agent's write and turn end still judge both. Subdivision flag emoji are built from tag characters and block; a person waives them. Math text with invisible operators (U+2061-2064) blocks."
