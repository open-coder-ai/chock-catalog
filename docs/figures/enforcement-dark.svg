<svg xmlns="http://www.w3.org/2000/svg" width="760" height="246" viewBox="0 0 760 246" role="img" aria-labelledby="t d">
  <title id="t">Chock-catalog enforcement coverage</title>
  <desc id="d">Of 73 chock-catalog policies, 35 are enforced at commit, 13 are refused in the agent (best-effort, failing open), and 25 are advisory only, read by the agent but backed by no mechanism.</desc>
  <rect width="760" height="246" fill="#1a1a19"/>
  <text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start">73 policies, by what actually enforces them</text>
  <text x="40" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">strongest → weakest, left to right — colour is never the only signal</text>
  <rect x="40" y="96" width="324" height="72" rx="4" fill="#184f95"/>
  <text x="202" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1a19" text-anchor="middle">35</text>
  <text x="202" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a1a19" text-anchor="middle">ENFORCED AT COMMIT</text>
  <rect x="366" y="96" width="119" height="72" rx="4" fill="#3987e5"/>
  <text x="425.5" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1a19" text-anchor="middle">13</text>
  <text x="425.5" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a1a19" text-anchor="middle">IN-AGENT</text>
  <rect x="487" y="96" width="231" height="72" rx="4" fill="#9ec5f4"/>
  <text x="602.5" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">25</text>
  <text x="602.5" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">ADVISORY</text>
  <text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">35 enforced at commit, 13 in-agent (best-effort, fails open), 25 advisory only</text>
  <text x="40" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">counts read from registry.yaml at generation time; the CI job below fails if this ever drifts from it</text>
</svg>
