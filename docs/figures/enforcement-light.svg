<svg xmlns="http://www.w3.org/2000/svg" width="760" height="246" viewBox="0 0 760 246" role="img" aria-labelledby="t d">
  <title id="t">Chock-catalog enforcement coverage</title>
  <desc id="d">Of 39 chock-catalog policies, 9 are enforced at commit and 8 more are enforced in-agent, for 17 enforced overall -- 22, more than half, are advisory only, read by the agent but backed by no mechanism.</desc>
  <rect width="760" height="246" fill="#fcfcfb"/>
  <text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">39 policies, by what actually enforces them</text>
  <text x="40" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">strongest → weakest, left to right — colour is never the only signal</text>
  <rect x="40" y="96" width="155" height="72" rx="4" fill="#104281"/>
  <text x="117.5" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fcfcfb" text-anchor="middle">9</text>
  <text x="117.5" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">ENFORCED AT COMMIT</text>
  <rect x="197" y="96" width="137" height="72" rx="4" fill="#2a78d6"/>
  <text x="265.5" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fcfcfb" text-anchor="middle">8</text>
  <text x="265.5" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">IN-AGENT</text>
  <rect x="336" y="96" width="382" height="72" rx="4" fill="#86b6ef"/>
  <text x="527" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">22</text>
  <text x="527" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">ADVISORY</text>
  <text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">17 enforced (9 at commit + 8 in-agent) — 22 advisory, the largest slice</text>
  <text x="40" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">counts read from registry.yaml at generation time; the CI job below fails if this ever drifts from it</text>
</svg>
