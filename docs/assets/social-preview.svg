<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-label="chock-catalog — the policy catalog for chock: policies you can adopt, graded by what they actually enforce. 37 policies across 3 packs (agentic-security 13, base 21, compliance 3); 16 enforced (9 at commit, 7 at pre-tool-use) and 21 advisory; 325 eval cases. The 9 blocking policies: block-invisible-unicode, block-unpinned-agent-components, block-unsafe-code-execution, block-wildcard-agent-permissions, block-wildcard-iam, pin-github-actions, protect-main-branch, scan-secrets, verify-dependency-exists. Full OWASP Agentic Security Initiative top ten coverage, ASI01 through ASI10. Apache-2.0.">
