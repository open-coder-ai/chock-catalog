  <text x="48" y="140" font-family="Geist Mono" font-size="10.5" letter-spacing="3.4" fill="#8A7340">— THE POLICY CATALOG</text>
  <text x="48" y="190" font-family="Geist Mono" font-size="33" font-weight="700" letter-spacing="-1.2" fill="#E8EEF6">Policies you can adopt,</text>
  <text x="48" y="230" font-family="Geist Mono" font-size="33" font-weight="700" letter-spacing="-1.2" fill="#D9B45C">graded by what they do.</text>
  <text x="48" y="276" font-family="Geist Mono" font-size="13" fill="#9FB0C4">Every policy states the strongest control it can</text>
  <text x="48" y="298" font-family="Geist Mono" font-size="13" fill="#9FB0C4">actually install, and carries its own eval suite.</text>
  <text x="48" y="320" font-family="Geist Mono" font-size="13" fill="#9FB0C4">Of these, 9 block. The rest say so.</text>
  <text x="48" y="372" font-family="Geist Mono" font-size="10.5" letter-spacing="3.4" fill="#8A7340">ADOPT ONE</text>
