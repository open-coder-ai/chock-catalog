  <text x="66" y="412" font-family="Geist Mono" font-size="12.5" fill="#9FB0C4">chock add owasp-asi02-tool-misuse</text>
  <text x="66" y="436" font-family="Geist Mono" font-size="12.5" fill="#D9B45C">chock sync</text>
