# Lint and test configuration for this catalog's own code: the policies' implementations, the
# java-security engine, the tools that check and render them, and the tests that prove them.
# The ruff rule set and limits are the framework's (open-coder-ai/chock pyproject.toml), so code
# written here is held to the bar code written there is. Nothing here is published: the
# distribution repos build from base/ with `chock plugin build`, which never reads tests/ or tools/.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["base/java-security/implementations", "tools", "tests"]
addopts = "-q --strict-markers"

# Every line and every branch of the code this catalog ships runs under a test: `pytest --cov`
# fails below 100. The source is each shipped implementation tree holding Python; a test in
# tests/test_repo_standards.py fails if one is added without being listed here. Guards run as
# processes (the java-security gate is started the way a hook runner starts it), so coverage
# follows subprocesses.
[tool.coverage.run]
branch = true
source = ["base/java-security/implementations", "base/no-a11y-regression/implementations"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
# Generated or copied bytes, reviewed at their source: the engine bundle chock writes, the
# framework checkout CI makes, and the Java/Kotlin corpus the tests feed the rules as text.
extend-exclude = ["*.md", ".chock/bin/", ".agents/", ".framework/", "tests/java_security/corpus/"]

[tool.ruff.lint]
# The framework's bar, unchanged: C90 complexity, N naming, PLR/PLW/PLC pylint, ERA commented-out
# code, T20 print, ARG unused args, RET/SIM/PIE correctness, FBT boolean traps, A builtin
# shadowing, B bugbear, S bandit security, BLE blind except, TRY exception hygiene, RUF.
select = [
    "E", "F", "W", "I",
    "C90", "N", "PLR", "PLW", "PLC", "ERA", "T20", "ARG", "RET", "SIM", "PIE",
    "FBT", "A", "B", "S", "BLE", "TRY", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Tests assert with bare `assert` (S101), pass literal fixtures positionally (FBT), repeat short
# literals as test data (PLR2004), and drive the shipped gate as a subprocess of this interpreter
# (S603) -- the framework's tests/** allowances, narrowed to what these tests use.
"tests/**" = ["S101", "FBT", "PLR2004", "S105", "S603"]
# A gate speaks to its runner through stderr and its exit code: print() is the protocol there,
# not a stray System.out.
"base/*/implementations/*.py" = ["T201"]
# Command-line tools report to the terminal, and run git, chock and python by name on purpose.
"tools/*.py" = ["T201", "S603", "S607"]
# TODO(lint-adoption): baseline debt in code that predates this configuration, listed per file and
# rule family exactly as `ruff check` finds it today -- deferred the way the framework deferred its
# own rather than rewritten under an unrelated change. Shrink these lists; never grow them. Code this
# repository ships to adopters (base/*/implementations) changes only with that policy's own evals, so
# its entries go with the next change to that policy.
"base/no-a11y-regression/implementations/no-a11y-regression-pre-commit.py" = ["C901", "FBT001", "PLR0911", "S603", "S607"]
"docs/assets/brandkit.py" = ["PLR0913", "PLR0917", "PLR2004", "RUF005", "S101"]
"docs/assets/gen_brand_assets.py" = ["S101", "T201"]
"docs/figures/make_enforcement.py" = ["ARG001", "ARG005", "T201", "TRY003"]
"docs/figures/make_family.py" = ["PLR0913", "T201"]
"docs/figures/make_social.py" = ["PLC0415", "T201"]
"docs/figures/palette.py" = ["PLR0913", "PLR0917"]
"measurements/context-report/dogfood.py" = ["E731"]
"tools/adopt_framework.py" = ["PLC0415", "PLW1510"]
"tools/check_a11y_rules.py" = ["FBT001", "TRY003"]
"tools/check_a11y_table.py" = ["FBT001", "PLR2004"]
"tools/check_console.py" = ["PLC0415", "PLR2004"]
"tools/check_effects.py" = ["C901", "PLR0913", "PLR0917", "TRY003"]
"tools/check_readme.py" = ["C901", "PLR0912", "RUF017", "SIM905"]
"tools/check_registry.py" = ["C901", "PLC0415", "PLR0912"]
"tools/check_workflows.py" = ["SIM114"]
"tools/gen_adoption_transcript.py" = ["C901", "PIE810", "PLC0415", "PLR2004", "PLW1510", "SIM114", "TRY003"]
