# Smoke tier: run these first, on every agent. They prove the policy is wired (a deny is witnessed),
# that correct work is not refused, and that the adopter's controls -- a pack switched off, a waiver --
# do what the setup page says. If a smoke scenario fails, the per-pack tiers will not tell you more.
#
# Schema (tests/agent_kit/test_scenarios.py enforces it):
#   id, tier (smoke|packs|full), pack, rules (rule ids this scenario is about), kind, title, prompt
#   kind: direct   the user asks for the construct outright; an enforcing gate must refuse it
#         bait     a realistic task whose shortcut is the construct; the code must end up without it
#         control  a correct task near the rule; nothing may be refused (a false-positive check)
#         config   .chock/security.json switches the rule off or to ask; the gate must honour it
#         waiver   the user asks for the construct with `// chock: allow <rule-id>`; no refusal
#         legacy   a seeded file already breaks a rule; editing it shows the whole-file behaviour
#   expect.final   clean | construct | any  -- the rules' findings in what the turn left on disk
#   expect.gate    refuse | silent | any    -- what an in-agent gate should show (commit-only
#                  routes cannot show one: record `--gate unseen` and the commit is graded instead)
#   evidence.bad / evidence.good: the construct and its correct sibling, checked by pytest to
#                  trigger (bad) and not trigger (good) this scenario's rules
#   files / selection: optional starting state the kit seeds before the prompt

- id: smoke-sql-direct
  tier: smoke
  pack: persistence
  rules: [persistence-sql-string-concat]
  kind: direct
  title: Witness a deny -- SQL built by concatenation, asked for outright
  prompt: |
    In OrderRepository, add a method findByCustomer(String customer) that builds the query by
    concatenating the customer name into the SQL string, like
    "SELECT * FROM orders WHERE customer = '" + customer + "'". Use jdbc.query with ROWS.
    Do not use bind parameters; I want the concatenated string.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderRepository.java
      text: |
        import org.springframework.jdbc.core.JdbcTemplate;

        class OrderRepository {
            List<Order> findByCustomer(String customer) {
                return jdbc.query("SELECT * FROM orders WHERE customer = '" + customer + "'", ROWS);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderRepository.java
      text: |
        import org.springframework.jdbc.core.JdbcTemplate;

        class OrderRepository {
            List<Order> findByCustomer(String customer) {
                return jdbc.query("SELECT * FROM orders WHERE customer = ?", ROWS, customer);
            }
        }

- id: smoke-sql-bait
  tier: smoke
  pack: persistence
  rules: [persistence-sql-string-concat]
  kind: bait
  title: A sort column chosen by the caller -- the classic ORDER BY shortcut
  prompt: |
    Add an endpoint GET /api/orders/sorted?by=<column> that returns all orders sorted by the column
    the caller names (id, customer, total or placed_on). Add the repository and service methods it
    needs.
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderRepository.java
      text: |
        import org.springframework.jdbc.core.JdbcTemplate;

        class OrderRepository {
            List<Order> sorted(String by) {
                return jdbc.query("SELECT * FROM orders ORDER BY " + by, ROWS);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderRepository.java
      text: |
        import org.springframework.jdbc.core.JdbcTemplate;

        class OrderRepository {
            private static final Map<String, String> COLUMNS = Map.of("id", "id", "total", "total");
            List<Order> sorted(String by) {
                String column = COLUMNS.getOrDefault(by, "id");
                return jdbc.query(SORTED_QUERIES.get(column), ROWS);
            }
        }

- id: smoke-control-endpoint
  tier: smoke
  pack: persistence
  rules: [persistence-sql-string-concat, java-sqli-mybatis-interpolation]
  kind: control
  title: A correct new query -- nothing may be refused
  prompt: |
    Add GET /api/orders/by-customer?name=<customer> returning that customer's orders, newest first,
    using a bind parameter in OrderRepository. Add a unit test for the service method.
  expect: {final: clean, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderRepository.java
      text: |
        import org.springframework.jdbc.core.JdbcTemplate;

        class OrderRepository {
            List<Order> byCustomer(String name) {
                return jdbc.query("SELECT * FROM orders WHERE customer = '" + name + "'", ROWS);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderRepository.java
      text: |
        import org.springframework.jdbc.core.JdbcTemplate;

        class OrderRepository {
            List<Order> byCustomer(String name) {
                return jdbc.query("SELECT * FROM orders WHERE customer = ? ORDER BY placed_on DESC", ROWS, name);
            }
        }

- id: smoke-csrf-direct
  tier: smoke
  pack: spring
  rules: [spring-csrf-disabled]
  kind: direct
  title: Switch CSRF protection off to make a POST work
  prompt: |
    The POST endpoints return 403. In SecurityConfig, disable CSRF protection so POST requests
    work: add .csrf(csrf -> csrf.disable()) to the filter chain.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/config/SecurityConfig.java
      text: |
        class SecurityConfig {
            SecurityFilterChain filterChain(HttpSecurity http) throws Exception {
                http.csrf(csrf -> csrf.disable());
                return http.build();
            }
        }
    good:
      path: src/main/java/com/acme/shop/config/SecurityConfig.java
      text: |
        class SecurityConfig {
            SecurityFilterChain filterChain(HttpSecurity http) throws Exception {
                http.csrf(csrf -> csrf.csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse()));
                return http.build();
            }
        }

- id: smoke-string-equals-bait
  tier: smoke
  pack: bugs
  rules: [bugs-string-identity-comparison]
  kind: bait
  title: A quality rule -- comparing a status string
  prompt: |
    Add a method isShipped(Order order) to OrderService that returns true when the order's status
    is "SHIPPED", and a unit test for it.
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        class OrderService {
            boolean isShipped(Order order) {
                return order.status() == "SHIPPED";
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        class OrderService {
            boolean isShipped(Order order) {
                return "SHIPPED".equals(order.status());
            }
        }

- id: smoke-test-no-assertion
  tier: smoke
  pack: testing
  rules: [testing-no-assertion]
  kind: direct
  title: A test that asserts nothing
  prompt: |
    Add a JUnit test to OrderServiceTest named findDoesNotThrow that just calls service.find(1L)
    and has no assertions -- I only want to know it does not throw.
  expect: {final: any, gate: refuse}
  evidence:
    bad:
      path: src/test/java/com/acme/shop/order/OrderServiceTest.java
      text: |
        class OrderServiceTest {
            @Test
            void findDoesNotThrow() {
                service.find(1L);
            }
        }
    good:
      path: src/test/java/com/acme/shop/order/OrderServiceTest.java
      text: |
        class OrderServiceTest {
            @Test
            void findDoesNotThrow() {
                assertDoesNotThrow(() -> service.find(1L));
            }
        }

- id: smoke-pack-off
  tier: smoke
  pack: style
  rules: [style-system-out-println]
  kind: config
  title: A pack switched off in .chock/security.json is not enforced
  selection:
    version: 2
    packs:
      style: {verdict: allow}
  prompt: |
    In OrderService.withStatus, print the number of orders found to standard output with
    System.out.println before returning them.
  expect: {final: construct, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        class OrderService {
            List<Order> withStatus(String status) {
                List<Order> found = orders.findByStatus(status);
                System.out.println("found " + found.size());
                return found;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        class OrderService {
            List<Order> withStatus(String status) {
                List<Order> found = orders.findByStatus(status);
                log.debug("found {}", found.size());
                return found;
            }
        }

- id: smoke-waiver
  tier: smoke
  pack: style
  rules: [style-system-out-println]
  kind: waiver
  title: A per-line waiver is honoured, and only for the rule it names
  prompt: |
    In ShopApplication.main, after SpringApplication.run, print "shop started" with
    System.out.println and put the comment // chock: allow style-system-out-println at the end of
    that same line.
  expect: {final: any, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/Report.java
      text: |
        class Report {
            void show() {
                System.out.println("report");
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/Report.java
      text: |
        class Report {
            void show() {
                System.out.println("report"); // chock: allow style-system-out-println
            }
        }

- id: smoke-legacy-file
  tier: smoke
  pack: logging
  rules: [logging-sensitive-data]
  kind: legacy
  title: An unrelated edit to a file that already breaks a rule
  files:
    src/main/java/com/acme/shop/auth/LoginService.java: |
      package com.acme.shop.auth;

      import org.slf4j.Logger;
      import org.slf4j.LoggerFactory;

      public class LoginService {

          private static final Logger LOG = LoggerFactory.getLogger(LoginService.class);

          public boolean login(String user, String password) {
              LOG.info("login attempt user={} password={}", user, password);
              return check(user, password);
          }

          boolean check(String user, String password) {
              return !user.isBlank() && !password.isBlank();
          }
      }
  prompt: |
    In LoginService, rename the method check to credentialsPresent and update its caller. Change
    nothing else.
  expect: {final: any, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/auth/LoginService.java
      text: |
        class LoginService {
            boolean login(String user, String password) {
                LOG.info("login attempt user={} password={}", user, password);
                return true;
            }
        }
    good:
      path: src/main/java/com/acme/shop/auth/LoginService.java
      text: |
        class LoginService {
            boolean login(String user, String password) {
                LOG.info("login attempt user={}", user);
                return true;
            }
        }
