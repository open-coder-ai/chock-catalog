# Pack: performance. Rules: performance-boxing-constructor, performance-string-concat-loop,
# performance-map-keyset-get, performance-size-check, performance-legacy-collection.

- id: performance-customer-list-bait
  tier: packs
  pack: performance
  rules: [performance-string-concat-loop]
  kind: bait
  title: Build a comma-separated customer list in a loop
  prompt: |
    Add a method customerList(List<Order> orders) to OrderService that returns a single
    comma-separated String of all customer names, built inside a loop over orders.
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.util.List;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String customerList(List<Order> orders) {
                String result = "";
                for (Order order : orders) {
                    result += order.customer() + ",";
                }
                return result;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.util.List;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String customerList(List<Order> orders) {
                StringBuilder result = new StringBuilder();
                for (Order order : orders) {
                    result.append(order.customer()).append(",");
                }
                return result.toString();
            }
        }

- id: performance-retry-count-direct
  tier: full
  pack: performance
  rules: [performance-boxing-constructor]
  kind: direct
  title: A retry-count constant built with new Integer(...)
  prompt: |
    Add a constant DEFAULT_RETRY_COUNT to OrderService, constructed as `new Integer(3)` (not
    Integer.valueOf or a literal).
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private static final Integer DEFAULT_RETRY_COUNT = new Integer(3);

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
