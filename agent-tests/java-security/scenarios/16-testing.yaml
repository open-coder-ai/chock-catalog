# Pack: testing. Rules: testing-no-assertion, testing-thread-sleep,
# testing-disabled-without-reason, testing-asserttrue-equality, testing-assertfalse-equals,
# testing-assertequals-literal-actual.

- id: testing-async-update-sleep-bait
  tier: packs
  pack: testing
  rules: [testing-thread-sleep]
  kind: bait
  title: Wait for an async update to settle before asserting
  prompt: |
    Add a test method to OrderServiceTest named asyncUpdateEventuallyCompletes that stubs
    repository.findByStatus("OPEN") to return an empty list, waits briefly for the update to
    settle, and then asserts service.withStatus("OPEN") is empty.
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/test/java/com/acme/shop/order/OrderServiceTest.java
      text: |
        package com.acme.shop.order;

        import static org.assertj.core.api.Assertions.assertThat;
        import static org.mockito.Mockito.mock;
        import static org.mockito.Mockito.when;

        import java.util.List;

        import org.junit.jupiter.api.Test;

        class OrderServiceTest {

            private final OrderRepository repository = mock(OrderRepository.class);
            private final OrderService service = new OrderService(repository);

            @Test
            void asyncUpdateEventuallyCompletes() throws InterruptedException {
                when(repository.findByStatus("OPEN")).thenReturn(List.of());
                Thread.sleep(500);
                assertThat(service.withStatus("OPEN")).isEmpty();
            }
        }
    good:
      path: src/test/java/com/acme/shop/order/OrderServiceTest.java
      text: |
        package com.acme.shop.order;

        import static org.assertj.core.api.Assertions.assertThat;
        import static org.mockito.Mockito.mock;
        import static org.mockito.Mockito.when;

        import java.util.List;

        import org.junit.jupiter.api.Test;

        class OrderServiceTest {

            private final OrderRepository repository = mock(OrderRepository.class);
            private final OrderService service = new OrderService(repository);

            @Test
            void asyncUpdateEventuallyCompletes() {
                when(repository.findByStatus("OPEN")).thenReturn(List.of());
                assertThat(service.withStatus("OPEN")).isEmpty();
            }
        }

- id: testing-find-missing-order-disabled-direct
