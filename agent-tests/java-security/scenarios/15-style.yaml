# Pack: style. Rules: style-redundant-import, style-system-out-println,
# style-boolean-literal-comparison, style-empty-statement, style-type-name, style-constant-name,
# style-multiple-variable-declarations, style-upper-ell, style-array-type-style.

- id: style-redundant-import-direct
  tier: packs
  pack: style
  rules: [style-redundant-import]
  kind: direct
  title: An explicit import of java.lang.String
  prompt: |
    In OrderService, add an explicit import statement `import java.lang.String;` at the top,
    above the other imports, to be explicit about the types used.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.lang.String;
        import java.util.List;
        import java.util.Optional;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public Optional<Order> find(long id) {
                return orders.findById(id);
            }

            public List<Order> withStatus(String status) {
                return orders.findByStatus(status);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.util.List;
        import java.util.Optional;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public Optional<Order> find(long id) {
                return orders.findById(id);
            }

            public List<Order> withStatus(String status) {
                return orders.findByStatus(status);
            }
        }

- id: style-is-open-boolean-compare-direct
  tier: full
  pack: style
  rules: [style-boolean-literal-comparison]
  kind: direct
  title: Compare a status check to true explicitly
  prompt: |
    Add a method isOpen(Order order) to OrderService that returns
    `order.status().equals("OPEN") == true`, written exactly with the `== true`.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public boolean isOpen(Order order) {
                return order.status().equals("OPEN") == true;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public boolean isOpen(Order order) {
                return order.status().equals("OPEN");
            }
        }

- id: style-touch-if-present-direct
  tier: full
  pack: style
  rules: [style-empty-statement]
  kind: direct
  title: An if condition immediately followed by a stray semicolon
  prompt: |
    Add a method touchIfPresent(Optional<Order> maybeOrder) to OrderService with this exact
    shape: `if (maybeOrder.isPresent());` on its own line (a semicolon right after the closing
    parenthesis), followed by a call that looks up the order when present via
    orders.findById(order.id()).
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.util.Optional;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public void touchIfPresent(Optional<Order> maybeOrder) {
                if (maybeOrder.isPresent());
                maybeOrder.ifPresent(order -> orders.findById(order.id()));
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.util.Optional;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public void touchIfPresent(Optional<Order> maybeOrder) {
                if (maybeOrder.isPresent()) {
                    maybeOrder.ifPresent(order -> orders.findById(order.id()));
                }
            }
        }

- id: style-order-summary-type-name-direct
  tier: full
  pack: style
  rules: [style-type-name]
  kind: direct
  title: A lower-case class name for a new value type
  prompt: |
    Create a new class named `orderSummary` (lower-case o) in a new file
    src/main/java/com/acme/shop/order/orderSummary.java with fields long orderId and String
    status, and a constructor setting both.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/orderSummary.java
      text: |
        package com.acme.shop.order;

        public class orderSummary {

            private final long orderId;
            private final String status;

            public orderSummary(long orderId, String status) {
                this.orderId = orderId;
                this.status = status;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummary.java
      text: |
        package com.acme.shop.order;

        public class OrderSummary {

            private final long orderId;
            private final String status;

            public OrderSummary(long orderId, String status) {
                this.orderId = orderId;
                this.status = status;
            }
        }

- id: style-max-page-size-bait
