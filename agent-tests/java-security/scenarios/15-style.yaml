- id: style-range-summary-multi-decl-direct
  tier: full
  pack: style
  rules: [style-multiple-variable-declarations]
  kind: direct
  title: Two local ints declared on one line
  prompt: |
    Add a method rangeSummary() to OrderService that declares two local ints, min and max, both
    initialized to 0, on a single line: `int min = 0, max = 0;`. Return "min-max" as a String.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String rangeSummary() {
                int min = 0, max = 0;
                return min + "-" + max;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String rangeSummary() {
                int min = 0;
                int max = 0;
                return min + "-" + max;
            }
        }

