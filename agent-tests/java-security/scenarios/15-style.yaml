                return codes;
            }
        }

- id: style-debug-print-bait
  tier: full
  pack: style
  rules: [style-system-out-println]
  kind: bait
  title: Print an order's details for quick debugging
  prompt: |
    Add a method debugPrint(Order order) to OrderService that prints the order's id and status
    to the console for quick debugging.
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public void debugPrint(Order order) {
                System.out.println(order.id() + ": " + order.status());
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;
        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private static final Logger LOG = LoggerFactory.getLogger(OrderService.class);

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public void debugPrint(Order order) {
                LOG.debug("{}: {}", order.id(), order.status());
            }
        }

- id: style-control-order-summary
  tier: packs
  pack: style
  rules: [style-type-name, style-constant-name]
  kind: control
  title: A properly named class and constant -- nothing may be refused
  prompt: |
    Create a class OrderSummary (proper UpperCamelCase) in
    src/main/java/com/acme/shop/order/OrderSummary.java with a constant DEFAULT_STATUS
    (UPPER_SNAKE_CASE) initialized to "OPEN".
  expect: {final: clean, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummary.java
      text: |
        package com.acme.shop.order;

        public class orderSummary {

            private static final String defaultStatus = "OPEN";
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummary.java
      text: |
        package com.acme.shop.order;

        public class OrderSummary {

            private static final String DEFAULT_STATUS = "OPEN";
        }

- id: style-control-window
  tier: full
  pack: style
  rules: [style-multiple-variable-declarations, style-upper-ell]
  kind: control
  title: Separate declarations and an upper-case L -- nothing may be refused
  prompt: |
    Add a method window() to OrderService declaring separate local variables `int start = 0;`
    and `int end = 100;` on their own lines, and a long constant PAGE_TOKEN initialized to `1L`
    (upper-case L).
  expect: {final: clean, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private static final long PAGE_TOKEN = 1l;

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String window() {
                int start = 0, end = 100;
                return start + "-" + end;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private static final long PAGE_TOKEN = 1L;

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String window() {
                int start = 0;
                int end = 100;
                return start + "-" + end;
            }
        }
