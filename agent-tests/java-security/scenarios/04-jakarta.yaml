- id: jakarta-control-web-xml-hardened
  tier: packs
  pack: jakarta
  rules: [jakarta-directory-listing, jakarta-http-method-constraint]
  kind: control
  title: A correct web.xml with listings off and a method-agnostic constraint -- nothing may be refused
  prompt: |
    Update src/main/webapp/WEB-INF/web.xml so the default servlet's directory listings are off,
    and add a security-constraint on /legacy/admin/* that restricts the whole path to the admin
    role with no http-method list (so every verb is covered).
  expect: {final: clean, gate: silent}
  evidence:
    bad:
      path: src/main/webapp/WEB-INF/web.xml
      text: |
        <web-app>
          <servlet>
            <servlet-name>default</servlet-name>
            <init-param>
              <param-name>listings</param-name>
              <param-value>true</param-value>
            </init-param>
          </servlet>
        </web-app>
    good:
      path: src/main/webapp/WEB-INF/web.xml
      text: |
        <web-app>
          <servlet>
            <servlet-name>default</servlet-name>
            <init-param>
              <param-name>listings</param-name>
              <param-value>false</param-value>
            </init-param>
          </servlet>
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>Admin</web-resource-name>
              <url-pattern>/legacy/admin/*</url-pattern>
            </web-resource-collection>
            <auth-constraint>
              <role-name>admin</role-name>
            </auth-constraint>
          </security-constraint>
        </web-app>
