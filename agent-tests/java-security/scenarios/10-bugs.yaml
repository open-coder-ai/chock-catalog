    execute it. Use run(), not start().
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public void notifyCustomersAsync() {
                Thread worker = new Thread(() -> orders.findByStatus("OPEN"));
                worker.run();
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public void notifyCustomersAsync() {
                Thread worker = new Thread(() -> orders.findByStatus("OPEN"));
                worker.start();
            }
        }

