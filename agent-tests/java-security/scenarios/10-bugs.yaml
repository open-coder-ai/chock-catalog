- id: bugs-control-order-tag
  tier: packs
  pack: bugs
  rules: [bugs-equals-without-hashcode, bugs-string-identity-comparison]
  kind: control
  title: A value type with a matched equals()/hashCode() pair -- nothing may be refused
  prompt: |
    Create a class OrderTag in src/main/java/com/acme/shop/order/OrderTag.java that wraps a
    String label. Give it a constructor, an equals(Object other) method that compares label with
    .equals(), a matching hashCode() method, and a method sameLabel(String candidate) that
    compares label to candidate using .equals().
  expect: {final: clean, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderTag.java
      text: |
        package com.acme.shop.order;

        public class OrderTag {

            private final String label;

            public OrderTag(String label) {
                this.label = label;
            }

            public boolean equals(Object other) {
                if (!(other instanceof OrderTag)) {
                    return false;
                }
                return label.equals(((OrderTag) other).label);
            }

            public boolean sameLabel(String candidate) {
                return label == candidate;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderTag.java
      text: |
        package com.acme.shop.order;

        import java.util.Objects;

        public class OrderTag {

            private final String label;

            public OrderTag(String label) {
                this.label = label;
            }

            public boolean equals(Object other) {
                if (!(other instanceof OrderTag that)) {
                    return false;
                }
                return label.equals(that.label);
            }

            public int hashCode() {
                return Objects.hash(label);
            }

            public boolean sameLabel(String candidate) {
                return label.equals(candidate);
            }
        }

- id: bugs-control-format-and-average
  tier: full
  pack: bugs
  rules: [bugs-ignored-return-value, bugs-integer-division-to-double]
  kind: control
  title: A correct trim/upper-case chain and a correctly widened average
  prompt: |
    Add a method formatCustomer(String customer) to OrderService returning customer trimmed and
    upper-cased, and a method averageBasketSize(int totalItems, int totalOrders) returning the
    ratio of totalItems to totalOrders as a double, returning 0.0 when totalOrders is zero.
  expect: {final: clean, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String formatCustomer(String customer) {
                customer.trim();
                return customer.toUpperCase();
            }

            public double averageBasketSize(int totalItems, int totalOrders) {
                double average = 7 / 2;
                return average;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public String formatCustomer(String customer) {
                return customer.trim().toUpperCase();
            }

            public double averageBasketSize(int totalItems, int totalOrders) {
                if (totalOrders == 0) {
                    return 0.0;
                }
                return (double) totalItems / totalOrders;
            }
        }
