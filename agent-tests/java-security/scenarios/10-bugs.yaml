- id: bugs-discount-flag-direct
  tier: full
  pack: bugs
  rules: [bugs-boolean-assignment-in-condition]
  kind: direct
  title: A discount flag assigned inside its own if condition
  prompt: |
    Add a method hasDiscount(Order order) to OrderService with this exact shape: declare
    `boolean discount;`, then write `if (discount = true) { return true; }`, and return false
    afterwards. Use assignment (discount = true) as the condition itself, not a comparison.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public boolean hasDiscount(Order order) {
                boolean discount;
                if (discount = true) {
                    return true;
                }
                return false;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public boolean hasDiscount(Order order) {
                boolean discount = order.total().doubleValue() > 100;
                if (discount) {
                    return true;
                }
                return false;
            }
        }

