# Pack: bugs. Rules: bugs-string-identity-comparison, bugs-equals-without-hashcode,
# bugs-equals-non-object-parameter, bugs-bigdecimal-double-constructor, bugs-nan-comparison,
# bugs-ignored-return-value, bugs-boolean-assignment-in-condition, bugs-array-tostring,
# bugs-thread-run-instead-of-start, bugs-self-assignment, bugs-math-abs-of-hashcode-or-random,
# bugs-integer-division-to-double.

- id: bugs-status-string-bait
  tier: packs
  pack: bugs
  rules: [bugs-string-identity-comparison]
  kind: bait
  title: A VIP-customer check -- the classic == shortcut on a String
  prompt: |
    Add a method isPriority(Order order) to OrderService that returns true when the order's
    customer is exactly "vip".
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public boolean isPriority(Order order) {
                return order.customer() == "vip";
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public boolean isPriority(Order order) {
                return "vip".equals(order.customer());
            }
        }

- id: bugs-equals-without-hashcode-direct
  tier: full
  pack: bugs
  rules: [bugs-equals-without-hashcode]
  kind: direct
  title: equals() overridden, hashCode() left out
  prompt: |
    Create a class OrderKey in a new file src/main/java/com/acme/shop/order/OrderKey.java with
    fields long orderId and String customer, and override equals(Object other) to compare both
    fields. Do not add a hashCode() method.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderKey.java
      text: |
        package com.acme.shop.order;

        import java.util.Objects;

        public class OrderKey {

            private final long orderId;
            private final String customer;

            public OrderKey(long orderId, String customer) {
                this.orderId = orderId;
                this.customer = customer;
            }

            public boolean equals(Object other) {
                if (!(other instanceof OrderKey)) {
                    return false;
                }
                OrderKey that = (OrderKey) other;
                return orderId == that.orderId && Objects.equals(customer, that.customer);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderKey.java
      text: |
        package com.acme.shop.order;

        import java.util.Objects;

        public class OrderKey {

            private final long orderId;
            private final String customer;

            public OrderKey(long orderId, String customer) {
                this.orderId = orderId;
                this.customer = customer;
            }

            public boolean equals(Object other) {
                if (!(other instanceof OrderKey)) {
                    return false;
                }
                OrderKey that = (OrderKey) other;
                return orderId == that.orderId && Objects.equals(customer, that.customer);
            }

            public int hashCode() {
                return Objects.hash(orderId, customer);
            }
        }

- id: bugs-equals-overload-direct
  tier: full
  pack: bugs
  rules: [bugs-equals-non-object-parameter]
  kind: direct
  title: equals(OrderKey) typed to the class itself, not Object
  prompt: |
    Create a class OrderKey in a new file src/main/java/com/acme/shop/order/OrderKey.java with
    fields long orderId and String customer, and add a method public boolean equals(OrderKey
    other) that compares both fields directly. Type the parameter as OrderKey, not Object.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderKey.java
      text: |
        package com.acme.shop.order;

        public class OrderKey {

            private final long orderId;
            private final String customer;

            public OrderKey(long orderId, String customer) {
                this.orderId = orderId;
                this.customer = customer;
            }

            public boolean equals(OrderKey other) {
                return other != null && orderId == other.orderId && customer.equals(other.customer);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderKey.java
      text: |
        package com.acme.shop.order;

        import java.util.Objects;

        public class OrderKey {

            private final long orderId;
            private final String customer;

            public OrderKey(long orderId, String customer) {
                this.orderId = orderId;
                this.customer = customer;
            }

            public boolean equals(Object other) {
                if (!(other instanceof OrderKey that)) {
                    return false;
                }
                return orderId == that.orderId && customer.equals(that.customer);
            }

            public int hashCode() {
                return Objects.hash(orderId, customer);
            }
        }

- id: bugs-fee-rate-bait
  tier: full
  pack: bugs
  rules: [bugs-bigdecimal-double-constructor]
  kind: bait
  title: A 10% service fee rate as a BigDecimal
  prompt: |
    Add a constant SERVICE_FEE_RATE to OrderService representing a 10% (0.1) service fee as a
    BigDecimal, and a method feeFor(BigDecimal total) that multiplies total by the rate.
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.math.BigDecimal;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private static final BigDecimal SERVICE_FEE_RATE = new BigDecimal(0.1);

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public BigDecimal feeFor(BigDecimal total) {
                return total.multiply(SERVICE_FEE_RATE);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import java.math.BigDecimal;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private static final BigDecimal SERVICE_FEE_RATE = BigDecimal.valueOf(0.1);

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public BigDecimal feeFor(BigDecimal total) {
                return total.multiply(SERVICE_FEE_RATE);
            }
        }

