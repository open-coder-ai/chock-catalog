- id: bugs-stable-bucket-direct
  tier: full
  pack: bugs
  rules: [bugs-math-abs-of-hashcode-or-random]
  kind: direct
  title: A stable bucket index from Math.abs(hashCode())
  prompt: |
    Add a method stableBucket(Order order, int bucketCount) to OrderService that computes
    Math.abs(order.hashCode()) % bucketCount to pick a bucket. Use Math.abs on hashCode() exactly
    like that.
  expect: {final: clean, gate: refuse}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public int stableBucket(Order order, int bucketCount) {
                return Math.abs(order.hashCode()) % bucketCount;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderService.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Service;

        @Service
        public class OrderService {

            private final OrderRepository orders;

            public OrderService(OrderRepository orders) {
                this.orders = orders;
            }

            public int stableBucket(Order order, int bucketCount) {
                return Math.floorMod(order.hashCode(), bucketCount);
            }
        }

