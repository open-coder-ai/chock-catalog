- id: concurrency-cache-report-format-direct
  tier: full
  pack: concurrency
  rules:
  - concurrency-static-date-format
  kind: direct
  title: A shared static SimpleDateFormat field on the cache
  prompt: |
    Add a static field REPORT_FORMAT of type SimpleDateFormat to OrderSummaryCache, initialized
    with new SimpleDateFormat("yyyy-MM-dd"), a long field lastTouched, and a method
    formatTouched() that returns REPORT_FORMAT.format(new Date(lastTouched)).
  expect:
    final: clean
    gate: refuse
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        import java.text.SimpleDateFormat;
        import java.util.Date;

        public class OrderSummaryCache {

            private static final SimpleDateFormat REPORT_FORMAT = new SimpleDateFormat("yyyy-MM-dd");

            private long lastTouched;

            public String formatTouched() {
                return REPORT_FORMAT.format(new Date(lastTouched));
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        import java.time.Instant;
        import java.time.ZoneOffset;
        import java.time.format.DateTimeFormatter;

        public class OrderSummaryCache {

            private static final DateTimeFormatter REPORT_FORMAT = DateTimeFormatter.ofPattern("yyyy-MM-dd");

            private long lastTouched;

            public String formatTouched() {
                return REPORT_FORMAT.format(Instant.ofEpochMilli(lastTouched).atZone(ZoneOffset.UTC));
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderSummaryCache.java: |
      package com.acme.shop.order;

      /** Caches order summaries between refreshes. */
      public class OrderSummaryCache {

          private final Object lock = new Object();

          public Object lock() {
              return lock;
          }
      }
- id: concurrency-control-volatile-singleton
  tier: packs
  pack: concurrency
  rules:
  - concurrency-double-checked-locking
  - concurrency-synchronization-on-shared-lock
  kind: control
  title: A correct volatile double-checked singleton locked on its own field
  prompt: |
    Create OrderSummaryCache with a volatile static instance field, a getInstance() using
    double-checked locking on a private static final Object LOCK field (not the class object
    literal), and make sure only LOCK -- not a string or a fresh object each time -- is used for
    the lock.
  expect:
    final: clean
    gate: silent
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private static OrderSummaryCache instance;

            public static OrderSummaryCache getInstance() {
                if (instance == null) {
                    synchronized ("cache-lock") {
                        if (instance == null) {
                            instance = new OrderSummaryCache();
                        }
                    }
                }
                return instance;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private static final Object LOCK = new Object();
            private static volatile OrderSummaryCache instance;

            public static OrderSummaryCache getInstance() {
                if (instance == null) {
                    synchronized (LOCK) {
                        if (instance == null) {
                            instance = new OrderSummaryCache();
                        }
                    }
                }
                return instance;
            }
        }
- id: concurrency-control-wait-loop-notifyall
  tier: full
  pack: concurrency
  rules:
  - concurrency-wait-not-in-loop
  - concurrency-notify-instead-of-notifyall
  kind: control
  title: A correct wait-in-a-loop / notifyAll pair
  prompt: |
    Add markRefreshed() and awaitRefresh() methods to OrderSummaryCache with a boolean refreshed
    field: markRefreshed acquires this monitor, sets refreshed true, and wakes every waiting
    thread; awaitRefresh acquires this monitor and blocks, rechecking the condition, until
    refreshed is true.
  expect:
    final: clean
    gate: silent
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private boolean refreshed;

            public synchronized void awaitRefresh() throws InterruptedException {
                if (!refreshed) {
                    wait();
                }
            }

            public synchronized void markRefreshed() {
                refreshed = true;
                notify();
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private boolean refreshed;

            public synchronized void awaitRefresh() throws InterruptedException {
                while (!refreshed) {
                    wait();
                }
            }

            public synchronized void markRefreshed() {
                refreshed = true;
                notifyAll();
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderSummaryCache.java: |
      package com.acme.shop.order;

      /** Caches order summaries between refreshes. */
      public class OrderSummaryCache {

          private final Object lock = new Object();

          public Object lock() {
              return lock;
          }
      }
