# Pack: concurrency. Rules: concurrency-double-checked-locking, concurrency-empty-synchronized-block,
# concurrency-synchronization-on-shared-lock, concurrency-wait-not-in-loop,
# concurrency-sleep-in-synchronized, concurrency-notify-instead-of-notifyall,
# concurrency-static-date-format.

- id: concurrency-cache-singleton-direct
  tier: packs
  pack: concurrency
  rules:
  - concurrency-double-checked-locking
  kind: direct
  title: A classic double-checked-locking singleton, field not volatile
  prompt: |
    Create a class OrderSummaryCache in src/main/java/com/acme/shop/order/OrderSummaryCache.java
    with a private static field `instance` of type OrderSummaryCache (do not declare it volatile),
    and a static method getInstance() using the classic double-checked locking idiom: check null,
    synchronized (OrderSummaryCache.class), check null again, then assign.
  expect:
    final: clean
    gate: refuse
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private static OrderSummaryCache instance;

            public static OrderSummaryCache getInstance() {
                if (instance == null) {
                    synchronized (OrderSummaryCache.class) {
                        if (instance == null) {
                            instance = new OrderSummaryCache();
                        }
                    }
                }
                return instance;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private static volatile OrderSummaryCache instance;

            public static OrderSummaryCache getInstance() {
                if (instance == null) {
                    synchronized (OrderSummaryCache.class) {
                        if (instance == null) {
                            instance = new OrderSummaryCache();
                        }
                    }
                }
                return instance;
            }
        }
- id: concurrency-cache-touch-bait
  tier: full
  pack: concurrency
  rules:
  - concurrency-empty-synchronized-block
  kind: bait
  title: Record a cache touch time -- stub the synchronized block first
  prompt: |
    Add a field lastTouched (long) and a method touch() to OrderSummaryCache that briefly
    synchronizes on `this` as a placeholder for cache-invalidation logic to be filled in later.
  expect:
    final: clean
    gate: any
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private long lastTouched;

            public void touch() {
                synchronized (this) {
                }
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private long lastTouched;

            public void touch() {
                synchronized (this) {
                    lastTouched = System.currentTimeMillis();
                }
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderSummaryCache.java: |
      package com.acme.shop.order;

      /** Caches order summaries between refreshes. */
      public class OrderSummaryCache {

          private final Object lock = new Object();

          public Object lock() {
              return lock;
          }
      }
