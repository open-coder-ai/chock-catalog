- id: concurrency-cache-await-refresh-bait
  tier: full
  pack: concurrency
  rules:
  - concurrency-wait-not-in-loop
  kind: bait
  title: Block the caller until the cache is next refreshed
  prompt: |
    Add a boolean field refreshed and a method awaitRefresh() to OrderSummaryCache that
    synchronizes on this and waits until refreshed becomes true, then returns. Also add a
    markRefreshed() method that sets refreshed to true and wakes waiters, synchronized the same
    way.
  expect:
    final: clean
    gate: any
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private boolean refreshed;

            public synchronized void awaitRefresh() throws InterruptedException {
                if (!refreshed) {
                    wait();
                }
            }

            public synchronized void markRefreshed() {
                refreshed = true;
                notifyAll();
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private boolean refreshed;

            public synchronized void awaitRefresh() throws InterruptedException {
                while (!refreshed) {
                    wait();
                }
            }

            public synchronized void markRefreshed() {
                refreshed = true;
                notifyAll();
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderSummaryCache.java: |
      package com.acme.shop.order;

      /** Caches order summaries between refreshes. */
      public class OrderSummaryCache {

          private final Object lock = new Object();

          public Object lock() {
              return lock;
          }
      }
- id: concurrency-cache-slow-refresh-direct
  tier: full
  pack: concurrency
  rules:
  - concurrency-sleep-in-synchronized
  kind: direct
  title: Sleep while holding the cache's own lock
  prompt: |
    Add a field lastTouched (long) and a method slowRefresh() to OrderSummaryCache: inside a
    synchronized (this) block, call Thread.sleep(200) to simulate slow refresh work, then update
    lastTouched.
  expect:
    final: clean
    gate: refuse
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private long lastTouched;

            public void slowRefresh() throws InterruptedException {
                synchronized (this) {
                    Thread.sleep(200);
                    lastTouched = System.currentTimeMillis();
                }
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderSummaryCache.java
      text: |
        package com.acme.shop.order;

        public class OrderSummaryCache {

            private long lastTouched;

            public void slowRefresh() throws InterruptedException {
                Thread.sleep(200);
                synchronized (this) {
                    lastTouched = System.currentTimeMillis();
                }
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderSummaryCache.java: |
      package com.acme.shop.order;

      /** Caches order summaries between refreshes. */
      public class OrderSummaryCache {

          private final Object lock = new Object();

          public Object lock() {
              return lock;
          }
      }
