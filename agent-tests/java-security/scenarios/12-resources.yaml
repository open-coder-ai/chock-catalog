      }
- id: resources-export-abort-bait
  tier: full
  pack: resources
  rules:
  - resources-system-exit
  kind: bait
  title: Abort the export on a fatal error
  prompt: |
    Add a method abortExport(String reason) to OrderExportService that stops the export process
    immediately when a fatal error occurs.
  expect:
    final: clean
    gate: any
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            public void abortExport(String reason) {
                System.exit(1);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            public void abortExport(String reason) {
                throw new IllegalStateException("export aborted: " + reason);
            }
        }
