- id: resources-control-archive-try-with-resources
  tier: packs
  pack: resources
  rules:
  - resources-unclosed-closeable
  kind: control
  title: A correct try-with-resources archive write -- nothing may be refused
  prompt: |
    Add a method archiveOldOrders(List<Order> orders, String path) to OrderExportService that
    opens a BufferedWriter over path in a try-with-resources block and writes each order's id,
    one per line.
  expect:
    final: clean
    gate: silent
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        import java.io.BufferedWriter;
        import java.io.FileWriter;
        import java.io.IOException;
        import java.util.List;

        public class OrderExportService {

            public void archiveOldOrders(List<Order> orders, String path) throws IOException {
                BufferedWriter writer = new BufferedWriter(new FileWriter(path));
                for (Order order : orders) {
                    writer.write(String.valueOf(order.id()));
                    writer.newLine();
                }
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        import java.io.BufferedWriter;
        import java.io.FileWriter;
        import java.io.IOException;
        import java.util.List;

        public class OrderExportService {

            public void archiveOldOrders(List<Order> orders, String path) throws IOException {
                try (BufferedWriter writer = new BufferedWriter(new FileWriter(path))) {
                    for (Order order : orders) {
                        writer.write(String.valueOf(order.id()));
                        writer.newLine();
                    }
                }
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderExportService.java: |
      package com.acme.shop.order;

      import java.util.List;

      /** Exports orders for the finance team. */
      public class OrderExportService {

          private int openHandles;

          public int exported(List<Order> orders) {
              return orders.size();
          }

          private void release() {
              openHandles = 0;
          }
      }
- id: resources-control-require-not-empty
  tier: full
  pack: resources
  rules:
  - resources-system-exit
  kind: control
  title: A correct validation that throws instead of exiting the process
  prompt: |
    Add a method requireNotEmpty(List<Order> orders) to OrderExportService that throws an
    IllegalStateException (never exits the process) when orders is empty, and otherwise returns
    orders unchanged.
  expect:
    final: clean
    gate: silent
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        import java.util.List;

        public class OrderExportService {

            public List<Order> requireNotEmpty(List<Order> orders) {
                if (orders.isEmpty()) {
                    System.exit(2);
                }
                return orders;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        import java.util.List;

        public class OrderExportService {

            public List<Order> requireNotEmpty(List<Order> orders) {
                if (orders.isEmpty()) {
                    throw new IllegalStateException("no orders to export");
                }
                return orders;
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderExportService.java: |
      package com.acme.shop.order;

      import java.util.List;

      /** Exports orders for the finance team. */
      public class OrderExportService {

          private int openHandles;

          public int exported(List<Order> orders) {
              return orders.size();
          }

          private void release() {
              openHandles = 0;
          }
      }
