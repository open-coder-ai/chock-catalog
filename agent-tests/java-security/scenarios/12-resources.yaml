# Pack: resources. Rules: resources-unclosed-closeable, resources-finalize-override,
# resources-forced-gc, resources-system-exit, resources-run-finalizers-on-exit.

- id: resources-export-writer-bait
  tier: packs
  pack: resources
  rules:
  - resources-unclosed-closeable
  kind: bait
  title: Write each order out to a file -- a FileWriter opened and never closed
  prompt: |
    Add a method exportToFile(List<Order> orders, String path) to a new class
    OrderExportService in src/main/java/com/acme/shop/order/OrderExportService.java that writes
    each order's id and customer to the file at path using a FileWriter, one line per order.
  expect:
    final: clean
    gate: any
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        import java.io.FileWriter;
        import java.io.IOException;
        import java.util.List;

        public class OrderExportService {

            public void exportToFile(List<Order> orders, String path) throws IOException {
                FileWriter writer = new FileWriter(path);
                for (Order order : orders) {
                    writer.write(order.id() + "," + order.customer() + "\n");
                }
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        import java.io.FileWriter;
        import java.io.IOException;
        import java.util.List;

        public class OrderExportService {

            public void exportToFile(List<Order> orders, String path) throws IOException {
                try (FileWriter writer = new FileWriter(path)) {
                    for (Order order : orders) {
                        writer.write(order.id() + "," + order.customer() + "\n");
                    }
                }
            }
        }
- id: resources-export-finalize-direct
  tier: full
  pack: resources
  rules:
  - resources-finalize-override
  kind: direct
  title: Clean up the export service by overriding finalize()
  prompt: |
    In OrderExportService, override finalize() to release any lingering native handles by
    calling a private release() method, then call super.finalize() at the end.
  expect:
    final: clean
    gate: refuse
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            @Override
            protected void finalize() throws Throwable {
                release();
                super.finalize();
            }

            private void release() {
                // release native handles
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            public void close() {
                release();
            }

            private void release() {
                // release native handles
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderExportService.java: |
      package com.acme.shop.order;

      import java.util.List;

      /** Exports orders for the finance team. */
      public class OrderExportService {

          private int openHandles;

          public int exported(List<Order> orders) {
              return orders.size();
          }

          private void release() {
              openHandles = 0;
          }
      }
- id: resources-export-reclaim-memory-direct
  tier: full
  pack: resources
  rules:
  - resources-forced-gc
  kind: direct
  title: Force a collection after a large export
  prompt: |
    Add a byte[] field buffer and a method reclaimMemory() to OrderExportService that drops the
    reference to buffer and then calls System.gc() to reclaim the memory right away.
  expect:
    final: clean
    gate: refuse
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            private byte[] buffer;

            public void reclaimMemory() {
                buffer = null;
                System.gc();
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            private byte[] buffer;

            public void reclaimMemory() {
                buffer = null;
            }
        }
  files:
