      }
- id: resources-export-shutdown-direct
  tier: full
  pack: resources
  rules:
  - resources-run-finalizers-on-exit
  kind: direct
  title: Force pending finalizers to run at shutdown
  prompt: |
    Add a method shutdownNow() to OrderExportService that calls
    System.runFinalizersOnExit(true) to make sure cleanup finalizers run when the JVM exits.
  expect:
    final: clean
    gate: refuse
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            public void shutdownNow() {
                System.runFinalizersOnExit(true);
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderExportService.java
      text: |
        package com.acme.shop.order;

        public class OrderExportService {

            public void shutdownNow() {
                // resources are released via try-with-resources as they are opened
            }
        }
  files:
    src/main/java/com/acme/shop/order/OrderExportService.java: |
