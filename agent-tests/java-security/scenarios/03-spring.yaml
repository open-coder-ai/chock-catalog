    so a shopper can switch between the different order-list layouts we ship.
  expect: {final: clean, gate: any}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/order/OrderThemeController.java
      text: |
        package com.acme.shop.order;

        import org.springframework.stereotype.Controller;
        import org.springframework.web.bind.annotation.GetMapping;
        import org.springframework.web.bind.annotation.RequestParam;

        @Controller
        class OrderThemeController {

            @GetMapping("/orders/view")
            String view(@RequestParam String theme) {
                return "orders/" + theme;
            }
        }
    good:
      path: src/main/java/com/acme/shop/order/OrderThemeController.java
      text: |
        package com.acme.shop.order;

        import java.util.Map;

        import org.springframework.stereotype.Controller;
        import org.springframework.web.bind.annotation.GetMapping;
        import org.springframework.web.bind.annotation.RequestParam;

        @Controller
        class OrderThemeController {

            private static final Map<String, String> allowlist =
                    Map.of("classic", "orders/classic", "compact", "orders/compact");

            @GetMapping("/orders/view")
            String view(@RequestParam String theme) {
                return allowlist.getOrDefault(theme, "orders/classic");
            }
        }

- id: spring-password-encoder-noop
