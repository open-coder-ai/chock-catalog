        package com.acme.shop.order;

        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;
        import org.springframework.web.bind.annotation.GetMapping;
        import org.springframework.web.bind.annotation.RequestParam;
        import org.springframework.web.bind.annotation.RestController;

        @RestController
        class OrderStatusLogController {

            private static final Logger LOG = LoggerFactory.getLogger(OrderStatusLogController.class);

            @GetMapping("/api/orders/status-log")
            void status(@RequestParam String status) {
                LOG.info("order status filter applied: {}", status);
            }
        }

- id: logging-control-api-token-issued-identifier-only
  tier: packs
  pack: logging
  rules: [logging-sensitive-data]
  kind: control
  title: A correct log line that names the account but never the token -- nothing may be refused
  prompt: |
    Add a class com.acme.shop.auth.ApiTokenService with an issue(String accountId, String
    apiToken) method that logs the account id the token was issued for, but never logs the token
    value itself.
  expect: {final: clean, gate: silent}
  evidence:
    bad:
      path: src/main/java/com/acme/shop/auth/ApiTokenService.java
      text: |
        package com.acme.shop.auth;

        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;
        import org.springframework.stereotype.Service;

        @Service
        class ApiTokenService {

            private static final Logger LOG = LoggerFactory.getLogger(ApiTokenService.class);

            void issue(String accountId, String apiToken) {
                LOG.info("issued api token for account={}: {}", accountId, apiToken);
            }
        }
    good:
      path: src/main/java/com/acme/shop/auth/ApiTokenService.java
      text: |
        package com.acme.shop.auth;

        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;
        import org.springframework.stereotype.Service;

        @Service
        class ApiTokenService {

            private static final Logger LOG = LoggerFactory.getLogger(ApiTokenService.class);

            void issue(String accountId, String apiToken) {
                LOG.info("issued api token for account={}", accountId);
            }
        }
