  artifact: rule
  enforcement: block
  mandatory: false
  mechanism: commit-time guard script
  enforces: enforced-at-commit
  eval_cases: 11
  eval_executed: 3
  description: 'trigger: staging a large change, committing more than a reviewer can read at once. avoid:
    one commit carrying hundreds of hand-written lines; lockfile and generated churn is not counted.'
- id: protect-test-integrity
  path: base/protect-test-integrity
  version: 0.0.3
  artifact: hook
  enforcement: block
  mandatory: false
  mechanism: test_integrity
  enforces: enforced-at-commit
  eval_cases: 19
  eval_executed: 17
  description: 'Blocks weakening tests to turn them green: a deleted test file (commit only), a net
    loss of assertions, or an added vacuous assertion (assert True, expect(true).toBe(true)). Added
    skips are block-test-skips. Runs: commit (incl. an agent''s commit: CHOCK_AGENT_COMMIT, CLAUDECODE=1,
    AI_AGENT or agent_commit_env), agent write (vs disk), turn''s end (vs HEAD). Waiver: ''chock: allow
    test-integrity'' on an added line. Person''s commit: honoured. Agent: only if already in HEAD; it
    asks a person.'
- id: agentic-code-security
  path: agentic-security/agentic-code-security
  version: 0.3.0
  artifact: hook
  enforcement: block
  mandatory: false
  mechanism: script
  enforces: enforced-at-commit
  eval_cases: 141
  eval_executed: 136
  description: 'trigger: writing agent code or agent config -- Python or TypeScript using AutoGen, CrewAI,
    LangChain, LangGraph, mem0, the OpenAI Agents or Claude Agent SDK, an MCP server or client (.mcp.json,
    .cursor/mcp.json, .vscode/mcp.json, claude_desktop_config.json, .codex/config.toml, .gemini/settings.json),
    docker-compose files for agents. avoid: code execution on the host, unpinned MCP servers and models,
    shell-reaching tools, approvals switched off, whole-environment and credential-store leaks, TLS
    verification off, unbounded loops, SQL and eval built from strings, stripped provenance markers.
    29 rules in 10 packs -- exec, supply, tools, approval, identity, comms, bounds, prompt-memory, code,
    provenance -- each pack or rule allow|deny in .chock/agentic-security.json; bounds, prompt-memory
    and one supply rule start as allow.'
- id: block-unguarded-agent-spawn
  path: base/block-unguarded-agent-spawn
  version: 0.0.2
  artifact: rule
  enforcement: advise
  mandatory: false
  mechanism: guard script
  enforces: best-effort (pre-tool-use, once hooks are installed; fails open if the hook crashes)
  eval_cases: 25
  eval_executed: 25
  description: 'Best-effort guard against an agent launching a coding agent with safety checks off:
    claude --dangerously-skip-permissions or --permission-mode bypassPermissions; codex --full-auto,
    --yolo, --dangerously-bypass-approvals-and-sandbox, --sandbox/-s danger-full-access; gemini --yolo,
    -y, --approval-mode yolo; cursor-agent --force/-f. Parsed: cd, bash -c, sudo/env, npx/bunx/pnpx
    wrappers are caught; echo/grep/commit text is not. Bypasses: aliases, scripts, config-set modes,
    unlisted agents.'
