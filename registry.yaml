    to a file and run on a later step, and interpreters or fetchers outside the lists are missed. Never
    refuses. Friction only.'
- id: scan-secrets-entropy
  path: base/scan-secrets-entropy
  version: 0.0.1
  artifact: hook
  enforcement: advise
  mandatory: false
  mechanism: warn-only gate
  enforces: advisory
  eval_cases: 25
  eval_executed: 25
  description: 'Friction, not a security boundary: flags secrets scan-secrets misses -- high-entropy
    values (16-150 chars) by secret-like keys, GitHub/npm tokens with valid checksums, Stripe test keys,
    Slack/AWS key-id shapes, Luhn-valid cards. Warns only (observe). Misses: values split across lines,
    over 150 chars, cut by # or & when unquoted, under other key names, written like code (a.b(), ALL_CAPS,
    words, URLs, paths), wrapped in a call, parens or concatenation, in XML, or padded with control
    characters.'
