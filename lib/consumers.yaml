# Which lib/ modules each policy ships, copied into <policy>/implementations/<package>/ by
# tools/gen_lib_copies.py. A package's __init__.py always ships; list every module the listed
# ones and the policy's own scripts import (static imports are checked). Edit lib/, never a copy.
# <tree>/<policy id>: {<package>: [<module>, ...]}
base/block-destructive-commands:
  chock_shellparse: [args, parse, targets, writes]
base/block-no-verify:
  chock_shellparse: [args, parse, targets, writes]
base/block-unapproved-egress:
  chock_shellparse: [args, parse, targets, writes]
  chock_scan: [hostmatch, hosts, idn, safe_read, urls]
base/ci-github-actions-security:
  chock_scan: [data_table, safe_read, yamlpath, yamlpath_block, yamlpath_blockscalar, yamlpath_cursor, yamlpath_flow, yamlpath_scalar]
base/block-unguarded-agent-spawn:
  chock_shellparse: [args, parse, targets, writes]
base/dockerfile-compose-security:
  chock_scan: [yamlpath, yamlpath_block, yamlpath_blockscalar, yamlpath_cursor, yamlpath_flow, yamlpath_scalar]
base/protect-agent-config:
  chock_shellparse: [args, parse, targets, writes]
base/protect-ci-workflows:
  chock_shellparse: [args, parse, targets, writes]
base/protect-commit-privacy:
  chock_shellparse: [args, parse, targets, writes]
base/rtk-dangerous-actions-blocker:
  chock_shellparse: [args, parse, targets, writes]
base/verify-mcp-allowlist:
  chock_shellparse: [args, parse, targets, writes]
base/agent-devenv-autoexec:
  chock_scan: [jsonc, yamlpath, yamlpath_block, yamlpath_blockscalar, yamlpath_cursor, yamlpath_flow, yamlpath_scalar]
base/package-lifecycle-scripts:
  chock_scan: [safe_read]
base/lockfile-integrity:
  chock_scan: [hostmatch, hosts, idn, jsonc, urls, yamlpath, yamlpath_block, yamlpath_blockscalar, yamlpath_cursor, yamlpath_flow, yamlpath_scalar]
base/scan-secret-files:
  chock_scan: [entropy, jsonc, keyword_values, sniff, sniff_keys, sniff_shebang, yamlpath, yamlpath_block, yamlpath_blockscalar, yamlpath_cursor, yamlpath_flow, yamlpath_scalar]
