name: New policy proposal
description: Propose a policy for the catalog
title: "[policy-proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: requirement
    attributes:
      label: What must always or never happen
    validations:
      required: true
  - type: input
    id: policy-id
    attributes:
      label: Proposed policy id (optional)
      description: Lowercase words joined by hyphens, e.g. `block-force-push`.
    validations:
      required: false
  - type: checkboxes
    id: determinism
    attributes:
      label: Can it be deterministic?
      description: A policy that exits non-zero is a control; one that does not is advice. Both are welcome, but the answer decides how it is labelled.
      options:
        - label: Expressible as a gate (`content_regex`, `forbidden_ref`, `dependency_allowlist`)
        - label: Expressible as a guard script consulted before a command runs
        - label: Advisory only — rule text compiled into agent context
  - type: textarea
    id: satisfiable
    attributes:
      label: Can it be satisfied?
      description: Describe the change that makes a blocked commit pass.
    validations:
      required: false
  - type: textarea
    id: adversarial
    attributes:
      label: Adversarial cases
      description: How would someone get past it by accident?
    validations:
      required: false
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: The agent you want it for, if one in particular.
      options:
        - claude-code
        - cursor
        - codex
        - copilot
        - devin
        - other
    validations:
      required: false
