name: Nightly transcript sweep

# Adoption transcripts are no longer checked on pull requests: they lag until the owner's release.
# When the FRAMEWORK changes what a command prints, or a policy changes, transcripts go stale and
# no PR touches them -- silent drift in the artifact whose whole value is that it cannot drift.
# This sweep re-adopts every policy from an empty repository once a
# day, so framework-output drift is caught within 24 hours instead of at each policy's next
# edit. Cost at 28 policies: ~45 seconds of ubuntu time, off the PR path entirely.
#
# `schedule` runs on the default branch with no fork code checked out, so the fork-secrets
# rule check_workflows.py enforces is not in play; workflow_dispatch is here for re-running
# the sweep by hand after a framework bump.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Same auth pattern as ci.yml: the framework is a private repo, and checkout handles
      # the token rather than a pip URL where it could surface in logs or the pip cache.
      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          # Deliberately unpinned: the nightly is the canary that warns when framework
          # main will break the NEXT adoption, without ever blocking a PR (CI is pinned).
          ref: main
          path: .framework

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install Chock
        run: pip install ./.framework

      # No --base: every policy, from an empty repository. A failure here means the
      # committed transcripts no longer describe what the tools print -- regenerate with
      # `python tools/gen_adoption_transcript.py` and commit the result via PR.
      - name: Every adoption transcript reproduces
        run: python tools/gen_adoption_transcript.py --check

  # Pull requests no longer keep the derived docs and images current: README counts and rows, the
  # policy pages, the coverage matrix, the quoted console output, the figures and the brand card lag
  # until the owner's release. This job is how that lag stays visible. It runs those checks against
  # main, lists the stale files in the job summary, and fails when any is stale. It opens no issue
  # (that would need `issues: write`); the failed run is the report. The adoption transcripts are
  # the sweep job's, above.
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # The framework at the pinned ref, as ci.yml reads it: the release regenerates with the pin,
      # so drift against framework main would be false drift. The sweep above stays the canary.
      - name: Read the framework pin
        run: python3 -I tools/framework_ref.py read

      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework

      # checkout resolves a ref by name, so a branch or tag spelled like the SHA could stand in.
      - name: The framework checkout is the pinned commit
        run: python3 -I tools/framework_ref.py verify .framework

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # cairosvg is the brand card's renderer; regen_all skips that check without it.
      - name: Install Chock and the generators' tooling
        run: |
          pip install ./.framework
          pip install --require-hashes -r requirements/test.txt
          pip install "cairosvg==2.9.0"

      - name: Derived files that lag until the release are current
        run: |
          status=0
          python tools/regen_all.py --drift > drift.txt 2>&1 || status=$?
          cat drift.txt
          {
            echo "### Derived files that lag until the release"
            echo '```'
            cat drift.txt
            echo '```'
            echo "Release PR regenerates them: \`python tools/regen_all.py\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
