name: CI

# The engine this catalog is built and checked against is pinned in the `.framework-ref`
# DATA FILE, not here. That is deliberate: an adoption PR that edits a data file does not
# modify `.github/workflows/`, so GitHub still runs this CI on the PR. When the pin lived in
# this file, every adoption PR was a workflow-modifying PR -- GitHub refused to run the
# `pull_request` CI on it, the required `dco`/`policies` checks never reported, and the
# protect-main ruleset (no bypass) deadlocked the merge. Bumping the pin is still an explicit,
# reviewable adoption: run `python tools/adopt_framework.py <sha>` to rewrite `.framework-ref`
# AND regenerate every derived artifact in one step. The nightly transcript workflow
# deliberately stays on main as an unpinned canary.
#
# FULL versus TARGETED. Everything runs in full -- every test, 100% line and branch coverage, every
# guard's declared effects -- on a push to main, a schedule, a manual dispatch, and any release
# or publish trigger added later: the rule is "not a pull request", so a new trigger is full until
# someone argues otherwise. A pull request is targeted: one `policy` job per policy it touches and per policy
# built on one (tools/select_plan.py), each running that policy's tests, its effects check, its adoption
# transcript and a staged adopter of it alone, with 100% coverage of its own implementations. It escalates to
# full when it touches anything that is not one policy's own files -- lib/, tools/, a shared test kit or
# conftest, pyproject.toml, requirements/, .github/, .framework-ref -- when more than a handful of policies
# are involved, and whenever the planner cannot tell. A full run's tests are `shards` jobs sized from the
# times main last recorded (tools/durations.py), so wall time holds as the catalog grows. A generated image
# is not one policy's file and forces nothing: the jobs that regenerate it check it. The other jobs run on
# every PR as before.


# Linux only. Policies are text plus POSIX guard scripts, so the platform matrix that the
# framework needs (bash resolution, line endings, path handling) buys nothing here -- and
# Windows bills 2x, macOS 10x, on a private repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every PR commit must carry a Signed-off-by trailer (Developer Certificate of
  # Origin -- see CONTRIBUTING.md). Same in-workflow check as the framework repo:
  # works while private; the DCO App can replace it after launch.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        env:
          # A branch name expanded by the runner into shell text is code injection waiting
          # for a branch with metacharacters; through the environment it stays data.
          BASE_REF: ${{ github.base_ref }}
        run: |
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done < <(git rev-list --no-merges "origin/$BASE_REF..HEAD")
          exit "$missing"

  # Commit messages and PR bodies are as public as the diff and much easier to leak
  # into -- container paths, session identifiers, personal addresses. Checked here
  # because the local test can only see the history it has.
  no-private-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan commit messages for local or personal data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          local_data='/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/|session_[0-9A-Za-z]{12,}|claude\.ai/code/session|/tmp/claude-[0-9]'
          email='[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,24}'
          # Suffixes that make a match a file path rather than an address.
          not_mail='\.(json|ya?ml|md|txt|py|js|ts|tsx|sh|toml|cfg|ini|lock|log|csv|tsv|html?|svg|png|jpe?g|gif|pdf|zip|gz|tar|whl|so|dll|exe)$'
          # Addresses that identify a service rather than a person.
          service='@users\.noreply\.github\.com$|^noreply@anthropic\.com$|^support@github\.com$|^noreply@github\.com$'
          # The maintainer's personal address, as a SHA-256 digest: writing it here in the
          # clear would publish it more prominently than the commits this check guards.
          blocked_digest='ecda4887099c1a8d73af02994c42938dfb0a1857674f6c3a6403af922360104f'
          found=0
          while read -r sha; do
            msg=$(git log -1 --format=%B "$sha")
            # Name the commit, never echo the match: a log line is a publication too.
            if printf '%s' "$msg" | grep -qiE "$local_data"; then
              echo "::error::commit $sha contains a local path or session identifier"
              found=1
            fi
            # A sign-off is somebody's own attestation, so a contributor's address there is
            # their choice and stays allowed. Anywhere else an address arrived by accident --
            # pasted from a log, a stack trace, or a quoted report.
            body=$(printf '%s' "$msg" | grep -viE '^(Signed-off-by|Co-Authored-By|Reported-by|Reviewed-by|Tested-by|Acked-by):')
            if printf '%s' "$body" | grep -oiE "$email" | grep -ivE "$not_mail" | grep -qivE "$service"; then
              echo "::error::commit $sha contains an email address outside a sign-off trailer"
              found=1
            fi
            while read -r addr; do
              [ -n "$addr" ] || continue
              if [ "$(printf '%s' "$addr" | tr '[:upper:]' '[:lower:]' | sha256sum | cut -d' ' -f1)" = "$blocked_digest" ]; then
                echo "::error::commit $sha contains the maintainer's personal address; sign off with the GitHub noreply address"
                found=1
              fi
            done <<< "$(printf '%s' "$msg" | grep -oiE "$email")"
          done < <(git rev-list --no-merges "$BASE_SHA..HEAD")
          exit "$found"

  brand-assets:
    # docs/assets/social-preview.svg is derived from registry.yaml -- so adding or re-grading a policy silently
    # invalidates the committed card. Nothing on it is hand-typed (every count is len() of
    # a list read at render time), but a stale image is wrong all the same, and the image
    # is what a link preview shows to someone who has not read the repo yet.
    #
    # The check compares the SVG, not the PNG: the SVG is text derived only from
    # repository data and is identical on any machine, while a PNG depends on the font
    # installed on the renderer. Facts reach the SVG first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "cairosvg==2.9.0" pyyaml
      - name: Check the social preview matches the repository
        run: cd docs/assets && python gen_brand_assets.py --check

  figures:
    # docs/figures/ carries the open-coder-ai family's shared, theme-aware figure set
    # (see docs/figures/palette.py): the enforcement-coverage bar, the cross-repo family
    # diagram, and the social card, each generated from real repository data rather than
    # typed in. Generators here are stdlib-only plus `palette` on purpose -- this job
    # installs nothing beyond Python itself -- so a generator that grew a PyPI dependency
    # would fail here before it failed anywhere else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Regenerate figures
        run: cd docs/figures && for g in make_*.py; do python "$g"; done
      - name: Fail on drift
        run: git diff --exit-code -- docs/figures

  # Decides, once, whether this run is full or targeted, and how a full one is cut, so every job below
  # agrees. Only a pull request can be targeted; the base ref reaches the shell through the environment, as
  # it does in the DCO check above. A planner that fails fails this job, which fails the `tests` gate:
  # unsure is never "run less". The durations come from main's last green run; with none (a first run, an
  # expired artifact) the shards are the default four, split by hash. Every shard downloads the one file
  # this job uploads, so they all cut the suite the same way even if main records a newer one meanwhile.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      jobs: ${{ steps.scope.outputs.jobs }}
      has_jobs: ${{ steps.scope.outputs.has_jobs }}
      rest: ${{ steps.scope.outputs.rest }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      # Full history: the planner diffs against the merge base with the PR's base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the test durations main last recorded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo '{}' > test-durations.json
          run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$REPO" --name test-durations --dir fetched; then
            cp fetched/test-durations.json test-durations.json
          else
            echo "no durations from main; default shards, split by hash"
          fi

      - name: Plan this run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 tools/select_plan.py "origin/$BASE_REF" > plan.json
          else
            echo '{"full": true}' > plan.json
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("plan.json"))
          jobs = plan.get("policies", [])
          print("full=" + str(plan["full"]).lower())
          print("jobs=" + json.dumps(jobs))
          print("has_jobs=" + str(bool(jobs)).lower())
          print("rest=" + plan.get("tests", ""))
          PY
          echo "shards=$(python3 tools/durations.py shards test-durations.json)" >> "$GITHUB_OUTPUT"
          cat plan.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: scope-durations
          path: test-durations.json
          if-no-files-found: error
          retention-days: 1

  # What `policies` used to run as one serial job is four jobs that start together: the
  # generated-file checks answer in about a minute, and the three slow ones -- this repo as an
  # adopter, the test suite, the staged adopter -- overlap instead of queueing. `policies`
  # itself is now the gate over all four, because branch protection requires a check of that
  # name. Locally, `python tools/regen_all.py` runs the same checks in the same order.
  generated:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      # Full history: the transcript check diffs against the merge base with the PR's base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .framework-ref
            requirements/test.txt

      # The framework pin lives in the .framework-ref data file (see the header comment) so
      # adoption PRs never touch this workflow. Read it into the job env for the checkout below;
      # anything but one full 40-hex commit SHA fails here, before checkout resolves it as a name.
      - name: Read the framework pin
        run: python3 -I tools/framework_ref.py read

      # Check out the framework at the pinned ref this catalog is validated against.
      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework

      # checkout resolves a ref by name, so a branch or tag spelled like the SHA could stand in.
      - name: The framework checkout is the pinned commit
        run: python3 -I tools/framework_ref.py verify .framework

      - name: Install Chock and the lint tooling
        run: |
          pip install ./.framework
          pip install --require-hashes -r requirements/test.txt

      # First, not last: it is the cheapest check here and the one most often tripped -- every
      # version bump and every eval case changes a row. `gen_registry.py --check` fails where
      # the rows or the README's counts are not what the generator writes.
      - name: Registry matches the policies on disk
        run: |
          python tools/check_registry.py
          python tools/gen_registry.py --check

      # `.agents/policies/` is what governs this repo; `base/` is what adopters receive. A fix
      # made only in the installed copy ships to nobody (pin-github-actions 0.0.3 did exactly
      # that), so an installed policy ahead of its source, or different at the same version,
      # fails; one behind is printed as a warning.
      - name: Installed policies trail, never lead, what this catalog publishes
        run: python tools/check_installed.py

      # Docs state what each policy enforces, so a stale one is an overclaim published where
      # adopters read first. The factual half of every page is derived from base/<id>/.
      - name: Policy docs match their policies
        run: |
          python tools/gen_policy_docs.py --check
          python tools/check_readme.py
          # The matrix image used to be a PNG with no generator: it drifted the day the
          # thirteenth policy landed and nothing noticed. Derived from registry.yaml now.
          python tools/gen_coverage_matrix.py --check

      # The numbers were guarded; the quoted terminal output was not, and that is the half
      # that broke twice -- a block message reading "(main/master)" against a gate blocking
      # `main|master`, and a transcript labelled "captured by running these commands" that
      # had gone stale. Quoted output is the most persuasive thing in a README exactly
      # because a reader cannot check it.
      - name: Console transcripts match what the tools print
        run: python tools/check_console.py

      # This repo distributes executable content, so a compromised workflow does not merely
      # leak a token -- it can publish a malicious guard script to everyone who runs
      # `chock add`. `pull_request_target` is the usual way that happens, and the
      # temptation arrives the first time someone wants a bot to comment on a fork PR.
      - name: Workflow triggers cannot hand fork code our secrets
        run: python tools/check_workflows.py

      # This repo's own compiled gates and lockfile match the policies it has installed.
      - name: Compiled artifacts match their manifests
        run: chock sync --repo . --check

      # Every base/<id>/ is also an Agent Plugins 1.0.0 package, and `plugin.json` plus
      # `skills/<id>/SKILL.md` are generated from manifest.yaml. They are committed so the
      # repo is browsable as a plugin marketplace without a build step -- which means a
      # manifest edit that skips `plugin build` publishes a package describing the old
      # policy, to clients we do not control and cannot correct. Before the transcripts,
      # which adopt the packaged folder.
      - name: Published policies are current Agent Plugins packages
        run: |
          # Every tree in tools/trees.py, not an enumerated list: this check once passed
          # while a newly added tree shipped no packages at all -- silent under-coverage
          # that read as "checked everything".
          for tree in $(python tools/trees.py); do
            chock plugin build --repo . --policies-dir "$tree" --check
          done

      # A contributor's "the policy works" claim is committed as docs/<id>/adoption.md --
      # the output of adopting that one policy into an empty repository -- and this step
      # re-derives it. Pasted output can be edited and goes stale; a transcript that fails
      # to reproduce fails the build. Scoped to policies -- or transcripts -- the PR
      # touches, the same trade the
      # reviewer-evidence step makes: an untouched policy's transcript can drift when
      # framework output changes, and is caught at its next edit rather than on every push.
      # A NEW policy with no committed transcript fails here with the command to run. A targeted run
      # checks them in the touched policy's own `policy` job; this is the full run's copy.
      - name: Adoption transcripts reproduce from an empty repo
        if: github.event_name == 'pull_request' && needs.scope.outputs.full == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/gen_adoption_transcript.py --check --base "origin/$BASE_REF"

      # The framework's merge bar, applied to this repository's own code: the same ruff rule set
      # and limits (pyproject.toml), and formatting. The format paths are regen_all.FORMATTED.
      - name: Lint (ruff, the framework's rule set)
        run: ruff check .

      - name: Formatting (ruff format)
        run: >-
          ruff format --check base/java-security agentic-security/agentic-code-security tests
          tools/gen_java_security_contract.py tools/regen_all.py tools/gen_registry.py tools/check_installed.py
          tools/owasp_llm.py tools/prose_counts.py tools/select_tests.py tools/select_plan.py tools/shard_tests.py
          tools/durations.py tools/policy_rows.py
          tools/check_data_tables.py tools/gen_lib_copies.py tools/lib_imports.py lib/chock_scan

  # This repo is itself an adopter: `.agents/policies/` holds the subset it is governed by,
  # committed as a pinned copy. Checking it here proves the adoption flow on a real repo
  # rather than only in the framework's tests.
  adopter:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      # Full history: `review verify` recomputes diff_sha from `merge-base origin/main HEAD`,
      # and a shallow clone has no merge base to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .framework-ref

      - name: Read the framework pin
        run: python3 -I tools/framework_ref.py read

      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework

      # checkout resolves a ref by name, so a branch or tag spelled like the SHA could stand in.
      - name: The framework checkout is the pinned commit
        run: python3 -I tools/framework_ref.py verify .framework

      - name: Install Chock
        run: pip install ./.framework

      # `chock check` is every truth check at once: validate, the lockfile, and a replay of
      # every executable eval case. A separate `chock check --only evals` replayed them twice.
      - name: This repo is a valid adopter
        run: chock check

      # First of the review criteria (docs/review-criteria/effects-honesty.md). A manifest
      # declaring `read_only` and a guard that writes is a wrong claim running on someone
      # else's machine, and nothing checked it. Behavioural, not a lint: the guard is run in a
      # throwaway workspace seeded with canaries and the filesystem is hashed either side.
      #
      # Every guard is run, one throwaway workspace each, and that was the slowest step here. They run
      # concurrently, and only on a full run: a targeted pull request checks the guards of the policies
      # it touches, and those built on them, in their own `policy` jobs.
      - name: Declared effects match what the guards actually do
        if: needs.scope.outputs.full == 'true'
        run: python tools/check_effects.py

      # Checks evidence when a PR carries it, and says so plainly when it does not. Not a
      # gate: nothing is rejected for lacking evidence, because requiring a ritual before
      # anyone has used it voluntarily is how the ritual becomes the point. What it does
      # guarantee is that evidence present in a PR is evidence that survived re-derivation --
      # a claim nobody re-runs is worth nothing, and worse than nothing if it looks checked.
      # Evidence is a claim about one diff, and `main` always carries the file from the
      # last merged PR -- so verifying every file in the directory failed every new branch
      # on evidence it merely inherited, and two concurrent PRs could never both be green.
      # Evidence for a different diff is not wrong, it is someone else's: skip it and say
      # so. Only evidence claiming THIS diff is verified, and it must hold.
      - name: Reviewer evidence, if the PR carries any
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from chock.review.evidence import diff_sha

          base = "origin/" + os.environ["BASE_REF"]
          current = diff_sha(Path(".").resolve(), base)
          files = sorted(Path(".chock/evidence").glob("*.json"))
          if not files:
              print("No reviewer evidence in this PR. Optional today; see docs/review-criteria/.")
              sys.exit(0)

          failed = False
          verified_any = False
          for f in files:
              claimed = json.loads(f.read_text(encoding="utf-8")).get("diff_sha", "")
              if claimed != current:
                  print(f"-- {f}: describes diff {claimed[:12]}, not this one ({current[:12]}); skipped.")
                  continue
              verified_any = True
              print(f"== {f}")
              proc = subprocess.run(
                  [sys.executable, "-m", "chock", "review", "verify",
                   "--repo", ".", "--base", base, str(f)],
              )
              failed = failed or proc.returncode != 0

          if not verified_any:
              print("No evidence describes this diff. Optional today; see docs/review-criteria/.")
          sys.exit(1 if failed else 0)
          PY

  # The test suite is CI's longest step, so a full run is shards that start together and a gate
  # that joins them. How many comes from the time main last recorded for each test file (the scope
  # job): enough that each takes about six minutes, so wall time holds as policies are added. Each
  # shard runs the whole files packed into its slice, longest first into the lightest slice
  # (tests/conftest.py, tools/shard_tests.py, tools/durations.py); with no recorded times it runs
  # the tests whose node-id hash falls in its slice -- crc32, not Python's per-process hash(),
  # because every xdist worker must keep the same tests. Either way the slices partition the suite
  # -- none twice, none dropped -- and the job count the slice is cut by is the matrix's own, so
  # editing the matrix cannot leave a slice unrun. Every test is independent (each already runs on
  # any xdist worker), which is what makes this safe. Never on a PR that is targeted.
  tests-shard:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .framework-ref
            requirements/test.txt

      - name: Read the framework pin
        run: python3 -I tools/framework_ref.py read

      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework

      # checkout resolves a ref by name, so a branch or tag spelled like the SHA could stand in.
      - name: The framework checkout is the pinned commit
        run: python3 -I tools/framework_ref.py verify .framework

      - name: Install Chock and the test tooling
        run: |
          pip install ./.framework
          pip install --require-hashes -r requirements/test.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: scope-durations

      # What the one `tests` step below used to say still holds, shard by shard: tests/ proves
      # every java-security rule case by case -- each refusing and silent case is a named test, and
      # a rule without a case in each direction fails `test_rule_is_proven_both_ways` -- and drives
      # the shipped gate, the eval suite, the selection file, the flow model and a corpus of
      # correct enterprise code no rule may fire on. `chock check` does not replay a script gate on
      # this engine, so this is where those cases run. Every policy in every tree is validated and
      # has each executable eval case replayed as a named test (tests/policies); every statement of
      # every shipped bash guard must be run by one of those cases (bash's own trace,
      # tests/policies/shellcov.py); and every line and branch of the shipped Python -- the
      # java-security engine and gate, the a11y guard, the build tools -- must run under a test.
      #
      # The a11y guard's two checkers (every rule entry, and the decision table and parser,
      # tools/check_a11y_rules.py and check_a11y_table.py) and the Java security setup contract
      # (gen_java_security_contract.py --check) run here, check by check, as
      # tests/a11y/test_a11y_guard.py and tests/java_security/test_setup_contract.py -- they
      # were also separate steps, running the same checks a second time. Nothing under tests/ is
      # published: the distribution repos build from base/ alone.
      #
      # A shard sees a quarter of the tests, so its own coverage is a quarter too and cannot be
      # gated: --cov-fail-under=0 leaves the 100% to the `tests` job, which gates the union.
      # COVERAGE_FILE names the data file without a leading dot because upload-artifact skips
      # hidden files.
      - name: Tests, one shard (every policy, every rule)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          COVERAGE_FILE: cov-shard-${{ matrix.shard }}
        run: >-
          python -m pytest --cov --cov-fail-under=0 --cov-report= -n auto
          --shard "$SHARD/$SHARDS" --shard-durations test-durations.json --durations-out "durations-$SHARD.json"

      # The coverage data and this shard's file times travel together to the `tests` job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            cov-shard-${{ matrix.shard }}
            durations-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # A targeted pull request's policies run in their own jobs below. This runs the rest, whole: the test
  # files the PR changed that no policy job runs, and the repo-wide standards test. No --cov, because a
  # partial run cannot reach 100% and a gate it must fail would be a gate nobody could pass; the policy
  # jobs hold their own implementations to 100%, and main holds the whole.
  tests-targeted:
    needs: scope
    if: needs.scope.outputs.full == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .framework-ref
            requirements/test.txt

      - name: Read the framework pin
        run: python3 -I tools/framework_ref.py read

      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework

      # checkout resolves a ref by name, so a branch or tag spelled like the SHA could stand in.
      - name: The framework checkout is the pinned commit
        run: python3 -I tools/framework_ref.py verify .framework

      - name: Install Chock and the test tooling
        run: |
          pip install ./.framework
          pip install --require-hashes -r requirements/test.txt

      - name: Changed tests and repo standards (targeted, no coverage gate)
        env:
          TESTS: ${{ needs.scope.outputs.rest }}
        run: |
          read -ra files <<< "$TESTS"
          python -m pytest -n auto "${files[@]}"

  # The required check, as `policies` is. A skipped job reports as passing and a failed one it
  # needs would skip this, so it always runs and fails unless exactly the jobs this run needed
  # succeeded: `scope`, then the four shards (full) or the targeted run. On a full run it then
  # does what the single job did last -- combine what the shards measured and fail below 100,
  # with the same [tool.coverage] settings, so what counts as covered has not moved.
  tests:
    if: always()
    needs: [scope, tests-shard, tests-targeted]
    runs-on: ubuntu-latest
    steps:
      - name: Every test job this run needed passed
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          SHARDS: ${{ needs.tests-shard.result }}
          TARGETED: ${{ needs.tests-targeted.result }}
        run: |
          echo "scope=$SCOPE full=$FULL shards=$SHARDS targeted=$TARGETED"
          [ "$SCOPE" = success ] || exit 1
          if [ "$FULL" = true ]; then
            [ "$SHARDS" = success ] && [ "$TARGETED" = skipped ] || exit 1
          else
            [ "$FULL" = false ] && [ "$TARGETED" = success ] && [ "$SHARDS" = skipped ] || exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: needs.scope.outputs.full == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        if: needs.scope.outputs.full == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install the coverage tooling
        if: needs.scope.outputs.full == 'true'
        run: pip install --require-hashes -r requirements/test.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        if: needs.scope.outputs.full == 'true'
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: true

      # `coverage report` finds a `source_pkgs` module the way pytest does only with tools/ on the
      # path (pyproject.toml pythonpath); without it a tool no test imported would drop out of
      # the report instead of showing as 0%.
      - name: Combine the shards, 100% line and branch coverage
        if: needs.scope.outputs.full == 'true'
        env:
          PYTHONPATH: tools
        run: |
          python -m coverage combine coverage-shards/cov-shard-*
          python -m coverage report

      # What the next run cuts its shards by. A file that alone takes longer than a shard is
      # supposed to means no split can balance it, so that fails here, naming it, the way the
      # 300-line rule fails a file that is too long: split it by activity.
      - name: Merge the file times, and no file takes longer than the cap
        if: needs.scope.outputs.full == 'true'
        run: |
          python tools/durations.py merge test-durations.json coverage-shards/durations-*.json
          python tools/durations.py check test-durations.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: needs.scope.outputs.full == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: test-durations
          path: test-durations.json
          if-no-files-found: error
          retention-days: 30

  # One job per policy a targeted pull request touches or that is built on one (tools/select_plan.py),
  # so cost follows the change rather than the catalog: this policy's tests, its effects check, its
  # adoption transcript when the PR touches it, and the policy staged alone into an empty repo as an
  # adopter would take it. `--policy` keeps the walker tests to this policy's own rows. Its
  # implementations must reach 100% line and branch coverage under those tests; a package copied in
  # from lib/ is left out, being identical to lib/ (check_registry.py) and gated there by a full run.
  # Matrix values reach the shell through the environment, never into the script text.
  policy:
    needs: scope
    if: needs.scope.outputs.has_jobs == 'true'
    name: policy (${{ matrix.policy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .framework-ref
            requirements/test.txt

      - name: Read the framework pin
        run: python3 -I tools/framework_ref.py read

      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework

      # checkout resolves a ref by name, so a branch or tag spelled like the SHA could stand in.
      - name: The framework checkout is the pinned commit
        run: python3 -I tools/framework_ref.py verify .framework

      - name: Install Chock and the test tooling
        run: |
          pip install ./.framework
          pip install --require-hashes -r requirements/test.txt

      - name: Tests and evals of this policy, its implementations at 100% coverage
        env:
          POLICY: ${{ matrix.policy }}
          TESTS: ${{ matrix.tests }}
          IMPL: ${{ matrix.implementations }}
          OMIT: ${{ matrix.omit }}
        run: |
          read -ra files <<< "$TESTS"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no test names $POLICY; the planner is wrong"; exit 1; }
          if [ -z "$IMPL" ]; then
            python -m pytest -n auto --policy "$POLICY" "${files[@]}"
            exit 0
          fi
          python -m pytest -n auto --policy "$POLICY" --cov --cov-fail-under=0 --cov-report= "${files[@]}"
          omit=()
          [ -z "$OMIT" ] || omit=(--omit="$OMIT")
          python -m coverage report --include="$IMPL/*,$IMPL/**/*" "${omit[@]}" --fail-under=100

      - name: Declared effects of this policy's guards match what they do
        env:
          POLICY: ${{ matrix.policy }}
        run: python tools/check_effects.py --policies "$POLICY"

      - name: Adoption transcript reproduces from an empty repo
        if: matrix.transcript
        env:
          POLICY: ${{ matrix.policy }}
        run: python tools/gen_adoption_transcript.py --check --policy "$POLICY"

      # The staged-adopter job's steps, for this one policy: published as an adopter would install it,
      # then validated with every eval case replayed. The OWASP claim needs the whole pack, so it stays
      # with the full run.
      - name: Stage this policy alone as an adopter would, and replay its evals
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          stage="$RUNNER_TEMP/staged"
          mkdir -p "$stage"
          cd "$stage"
          git init --quiet .
          git config user.email ci@chock.invalid
          git config user.name ci
          chock init . --skip-hooks
          cp -r "$GITHUB_WORKSPACE/$FOLDER" .agents/policies/
          chock sync --repo . --skip-hooks
          chock check --repo .

  # Everything PUBLISHED is checked separately, in a throwaway repo. A full run stages all of it; a
  # targeted run stages each policy it touches alone, in that policy's `policy` job. Staging into
  # `.agents/policies/` would overwrite the pinned copies above with `base/`, conflating
  # what this repo runs with what it ships -- the exact separation that makes editing a
  # published policy safe.
  staged-adopter:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .framework-ref

      - name: Read the framework pin
        run: python3 -I tools/framework_ref.py read

      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework

      # checkout resolves a ref by name, so a branch or tag spelled like the SHA could stand in.
      - name: The framework checkout is the pinned commit
        run: python3 -I tools/framework_ref.py verify .framework

      - name: Install Chock
        run: pip install ./.framework

      - name: Stage every published policy and skill as an adopter would
        run: |
          rm -rf /tmp/catalog-check
          mkdir -p /tmp/catalog-check
          cd /tmp/catalog-check
          git init --quiet .
          git config user.email ci@chock.invalid
          git config user.name ci
          chock init . --skip-hooks
          # The tree list comes from tools/trees.py, the same source every tool reads.
          # Enumerating trees here is how the plugin check missed `compliance/` entirely.
          for tree in $(python "$GITHUB_WORKSPACE"/tools/trees.py); do
            if [ -d "$GITHUB_WORKSPACE/$tree" ]; then
              cp -r "$GITHUB_WORKSPACE/$tree"/* .agents/policies/
            else
              # trees.py is the source of truth for what this catalog publishes; a
              # listed tree with no directory means the staging step would validate
              # an incomplete published set and report it whole.
              echo "::error::tree listed by tools/trees.py is missing: $tree"
              exit 1
            fi
          done
          if [ -d "$GITHUB_WORKSPACE/skills" ]; then
            cp -r "$GITHUB_WORKSPACE"/skills/* .agents/skills/
          fi
          chock sync --repo . --skip-hooks
          ls .agents/policies .agents/skills

      # Validates every published policy and, as tier 2, replays each policy's own gate or
      # guard against a throwaway repo: a policy whose declared gate does not do what its eval
      # suite claims fails here. One run -- `chock check` already replays the evals, so the
      # `--only evals` step that followed it ran every case a second time.
      - name: Validate every published policy and replay its evals
        run: chock check --repo /tmp/catalog-check

      # The README's coverage claim, re-derived: the staged adopter (which installs every
      # published policy) must score all ten OWASP ASI controls covered. This repo itself
      # stays minimal on purpose -- contributors should not wade through sixteen ambient
      # policies -- so the claim is verified where the full pack is actually installed.
      - name: OWASP ASI coverage claim holds in the staged adopter
        run: |
          cd /tmp/catalog-check
          report="$(chock compliance report --framework owasp_asi)"
          echo "$report"
          if echo "$report" | grep -q "uncovered"; then
            echo "::error::README claims 10/10 ASI coverage but the staged adopter has uncovered controls"
            exit 1
          fi

  # The required check. A job skipped because a job it needs failed would report as passing, so this
  # one always runs and fails unless every job this run needed succeeded and every job it did not need
  # was skipped: `staged-adopter` on a full run, the `policy` jobs on a targeted one with policies.
  policies:
    if: always()
    needs: [scope, generated, adopter, tests, staged-adopter, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Every policies job passed
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          HAS_JOBS: ${{ needs.scope.outputs.has_jobs }}
          GENERATED: ${{ needs.generated.result }}
          ADOPTER: ${{ needs.adopter.result }}
          TESTS: ${{ needs.tests.result }}
          STAGED: ${{ needs.staged-adopter.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          echo "scope=$SCOPE full=$FULL has_jobs=$HAS_JOBS generated=$GENERATED adopter=$ADOPTER tests=$TESTS staged=$STAGED policy=$POLICY"
          for result in "$SCOPE" "$GENERATED" "$ADOPTER" "$TESTS"; do
            [ "$result" = success ] || exit 1
          done
          want=skipped
          [ "$FULL" = true ] && want=success
          [ "$STAGED" = "$want" ] || exit 1
          want=skipped
          [ "$HAS_JOBS" = true ] && want=success
          [ "$POLICY" = "$want" ] || exit 1
