name: CodeQL

# Scans `tools/*.py` -- the scripts CI depends on to catch overclaims. They are small, but they
# are the mechanism behind every honesty check this repo makes, so "too small to scan" is the
# wrong instinct.
#
# CodeQL does not analyse shell, so `implementations/*.sh` -- the executable content this repo
# actually distributes -- is NOT covered here. Human review routed by CODEOWNERS remains the
# only control on those, exactly as SECURITY.md says. Worth stating rather than letting a green
# CodeQL badge imply otherwise.
#
# Guarded on `private == false` rather than left to fail: CodeQL needs a public repo or
# Advanced Security, and a workflow that is red on every push teaches everyone to ignore red
# workflows. It starts working by itself the day the repo flips.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: "/language:python"
