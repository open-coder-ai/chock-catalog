# OSSF Scorecard: supply-chain posture score + public badge.
#
# Plumbing committed pre-launch, activation automatic at launch: gated on the PUBLIC
# repository name, so it no-ops in the private workshop repo and starts scoring once
# `open-coder-ai/chock-catalog` exists. publish_results requires a public repo.
name: Scorecard

on:
  schedule:
    - cron: "45 4 * * 1" # weekly, Monday 04:45 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: github.repository == 'open-coder-ai/chock-catalog'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
