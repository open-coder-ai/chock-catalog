version: 2

# No pip ecosystem here on purpose: this repo declares no Python dependencies. `tools/*.py`
# runs against the framework and PyYAML, both of which arrive with `pip install chock`
# and are versioned there. Pointing dependabot at a directory with no manifest produces
# nothing except a config that looks like coverage.
#
# Actions are the real surface. CI checks out the framework and installs it, so a stale or
# compromised action in this workflow reaches the point where policies are validated before
# publication -- and what this repo publishes becomes a git hook in other people's
# repositories.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # A one-week cooldown before adopting a fresh release is the xz-class
    # counter; security advisories bypass it via alerts.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      # All action bumps in one weekly PR. Not only to cut noise -- ungrouped bumps are
      # WRONG here, and were. codeql-action 4.37.8 arrived as three separate PRs (#49 init,
      # #50 analyze, #51 upload-sarif), and each fails on its own with "Loaded a
      # configuration file for version '4.37.8', but running version '4.37.7'": those three
      # steps must run the same version, so splitting one atomic upgrade across three
      # branches makes every branch individually red and green only after all three land.
      # Grouping keeps a multi-step action's steps in step. Matches chock's own config.
      actions:
        patterns: ["*"]
