# Fake, documented secret-shaped fixtures for the scan-secrets policies.
# Our own scan-secrets gate still checks these files (pragma required, person's commit only);
# only GitHub's secret scanning / push protection skips them.
paths-ignore:
  - "tests/policies/test_scan_secrets*.py"
  - "base/scan-secrets*/evals/**"
  - ".agents/policies/scan-secrets*/evals/**"
  - "base/scan-secret-files/evals/**"
