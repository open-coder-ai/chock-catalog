id: owasp-asi03-identity-privilege-abuse
name: "OWASP ASI03 — Identity & Privilege Abuse"
version: "0.0.1"
description: >
  Give each agent its own scoped, short-lived identity so a compromise does not
  inherit a human's or a shared account's full permissions. Use when an agent
  needs credentials, a service account, a cloud role, an API token, or when
  reviewing delegation and impersonation between an agent and its user. Do NOT
  use for keeping secrets out of the repository — that is `code-safety` and
  `scan-secrets`.
artifact: rule
enforcement: advise
mandatory: false
effects:
- read_only
approval:
  required: false

rule:
  text: |
    identity(per_agent): unique + short_lived + task_scoped; never: reuse(human_credential) | share(service_account) | issue(long_lived_broad_token)
    review(agent_permissions) on(human_access_review_schedule); expire(credentials) automatically; see .agents/policies/owasp-asi03-identity-privilege-abuse/references/identity.md

compliance:
  owasp_asi:
  - ASI03

provenance:
  author: "chock-core"
  author_email: "chock@example.com"
  created_at: "2026-08-12T00:00:00Z"
  updated_at: "2026-08-12T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

