  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-13'
  changes:
  - "Initial draft: content_regex gate over @latest launchers and :latest images."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Self-safe authoring (#32): pattern rewritten with single-character classes so it cannot match its own source; eval payload lines and reference examples carry the allowlist pragma. Committing this policy folder no longer trips its own gate. Matching behaviour on real content is unchanged."
- version: 0.0.3
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas/nist_ai_rmf); no mechanism change."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Also run in the agent: gate.on is now [commit, tool_use], so an unpinned launcher or image is refused as the agent writes it (the whole written file is scanned at the turn's end). No pattern change. Known cost: a README or doc that shows an npx or uvx launch at the floating tag is refused too, and an already-committed line carrying the pragma still blocks a later agent edit of that file, because the pragma is not honoured in the agent; pin the version in the example, or a person makes the edit. forbidden_path_regex was not used to limit the scan to config paths: on content_regex it denies matching paths outright rather than scoping the pattern."
- version: 0.0.5
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, a commit made with CHOCK_AGENT_COMMIT set) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "Behaviour change (roadmap HP06 v2, single-line forms). Also blocks: dist-tags latest, next, canary, beta, rc, nightly, alpha and experimental after npx, pnpx, uvx, bunx, pnpm dlx, yarn dlx, pipx run, uv tool run/install, npm i/install/add/exec, pnpm add/install, yarn add and bun add/install/x, with flags in between; single- or double-quoted package-at-dist-tag strings (MCP args arrays); FROM in any letter case, with or without the platform flag, at the latest tag or at an untagged image path that has a slash (a stage alias never has one); docker, podman and nerdctl run/pull/create naming an image (a registry port allowed) at latest, edge, nightly or canary, and a one-line args array whose run, pull or create element precedes such an image; docker:// refs untagged or at those tags or next, main, master; pip's pre-release install flag; go install and go run at latest; a line that installs crates with cargo with no version and none of the locked, path, rev or list flags; a git+ URL without a full 40-hex commit ending the ref, in a pip, pipx, uv or uvx command, a requirements line, a PEP 508 string, a lone quoted args line or after a quoted from-flag; a github: owner/repo ref without a 40-hex commit as a dependency value (not the repository key) or in an npm, pnpm, yarn or bun command."
  - "Every repeat in the pattern is bounded, so a gate run stays linear in line length (a 1 MB line takes about a second). Two 0.0.5 alternatives were quadratic on long whitespace-free lines (a 100 KB minified JSON line took 6.6 s and could exceed the 30 s gate budget): the double-quoted latest string and the image key now allow at most 256 characters before the tag. Every other 0.0.5 alternative is kept verbatim, so their verdicts are unchanged; the two bounded ones differ only for a token longer than 256 characters."
  - "Not covered yet, listed in references: bare untagged FROM (needs the wave 3 stage-aware script), untagged compose/k8s image keys and the opt-in digest requirement (ask tier, a separate gate), docker run with an untagged image, launchers with no version, multi-line forms. Known cost: docs that show one of these forms are refused too; pin the example or a person waives it."
