id: block-unpinned-agent-components
name: "Block Unpinned Agent Components"
version: "0.1.0"
description: >
  Gate for the line-visible slice of ASI04: agent components fetched at a floating
  version. Blocks dist-tags (latest, next, canary, beta, rc, nightly) on npx/uvx/bunx,
  dlx, add/install and pipx run; FROM at latest or an untagged registry path; floating
  docker run/pull and docker:// refs; pip --pre; go install at latest; unversioned cargo
  installs; git+ installs and requirements, and github: dependencies, with no commit
  SHA. Per line: friction, not a boundary (limits in references).
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Unpinned agent component detected. Pin an exact version or digest
      (name@1.2.3, image:1.27.1 or image@sha256:..., a 40-hex commit for git+ and
      github: refs, cargo install name@1.2.3, no pip --pre) so what runs tomorrow is
      what was reviewed today, or add 'pragma: allowlist unpinned' on the same line
      for a deliberate exception (a person's; in the agent it counts only when that
      exact line is already committed in HEAD, so an agent asks a person).
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+unpinned'
      # The single-character classes ([s]) keep this pattern from matching its own
      # source text in this manifest and in the compiled gate.json, while matching
      # identical real content. Without them, committing this policy folder tripped
      # the policy's own gate (#32).
      content_pattern: |-
        (npx|uvx|bunx)\s+(-y\s+|--yes\s+)?\S*@late[s]t\b|"\S{1,256}@late[s]t"|FROM\s+\S+:late[s]t\b|image:\s*['"]?\S{1,256}:late[s]t\b|\b(?:npx|pnpx|uvx|bunx|pnpm\s+dlx|yarn\s+dlx|pipx\s+run|uv\s+tool\s+(?:run|install)|npm\s+(?:i|install|add|exec|x)|pnpm\s+(?:add|i|install)|yarn\s+(?:global\s+)?add|bun\s+(?:add|i|install|x))\s[^\n#;|&]{0,200}?\S@(?:late[s]t|nex[t]|canar[y]|bet[a]|nightl[y]|r[c]|alph[a]|experimenta[l])(?![\w.-])|["'](?:@[\w.-]{1,214}/)?[\w.-]{1,214}@(?:late[s]t|nex[t]|canar[y]|bet[a]|nightl[y]|r[c]|alph[a]|experimenta[l])["']|["'](?:run|pull|create)["']\s*,[^\n]{0,300}?["'](?:[^\s/=@'"]{1,128}/){0,8}[^\s:/=@'"]{1,128}:(?:late[s]t|edg[e]|nightl[y]|canar[y])["']|^\s*[Ff][Rr][Oo][Mm]\s+(?:--platform[=\s]\S+\s+)?(?!-)(?:\S+:late[s]t(?![\w.-])|(?:[^\s/'"]+/)+[^\s/:@'"$]+(?:\s+[Aa][Ss]\s+\S+)?\s*(?:#.*)?$)|\b(?:docker|podman|nerdctl)\s+(?:image\s+|container\s+)?(?:run|pull|create)\s[^\n#;|&]{0,200}?(?<![^\s'"])(?:[^\s/=@'"]{1,128}/){0,8}[^\s:/=@'"]{1,128}:(?:late[s]t|edg[e]|nightl[y]|canar[y])(?![\w.-])|\bdocker://(?:(?:[^\s/'"@]{1,128}/){0,8}[^\s/:@'"$]{1,128}(?=$|[\s'",\]])|[^\s'"@]{1,256}:(?:late[s]t|edg[e]|nightl[y]|canar[y]|nex[t]|mai[n]|maste[r])(?![\w.-]))|\bpip(?:3(?:\.\d+)?)?\s+install\s[^\n#;|&]{0,200}?--pr[e](?![\w-])|\bgo\s+(?:install|run)\s[^\n#;|&]{0,200}?@late[s]t\b|\bcargo(?:\s+\+\S+)?\s+install(?![\w-])(?![^\n#;|&]{0,200}?(?:--locke[d]|--vers|--path|--list|--rev\b))(?:\s+-[\w-]{1,32}(?:[=\s](?!-)\S{1,128})?){0,12}\s+(?!(?:to|for|the|a|an|and|or|of|with|from|in|on|is|it|its|this|that|will|can|first|then|again|command|step|line)\b)[A-Za-z][\w-]{0,64}(?![\w@=.:/-])(?:\s+[A-Za-z][\w-]{0,64}(?![\w@=.:/-])){0,7}\s*(?=$|[;&|)`'"#\\]|\s-)|\b(?:pip(?:3(?:\.\d+)?)?|pipx|uvx?)\s[^\n#;|&]{0,200}?\bgit\+(?![^\s'"#]{0,512}@[0-9a-fA-F]{40}(?=$|[\s'",\]#]))[^\s'"]{1,512}|^\s*(?:-e\s+)?(?:[A-Za-z0-9][\w.-]{0,100}(?:\[[^\]]{0,100}\])?\s*@\s*)?git\+(?![^\s'"#]{0,512}@[0-9a-fA-F]{40}(?=$|[\s'",\]#]))[^\s'"]{1,512}|["'][A-Za-z0-9][\w.-]{0,100}(?:\[[^\]]{0,100}\])?\s*@\s*git\+(?![^\s'"#]{0,512}@[0-9a-fA-F]{40}(?=$|[\s'",\]#]))[^\s'"]{1,512}|^\s*["']git\+(?![^\s'"#]{0,512}@[0-9a-fA-F]{40}(?=$|[\s'",\]#]))[^\s'"]{1,512}["'],?\s*$|["']--fro[m]["']\s*,\s*["']git\+(?![^\s'"#]{0,512}@[0-9a-fA-F]{40}(?=$|[\s'",\]#]))[^\s'"]{1,512}|["'](?!repository["'])[^"'\s]{1,128}["']\s*:\s*["']github:[A-Za-z0-9][\w.-]{0,100}/[\w.-]{1,100}(?![\w.-])(?!#[0-9a-fA-F]{40}(?=$|[\s'",\]]))|\b(?:npx|pnpx|bunx|npm|pnpm|yarn|bun)\s[^\n#;|&]{0,200}?(?<![^\s'"])github:[A-Za-z0-9][\w.-]{0,100}/[\w.-]{1,100}(?![\w.-])(?!#[0-9a-fA-F]{40}(?=$|[\s'",\]]))

compliance:
  mitre_atlas:
  - control: AML.T0109
    coverage: partial
    note: "pinning gate removes the floating-version carrier of rug pulls"
  - control: AML.T0110
    coverage: partial
    note: "blocks the unpinned acquisition path a poisoned tool rides in on"
  nist_ai_rmf:
  - control: MANAGE-3.1
    coverage: partial
    note: "commit-time control on third-party agentic components"
  owasp_asi:
  - control: ASI04
    coverage: partial
    note: "blocks unpinned launches a diff can show; signature verification, provenance, and AIBOM remain advisory (owasp-asi04-agentic-supply-chain). Language manifests are verify-dependency-exists."

