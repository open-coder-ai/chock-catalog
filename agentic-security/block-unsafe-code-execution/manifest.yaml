id: block-unsafe-code-execution
name: "Block Unsafe Code Execution"
version: "0.1.0"
description: >
  Commit and agent-write gate, greppable slice of ASI05: eval and exec
  (bare, global-receiver and indirect forms), the Function constructor, string
  timers, exec-mode compile, import by computed name, shell-mode and
  implicit-shell process APIs, unsafe deserializers (pickle family, unsafe yaml
  loaders, model loads) and shell eval of a variable. File-type-blind
  line scan: friction, not a security boundary. Waiver 'pragma: allowlist exec' on
  the line; in the agent only if already committed in HEAD.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Dynamic execution primitive detected. Replace it with a parameterized API
      (a subprocess argument vector without a shell, execFile/spawn without the
      shell option, yaml.safe_load, torch load with weights_only, a real parser or
      an explicit dispatch table), or have a person add 'pragma: allowlist exec' on
      the same line for a reviewed, deliberate use (in the agent it counts only when
      that exact line is already committed in HEAD).
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+exec'
      content_pattern: |-
        (?<![\w.])(?:eval|exec)\s*(?:\?\.\s*)?\(|(?<![\w.$])(?:window|globalThis|__builtins__|builtins)\s*\.\s*(?:eval|exec)\s*\(|\[\s*["'](?:eval|exec|execSync)["']\s*\]\s*\(|,\s*eval\s*\)\s*\(|=\s*eval\s*;|getattr\s*\(\s*(?:__builtins__|builtins)\s*,\s*["'](?:eval|exec)["']|new\s+Function\s*\(|(?<![\w.$])(?<!class\s)(?<!def\s)(?<!function\s)Function\((?!\?|[\w$]+\??\s*:)(?!(?:\s*(?:"[^"\\]*"|'[^'\\]*')\s*,)*\s*(?:"[^"\\]*"|'[^'\\]*')\s*\))|(?:(?<![\w.$])|(?<=\bwindow\.)|(?<=\bglobalThis\.))(?:setTimeout|setInterval)\s*\(\s*["'`]|(?<![\w.])(?<!def\s)compile\s*\(.*["'](?:exec|eval|single)["']|(?<!\w)__import__\s*\((?!\s*(?:"[^"\\]*"|'[^'\\]*')\s*[,)])|__import__\s*\(\s*["'](?:os|subprocess|pty|builtins|commands|posix|nt|ctypes)["']|(?<![\w.])(?:importlib\s*\.\s*)?import_module\s*\((?!\s*(?:"[^"\\]*"|'[^'\\]*')\s*[,)])|shell\s*=\s*(?:True|1)\b|["']?shell["']?\s*:\s*(?:true|True)\b|os\.(?:system|popen)\s*\(|(?:subprocess|commands)\s*\.\s*get(?:status)?output\s*\(|os\s*\.\s*(?:exec[lv]p?e?|spawn[lv]p?e?|posix_spawnp?)\s*\(|create_subprocess_shell\s*\(|execSync\s*\(|(?<![\w$])(?:child_process|childProcess|cp)\s*\.\s*exec\s*\(|require\s*\(\s*["'](?:node:)?child_process["']\s*\)\s*\.\s*exec\s*\(|getRuntime\s*\(\s*\)\s*\.\s*exec\s*\(|pickle\.loads?\s*\(|marshal\.loads?\s*\(|(?:cPickle|dill)\s*\.\s*loads?\s*\(|(?:pickle|cPickle|dill)\s*\.\s*Unpickler\s*\(|jsonpickle\s*\.\s*decode\s*\(|shelve\s*\.\s*open\s*\(|yaml\.load(?:_all)?\s*\((?![^)]*(?<![\w.])(?:yaml\.)?C?SafeLoader\b)|yaml\s*\.\s*unsafe_load(?:_all)?\s*\(|typ\s*=\s*["']unsafe["']|torch\s*\.\s*load\s*\((?![^#\n]*weights_only\s*=\s*True)|allow_pickle\s*=\s*True\b|(?<![\w.$-])eval\s+(?:"[^"]*)?\$\{?[\w@*#?!]|(?<![\w$])vm\s*\.\s*(?:runIn(?:New|This)?Context|compileFunction)\s*\(|new\s+vm\s*\.\s*Script\s*\(

compliance:
  mitre_atlas:
  - control: AML.T0050
    coverage: partial
    note: "blocks bare interpreter sinks a diff can show; runtime sandboxing is out of scope"
  owasp_asi:
  - control: ASI05
    coverage: partial
    note: "blocks the greppable primitives; sandbox containment and egress policy remain advisory (owasp-asi05-unexpected-code-execution)"
  cwe:
  - control: CWE-78
    coverage: partial
    note: "shell-mode, implicit-shell, child-process-exec, runtime-exec, shell-eval-expansion; same-line forms only"
  - control: CWE-95
    coverage: partial
    note: "eval-exec-call, eval-exec-receiver, eval-exec-indirect, function-constructor, string-timer, compile-builtin, vm-run, shell-eval-expansion"
  - control: CWE-470
    coverage: partial
    note: "dynamic-import: import by a computed name, and the import of os/subprocess-class modules by literal name"
  - control: CWE-502
    coverage: partial
    note: "deserialize, yaml-unsafe, model-load"

provenance:
  author: "chock-core"
  author_email: "chock@example.com"
  created_at: "2026-08-13T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-13'
  changes:
  - "Initial draft: content_regex gate over the ASI05 primitives a diff can actually show."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Self-safe authoring (#32): description names the shell-mode form instead of showing the literal that matched the policy's own gate; eval prompts describe rather than show, and eval payload lines plus reference examples carry the allowlist pragma. The pattern itself was already self-safe and is unchanged."
- version: 0.0.3
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Also run in the agent: gate.on is now [commit, tool_use], so a dynamic-execution primitive is refused as the agent writes it (an edit's own text at tool use; at the turn's end only lines changed against HEAD). No pattern change. False-positive check: the pattern needs a call paren after eval/exec (a `.exec(` method call is excluded by its lookbehind) and skips nothing by path, so prose that names a primitive with a call paren is refused in the agent as it already was at commit; a line already committed with the pragma is never re-flagged. Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, a commit made with CHOCK_AGENT_COMMIT set) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "v2, regex tier (roadmap HP13): the pattern now also refuses the receiver forms of known sinks (the child_process exec family, a Runtime exec, os exec*/spawn*/posix_spawn, subprocess and commands getstatusoutput/getoutput, asyncio's shell subprocess), eval/exec through window, globalThis or builtins and their indirect forms (bracket access, the comma-operator call, assignment to a name, getattr with a literal name), the Function constructor without new unless every argument is a plain literal, string timers, compile in exec/eval/single mode, import by computed name (and by the literal names of os-class modules), the shell option as true or 1 in keyword, JSON and object forms, the cPickle/dill/jsonpickle/shelve/Unpickler deserializers, the yaml unsafe loaders and ruamel's unsafe type, torch load without weights_only set to True on the line, allow_pickle set to True, the vm run APIs, and shell eval of a variable expansion. The yaml SafeLoader exemption now needs the loader name itself (a name that merely ends in SafeLoader no longer exempts). Each rule names its CWE under compliance.cwe."
  - "Nothing loosens: every line the 0.0.4 pattern refused is still refused (checked over about 3.4 million lines of installed Python and Node packages, zero lines lost). Kept exemptions: dotted method calls on other receivers (model.eval, pattern.exec, self.exec), ast.literal_eval, yaml.safe_load, the shell-init idiom that evals a command substitution, Function or import with plain-literal arguments. Not done here: the roadmap's markdown-fence, comment-line and test-path exemptions would loosen the gate and a line scan cannot see a fence; they are left to NP10 (wave 4) and the owner. Multi-line calls, aliases and constructed names stay documented limits."
