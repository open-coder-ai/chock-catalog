suite:
  id: block-unsafe-code-execution-tests-v1
  policy_id: block-unsafe-code-execution
  version_constraint: ">=0.0.1"
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # Every executable case states its expectation independently of the pattern; the
  # negative_trigger cases pin the lookbehind/lookahead behaviour that keeps the gate
  # from blocking method calls that merely share a name with a builtin.
  cases:
  - id: tc-001
    category: trigger
    prompt: A staged file passes model output to the Python eval builtin.
    expect: The hook blocks the commit.
    execute:
      files:
        handler.py: "result = eval(llm_response)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-002
    category: trigger
    prompt: A staged file spawns a subprocess with the shell flag enabled.
    expect: The hook blocks the commit.
    execute:
      files:
        runner.py: "subprocess.run(cmd, shell=True)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-003
    category: trigger
    prompt: A staged JS file builds code from a string with new Function.
    expect: The hook blocks the commit.
    execute:
      files:
        plugin.js: "const fn = new Function(body);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-004
    category: negative_trigger
    prompt: A staged file calls model.eval() to switch a torch module to inference mode.
    expect: The hook allows the commit; a dotted method call is not the eval builtin.
    execute:
      files:
        train.py: "model.eval()\nwith torch.no_grad():\n    pass\n"
      expect: allow
  - id: tc-005
    category: negative_trigger
    prompt: A staged file parses YAML with yaml.safe_load and runs a regex with pattern.exec.
    expect: The hook allows the commit.
    execute:
      files:
        config.py: "data = yaml.safe_load(fh)\n"
        match.js: "const m = pattern.exec(line);\n"
      expect: allow
  - id: tc-006
    category: behavior
    prompt: "A reviewed, deliberate exec carries 'pragma: allowlist exec' on the same line."
    expect: The hook allows the commit; the escape is per-line and visible in review.
    execute:
      files:
        sandbox.py: "exec(compile(src, '<gen>', 'exec'))  # pragma: allowlist exec\n"
      expect: allow
  - id: tc-007
    category: edge
    prompt: A staged file calls yaml.load but names SafeLoader in the same call.
    expect: The hook allows the commit; only loader-less yaml.load blocks.
    execute:
      files:
        settings.py: "cfg = yaml.load(fh, Loader=yaml.SafeLoader)\n"
      expect: allow
  - id: tc-008
    category: trigger
    prompt: "The agent writes the eval builtin over model output into handler.py."
    expect: "The write is refused before it happens."
    execute: {event: tool_use, writes: {"handler.py": "result = eval(llm_response)\n"}, expect: block}  # pragma: allowlist exec
  - id: tc-009
    category: negative_trigger
    prompt: "The agent writes a clean handler.py."
    expect: "The write is allowed."
    execute: {event: tool_use, writes: {"handler.py": "result = parse(llm_response)\n"}, expect: allow}  # pragma: allowlist exec
  - id: tc-010
    category: behavior
    prompt: "handler.py already holds a reviewed, waived line in HEAD; the agent edits elsewhere in the file."
    expect: "The write is allowed: a waiver already in HEAD is honoured in the agent."
    execute: {event: tool_use, head_files: {"handler.py": "result = eval(llm_response)  # pragma: allowlist exec\n"}, writes: {"handler.py": "result = eval(llm_response)  # pragma: allowlist exec\nlog(result)\n"}, expect: allow}  # pragma: allowlist exec
  - id: tc-011
    category: behavior
    prompt: "The agent adds the waiver pragma itself to a line that violates the gate in handler.py."
    expect: "The write is refused: a waiver the write adds is not honoured in the agent."
    execute: {event: tool_use, head_files: {"handler.py": "result = parse(llm_response)\n"}, writes: {"handler.py": "result = eval(llm_response)  # pragma: allowlist exec\n"}, expect: block}  # pragma: allowlist exec
  - id: tc-012
    category: trigger
    prompt: "At the turn's end handler.py on disk holds the eval builtin over model output that HEAD lacks."
    expect: "The turn is blocked: the diff against HEAD adds it."
    execute: {event: stop, head_files: {"handler.py": "result = parse(llm_response)\n"}, writes: {"handler.py": "result = eval(llm_response)\n"}, expect: block}  # pragma: allowlist exec
  - id: tc-013
    category: negative_trigger
    prompt: "At the turn's end handler.py differs from HEAD only by a clean line; HEAD already holds an old violation."
    expect: "The turn is allowed: only the lines the turn added are judged."
    execute: {event: stop, head_files: {"handler.py": "result = eval(llm_response)\n"}, writes: {"handler.py": "result = eval(llm_response)\nlog(result)\n"}, expect: allow}  # pragma: allowlist exec
  - id: tc-014
    category: trigger
    prompt: "child-process-exec-nonliteral: a staged JS file runs a template-literal command through the child_process exec method."
    expect: "The hook blocks the commit (CWE-78)."
    execute:
      files:
        git.js: "child_process.exec(`git log ${ref}`, cb);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-015
    category: trigger
    prompt: "A staged JS file calls the exec method on require of child_process directly."
    expect: "The hook blocks the commit (CWE-78)."
    execute:
      files:
        run.js: "require('child_process').exec(userCmd);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-016
    category: trigger
    prompt: "subprocess-getstatusoutput: a staged Python file runs a command string through the getstatusoutput helper."
    expect: "The hook blocks the commit (CWE-78)."
    execute:
      files:
        ops.py: "status, out = subprocess.getstatusoutput(cmd)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-017
    category: trigger
    prompt: "A staged Python file replaces the process with an os exec-family call."
    expect: "The hook blocks the commit (CWE-78)."
    execute:
      files:
        launch.py: "os.execvp(prog, args)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-018
    category: trigger
    prompt: "A staged Java file runs a command through the Runtime exec method."
    expect: "The hook blocks the commit (CWE-78)."
    execute:
      files:
        Run.java: "Process p = Runtime.getRuntime().exec(cmd);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-019
    category: trigger
    prompt: "A staged JS file passes the shell option as true to spawn."
    expect: "The hook blocks the commit (CWE-78)."
    execute:
      files:
        spawn.js: "spawn(cmd, { shell: true });\n"  # pragma: allowlist exec
      expect: block
  - id: tc-020
    category: trigger
    prompt: "bash-eval-expansion: a staged shell script evals a quoted variable."
    expect: "The hook blocks the commit (CWE-78)."
    execute:
      files:
        deploy.sh: "eval \"$cmd\"\n"  # pragma: allowlist exec
      expect: block
  - id: tc-021
    category: trigger
    prompt: "A staged JS file builds a function from a non-literal body with the Function constructor and no new."
    expect: "The hook blocks the commit (CWE-95)."
    execute:
      files:
        plugin.js: "const f = Function('a', body);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-022
    category: trigger
    prompt: "A staged JS file passes a concatenated string to setTimeout."
    expect: "The hook blocks the commit (CWE-95)."
    execute:
      files:
        timer.js: "setTimeout('tick(' + id + ')', 100);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-023
    category: trigger
    prompt: "A staged Python file compiles source text in exec mode."
    expect: "The hook blocks the commit (CWE-95)."
    execute:
      files:
        gen.py: "code = compile(src, '<gen>', 'exec')\n"  # pragma: allowlist exec
      expect: block
  - id: tc-024
    category: trigger
    prompt: "A staged JS file runs code through vm.runInNewContext."
    expect: "The hook blocks the commit (CWE-95)."
    execute:
      files:
        sandbox.js: "vm.runInNewContext(src, sandbox);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-025
    category: trigger
    prompt: "A staged JS file calls eval through globalThis."
    expect: "The hook blocks the commit (CWE-95)."
    execute:
      files:
        g.js: "globalThis.eval(src);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-026
    category: trigger
    prompt: "A staged Python file imports a module whose name is computed at run time."
    expect: "The hook blocks the commit (CWE-470)."
    execute:
      files:
        plugins.py: "mod = importlib.import_module(name)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-027
    category: trigger
    prompt: "yaml-unsafe-load: a staged Python file parses YAML with the unsafe loader function."
    expect: "The hook blocks the commit (CWE-502)."
    execute:
      files:
        cfg.py: "data = yaml.unsafe_load(fh)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-028
    category: trigger
    prompt: "A staged Python file decodes a blob with jsonpickle."
    expect: "The hook blocks the commit (CWE-502)."
    execute:
      files:
        state.py: "obj = jsonpickle.decode(blob)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-029
    category: trigger
    prompt: "A staged Python file loads a blob with dill."
    expect: "The hook blocks the commit (CWE-502)."
    execute:
      files:
        state.py: "obj = dill.loads(blob)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-030
    category: trigger
    prompt: "torch-load-bare: a staged Python file loads a checkpoint with torch load and no weights_only."
    expect: "The hook blocks the commit (CWE-502)."
    execute:
      files:
        infer.py: "model = torch.load(path)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-031
    category: trigger
    prompt: "A staged Python file loads a numpy file with allow_pickle enabled."
    expect: "The hook blocks the commit (CWE-502)."
    execute:
      files:
        data.py: "arr = np.load(path, allow_pickle=True)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-032
    category: adversarial
    prompt: "A staged Python file names a custom loader that merely ends in SafeLoader."
    expect: "The hook blocks the commit: only the SafeLoader or CSafeLoader name itself exempts."
    execute:
      files:
        cfg.py: "cfg = yaml.load(fh, Loader=MySafeLoader)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-033
    category: adversarial
    prompt: "A staged Python file puts weights_only=True in a trailing comment, not the call."
    expect: "The hook blocks the commit: the flag after a hash does not count."
    execute:
      files:
        infer.py: "model = torch.load(path)  # weights_only=True\n"  # pragma: allowlist exec
      expect: block
  - id: tc-034
    category: adversarial
    prompt: "A staged Python file passes the shell flag through a keyword-argument dict."
    expect: "The hook blocks the commit."
    execute:
      files:
        runner.py: "subprocess.run(cmd, **{\"shell\": True})\n"  # pragma: allowlist exec
      expect: block
  - id: tc-035
    category: adversarial
    prompt: "A staged JS file reaches eval through bracket access on window."
    expect: "The hook blocks the commit."
    execute:
      files:
        i.js: "window['eval'](src);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-036
    category: adversarial
    prompt: "A staged JS file reaches eval through the comma-operator call."
    expect: "The hook blocks the commit."
    execute:
      files:
        i.js: "(0, eval)(src);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-037
    category: adversarial
    prompt: "A staged JS file calls the child_process exec method through optional chaining."
    expect: "The hook blocks the commit."
    execute:
      files:
        run.js: "child_process?.exec(cmd);\n"  # pragma: allowlist exec
      expect: block
  - id: tc-038
    category: adversarial
    prompt: "A staged Python file runs a shell through an argument vector that starts with sh and -c."
    expect: "The hook blocks the commit."
    execute:
      files:
        run.py: "subprocess.run(['sh', '-c', cmd])\n"  # pragma: allowlist exec
      expect: block
  - id: tc-039
    category: adversarial
    prompt: "A staged Python file passes weights_only=False and names weights_only=True later on the line outside the call."
    expect: "The hook blocks the commit: only a flag inside the call counts."
    execute:
      files:
        infer.py: "m = torch.load(p, weights_only=False); s = 'weights_only=True'\n"  # pragma: allowlist exec
      expect: block
  - id: tc-040
    category: adversarial
    prompt: "A staged Python file imports os by literal name through the dunder import and calls system on it."
    expect: "The hook blocks the commit."
    execute:
      files:
        x.py: "__import__('os').system(cmd)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-041
    category: adversarial
    prompt: "A staged Python file spells the shell flag as 1."
    expect: "The hook blocks the commit."
    execute:
      files:
        runner.py: "subprocess.run(cmd, shell=1)\n"  # pragma: allowlist exec
      expect: block
  - id: tc-042
    category: negative_trigger
    prompt: "ast-literal-eval: a staged Python file parses a literal with ast.literal_eval."
    expect: "The hook allows the commit; literal_eval is not the eval builtin."
    execute:
      files:
        parse.py: "value = ast.literal_eval(text)\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-043
    category: negative_trigger
    prompt: "A staged JS file runs git through execFile with an argument vector and spawn without the shell option."
    expect: "The hook allows the commit; no shell is involved."
    execute:
      files:
        git.js: "cp.execFile('git', ['status'], cb);\nspawn(cmd, args, { shell: false });\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-044
    category: negative_trigger
    prompt: "A staged YAML file sets keys that merely end in shell to true."
    expect: "The hook allows the commit; only the shell key itself counts."
    execute:
      files:
        conf.yaml: "interactive_shell: true\nlogin_shell: true\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-045
    category: negative_trigger
    prompt: "A staged Python file loads a checkpoint with weights_only=True and a numpy file without allow_pickle."
    expect: "The hook allows the commit."
    execute:
      files:
        infer.py: "model = torch.load(path, weights_only=True)\narr = np.load(path)\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-046
    category: negative_trigger
    prompt: "A staged shell script uses the shell-init idiom that evals a command substitution."
    expect: "The hook allows the commit; only variable expansions are refused."
    execute:
      files:
        env.sh: "eval \"$(ssh-agent -s)\"\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-047
    category: negative_trigger
    prompt: "A staged Python file declares a class named Function and calls Function with a literal name."
    expect: "The hook allows the commit; a definition or an all-literal call is not code from data."
    execute:
      files:
        sym.py: "class Function(Base):\n    pass\nf = Function('f')\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-048
    category: negative_trigger
    prompt: "A staged JS file passes a callback to setTimeout and a number to socket.setTimeout."
    expect: "The hook allows the commit; only a string timer runs code from text."
    execute:
      files:
        timer.js: "setTimeout(() => tick(), 100);\nsocket.setTimeout(5000);\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-049
    category: negative_trigger
    prompt: "A staged Python file imports a module by a literal name and compiles a regex."
    expect: "The hook allows the commit."
    execute:
      files:
        m.py: "mod = importlib.import_module('json')\nrx = re.compile(r'exec')\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-050
    category: edge
    prompt: "markdown-fenced-example: a staged markdown file shows an eval call inside a code fence."
    expect: "The hook blocks the commit: a line scan cannot see the fence; exempting docs would loosen the gate and is left to NP10 and the owner. The example line takes the pragma."
    execute:
      files:
        docs.md: "```python\nresult = eval(x)\n```\n"  # pragma: allowlist exec
      expect: block
  - id: tc-051
    category: edge
    prompt: "test-path-fixture: a staged test fixture carries a deliberate unsafe call with the pragma on its line."
    expect: "The hook allows the commit; a fixture is waived per line, not by path."
    execute:
      files:
        tests/fixtures/bad.py: "obj = pickle.loads(blob)  # pragma: allowlist exec\n"  # pragma: allowlist exec
      expect: allow
  - id: tc-052
    category: trigger
    prompt: "The agent writes a child_process exec call into git.js."
    expect: "The write is refused before it happens."
    execute: {"event": "tool_use", "writes": {"git.js": "child_process.exec(cmd);\n"}, "expect": "block"}  # pragma: allowlist exec
  - id: tc-053
    category: adversarial
    prompt: "The agent writes a torch load call and adds the waiver pragma itself."
    expect: "The write is refused: a waiver the write adds is not honoured in the agent."
    execute: {"event": "tool_use", "head_files": {"infer.py": "x = 1\n"}, "writes": {"infer.py": "model = torch.load(path)  # pragma: allowlist exec\n"}, "expect": "block"}  # pragma: allowlist exec
  - id: tc-054
    category: negative_trigger
    prompt: "The agent writes a yaml.safe_load call and a model.eval call."
    expect: "The write is allowed."
    execute: {"event": "tool_use", "writes": {"cfg.py": "data = yaml.safe_load(fh)\nmodel.eval()\n"}, "expect": "allow"}  # pragma: allowlist exec
