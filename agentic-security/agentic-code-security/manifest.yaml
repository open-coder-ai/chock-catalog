id: agentic-code-security
name: "Agentic Code Security"
version: "0.3.0"
description: >
  trigger: writing agent code or agent config -- Python or TypeScript using AutoGen, CrewAI,
  LangChain, LangGraph, mem0, the OpenAI Agents or Claude Agent SDK, an MCP server or client
  (.mcp.json, .cursor/mcp.json, .vscode/mcp.json, claude_desktop_config.json, .codex/config.toml,
  .gemini/settings.json), docker-compose files for agents. avoid: code execution on the host,
  unpinned MCP servers and models, shell-reaching tools, approvals switched off, whole-environment
  and credential-store leaks, TLS verification off, unbounded loops, SQL and eval built from strings,
  stripped provenance markers. 29 rules in 10 packs -- exec, supply, tools, approval, identity,
  comms, bounds, prompt-memory, code, provenance -- each pack or rule allow|deny in
  .chock/agentic-security.json; bounds, prompt-memory and one supply rule start as allow.
artifact: hook
enforcement: block
mandatory: false
effects: [read_only]
approval:
  required: false
hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      agentic-code-security: a construct one of its rules denies -- the refusal above names the rule,
      its CWE and OWASP ASI entry, and the fix. Only what the change adds is refused, at commit,
      as the agent writes and at its turn's end: an old finding on lines it leaves alone never blocks. Each rule's verdict
      is allow|deny in .chock/agentic-security.json, per rule or per pack (exec, supply, tools,
      approval, identity, comms, bounds, prompt-memory, code, provenance). Only a human reviewer
      waives a line, with # chock: allow <rule-id> (// in JavaScript), never the agent: in the agent a
      waiver counts once a human has committed it. JSON configs are waived in the selection file only.
    params:
      script: agentic-code-security-gate.py

compliance:
  owasp_asi:
  - control: ASI02
    coverage: partial
    note: "refuses tools that hand the model's string to a subprocess, shell tools, and approvals switched off; tool scoping stays with owasp-asi02-tool-misuse"
  - control: ASI03
    coverage: partial
    note: "refuses the whole host environment and credential stores handed to agent code; privilege design stays with owasp-asi03-identity-privilege-abuse"
  - control: ASI04
    coverage: partial
    note: "refuses unpinned MCP launch commands, git installs without a commit, plain-HTTP MCP servers and trust_remote_code; signatures and provenance stay with owasp-asi04-agentic-supply-chain"
  - control: ASI05
    coverage: partial
    note: "refuses framework settings that run model-written code on the host; sandbox design stays with owasp-asi05-unexpected-code-execution"
  - control: ASI07
    coverage: partial
    note: "refuses TLS verification switched off; agent authentication and message integrity stay with owasp-asi07-insecure-inter-agent-communication"
  - control: ASI09
    coverage: partial
    note: "refuses human approval removed where an agent acts; trust calibration stays with owasp-asi09-human-agent-trust"
  eu_ai_act:
  - control: Art50
    coverage: partial
    note: "refuses a change that removes a provenance marker a file carried at HEAD; whether content is marked in the first place stays with eu-ai-act-transparency"

provenance:
  author: "chock-core"
  created_at: "2026-09-29T00:00:00Z"
  updated_at: "2026-09-30T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.3.0
  date: '2026-09-30'
  changes:
  - "The gate prints a findings document and the engine (chock 0.15.0) compares it with the baseline, instead of the gate deciding which lines are new. On stdout it prints {\"findings\": [{key, path, line, message, new?}]}; the runner runs it again on the baseline text -- HEAD at commit and at the turn's end, the file on disk before the write at PreToolUse -- and blocks only a (path, key) the change holds more of than the baseline. The exit code stays the verdict: 1 refuses. A key is the rule id, the dotted enclosing class and function names from the syntax tree (empty outside Python) and the flagged line with its whitespace collapsed -- no line number, so a violation that only moves is old, a second copy is new, and a deleted line can make a finding new: a `cur.execute(` whose first argument was a fixed SQL string becomes a finding when that line is deleted and an f-string moves into first place. provenance-marker-removed compares with HEAD itself, so its findings carry `\"new\": true` and always count."
  - "Waivers are applied identically in both runs (a waiver counts only where a human committed it). Removed: the statement-span and new-line comparison in agentic_gate/changed.py, the MCP entry `block` lines, the `related` lines Hit and Finding carried and every rule that recorded them; agentic_gate/document.py builds the document, and evaluate no longer takes a baseline. Eval replay goes through the engine, and new cases add a deleted first argument, an old violation untouched, a line shift and a duplicate. An MCP server entry is keyed by its flagged line, so editing an argument that carries no finding is old, and a new unpinned package changes that line and is new."
  - "Remaining gaps, stated rather than implied: a method or function renamed with its body untouched re-reports its old findings, because the enclosing name is part of the key, which errs toward blocking; flows are read within one file, so a value that crosses a file boundary is not followed; and an early-return guard (`if (!ALLOWED.contains(x)) return;`) is not modelled as a sanitizer, so use the ternary or the allowlist form the rules name."
- version: 0.2.0
  date: '2026-09-30'
  changes:
  - "The gate judges only what a change adds, at every event, not whole files. A finding is kept when a line it involves is new against the baseline: its reported line, the Python statement that line sits in (a compound statement counts as its header; a statement over 60 lines stands for its one line), and the lines its rule recorded -- a tool's signature and each assignment that carries the model's string on, the assignment that built an executed SQL string, the assignments that bind a mem0 client, an MCP server's whole entry (its braces in JSON, its table in TOML). A line is new when the written text holds more copies of it (indentation and a trailing comma ignored) than the baseline does. Baseline: HEAD at commit; the file on disk before the write at PreToolUse; HEAD at the turn's end, when disk already holds the written text; a new file has every line new, so it is judged whole. Before, commit dropped findings by rule and line text (so a new source line completing a flow into an old sink was dropped too) and the agent's own text was judged whole (so an old violation in a touched file blocked it). Eval tc-127 flips from block to allow; tc-128, tc-129, tc-132, tc-133 block a new line that completes a flow, feeds an old source into a new sink, or changes an old server's command; tc-130, tc-131, tc-134 allow an unrelated new line, function or server beside an old finding. The provenance rule compares with HEAD itself and stays as it was. Not caught, by construction: a violation a change makes by deleting a line (a removed allowlist check), and JavaScript, YAML, shell and env findings beyond their own line. Waivers are unchanged. New module agentic_gate/changed.py; a policy-local copy, java-security has its own."
- version: 0.1.0
  date: '2026-09-29'
  changes:
  - "First release. One script gate, 29 rules in 10 packs, for the constructs the OWASP Top 10 for Agentic Applications names that a static read can decide: exec (ASI05), supply (ASI04), tools (ASI02), approval (ASI02, ASI09), identity (ASI03), comms (ASI07), bounds (ASI08), prompt-memory (ASI01, ASI06), code (eval and SQL built from strings), provenance (EU AI Act Art. 50). It runs at commit and at tool use, where the write is judged as the file would be after it and again at the turn's end, and it refuses only what is new: at commit a finding HEAD already had is not refused; a waiver (# chock: allow <rule-id>, // in JavaScript) is honoured at commit and, for the agent, only on a line a human already committed."
  - "Read precisely rather than by pattern where the language allows: Python through ast (calls, keywords, dict keys, and a parameter-to-subprocess flow inside a registered tool), JavaScript through a comment- and string-aware scan, MCP and agent client configs (JSON and TOML) parsed structurally so a pretty-printed args array reads like a one-liner; YAML is read line by line, since the standard library has no YAML parser. A file that does not parse draws no finding from the rules that need the parse."
  - "The selection file is .chock/agentic-security.json, not .chock/security.json: java-security's selection there rejects a pack it does not carry, so one file could not serve both policies. Verdicts are allow or deny per pack or per rule; a rule can differ from its pack. Bounds, prompt-memory and supply-hf-unpinned-revision are noisy heuristics and start as allow; everything else denies until someone speaks. What existing gates already catch stays theirs -- shell=True, os.system, pickle, @latest (block-unsafe-code-execution, block-unpinned-agent-components); only code-dynamic-eval-exec overlaps them by design, and it refuses at tool use as well, where those gates do not run."
