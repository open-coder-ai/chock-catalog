    prompt: A file `lc/pandas_agent.py` sets allow_dangerous_code=True on a LangChain agent, judged at commit.
    expect: The write is refused and the refusal names exec-langchain-dangerous-code with its CWE, OWASP ASI entry
      and fix.
    execute:
      files:
        lc/pandas_agent.py: |
          agent = create_pandas_dataframe_agent(llm, df, allow_dangerous_code=True)
      event: commit
      expect: block
  - id: tc-005
