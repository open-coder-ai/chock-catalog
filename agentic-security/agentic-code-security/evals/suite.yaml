# `tests/agentic_code_security/test_evals.py` replays every case that has an `execute` block through the
# shipped gate in a throwaway git repository, because `chock check --only evals` does not replay a script
# gate on this engine. `files` are the writes; `head_files` are committed first (HEAD) and `repo_files` (the selection
# file) sit in the working tree; `event` is commit, where a person reviews what is staged (the gate treats a
# push or CI run the same way; tests/agentic_code_security/test_gate.py runs those). Each of the 29 rules has a case it refuses and a case where the correct form draws
# nothing, from any rule; rules that start as allow are switched on by a selection file in the refusing
# case. The cases without `execute` are the agent's own events (tool use, and the turn's end), which the
# schema cannot express: tests/agentic_code_security/test_waiver.py and test_provenance.py run them.
suite:
  id: agentic-code-security-tests-v1
  policy_id: agentic-code-security
  version_constraint: '>=0.1.0'
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  cases:
  - id: tc-001
    category: trigger
    prompt: A file `agents/proxy.py` runs AutoGen code with use_docker False, judged at commit.
    expect: The write is refused and the refusal names exec-autogen-local-execution with its CWE, OWASP ASI entry
      and fix.
    execute:
      files:
        agents/proxy.py: |
          from autogen import UserProxyAgent

          proxy = UserProxyAgent("u", code_execution_config={"work_dir": "coding", "use_docker": False})
      event: commit
      expect: block
  - id: tc-002
    category: trigger
    prompt: A file `agents/executor.py` builds a LocalCommandLineCodeExecutor, judged at commit.
    expect: The write is refused and the refusal names exec-autogen-local-execution with its CWE, OWASP ASI entry
      and fix.
    execute:
      files:
        agents/executor.py: |
          from autogen.coding import LocalCommandLineCodeExecutor

          executor = LocalCommandLineCodeExecutor(work_dir='coding')
      event: commit
      expect: block
  - id: tc-003
    category: trigger
    prompt: A file `crew/agents.py` turns on CrewAI code execution in unsafe mode, judged at commit.
    expect: The write is refused and the refusal names exec-crewai-unsafe-mode with its CWE, OWASP ASI entry and
      fix.
    execute:
      files:
        crew/agents.py: |
          from crewai import Agent

          dev = Agent(role="dev", goal="g", backstory="b", allow_code_execution=True, code_execution_mode="unsafe")
      event: commit
      expect: block
