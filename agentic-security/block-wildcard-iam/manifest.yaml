changelog:
- version: 0.0.1
  date: '2026-08-13'
  changes:
  - "Initial draft: content_regex gate over wildcard IAM grants in JSON, YAML, and Terraform."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Self-safe authoring (#32): the literal ARN alternative rewritten with a single-character class so the pattern cannot match its own source; description and eval prompt describe the Terraform wildcard form instead of showing it; eval payload lines and reference examples carry the allowlist pragma. Matching behaviour on real content is unchanged."
- version: 0.0.3
  date: '2026-09-29'
  changes:
  - "Also run in the agent: gate.on is now [commit, tool_use], so a wildcard grant is refused as the agent writes it (the whole written file is scanned at the turn's end). No pattern change. The pragma is a commit-review waiver and is not honoured in the agent, so a reviewed break-glass line that is already committed still blocks a later agent edit of that file; a person edits that file. forbidden_path_regex was not used to limit the scan to config paths: on content_regex it denies matching paths outright rather than scoping the pattern."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, a commit made with CHOCK_AGENT_COMMIT set) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "v2, single-line forms (roadmap HP05; closes the probed misses of defect 4.5 #2): list forms, either quote style, bare YAML and trailing comments for the wildcard action, resource and principal keys (AWS, Federated, Service, CanonicalUser), escaped JSON inside strings and the unicode-escaped star; the global wildcard; whole-service wildcards on s3, iam, sts, kms and ec2 on an action key or alone as a list element line; Allow with NotAction, NotResource or NotPrincipal on one line; PowerUserAccess and IAMFullAccess beside AdministratorAccess, by ARN in any partition, by policy-name key or in SAM Policies; CDK any-principal and star-principal; unquoted GCP owner/editor in gcloud flags and YAML bindings; allUsers and allAuthenticatedUsers members, gcloud member flags and gsutil grants; Kubernetes RBAC verbs, resources and apiGroups wildcards and cluster-admin bindings (kubectl flag, roleRef, a non-list name line); Azure wildcard actions and dataActions, Owner by role definition name, az role assignment create, or built-in id in any case. A single strict-JSON AWS Deny statement on one line (Effect Deny its first key, every later object a key's value, no other effect, statement, escape, code character, Kubernetes or Azure key, or allow) passes, the one format that cannot carry the pragma. Service wildcards and PowerUserAccess block rather than ask: a content_regex gate has one action, so the roadmap's ask tier waits for the structured iam-policy-scan (wave 3), as do multi-line statements."
