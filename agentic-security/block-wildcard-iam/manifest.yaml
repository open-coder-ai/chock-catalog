id: block-wildcard-iam
name: "Block Wildcard IAM"
version: "0.0.5"
description: >
  Commit and agent-write gate, 1-line slice of ASI03: IAM Action or Resource set to
  a bare * (JSON double-quoted, YAML single-quoted), a one-element Terraform * list, the
  AdministratorAccess ARN, quoted GCP roles/owner or roles/editor. Probed misses: * in a JSON
  list, service wildcards (s3:*), YAML double-quoted or bare *, Terraform jsonencode, NotAction,
  Principal *, PowerUser, multi-line lists, Azure Owner, K8s RBAC. Waiver: 'pragma: allowlist
  broad-privilege' same line; agent: only if in HEAD.
artifact: hook
enforcement: block
mandatory: false
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Broad privilege grant detected. Scope Action and Resource to what the task
      needs, or a person adds 'pragma: allowlist broad-privilege' on the same line
      for a reviewed exception (in the agent it counts only when that exact line is already committed
      in HEAD, so an agent asks a person). Strict JSON cannot carry the pragma; narrow the grant
      or manage that document in Terraform/YAML.
    params:
      scan: added_lines
      allowlist_pragma: 'pragma:\s*allowlist\s+broad-privilege'
      # The single-character class ([A]) keeps the fully-literal ARN alternative from
      # matching its own source text in this manifest and in the compiled gate.json,
      # while matching identical real content. Without it, committing this policy
      # folder tripped the policy's own gate (#32).
      content_pattern: |-
        "(Action|Resource)"\s*:\s*"\*"|(Action|Resource):\s*'\*'|arn:aws:iam::aws:policy/Administrator[A]ccess|["']roles/(owner|editor)["']|(actions|resources)\s*=\s*\[\s*"\*"\s*\]

compliance:
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "blocks wildcard grants a diff can show; identity-per-agent, TTLs, and delegation scope remain advisory (owasp-asi03-identity-privilege-abuse)"

provenance:
  author: "chock-core"
  author_email: "chock@example.com"
  created_at: "2026-08-13T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by: []

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-13'
  changes:
  - "Initial draft: content_regex gate over wildcard IAM grants in JSON, YAML, and Terraform."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Self-safe authoring (#32): the literal ARN alternative rewritten with a single-character class so the pattern cannot match its own source; description and eval prompt describe the Terraform wildcard form instead of showing it; eval payload lines and reference examples carry the allowlist pragma. Matching behaviour on real content is unchanged."
- version: 0.0.3
  date: '2026-09-29'
  changes:
  - "Also run in the agent: gate.on is now [commit, tool_use], so a wildcard grant is refused as the agent writes it (the whole written file is scanned at the turn's end). No pattern change. The pragma is a commit-review waiver and is not honoured in the agent, so a reviewed break-glass line that is already committed still blocks a later agent edit of that file; a person edits that file. forbidden_path_regex was not used to limit the scan to config paths: on content_regex it denies matching paths outright rather than scoping the pattern."
- version: 0.0.4
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, a commit made with CHOCK_AGENT_COMMIT set) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.5
  date: '2026-10-02'
  changes:
  - "Disclosure, no behaviour change: the description now names the forms the pattern was probed to miss -- a star inside a JSON list, service wildcards such as s3 star, a YAML double-quoted or bare star, Terraform jsonencode statements, NotAction, a Principal star, PowerUserAccess, multi-line lists, Azure Owner and Kubernetes RBAC wildcards -- instead of implying every wildcard grant is caught. references/pattern-notes.md lists the same misses, and tests/policies/test_stated_limits.py fails if the gate starts catching one (so the text is updated) or the text stops naming one. The closing fixes are HP05."
