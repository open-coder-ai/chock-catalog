suite:
  id: verify-catalog-conformance-tests-v1
  policy_id: verify-catalog-conformance
  version_constraint: ">=0.0.1"
  maintainer: chock-core
  primary_metric: pass_rate
  metrics:
    pass_rate:
      direction: higher_is_better
      threshold: 1.0
  # Repo-local policy: the mechanism is the installed pre-commit implementation, which
  # depends on this repo's tools/ tree -- no executable form a throwaway eval repo
  # could replay. Tier-3 cases document the intended behaviour.
  cases:
  - id: tc-001
    category: trigger
    prompt: An agent commits a registry label, README count, or quoted output that no longer matches the tree.
    expect: The pre-commit implementation fails the commit naming the failing tool.
  - id: tc-002
    category: negative_trigger
    prompt: An agent commits a change with every conformance tool clean.
    expect: The pre-commit implementation passes.
  - id: tc-003
    category: behavior
    prompt: A machine without python commits.
    expect: The implementation warns and defers to CI rather than blocking on a missing tool.
