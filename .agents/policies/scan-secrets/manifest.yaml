id: scan-secrets
name: "Scan Secrets"
version: "0.1.0"
description: >
  Blocks credentials: vendor tokens (AWS, GitHub, GitLab, Slack, OpenAI, HF, ...), JWTs, private-key
  and PGP blocks, named key/token/secret/password values (JSON, YAML, env, HCL, code), URI creds,
  Authorization literals, CLI password flags; files by path (.env*, keys). Misses: split or encoded
  values, quoted values with spaces, unlisted names, reference- or placeholder-like values. Runs:
  commit, agent write, turn end. Pragma same line; agent: only if in HEAD; MCP gateway: never.
artifact: hook
enforcement: block
mandatory: true
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: content_regex
    "on": [commit, tool_use]
    action: block
    message: >
      Potential secret detected in this change. Remove credentials and rotate any exposed keys.
      '# pragma: allowlist secret' on the same line marks a documented test fixture; in the agent (tool use, the turn's end) it counts only when that exact line is already committed in HEAD, so an agent asks a person rather than writing the pragma itself.
    params:
      scan: added_lines
      # .env plus environment-specific variants (.env.production, .env.local, .env.staging)
      # but NOT a committed template: a name whose last suffix is .example/.sample/.template/
      # .dist/.defaults (.env.example, .env.local.example), which carries placeholders.
      forbidden_path_regex: '(\.env(?![^/]*\.(sample|example|template|dist|defaults)$)(\.[^/]+)?|\.(pem|key|p12|pfx|jks|keystore))$'
      allowlist_pragma: '#\s*pragma:\s*allowlist\s+secret'
      content_pattern: |-
        (?ix)
        # v1 shapes, unchanged except where noted
        (AKIA|ASIA)[0-9A-Z]{16}
        |gh[oprsu]_[0-9A-Za-z]{36}
        |github_pat_[0-9A-Za-z_]{22,}
        |xox[bpas]-[0-9A-Za-z-]{10,}
        |(sk|rk)_live_[0-9A-Za-z]{16,}
        |sk-proj-[0-9A-Za-z_-]{20,}
        |sk-ant-[0-9A-Za-z_-]{20,}
        |sk-[0-9A-Za-z]{20,}
        |AIza[0-9A-Za-z_-]{35}
        |npm_[0-9A-Za-z]{36}
        |SG\.[0-9A-Za-z_-]{16,}\.[0-9A-Za-z_-]{16,}
        # JWT: segment lengths bounded so a hostile line is judged in linear time
        |eyJ[A-Za-z0-9_-]{0,1024}\.[A-Za-z0-9_-]{0,16384}\.[A-Za-z0-9_-]*
        |api[_-]?key\s*=\s*["'][A-Za-z0-9_\-]{20,}["']
        |secret[_-]?key\s*=\s*["'][A-Za-z0-9_\-]{20,}["']
        |auth[_-]?token\s*=\s*["'][A-Za-z0-9_\-]{20,}["']
        |password\s*=\s*["'][^"'\s]{12,}["']
        |(api|secret|auth)[_-]?(key|token)\s*[=:]\s*[A-Za-z0-9_\-]{20,}
        # v1 bare password, now silent on SOPS, vault:, Terraform references and environment lookups
        |password\s*[=:]\s*(?!ENC\[|vault:|(?:var|local|data|module|each|self)\.|[\w.]{0,64}(?:env|getenv|environ)[.(\[])[^\s"'${}]{12,}
        # private keys: any PEM label ending PRIVATE KEY (RSA, EC, DSA, OPENSSH, ENCRYPTED, PKCS8), PGP armor
        |-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE\ KEY(?:\ BLOCK)?-----
        # key, token, secret and password names in any case and separator: JSON, YAML, env, HCL, Go, Ruby, PHP, Python, JS
        |(?:api[_.-]?key|secret[_.-]?(?:access[_.-]?)?key(?:[_.-]?base)?|access[_.-]?key
           |(?:client|consumer|jwt|webhook|app|session|signing|cookie)[_.-]?secret
           |(?:auth|access|refresh|api|bearer|bot)[_.-]?token|(?:private|signing|encryption|master)[_.-]?key
           |passw(?:or)?d|passphrase|(?-i:[A-Z0-9_]{0,64}_(?:TOKEN|SECRET|PASS|PWD)))
         ["'`]?\]?(?:\s*:\s*[\w.|\[\], ]{1,40}?(?=\s*=))?\s*(?::=|=>|\?=|[:=])\s*(?!=)(?:[bru]{1,2}(?=["'`]))?(?P<kv_quote>["'`])?
         (?!(?:\$|\{|%[({]|\#\{|<|\[\[|\*{3}|x{4}|\.\.\.|\.{1,2}/|~/|/(?:etc|home|usr|var|opt|run|tmp|srv|root|Users|secrets?|keys?|certs?|config)/
           |[a-z]:\\|file:|ENC\[|vault:|(?:var|local|data|module|each|self)\.|arn:aws:|projects/|@Microsoft\.KeyVault|secretKeyRef
           |[\w.]{0,64}(?:env|getenv|environ)[.(\[]|(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+|[a-z][a-z0-9]*(?:_[a-z0-9]+)+)(?:["'`\s,;)\]}]|$)
           |(?:your|my|example|sample|dummy|fake|placeholder|change[_-]?me|replace[_-]?me|redacted|todo|none|null|insert|enter)(?:[\W_]|$)))
         (?(kv_quote)(?=[^"'`\s]{0,512}[^a-z._\-"'`\s])(?![^"'`\s]{0,512}\.(?:txt|pem|key|crt|cer|json|ya?ml|env|cfg|conf|ini|p12|pfx|jks)["'`])
            [^"'`\s]{12,512}["'`]
           |(?=[A-Za-z0-9/+=_~-]{0,512}\d)(?![A-Za-z0-9/+=_~-]{0,512}(?-i:Key|Token|Secret|Passw|Type|Str|Bytes|Cred))
            [A-Za-z0-9/+=_~-]{16,512}(?=[\s,;)\]}]|$))
        # credentials in a URI: scheme://user:password@host, not localhost or example hosts, not a placeholder
        |\b[a-z][a-z0-9+.-]{1,20}://(?P<uri_user>[^\s/:@'"]*):(?!(?P=uri_user)@)
         (?!(?:\$|\{|<|%|\*|\\|x{3}|\.\.\.|(?:pass(?:word|wd)?|pwd|secret|changeme|token|example|dummy|redacted|placeholder)@))
         [^\s/:@'"]{3,}@(?!(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|(?:[\w-]+\.)*example(?:\.(?:com|org|net))?|host|hostname)(?:[:/\s'"]|$))
        # Authorization header literals
        |\bauthorization["'`]?\]?\s*[:=,]\s*["'`]?(?!(?:bearer|token)\s+[A-Za-z._~+/-]{1,512}(?:["'`\s,;)]|$))
         (?:bearer|basic|token)\s+(?!(?:\$|\{|<|%|\*|x{3}|\.\.\.|your|example|(?-i:[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+)(?:["'`\s,;)]|$)))
         [A-Za-z0-9._~+/-]{12,}
        # passwords passed on a command line
        |\bcurl\b.{0,200}\s(?:-u|--user)(?:[=\s]+|(?=[^\s-]))["']?[^\s:"']+:(?!(?:\$|\{|<|%|\*|\\|x{3}|\.\.\.|(?:pass(?:word|wd)?|pwd|secret|changeme|token)(?:["'`\s,;)]|$)))[^\s"'`]{3,}
        |\b(?:docker|podman|oras)\s+login\b.{0,200}\s(?:-p|--password)(?:[=\s]+|(?=["']))["']?(?!(?:\$|\{|<|%|\*|\\|x{3}|\.\.\.|(?:pass(?:word|wd)?|pwd|secret|changeme)(?:["'`\s,;)]|$)))[^\s"'`]{3,}
        |\bmysql(?:dump|admin|sh)?\b.{0,200}\s(?-i:-p)["']?(?!(?:\$|\{|<|%|\*|\\|x{3}|\.\.\.|(?:pass(?:word|wd)?|pwd|secret|changeme)(?:["'`\s,;)]|$)))[^\s"'`]{3,}
        |\bsshpass\s+(?-i:-p)\s*["']?(?!(?:\$|\{|<|%|\*|\\|x{3}|\.\.\.|(?:pass(?:word|wd)?|pwd|secret|changeme)(?:["'`\s,;)]|$)))[^\s"'`]{3,}
        # vendor token shapes (case-sensitive)
        |(?-i:\bgl(?:pat|dt|rtr?|cbt|ptt|ft|imt|agent|oas|soat|ffct|wt)-[0-9A-Za-z_-]{20,})
        |(?-i:\bGR1348941[0-9A-Za-z_-]{20,})
        |(?-i:\b(?:hf|api_org)_[A-Za-z0-9]{34}\b)
        |(?-i:\bya29\.[0-9A-Za-z_-]{20,})
        |(?-i:hooks\.slack\.com/(?:services|workflows|triggers)/[A-Za-z0-9]{8,}/[A-Za-z0-9/]{16,})
        |(?-i:\bxox[er]-[0-9A-Za-z-]{10,}|\bxoxe\.xox[bp]-[0-9A-Za-z-]{10,}|\bxapp-\d-[0-9A-Za-z-]{10,})
        |(?-i:\bSK[0-9a-f]{32}\b)
        |(?-i:\bdapi[0-9a-f]{32}\b)
        |(?-i:\bdp\.(?:pt|st|sa|said|ct|scim|audit)\.(?:[a-z0-9_-]{2,35}\.)?[0-9A-Za-z]{40,})
        |(?-i:\bpul-[0-9a-f]{40}\b)
        |(?-i:\bhv[sbr]\.[0-9A-Za-z_-]{24,})
        |(?-i:\bshp(?:at|ca|pa|ss)_[0-9a-fA-F]{32}\b)
        |(?-i:\bsntry[usai]_[0-9A-Za-z+/=_]{40,})
        |(?-i:\bglsa_[0-9A-Za-z]{32}_[0-9a-fA-F]{8}\b|\bglc_[0-9A-Za-z+/]{32,})
        |(?-i:\bdo[por]_v1_[0-9a-f]{64}\b)
        |(?-i:\blin_(?:api|oauth)_[0-9A-Za-z]{40}\b)
        |(?-i:\bntn_[0-9A-Za-z]{40,}|\bsecret_[0-9A-Za-z]{43}\b)
        |(?-i:\bpplx-[0-9A-Za-z]{48}\b)
        |(?-i:\bpscale_(?:tkn|oauth|pw)_[0-9A-Za-z_=.-]{32,})
        |(?-i:\bPMAK-[0-9a-f]{24}-[0-9a-f]{34}\b)
        |(?-i:\bHRKU-[0-9A-Za-z_-]{36,})
        |(?-i:\bpypi-[0-9A-Za-z_-]{85,})
        |(?-i:\brubygems_[0-9a-f]{48}\b)
        |(?-i:\bsk-(?:svcacct|admin)-[0-9A-Za-z_-]{20,})

compliance:
  mitre_atlas:
  - control: AML.T0055
    coverage: partial
    note: "blocks committed credential values a diff can show; runtime credential hygiene is out of scope"

provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-10-02T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.1.0
  date: '2026-10-02'
  changes:
  - "v2 regex tier (roadmap HP01; the files and entropy tiers are separate policies, not this one). The content_pattern is now a verbose, commented regex (one alternative per line, so no line of this manifest matches it). The 0.0.9 alternatives are kept, with three changes: the private-key one is replaced by a broader one (any PEM label ending PRIVATE KEY, and the PGP armor); the JWT one bounds its first two segments (1024 and 16384 characters) so a hostile line is judged in linear time; the bare password one no longer fires on a value starting ENC[ (SOPS), vault:, a Terraform reference (var., local., data., module., each., self.) or an environment lookup (os.environ, getenv(, process.env., ENV[). Added: (1) named credential values: api key, secret key, secret key base, access key, AWS secret access key, client/consumer/JWT/webhook/app/session/signing/cookie secret, auth/access/refresh/API/bearer/bot token, private/signing/encryption/master key, password, passwd, passphrase, and any SCREAMING_SNAKE name ending _TOKEN, _SECRET, _PASS or _PWD; in any case and separator, with = : := => ?=, an optional quote or index bracket round the name (config['password'] =), an optional type annotation (password: str =) and a b/r/u string prefix; a quoted value of 12-512 characters with a digit or symbol, or a bare value of 16-512 with a digit. Values that start like a reference or a placeholder word (${, $VAR, {, <, ENC[, vault:, a path, an UPPER_SNAKE or lower_snake identifier, your, example, changeme, ...) are not judged, nor quoted values ending in a key or config file extension, nor bare values naming a type (Key, Token, Type, ...). (2) credentials in a URI (scheme://user:password@host) unless the host is localhost or an example host, the password is a placeholder or equals the user name. (3) Authorization Bearer, Basic and Token literals. (4) passwords on a command line: curl -u/--user (attached or not), docker/podman/oras login -p/--password, mysql -p<value> (quoted or not), sshpass -p. (5) vendor shapes: GitLab tokens and runner registration token, Hugging Face, Google OAuth access token, Slack webhook URL, xoxe/xapp tokens, Twilio API key, Databricks, Doppler, Pulumi, Vault, Shopify, Sentry, Grafana, DigitalOcean, Linear, Notion, Perplexity, PlanetScale, Postman, Heroku, PyPI, RubyGems, OpenAI service-account and admin keys. Every new quantifier that scans ahead is bounded, so a 200 KB hostile line is judged in under a second. The forbidden-path regex now spares a dotenv template whose last suffix is a template word (.env.local.example, .env.production.sample), which it blocked before. Stripe test keys stay unmatched: the roadmap asks for them as ask, and a content_regex gate has one action. The description lists what is caught and what is missed."
- version: 0.0.9
  date: '2026-09-30'
  changes:
  - "Wording only; the content pattern is unchanged. The description now says whole files are blocked by path (.env*, *.pem, *.key, *.p12, *.pfx, *.jks, *.keystore), that JWTs are matched, and which forms are not yet caught: the quoted-colon forms (`\"password\": \"...\"`, `api_key: \"...\"`, standard JSON and YAML), access_token= and client_secret=. The gate message is unchanged for now: the README quotes it verbatim, so its wording (a path hit is waived by the pragma anywhere in the file, not only on a line) changes together with that quote. The description names where each check runs and fits the 500-char budget; source_repo points at chock-catalog."
- version: 0.0.8
  date: '2026-09-29'
  changes:
  - "Waiver wording follows chock 0.14.0: the pragma is honoured at commit; in the agent (tool use, the turn's end, an agent's commit (CHOCK_AGENT_COMMIT, CLAUDECODE=1, AI_AGENT or agent_commit_env)) it counts only when that exact line is already committed in HEAD, and the turn's end judges only the lines changed against HEAD. The gate message and description said a waiver is never honoured in the agent. Pattern and gate behaviour unchanged."
- version: 0.0.7
  date: '2026-09-21'
  changes:
  - "Token format coverage (deep review, CONTRIBUTING.md's own invited first contribution):
    AWS ASIA (STS temporary access keys, as common as AKIA in CI); GitHub gho_/ghu_/ghr_
    (OAuth, App user-to-server, App refresh tokens -- ghp_/ghs_/github_pat_ were already
    covered); and the legacy sk- OpenAI API key format (pre sk-proj-, still issued and valid,
    distinct from sk-ant- and sk-proj- which were already covered). Six eval cases added
    (tc-021..tc-026), one of them a negative guarding scikit-learn/sklearn text against the
    broadened sk- pattern."
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."
- version: 0.0.2
  date: '2026-08-13'
  changes:
  - "Vendor token prefixes (#10): GitHub fine-grained PATs, Slack, Stripe live keys, OpenAI project keys, Anthropic, Google API keys, npm, SendGrid. Bounded shapes, not bare prefixes -- `SG.` alone would match prose."
- version: 0.0.3
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.4
  date: '2026-08-24'
  changes:
  - "Broaden coverage (hardening review): the forbidden-path regex now catches environment-specific dotenv files (.env.production, .env.local, .env.staging) while still sparing committed templates (.env.example/.sample/.template/.dist/.defaults, which hold placeholders). Content patterns gain UNQUOTED credential assignments -- api/secret/auth key|token = or : value (>=20 chars) and password = or : value (>=12 chars) -- which the previous quote-anchored patterns missed; ${VAR} env references are excluded from the password value class to avoid false positives. Self-hosting preserved. Five eval cases added (.env.production block, .env.example allow, unquoted api_key, unquoted password, below-floor negative)."
- version: 0.0.5
  date: '2026-08-25'
  changes:
  - "Honesty (do-not-claim): drop 'high-entropy secret values' from the description -- the guard matches known patterns (vendor prefixes, private-key blocks, key/token/password assignments) and computes no entropy. Wording only; guard unchanged."
- version: 0.0.6
  date: '2026-08-28'
  changes:
  - "Bind at tool-use as well as commit: gate.on now [commit, tool_use], so the same pattern enforces at agent write-time (mcp-gateway / agent guard) and not only over a git diff -- a secret is caught as the agent writes it, before any commit. No pattern change. Message generalized from 'staged changes' to 'this change' and notes that the allowlist pragma is a commit-review concept NOT honored at tool-use (the scanned text there is a live, attacker-controllable tool argument, so a match always blocks -- matching the gateway's existing content_regex semantics)."
