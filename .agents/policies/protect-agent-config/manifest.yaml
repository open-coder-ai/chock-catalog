id: protect-agent-config
name: "Protect Agent Config"
version: "0.0.5"
description: >
  Guard against an agent hand-editing its own guardrails. Agent instruction files
  (AGENTS.md and the per-agent wrappers), permission files (.claude/settings.json,
  .mcp.json) and vendored enforcement (.chock/bin/, .chock/compiled/) define what the
  agent may do -- so a shell command that rewrites them is the agent modifying its own
  authority (MITRE ATLAS AML.T0081; the AIVSS self-modification factor). The guard
  refuses shell write-commands targeting those paths; reads pass, and regeneration
  through `chock sync` passes because the tool writes them itself rather than through
  shell editing. Best-effort and deliberately coarse: a compound command that both
  reads a protected file and writes elsewhere may be refused -- rewrite it in two
  steps. The 'chock: approved-config-change' escape marker is friction plus an audit
  trail, not authentication -- the agent can write it too; the check an agent cannot
  self-approve is the commit-time gate and CI.
artifact: rule
enforcement: advise
rule:
  text: |
    agent_config(AGENTS.md|wrappers|.claude/settings|.mcp.json|.chock/bin|.chock/compiled|.agents/policies/*/implementations): never(hand_edit|delete); regenerate_via(chock sync)
    if(config_change_needed): propose_to_human; await(approval)  # an agent must not widen or disarm its own guardrails
effects:
- read_only
approval:
  required: false

compliance:
  mitre_atlas:
  - control: AML.T0081
    coverage: partial
    note: "refuses shell edits to agent instruction, permission and enforcement files"
  - control: AML.T0083
    coverage: partial
    note: "reduces exposure by refusing shell rewrites of the config files that carry credentials"
  owasp_asi:
  - control: ASI03
    coverage: partial
    note: "blocks shell self-modification of agent permission and instruction files; identity design and grant scoping remain advisory"

provenance:
  author: "chock-core"
  created_at: "2026-08-16T00:00:00Z"
  updated_at: "2026-08-24T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock-catalog"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-08-16'
  changes:
  - "Initial release. Anchors: MITRE ATLAS AML.T0081 (Modify Agent Configuration), AML.T0083, OWASP ASI03, AIVSS Self-Modification."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (mitre_atlas); no mechanism change."
- version: 0.0.3
  date: '2026-08-22'
  changes:
  - "Delivery bump for the Claude-format plugin packages built from this policy: on republish, their PreToolUse command is a single python3 invocation (the proposed interpreter-fallback chain was rejected after review proved it could erase deny verdicts) and their descriptions state the per-client fail posture. Guard logic and this repo's own artifacts are unchanged."
- version: 0.0.4
  date: '2026-08-23'
  changes:
  - "Description honesty: the approved-config-change marker is stated as what it is -- friction plus an audit trail, not authentication (anything in the command line, the agent can write; found in external review of the Copilot marketplace submission). Points at the commit-time gate and CI as the enforcement an agent cannot self-approve. Guard logic unchanged."
- version: 0.0.5
  date: '2026-08-24'
  changes:
  - "Guard self-protection + coverage (hardening review): also protect the policy implementation sources (.agents/policies/*/implementations/) so an agent cannot shell-rewrite the very guard the hook executes; treat interpreter write-forms (python -c, perl -i, ruby -i, node -e) and dd/ed/ex as writers; normalize Windows backslash paths and also scan CHOCK_RAW_COMMAND. Read-form interpreter invocations (e.g. `python script.py path`) still pass. Six eval cases added: four red-first triggers, two negatives proving the read-path false-positive reduction."
