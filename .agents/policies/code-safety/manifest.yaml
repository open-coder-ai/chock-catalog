id: code-safety
name: "Code Safety Rule"
version: "0.0.2"
description: >
  trigger: secrets, eval/exec, unsanitized SQL, hallucinated dependencies.
  avoid: committing credentials, adding unverified packages, executing dynamic code.
  Install scan-secrets and verify-dependency-exists to enforce the secret and dependency
  slices deterministically; the eval/exec and unsanitized-SQL guidance stays advisory (no
  diff-time gate can decide whether dynamic execution or a query string is unsafe).
artifact: rule
enforcement: advise
compliance:
  owasp_asi:
  - ASI05
rule:
  text: |
    enforced_when_installed(scan-secrets): commit(secrets|keys|tokens|passwords|.env); enforced_when_installed(verify-dependency-exists): add(unlisted_dependency)
    advisory: avoid(eval|exec|unsanitized_sql); on_find(secret|hallucinated_pkg): propose_removal_to_human
provenance:
  author: "chock-core"
  created_at: "2026-07-12T00:00:00Z"
  updated_at: "2026-08-25T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-07-12'
  changes:
  - "Initial public baseline (0.0.1); pre-release iteration history is preserved in git log."
- version: 0.0.2
  date: '2026-08-25'
  changes:
  - "Meta-composition + honesty (hardening review): recast the advise-tier rule so the secret and dependency slices point to their enforced siblings (scan-secrets, verify-dependency-exists) rather than asserting 'never' and 'block' from an advisory policy; eval/exec and unsanitized-SQL stay advisory (no diff-time gate can decide them), and on_find now says propose_removal_to_human, not 'block + remove'. Wording/framing only."
