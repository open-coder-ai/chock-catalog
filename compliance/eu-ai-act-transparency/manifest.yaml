  date: '2026-08-12'
  changes:
  - "Initial draft. Article 50 applies from 2026-08-02; not deferred by the Digital AI Omnibus."
- version: 0.0.2
  date: '2026-08-16'
  changes:
  - "Add compliance claims (eu_ai_act); no mechanism change."
